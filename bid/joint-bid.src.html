<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>우수업체 공동선정 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

<!-- @include view-transition-css -->

    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- @include common-css -->

    <style>
        /* 이 페이지(우수업체 공동선정) 전용 CSS */
        .side-menu-tab { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold; font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s; }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }

        .left-scroll-area { direction: rtl; overflow-y: auto; height: 100%; padding-bottom: 2rem; }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 💡 공동선정 카드 호버 시 테두리가 선명하고 굵게 보이도록 (레이아웃이
           흔들리지 않게 transform 대신 box-shadow로 두꺼운 테두리를 표현) */
        .joint-bid-card { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .joint-bid-card:hover { border-color: #2563eb; box-shadow: 0 0 0 2px #2563eb; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <div class="w-full flex flex-col bg-white shadow-md relative z-[800] shrink-0">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>
    </div>
<!-- @include header-close -->

    <div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
        <main class="flex-1 max-w-[1400px] mx-auto w-full pl-4 md:pl-5 pr-4 md:pr-8 pt-7 flex flex-col md:flex-row gap-8 overflow-hidden">
            
            <!-- 사이드바 -->
            <aside class="w-full md:w-[232px] shrink-0 h-full left-scroll-area">
                <div class="left-scroll-content">
                    <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                        <div class="side-menu-tab" onclick="location.href='bid-list.html'">견적 및 입찰 정보</div>
                        <div class="h-px bg-gray-100 mx-2 my-1"></div>
                        <div class="side-menu-tab" onclick="location.href='company-ads.html'">협력업체 홍보관</div>
                        <div class="h-px bg-gray-100 mx-2 my-1"></div>
                        <div class="side-menu-tab-active" onclick="location.href='joint-bid.html'">우수업체 공동선정</div>
                    </div>
                </div>
            </aside>

            <!-- 메인 컨텐츠 -->
            <div class="flex-1 min-w-0 h-full main-scroll-area relative flex flex-col">
                <section class="flex-1 shrink-0 pb-8">
                    
                    <div class="flex items-center gap-2 mb-6">
                        <i class="fas fa-list-ul text-[#f59e0b] text-xl"></i>
                        <h2 class="text-xl font-bold text-gray-800">진행 중인 공동선정 연합 공고</h2>
                    </div>

                    <!-- 카드 리스트 컨테이너 -->
                    <div id="joint-bid-container" class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <div class="col-span-full py-10 text-center text-gray-500">데이터를 불러오는 중입니다...</div>
                    </div>

                </section>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchJointBids();
        });

        // D-Day 계산 함수
        function getDdayText(endDateStr) {
            if (!endDateStr) return '마감 미정';
            const today = new Date(); today.setHours(0,0,0,0);
            const endDate = new Date(endDateStr);
            if (isNaN(endDate.getTime())) return '마감 미정';
            endDate.setHours(0,0,0,0);
            
            const diffTime = endDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return '마감됨';
            if (diffDays === 0) return 'D-Day';
            return `마감 D-${diffDays}`;
        }

        async function fetchJointBids() {
            const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
            const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} }}}) : null;

            if (!sb) return;

            const { data, error } = await sb.from('joint_bids').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('joint-bid-container');

            if (error || !data || data.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 text-center text-gray-500 border border-gray-200 bg-gray-50 rounded-lg">등록된 공동발주 공고가 없습니다.</div>';
                return;
            }

            container.innerHTML = data.map(bid => {
                const badgeItem = bid.target_item || '분류 미지정';
                const title = bid.title || '제목 없음';
                const pCount = bid.participants_count || 0;
                
                // 마감일 계산
                const dDayBadge = getDdayText(bid.end_date);
                const isClosed = dDayBadge === '마감됨';
                const badgeColor = isClosed ? 'bg-gray-500' : 'bg-red-500';

                // 할인율 및 목표 진행도 계산 로직
                let currentDiscount = 0;
                let nextTarget = 5;
                let nextDiscount = 5;

                if (pCount >= 20) {
                    currentDiscount = 20;
                } else if (pCount >= 10) {
                    currentDiscount = 10;
                    nextTarget = 20;
                    nextDiscount = 20;
                } else if (pCount >= 5) {
                    currentDiscount = 5;
                    nextTarget = 10;
                    nextDiscount = 10;
                }

                // 상태 텍스트
                const statusText = pCount >= 20 
                    ? `<span class="text-green-600 font-bold"><i class="fas fa-check-circle"></i> 최대 할인율(20%) 달성!</span>`
                    : `<span class="text-gray-500 text-[13px]"><b class="text-blue-600">${nextTarget - pCount}개</b> 단지 추가 시 <b class="text-red-500">${nextDiscount}%</b> 할인</span>`;

                return `
                <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md joint-bid-card flex flex-col h-full relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <!-- 💡 카테고리 뱃지를 주황색 테마로 변경 -->
                        <span class="bg-orange-50 text-orange-600 text-[12px] font-bold px-3 py-1 rounded border border-orange-200">${badgeItem}</span>
                        <span class="${badgeColor} text-white text-[12px] font-bold px-3 py-1 rounded shadow-sm">${dDayBadge}</span>
                    </div>
                    
                    <h3 class="text-[17px] font-extrabold text-gray-900 mb-5 leading-snug line-clamp-2">${title}</h3>
                    
                    <!-- 💡 박스 배경색 연한 파란색(bg-blue-50)으로 변경 -->
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 flex-1 mb-5 flex flex-col justify-center gap-3">
                        <div class="flex justify-between items-end">
                            <div class="font-bold text-slate-700 text-[14px]">
                                현재 <span class="text-blue-700 text-[16px]">${pCount}</span>개 단지 참여
                            </div>
                            <div class="font-black text-red-600 text-[16px]">
                                현재 ${currentDiscount}% 할인
                            </div>
                        </div>
                        
                        <div class="text-right mt-1">
                            ${statusText}
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2.5 mt-auto">
                        <button class="bg-[#f8fafc] text-[#475569] border border-[#e2e8f0] hover:bg-[#f1f5f9] hover:border-[#cbd5e1] font-bold py-3 rounded-lg text-[14px] transition-colors">
                            상세 정보 보기
                        </button>
                        <button class="bg-[#f0f9ff] text-[#0284c7] border border-[#e0f2fe] hover:bg-[#e0f2fe] hover:border-[#bae6fd] font-bold py-3 rounded-lg text-[14px] transition-colors shadow-sm">
                            참여 현황 보기
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
