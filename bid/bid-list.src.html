    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        const dummyStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: dummyStorage}}) : null;

        let allBids = [];
        let filteredBids = [];
        let currentPage = 1;
        let itemsPerPage = 20;
        let currentSort = 'latest';
        let tags = [];
        const DB_TABLE_NAME = 'bids';

        function initApp() {
            initRegionFilters();
            fetchBids();
        }

        async function fetchBids() {
            if(!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from(DB_TABLE_NAME).select('*').order('id', { ascending: false });
                if (error) throw error;
                allBids = data || [];
                applyFilters(); 
            } catch (error) {
                document.getElementById('bid-list-body').innerHTML = '<tr><td colspan="8" class="text-center py-10 text-red-500 font-bold">데이터를 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</td></tr>';
            }
        }

        function applyFilters() {
            filteredBids = [...allBids]; 
            
            const startDateStr = document.getElementById('start-date').value;
            const endDateStr = document.getElementById('end-date').value;
            if (startDateStr) { 
                const sd = new Date(startDateStr); sd.setHours(0,0,0,0); 
                filteredBids = filteredBids.filter(b => b.start_date && new Date(b.start_date) >= sd); 
            }
            if (endDateStr) { 
                const ed = new Date(endDateStr); ed.setHours(23,59,59,999); 
                filteredBids = filteredBids.filter(b => b.start_date && new Date(b.start_date) <= ed); 
            }

            let selectedStatus = 'ALL';
            document.getElementsByName('status').forEach(r => { if(r.checked) selectedStatus = r.value; });
            const today = new Date(); today.setHours(0,0,0,0);
            if (selectedStatus === 'OPEN') {
                filteredBids = filteredBids.filter(b => !b.end_date || new Date(b.end_date) >= today);
            } else if (selectedStatus === 'CLOSED') {
                filteredBids = filteredBids.filter(b => b.end_date && new Date(b.end_date) < today);
            }

            const checkedCategories = Array.from(document.querySelectorAll('.category-cb:checked')).map(cb => cb.value).filter(v => v !== '전체 보기');
            if (checkedCategories.length > 0) {
                filteredBids = filteredBids.filter(b => checkedCategories.includes(b.category) || checkedCategories.includes(b.type));
            }

            const checkedSubRegions = Array.from(document.querySelectorAll('.sub-region-checkbox:checked')).map(cb => cb.value);
            if (checkedSubRegions.length > 0) {
                filteredBids = filteredBids.filter(b => {
                    const region = b.region || b.location || b.address || '';
                    return checkedSubRegions.some(sr => region.includes(sr.replace(/(시|군|구)$/, '')));
                });
            }

            if (tags.length > 0) {
                filteredBids = filteredBids.filter(b => {
                    const searchText = `${b.title || ''} ${b.location || ''} ${b.address || ''} ${b.category || ''} ${b.type || ''} ${b.company_name || ''}`.toLowerCase();
                    return tags.every(tag => searchText.includes(tag.toLowerCase()));
                });
            }

            const excludeInput = document.getElementById('exclude-word-input').value;
            if (excludeInput.trim()) {
                const excludeWords = excludeInput.split(',').map(w => w.trim().toLowerCase()).filter(w => w !== '');
                filteredBids = filteredBids.filter(b => {
                    const searchText = `${b.title || ''} ${b.location || ''} ${b.address || ''} ${b.category || ''} ${b.type || ''} ${b.company_name || ''}`.toLowerCase();
                    return !excludeWords.some(ew => searchText.includes(ew));
                });
            }

            if (currentSort === 'latest') {
                filteredBids.sort((a, b) => b.id - a.id); 
            } else if (currentSort === 'views') {
                filteredBids.sort((a, b) => (b.views || 0) - (a.views || 0));
            }

            currentPage = 1; 
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('total-count').innerText = filteredBids.length;
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedBids = filteredBids.slice(startIndex, startIndex + itemsPerPage);
            
            renderBidsList(paginatedBids, filteredBids.length, startIndex);
            renderPagination(filteredBids.length);
        }

        function renderBidsList(bids, totalCount, startIndex) {
            const tbody = document.getElementById('bid-list-body'); 
            tbody.innerHTML = ''; 
            
            if (bids.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-20 font-bold text-gray-500">조건에 맞는 공고가 없습니다.</td></tr>'; 
                return; 
            }

            const today = new Date(); today.setHours(0,0,0,0);

            bids.forEach((bid) => {
                let isOpen = true; 
                if (bid.end_date) {
                    const endDate = new Date(bid.end_date); endDate.setHours(0,0,0,0);
                    if (endDate < today) isOpen = false;
                }

                const statusBadge = isOpen ? '<span class="badge-open">진행중</span>' : '<span class="badge-closed">마감</span>';
                const title = bid.title || '제목 없음';
                const category = bid.category || bid.type || '-';
                const region = bid.region || bid.address || '-';
                const companyName = bid.company_name || '업체명 미기재';
                
                const formatDate = (dateStr) => {
                    if(!dateStr) return '-';
                    const d = new Date(dateStr);
                    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
                };
                
                const tr = document.createElement('tr');
                tr.onclick = () => incrementViewAndGo(bid.id, bid.views || 0);
                
                tr.innerHTML = `
                    <td>${statusBadge}</td>
                    <td class="text-left pl-4 font-bold text-[#0B2A5B] hover:underline">${title}</td>
                    <td>${category}</td>
                    <td>${region}</td>
                    <td>${companyName}</td>
                    <td>${formatDate(bid.start_date)}</td>
                    <td>${formatDate(bid.end_date)}</td>
                    <td>${bid.views || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            const container = document.getElementById('pagination-container'); 
            if (!container) return;
            
            let html = `<button onclick="changePage(${Math.max(1, currentPage - 1)})" class="w-8 h-8 flex items-center justify-center border border-gray-300 bg-white rounded text-xs hover:bg-gray-50">&lt;</button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<button class="w-8 h-8 border border-[#0B2A5B] bg-[#0B2A5B] text-white font-bold rounded text-xs">${i}</button>`;
                } else {
                    html += `<button onclick="changePage(${i})" class="w-8 h-8 border border-gray-300 bg-white rounded text-xs hover:bg-gray-50">${i}</button>`;
                }
            }
            
            html += `<button onclick="changePage(${Math.min(totalPages, currentPage + 1)})" class="w-8 h-8 flex items-center justify-center border border-gray-300 bg-white rounded text-xs hover:bg-gray-50">&gt;</button>`;
            container.innerHTML = html;
        }

        function changePage(page) { currentPage = page; updateDisplay(); }

        function incrementViewAndGo(id, currentViews) {
            if(supabaseClient) {
                supabaseClient.from(DB_TABLE_NAME).update({ views: parseInt(currentViews) + 1 }).eq('id', id).then();
            }
            window.location.href = `bid-detail.html?id=${id}`;
        }

        function setPeriod(period, btnElement) {
            document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('border-[#3b5bdb]', 'text-[#3b5bdb]', 'bg-blue-50', 'font-bold'));
            if (btnElement) btnElement.classList.add('border-[#3b5bdb]', 'text-[#3b5bdb]', 'bg-blue-50', 'font-bold');
            
            const startInput = document.getElementById('start-date'); 
            const endInput = document.getElementById('end-date');
            
            if (period === 'all') { 
                startInput.value = ''; endInput.value = ''; 
            } else {
                const end = new Date(); const start = new Date();
                if (period === '1w') start.setDate(start.getDate() - 7);
                else if (period === '1m') start.setMonth(start.getMonth() - 1);
                else if (period === '2m') start.setMonth(start.getMonth() - 2);
                else if (period === '6m') start.setMonth(start.getMonth() - 6);
                
                const offset = start.getTimezoneOffset() * 60000;
                startInput.value = new Date(start.getTime() - offset).toISOString().split('T')[0];
                endInput.value = new Date(end.getTime() - offset).toISOString().split('T')[0];
            }
        }

        function setSort(sortType) {
            currentSort = sortType;
            const btnLatest = document.getElementById('btn-sort-latest');
            const btnViews = document.getElementById('btn-sort-views');
            
            if(sortType === 'latest') {
                btnLatest.className = "bg-[#333] text-white px-3 flex items-center justify-center h-full font-bold cursor-pointer transition-colors";
                btnViews.className = "bg-white text-gray-600 hover:bg-gray-50 px-3 border-l border-gray-300 flex items-center justify-center h-full cursor-pointer transition-colors";
            } else {
                btnLatest.className = "bg-white text-gray-600 hover:bg-gray-50 px-3 flex items-center justify-center h-full cursor-pointer transition-colors";
                btnViews.className = "bg-[#333] text-white px-3 border-l border-[#333] flex items-center justify-center h-full font-bold cursor-pointer transition-colors";
            }
            applyFilters();
        }

        function setPerPage(element) { itemsPerPage = parseInt(element.value); currentPage = 1; updateDisplay(); }

        const majorContainer = document.getElementById('major-region-container');
        const minorContainer = document.getElementById('minor-region-container');
        const minorBox = document.getElementById('minor-region-box');
        let selectedMajors = [];
        const includeContainer = document.getElementById('include-word-container');
        const manualInput = document.getElementById('manual-word-input');

        function renderTags() {
            includeContainer.querySelectorAll('.tag-chip').forEach(el => el.remove());
            tags.forEach(word => {
                const chip = document.createElement('span');
                chip.className = 'tag-chip';
                chip.innerHTML = `${word} <span class="tag-remove" data-word="${word}">✕</span>`;
                includeContainer.insertBefore(chip, manualInput);
            });
            manualInput.placeholder = tags.length > 0 ? "" : "포함할 단어 (엔터 추가)";
        }

        function addTag(word) {
            const trimmed = word.trim();
            if (trimmed && !tags.includes(trimmed)) {
                tags.push(trimmed); renderTags(); applyFilters(); 
            }
        }

        function removeTag(word) {
            tags = tags.filter(t => t !== word);
            
            const checkboxes = document.querySelectorAll(`input[type="checkbox"][value="${word}"]`);
            checkboxes.forEach(cb => {
                cb.checked = false;
                if(cb.classList.contains('major-checkbox')) {
                    selectedMajors = selectedMajors.filter(val => val !== word);
                    renderMinorRegions();
                }
            });
            
            const radios = document.querySelectorAll(`input[type="radio"][value="${word}"]`);
            radios.forEach(rb => {
                if (rb.checked) {
                    const defaultRadio = document.querySelector('input[name="status"][value="ALL"]');
                    if (defaultRadio) defaultRadio.checked = true;
                }
            });
            
            renderTags(); applyFilters(); 
        }

        includeContainer.addEventListener('click', (e) => {
            if (e.target.closest('.tag-remove')) { removeTag(e.target.closest('.tag-remove').dataset.word); } 
            else { manualInput.focus(); }
        });

        manualInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                manualInput.value.split(',').forEach(w => addTag(w));
                manualInput.value = '';
            } else if (e.key === 'Backspace' && manualInput.value === '' && tags.length > 0) {
                removeTag(tags[tags.length - 1]);
            }
        });

        document.addEventListener('change', (e) => {
            const target = e.target;
            if (target.matches('.category-cb, .sub-region-checkbox')) {
                if (target.checked) addTag(target.value); else removeTag(target.value);
            }
            if (target.matches('.status-radio')) {
                ['OPEN', 'CLOSED', 'ALL'].forEach(v => {
                    const labelStr = v === 'OPEN' ? '진행중' : v === 'CLOSED' ? '마감' : '전체보기';
                    if (v !== target.value) removeTag(labelStr);
                });
                if (target.value !== 'ALL') { addTag(target.value === 'OPEN' ? '진행중' : '마감'); } 
                else { applyFilters(); }
            }
        });

        function initRegionFilters() {
            // ★ 대분류 체크박스는 이제 JS로 나중에 만들어 넣지 않고 build.js가
            //   만든 정적 HTML에 이미 다 있음 (바로 위 마크업 참고). 페이지가
            //   로드된 "다음" 시점에 JS로 항목을 채워 넣으면, 화면에 빈 박스가
            //   한 번 보였다가 곧바로 체크박스들이 들어차면서 아래 내용이
            //   순간적으로 밀렸다 붙었다 하는 "덜컹거림"이 생김 — 처음부터
            //   완성된 모습으로 나오도록 정적 마크업으로 고정하고, 여기서는
            //   이미 있는 체크박스에 이벤트만 연결한다.
            majorContainer.querySelectorAll('.major-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (this.checked) selectedMajors.push(this.value); else selectedMajors = selectedMajors.filter(val => val !== this.value);
                    renderMinorRegions();
                });
            });
        }

        function renderMinorRegions() {
            // 덜컹거림 방지: 내용을 바꾸기 전 현재 박스 높이를 고정해두고,
            // 내용을 새로 채운 뒤 실제 필요한 높이로 부드럽게 애니메이션.
            const startHeight = minorBox.getBoundingClientRect().height;

            minorContainer.innerHTML = '';
            if (selectedMajors.length === 0) {
                minorContainer.innerHTML = '<div class="text-[13px] text-gray-500 py-2">대분류 지역을 먼저 선택해주세요.</div>';
            } else {
                selectedMajors.forEach(major => {
                    const groupDiv = document.createElement('div'); groupDiv.className = 'mb-2 last:mb-0';
                    const groupTitle = document.createElement('div'); groupTitle.className = 'text-[12px] font-bold text-gray-600 mb-1.5'; groupTitle.textContent = `[${major}]`;
                    groupDiv.appendChild(groupTitle);
                    const gridDiv = document.createElement('div'); gridDiv.className = 'grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-y-2 gap-x-2';

                    if (major === '전국') { gridDiv.innerHTML += `<label class="custom-checkbox"><input type="checkbox" value="전국 전체" class="font-bold text-blue-600 sub-region-checkbox"> <span class="font-bold">전국 전체</span></label>`; }
                    else {
                        gridDiv.innerHTML += `<label class="custom-checkbox"><input type="checkbox" value="${major} 전체" class="font-bold text-blue-600 sub-region-checkbox"> <span class="font-bold">${major} 전체</span></label>`;
                        if (typeof subRegionData !== 'undefined' && subRegionData[major]) {
                            subRegionData[major].forEach(minor => {
                                if (minor.replace(/\s+/g, '') === `${major}전체`) return;
                                gridDiv.innerHTML += `<label class="custom-checkbox"><input type="checkbox" value="${minor}" class="sub-region-checkbox"> <span>${minor}</span></label>`;
                            });
                        }
                    }
                    groupDiv.appendChild(gridDiv); minorContainer.appendChild(groupDiv);
                });
            }

            animateMinorBoxHeight(startHeight);
        }

        function animateMinorBoxHeight(startHeight) {
            // 1) 시작 높이로 고정
            minorBox.style.height = startHeight + 'px';
            // 2) 새 내용이 실제로 필요로 하는 높이 측정
            minorBox.style.height = 'auto';
            const endHeight = minorBox.getBoundingClientRect().height;
            minorBox.style.height = startHeight + 'px';
            // 3) 강제 리플로우 후 목표 높이로 트랜지션
            void minorBox.offsetHeight;
            requestAnimationFrame(() => { minorBox.style.height = endHeight + 'px'; });

            const onEnd = (e) => {
                if (e.propertyName !== 'height') return;
                minorBox.style.height = 'auto';
                minorBox.removeEventListener('transitionend', onEnd);
            };
            minorBox.addEventListener('transitionend', onEnd);
        }

        const mainContent = document.getElementById('main-content');
        (function wrapOwnContent() {
            const ownPanel = document.createElement('div'); ownPanel.className = 'tab-panel'; ownPanel.dataset.tabUrl = 'bid-list.html';
            while (mainContent.firstChild) { ownPanel.appendChild(mainContent.firstChild); }
            mainContent.appendChild(ownPanel);
        })();

        function loadContent(url, element) {
            if (element && element.classList.contains('side-menu-tab-active')) return;

            // 안전장치: 이 탭 전환은 같은 페이지 안에서의 콘텐츠 교체이므로
            // View Transition 슬라이드 애니메이션이 절대 걸리지 않도록 미리 차단
            document.documentElement.classList.add('no-page-transition');
            if (document.activeViewTransition) {
                document.activeViewTransition.skipTransition();
            }

            window.scrollTo(0, 0);

            const activateMenu = () => {
                const menuContainer = document.getElementById('side-menu-container');
                if (menuContainer) { menuContainer.querySelectorAll('div').forEach(menu => { menu.className = 'side-menu-tab'; }); }
                element.className = 'side-menu-tab-active';
                window.history.pushState({ path: url }, '', url);
            };

            const existingPanel = mainContent.querySelector(`[data-tab-url="${url}"]`);
            if (existingPanel) {
                mainContent.querySelectorAll('.tab-panel').forEach(p => { p.style.display = 'none'; });
                existingPanel.style.display = ''; activateMenu();
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    document.documentElement.classList.remove('no-page-transition');
                }));
                return;
            }

            fetch(url).then(response => { if (!response.ok) throw new Error('Network response was not ok'); return response.text(); })
                .then(html => {
                    const parser = new DOMParser(); const doc = parser.parseFromString(html, 'text/html'); const newContent = doc.getElementById('main-content');
                    if (!newContent) { location.href = url; return; }
                    mainContent.querySelectorAll('.tab-panel').forEach(p => { p.style.display = 'none'; });
                    const newPanel = document.createElement('div'); newPanel.className = 'tab-panel'; newPanel.dataset.tabUrl = url; newPanel.innerHTML = newContent.innerHTML;
                    mainContent.appendChild(newPanel); activateMenu();

                    const SHARED_SCRIPT_PATTERN = /header\.js|footer\.js|region-data\.js|tailwindcss\.com|supabase-js/;
                    const alreadyLoadedSrcs = Array.from(document.scripts).map(s => s.src).filter(Boolean);
                    doc.querySelectorAll('script').forEach(oldScript => {
                        if (oldScript.src) {
                            const resolvedSrc = new URL(oldScript.getAttribute('src'), document.baseURI).href;
                            if (alreadyLoadedSrcs.includes(resolvedSrc) || SHARED_SCRIPT_PATTERN.test(resolvedSrc)) return;
                            const s = document.createElement('script'); s.src = resolvedSrc; document.body.appendChild(s);
                        } else {
                            try { const s = document.createElement('script'); s.textContent = oldScript.textContent; document.body.appendChild(s); s.remove(); } catch (err) {}
                        }
                    });

                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        document.documentElement.classList.remove('no-page-transition');
                    }));
                }).catch(error => { location.href = url; });
        }
        window.addEventListener('popstate', function(event) { location.reload(); });
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>
</body>
