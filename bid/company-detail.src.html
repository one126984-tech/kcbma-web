    <style>
        /* 이 페이지(업체 상세) 전용 CSS */
        html, body { overflow-y: scroll; }

        .detail-header { border-bottom: 2px solid #12387a; padding-bottom: 20px; margin-bottom: 25px; }
        .catchphrase-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px 20px; border-radius: 4px; font-size: 18px; font-weight: 800; color: #1d4ed8; margin-bottom: 15px; }
        .detail-title { font-size: 26px; font-weight: 900; color: #111; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border-top: 1px solid #e5e7eb; }
        .info-table th { width: 130px; background: #f8fafc; color: #333; font-weight: bold; text-align: left; padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14.5px; }

        .content-area { min-height: 300px; padding: 30px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 15.5px; line-height: 1.8; color: #333; margin-bottom: 40px; }

        .contact-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 25px; text-align: center; margin-bottom: 30px; }
        .btn-call-large { display: inline-block; background: #12387a; color: white; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(18, 56, 122, 0.2); transition: all 0.2s; }
        .btn-call-large:hover { background: #0B2A5B; transform: translateY(-2px); }
        .btn-web-large { display: inline-block; background: white; color: #334155; border: 1px solid #cbd5e1; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-left: 10px; transition: all 0.2s; }
        .btn-web-large:hover { background: #f1f5f9; border-color: #94a3b8; }

        .btn-wrap { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .btn-list { padding: 12px 40px; background: #fff; border: 1px solid #cbd5e1; color: #333; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-list:hover { background: #f8fafc; border-color: #94a3b8; }

        .badge-premium { background: #f59e0b; color: white; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 900; letter-spacing: 0.5px; }
    </style>

                <div class="contact-box">
                    <p class="text-gray-500 text-sm font-bold mb-4">"대한집합건물관리협회 회원사입니다" 라고 말씀하시면 더 빠른 상담이 가능합니다.</p>
                    <button class="btn-call-large" id="btn-call"><i class="fas fa-phone-alt mr-2"></i> <span id="company-phone"></span></button>

    </div>
    <!-- 핑크박스 끝 -->

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const dummyStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: dummyStorage}}) : null;

        const DB_TABLE_NAME = 'companies';

        document.addEventListener('DOMContentLoaded', () => {
            fetchCompanyDetail();
        });

        async function fetchCompanyDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('id');

            if (!companyId || !supabaseClient) {
                renderMockData();
                return;
            }

            try {
                const { data, error } = await supabaseClient.from(DB_TABLE_NAME).select('*').eq('id', companyId).single();
                if (error) throw error;
                if (!data) throw new Error('Data not found');
                renderCompanyDetail(data);
            } catch (error) {
                console.error(error);
                renderMockData();
            }
        }

        function renderCompanyDetail(data) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('detail-container').style.display = 'block';

            document.getElementById('company-name').innerText = data.company_name;
            document.getElementById('company-catchphrase').innerText = `"${data.catchphrase}"`;
            document.getElementById('company-category').innerText = data.category;
            document.getElementById('company-region').innerText = data.region;
            document.getElementById('company-phone').innerText = data.phone;

            if (data.is_premium) {
                document.getElementById('premium-badge').style.display = 'inline-block';
            }
            if (data.website) {
                const btnWeb = document.getElementById('btn-web');
                btnWeb.style.display = 'inline-block';
                btnWeb.onclick = () => window.open(data.website, '_blank');
            }

            document.getElementById('btn-call').onclick = () => window.location.href = `tel:${data.phone}`;

            document.getElementById('info-manager').innerText = data.manager_name || '-';
            document.getElementById('info-email').innerText = data.email || '-';
            document.getElementById('info-service').innerText = data.service_summary || '-';

            let contentStr = data.description || '';
            document.getElementById('company-content').innerHTML = contentStr.replace(/\n/g, '<br>');
        }

        function renderMockData() {
            const mockData = {
                company_name: '(주)제일소방안전기술',
                catchphrase: '과태료 0건! 완벽한 소방점검의 기준',
                category: '소방시설',
                region: '서울/경기',
                phone: '1588-0001',
                website: 'http://example.com',
                is_premium: true,
                manager_name: '홍길동 대표',
                email: 'contact@jeil-fire.co.kr',
                service_summary: '소방시설 종합정밀점검, 작동기능점검, 전문 소방공사, 소방안전관리 대행',
                description: '당사는 20년 경력의 소방 전문 기업으로...\n\n1. 완벽한 점검 시스템\n2. 과태료 발생 시 100% 책임 보상\n3. 합리적인 월 정기 보수 비용'
            };
            renderCompanyDetail(mockData);
        }
    </script>
