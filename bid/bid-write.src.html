    <style>

    <style>
        /* [COMMON-CSS] 자동 생성됨 */
        html, body { overflow-x: hidden; }

        #main-header { background-color: #ffffff; }

.sos-btn { background-color: transparent; color: #dc2626; border: none; cursor: pointer; padding: 5px 8px; margin-left: 8px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }

        .login-btn { background-color: #2c3e50; color: #ffffff; font-weight: 700; padding: 6px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background-color 0.15s; }

    <style>
        /* 이 페이지(견적의뢰 등록) 전용 CSS */
        html, body { overflow-y: scroll; }

        .form-table { width: 100%; border-top: 2px solid #12387a; border-collapse: collapse; margin-bottom: 30px; background: #fff; }
        .form-table th { width: 160px; background: #f9fafb; color: #333; font-weight: bold; text-align: left; padding: 16px 20px; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 14px; vertical-align: middle; }
        .form-table td { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }

        .req { color: #ef4444; margin-left: 4px; font-weight: bold; }

        .input-text { width: 100%; max-width: 500px; border: 1px solid #d1d5db; border-radius: 4px; padding: 10px 12px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .input-text:focus { border-color: #3b82f6; }
        .input-text.full { max-width: 100%; }

        .input-date { border: 1px solid #d1d5db; border-radius: 4px; padding: 8px 12px; font-size: 14px; outline: none; color: #4b5563; }
        .input-select { border: 1px solid #d1d5db; border-radius: 4px; padding: 10px 12px; font-size: 14px; outline: none; min-width: 180px; }

        .custom-radio { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; margin-right: 20px; }

        .textarea-box { width: 100%; height: 300px; border: 1px solid #d1d5db; border-radius: 4px; padding: 15px; font-size: 14px; outline: none; resize: vertical; line-height: 1.6; }
        .textarea-box:focus { border-color: #3b82f6; }

        .btn-wrap { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; margin-top: 20px; }
        .btn-cancel { padding: 12px 30px; background: #fff; border: 1px solid #cbd5e1; color: #4b5563; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-cancel:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-submit { padding: 12px 40px; background: #0B2A5B; border: 1px solid #0B2A5B; color: #fff; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-submit:hover { background: #12387a; }
    </style>
</head>
<body class="flex flex-col min-h-screen page-bid-write">

<!-- @include header -->

    <div class="sticky top-0 w-full flex flex-col bg-white shadow-md relative z-[800]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col">

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-8">

        <!-- ★ 최신 3단 탭 사이드바 영역 -->
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[90px] h-fit z-40">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab-active" onclick="window.location.href='bid-list.html'">견적 및 입찰 정보</div>
                <div class="side-menu-tab" onclick="window.location.href='company-ads.html'">협력업체 홍보관</div>
                <div class="side-menu-tab" onclick="window.location.href='joint-bid.html'">우수업체 공동선정</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 bg-white p-6 md:p-8 border border-gray-200 rounded shadow-sm">

            <h1 id="page-title" class="text-[20px] font-bold text-gray-900 mb-6 pb-3 border-b border-gray-200">견적의뢰 등록</h1>

            <form id="bid-form" onsubmit="submitBid(event)">
                <table class="form-table">
                    <tbody>
                        <tr>
                            <th>공고명 <span class="req">*</span></th>
                            <td colspan="3">
                                <input type="text" id="f-title" class="input-text full" placeholder="견적의뢰 제목을 입력해주세요" required>
                            </td>
                        </tr>
                        <tr>
                            <th>발주업체명 <span class="req">*</span></th>
                            <td>
                                <input type="text" id="f-company" class="input-text" placeholder="예: OOO아파트 입주자대표회의" required>
                            </td>
                            <th>분류 <span class="req">*</span></th>
                            <td>
                                <!-- 💡 분류 선택 항목이 리스트 페이지와 동일하게 변경되었습니다 -->
                                <select id="f-category" class="input-select" required>
                                    <option value="">분류 선택</option>
                                    <option value="전기">전기</option>
                                    <option value="소방">소방</option>
                                    <option value="승강기">승강기</option>
                                    <option value="기계설비">기계설비</option>
                                    <option value="배관설비">배관설비</option>
                                    <option value="위생설비">위생설비</option>
                                    <option value="인테리어">인테리어</option>
                                    <option value="토목건축">토목건축</option>
                                    <option value="기타">기타</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th>지역 <span class="req">*</span></th>
                            <td>
                                <select id="f-region" class="input-select" required>
                                    <option value="">지역 선택</option>
                                </select>
                            </td>
                            <th>상세 현장 위치</th>
                            <td>
                                <input type="text" id="f-location" class="input-text" placeholder="상세 주소 또는 아파트명">
                            </td>
                        </tr>
                        <tr>
                            <th>공고일 (시작일) <span class="req">*</span></th>
                            <td>
                                <input type="date" id="f-start-date" class="input-date" required>
                            </td>
                            <th>마감일 <span class="req">*</span></th>
                            <td>
                                <input type="date" id="f-end-date" class="input-date" required>
                            </td>
                        </tr>
                        <tr>
                            <th>상세 내용 <span class="req">*</span></th>
                            <td colspan="3">
                                <textarea id="f-description" class="textarea-box" placeholder="입찰 참가 자격, 제출 서류, 세부 공고 내용을 작성해 주세요." required></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="btn-wrap">
                    <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                    <button type="submit" id="btn-submit" class="btn-submit">등록하기</button>
                </div>
            </form>

            <div id="footer-container"></div>
            <script src="../../assets/js/region-data.js"></script>
            <script src="../../assets/js/footer.js?v=1.3"></script>
        </section>
    </main>

    </div>

    <script>
        // 로그인한 회원 정보를 알아야 등록·수정할 수 있으므로, 헤더와 같은 로그인 연결(window.sb)을 사용합니다.
        // (예전엔 로그인 정보를 버리는 임시 연결이라 로그인해도 항상 '로그인이 필요합니다'가 떴음)
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.sb || (window.supabase ? (window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)) : null);

        const DB_TABLE_NAME = 'bids'; 

        // ?id=값이 있으면 '수정' 모드, 없으면 '새 등록' 모드
        const editId = new URLSearchParams(window.location.search).get('id');
        const isEditMode = !!editId;

        async function initApp() {
            initForm();
            if (isEditMode) await loadBidForEdit();
        }

        function initForm() {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const todayStr = new Date(today.getTime() - offset).toISOString().split('T')[0];
            document.getElementById('f-start-date').value = todayStr;

            const regionSelect = document.getElementById('f-region');
            if (typeof subRegionData !== 'undefined') {
                for (const major in subRegionData) {
                    if (major === '전국') continue;
                    const option = document.createElement('option');
                    option.value = major;
                    option.text = major;
                    regionSelect.appendChild(option);
                }
            } else {
                const defaultRegions = ['서울', '경기', '인천', '부산', '대구', '광주', '대전', '울산', '세종', '강원', '경남', '경북', '전남', '전북', '충남', '충북', '제주'];
                defaultRegions.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r;
                    option.text = r;
                    regionSelect.appendChild(option);
                });
            }
        }

        // 날짜 값(예: 2026-11-13T00:00:00)을 date 입력칸 형식(2026-11-13)으로 맞춤
        function toDateInput(v) {
            if (!v) return '';
            return String(v).slice(0, 10);
        }

        // 선택 목록에 없는 값(예전 분류·지역)도 사라지지 않도록 항목을 추가한 뒤 선택
        function setSelectValue(id, value) {
            const sel = document.getElementById(id);
            if (!value) return;
            if (![...sel.options].some(o => o.value === value)) {
                const opt = document.createElement('option');
                opt.value = value; opt.text = value;
                sel.appendChild(opt);
            }
            sel.value = value;
        }

        async function loadBidForEdit() {
            document.getElementById('page-title').innerText = '견적의뢰 수정';
            document.title = '견적의뢰 수정 | 대한집합건물관리협회';
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerText = '수정하기';

            if (!supabaseClient) { alert('데이터베이스 연결에 실패했습니다.'); return; }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert('로그인이 필요합니다.');
                location.href = '{{BASE}}login.html';
                return;
            }

            const { data: bid, error } = await supabaseClient.from(DB_TABLE_NAME).select('*').eq('id', editId).single();
            if (error || !bid) {
                alert('존재하지 않거나 삭제된 견적의뢰입니다.');
                location.href = 'bid-list.html';
                return;
            }

            const isAdmin = !!(user.app_metadata && user.app_metadata.role === 'admin');
            if (!isAdmin && bid.created_by !== user.id) {
                alert('본인이 등록한 견적의뢰만 수정할 수 있습니다.');
                location.href = `bid-detail.html?id=${encodeURIComponent(editId)}`;
                return;
            }

            // 상세 내용이 예전 형식(JSON {intro: ...})으로 저장된 경우 본문만 꺼내서 보여 줌
            let desc = bid.description || '';
            try { const parsed = JSON.parse(desc); if (parsed && parsed.intro) desc = parsed.intro; } catch (e) {}

            document.getElementById('f-title').value = bid.title || '';
            document.getElementById('f-company').value = bid.company_name || '';
            setSelectValue('f-category', bid.category || bid.type || '');
            setSelectValue('f-region', bid.region || '');
            document.getElementById('f-location').value = bid.location || bid.address || '';
            document.getElementById('f-start-date').value = toDateInput(bid.start_date || bid.created_at);
            document.getElementById('f-end-date').value = toDateInput(bid.end_date);
            document.getElementById('f-description').value = desc;
        }

        async function submitBid(event) {
            event.preventDefault();

            if(!supabaseClient) {
                alert('데이터베이스 연결에 실패했습니다.');
                return;
            }

            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData || !authData.user) {
                alert('로그인이 필요합니다.');
                location.href = '{{BASE}}login.html';
                return;
            }

            const title = document.getElementById('f-title').value.trim();
            const company = document.getElementById('f-company').value.trim();
            const category = document.getElementById('f-category').value;
            const region = document.getElementById('f-region').value;
            const locationStr = document.getElementById('f-location').value.trim();
            const startDate = document.getElementById('f-start-date').value;
            const endDate = document.getElementById('f-end-date').value;
            const description = document.getElementById('f-description').value.trim();

            if (new Date(startDate) > new Date(endDate)) {
                alert('마감일은 공고 시작일 이후여야 합니다.');
                return;
            }

            const submitBtn = document.getElementById('btn-submit');
            const btnLabel = isEditMode ? '수정하기' : '등록하기';
            submitBtn.disabled = true;
            submitBtn.innerText = isEditMode ? '수정 중...' : '등록 중...';
            submitBtn.style.opacity = '0.7';

            const fields = {
                title: title,
                company_name: company,
                category: category,
                region: region,
                location: locationStr,
                start_date: startDate,
                end_date: endDate,
                description: description
            };

            try {
                if (isEditMode) {
                    // 수정: 조회수·상태·작성자는 건드리지 않고 내용만 바꿈
                    const { data, error } = await supabaseClient
                        .from(DB_TABLE_NAME)
                        .update(fields)
                        .eq('id', editId)
                        .select('id');
                    if (error) throw error;
                    if (!data || data.length === 0) {
                        // DB 규칙상 수정 권한이 없으면 오류 없이 0건 수정으로 끝나므로 따로 안내
                        throw new Error('NO_PERMISSION');
                    }
                    alert('견적의뢰가 수정되었습니다.');
                    window.location.href = `bid-detail.html?id=${encodeURIComponent(editId)}`;
                } else {
                    const { error } = await supabaseClient
                        .from(DB_TABLE_NAME)
                        .insert([{ ...fields, status: 'OPEN', views: 0, created_by: authData.user.id }]);
                    if (error) throw error;
                    alert('견적의뢰가 성공적으로 등록되었습니다.');
                    window.location.href = 'bid-list.html';
                }

            } catch (error) {
                console.error(isEditMode ? 'Update error:' : 'Insert error:', error);
                if (error && error.message === 'NO_PERMISSION') {
                    alert('수정 권한이 없습니다. 본인이 등록한 견적의뢰만 수정할 수 있습니다.');
                } else {
                    alert((isEditMode ? '수정' : '공고 등록') + ' 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                }

                submitBtn.disabled = false;
                submitBtn.innerText = btnLabel;
                submitBtn.style.opacity = '1';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>

</body>
</html>
