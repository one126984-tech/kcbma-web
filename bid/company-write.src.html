<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>업체 광고 등록 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- @include view-transition-css -->

<!-- @include common-css -->

    <style>
        /* 이 페이지(업체 광고 등록) 전용 CSS */
        html, body { overflow-y: scroll; }

        .form-table { width: 100%; border-top: 2px solid #12387a; border-collapse: collapse; margin-bottom: 30px; background: #fff; }
        .form-table th { width: 160px; background: #f9fafb; color: #333; font-weight: bold; text-align: left; padding: 16px 20px; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 14px; vertical-align: middle; }
        .form-table td { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }

        .req { color: #ef4444; margin-left: 4px; font-weight: bold; }

        .input-text { width: 100%; max-width: 500px; border: 1px solid #d1d5db; border-radius: 4px; padding: 10px 12px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .input-text:focus { border-color: #3b82f6; }
        .input-text.full { max-width: 100%; }

        .input-select { border: 1px solid #d1d5db; border-radius: 4px; padding: 10px 12px; font-size: 14px; outline: none; min-width: 180px; }
        .textarea-box { width: 100%; height: 200px; border: 1px solid #d1d5db; border-radius: 4px; padding: 15px; font-size: 14px; outline: none; resize: vertical; line-height: 1.6; }
        .textarea-box:focus { border-color: #3b82f6; }

        .btn-wrap { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .btn-cancel { padding: 12px 30px; background: #fff; border: 1px solid #cbd5e1; color: #4b5563; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-cancel:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-submit { padding: 12px 40px; background: #0B2A5B; border: 1px solid #0B2A5B; color: #fff; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-submit:hover { background: #12387a; }

        .premium-checkbox-wrap { background-color: #fff9db; border: 1px solid #fcc419; padding: 12px 24px; border-radius: 6px; display: inline-flex; align-items: center; gap: 15px; cursor: pointer; }
        .premium-checkbox-text { color: #946c00; font-weight: 800; font-size: 15px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

<!-- @include header -->

    <div class="w-full flex flex-col bg-white shadow-md relative z-[800]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
            <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex items-center h-full">
                <div class="w-full md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl tracking-wide flex items-center justify-center h-full">
                    업체별 광고 (B2B)
                </div>
            </div>
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col">



    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[90px] h-fit z-40">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6">
                <div class="side-menu-tab-active"><span>업체별 광고</span></div>
                <div class="h-px bg-gray-100 mx-2 my-1"></div>
                <div class="side-menu-tab" onclick="location.href='bid-list.html'"><span>견적·입찰정보</span></div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 bg-white p-6 md:p-8 border border-gray-200 rounded shadow-sm">
            <h1 class="text-[20px] font-bold text-gray-900 mb-6 pb-3 border-b border-gray-200">협력업체 광고 등록</h1>

            <form id="company-form" onsubmit="submitCompany(event)">
                <table class="form-table">
                    <tbody>
                        <tr>
                            <th>업체명 <span class="req">*</span></th>
                            <td><input type="text" id="f-name" class="input-text" placeholder="(주)업체명" required></td>
                            <th>광고 등급</th>
                            <td>
                                <label class="premium-checkbox-wrap">
                                    <input type="checkbox" id="f-premium" style="width: 18px; height: 18px; cursor: pointer; accent-color: #f59e0b;">
                                    <div class="premium-checkbox-text">
                                        프리미엄 광고 적용<br>
                                        <span style="font-size: 13.5px;">(화면 상단 노출)</span>
                                    </div>
                                </label>
                            </td>
                        </tr>
                        <tr>
                            <th>한 줄 어필 문구 <span class="req">*</span></th>
                            <td colspan="3">
                                <input type="text" id="f-catchphrase" class="input-text full" placeholder="예: 과태료 0건! 완벽한 소방점검의 기준" required>
                                <p class="text-xs text-gray-500 mt-1">리스트 화면에 노출될 강력한 한 줄 문구를 작성해주세요.</p>
                            </td>
                        </tr>
                        <tr>
                            <th>분류 <span class="req">*</span></th>
                            <td>
                                <select id="f-category" class="input-select" required>
                                    <option value="">분류 선택</option>
                                    <option value="소방시설">소방시설·점검</option>
                                    <option value="전기설비">전기·통신설비</option>
                                    <option value="승강기">승강기 유지보수</option>
                                    <option value="기계설비">기계·배관설비</option>
                                    <option value="건축영선">건축·방수·영선</option>
                                    <option value="위생미화">위생·소독·저수조</option>
                                    <option value="보안경비">보안·경비·CCTV</option>
                                    <option value="기타">기타 전문업체</option>
                                </select>
                            </td>
                            <th>주요 활동 지역 <span class="req">*</span></th>
                            <td><input type="text" id="f-region" class="input-text" placeholder="예: 서울/경기, 전국" required></td>
                        </tr>
                        <tr>
                            <th>대표 전화번호 <span class="req">*</span></th>
                            <td><input type="tel" id="f-phone" class="input-text" placeholder="예: 02-1234-5678" required></td>
                            <th>홈페이지 주소</th>
                            <td><input type="url" id="f-website" class="input-text" placeholder="http://"></td>
                        </tr>
                        <tr>
                            <th>담당자명</th>
                            <td><input type="text" id="f-manager" class="input-text" placeholder="담당자 이름 또는 대표자명"></td>
                            <th>이메일</th>
                            <td><input type="email" id="f-email" class="input-text" placeholder="contact@example.com"></td>
                        </tr>
                        <tr>
                            <th>주요 서비스 요약</th>
                            <td colspan="3">
                                <input type="text" id="f-service" class="input-text full" placeholder="예: 우레탄 방수, 에폭시, 옥상누수 전문">
                            </td>
                        </tr>
                        <tr>
                            <th>업체 상세 소개 <span class="req">*</span></th>
                            <td colspan="3">
                                <textarea id="f-desc" class="textarea-box" placeholder="보유 면허, 주요 실적, 특장점 등 업체를 상세히 홍보해주세요." required></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="btn-wrap">
                    <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                    <button type="submit" id="btn-submit" class="btn-submit">등록 완료</button>
                </div>
            </form>
        </section>
    </main>

    </div>
    <!-- 핑크박스 끝 -->

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const dummyStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: dummyStorage}}) : null;

        const DB_TABLE_NAME = 'companies';

        async function submitCompany(event) {
            event.preventDefault();

            if(!supabaseClient) {
                alert('데이터베이스가 연결되지 않았습니다. (테스트 환경)');
                window.location.href = 'company-ads.html';
                return;
            }

            const dataObj = {
                company_name: document.getElementById('f-name').value.trim(),
                catchphrase: document.getElementById('f-catchphrase').value.trim(),
                category: document.getElementById('f-category').value,
                region: document.getElementById('f-region').value.trim(),
                phone: document.getElementById('f-phone').value.trim(),
                website: document.getElementById('f-website').value.trim(),
                manager_name: document.getElementById('f-manager').value.trim(),
                email: document.getElementById('f-email').value.trim(),
                service_summary: document.getElementById('f-service').value.trim(),
                description: document.getElementById('f-desc').value.trim(),
                is_premium: document.getElementById('f-premium').checked
            };

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerText = '등록 중...';

            try {
                const { error } = await supabaseClient.from(DB_TABLE_NAME).insert([dataObj]);
                if (error) throw error;

                alert('광고 업체 등록이 완료되었습니다.');
                window.location.href = 'company-ads.html';
            } catch (error) {
                console.error(error);
                alert('등록 중 오류가 발생했습니다. (테이블 생성 여부를 확인하세요)');
                submitBtn.disabled = false;
                submitBtn.innerText = '등록 완료';
            }
        }
    </script>
</body>
</html>
