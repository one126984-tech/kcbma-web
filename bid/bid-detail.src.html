        .badge-closed { display: inline-block; padding: 4px 10px; background-color: #6b7280; color: white; border-radius: 4px; font-size: 12px; font-weight: bold; text-align: center; margin-right: 10px; vertical-align: middle; }

        .btn-wrap { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchBidDetail();
        });

        const dummyStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: dummyStorage}}) : null;

        const DB_TABLE_NAME = 'jobs'; 

        async function fetchBidDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const bidId = urlParams.get('id');

            if (!bidId) {
                alert('잘못된 접근입니다. (공고 ID가 없습니다)');
                location.href = 'bid-list.html';
                return;
            }

            if(!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient.from(DB_TABLE_NAME).select('*').eq('id', bidId).single();
                
                if (error) throw error;
                if (!data) {
                    alert('존재하지 않거나 삭제된 공고입니다.');
                    location.href = 'bid-list.html';
                    return;
                }

                renderBidDetail(data);

            } catch (error) {
                document.getElementById('loading-spinner').innerHTML = '<span class="text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</span>';
                console.error('Fetch error:', error);
            }
        }

        function renderBidDetail(bid) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('detail-container').style.display = 'block';

            const today = new Date(); 
            today.setHours(0,0,0,0);
            
            let isOpen = true; 
            if (bid.end_date) {
                const endDate = new Date(bid.end_date); endDate.setHours(0,0,0,0);
                if (endDate < today) isOpen = false;
            }

            const badgeEl = document.getElementById('bid-status-badge');
            if (isOpen) {
                badgeEl.className = 'badge-open';
                badgeEl.innerText = '진행중';
            } else {
                badgeEl.className = 'badge-closed';
                badgeEl.innerText = '마감';
            }

            const formatDate = (dateStr) => {
                if(!dateStr) return '미지정';
                const d = new Date(dateStr);
                return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
            };

            const title = bid.title || '제목 없음';
            const category = bid.category || bid.type || '분류 미지정';
            const company = bid.company_name || '업체명 미기재';
            const location = `${bid.region || ''} ${bid.address || bid.location || ''}`.trim() || '위치 미기재';
            const startDate = formatDate(bid.start_date || bid.created_at);
            const endDate = formatDate(bid.end_date);
            const views = bid.views || 0;

            document.getElementById('bid-title').innerText = title;
            document.getElementById('bid-category').innerText = `[${category}]`;
            document.getElementById('bid-company').innerText = company;
            document.getElementById('bid-date').innerText = startDate;
            document.getElementById('bid-views').innerText = views;

            document.getElementById('info-company').innerText = company;
            document.getElementById('info-location').innerText = location;
            document.getElementById('info-start-date').innerText = startDate;
            document.getElementById('info-end-date').innerText = endDate;
            document.getElementById('info-category').innerText = category;

            let contentStr = bid.description || '상세 내용이 없습니다.';
            
            try {
                const parsed = JSON.parse(contentStr);
                if(parsed && parsed.intro) contentStr = parsed.intro;
            } catch(e) {
                // JSON이 아닌 일반 텍스트일 경우 그대로 사용
            }
            
            contentStr = contentStr.replace(/\n/g, '<br>');
            document.getElementById('bid-content').innerHTML = contentStr;
        }

        function editBid() {
            const urlParams = new URLSearchParams(window.location.search);
            const bidId = urlParams.get('id');
            alert('수정 기능은 준비 중입니다.');
        }
    </script>
