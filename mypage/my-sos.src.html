    <style>
        /* 이 페이지(내 SOS 내역) 전용 CSS */
        html, body { overflow-y: scroll; }

        .tab-item { padding: 10px 22px; font-size: 14.5px; font-weight: 700; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab-item:hover { color: #12387a; }
        .tab-item.active { color: #12387a; border-bottom-color: #12387a; }

        .sos-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px 22px; display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
        .sos-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .btn-refund { background: #fff; color: #b45309; border: 1px solid #f59e0b; font-weight: 700; font-size: 13px; padding: 9px 18px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn-refund:hover { background: #fffbeb; }
        .refund-note { font-size: 12.5px; margin-top: 6px; line-height: 1.5; word-break: keep-all; }
        .rf-modal { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
        .rf-modal.open { display: flex; }
        .rf-box { background: #fff; border-radius: 10px; width: 100%; max-width: 440px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
        .rf-box h3 { font-size: 18px; font-weight: 900; color: #0B2A5B; margin: 0 0 6px; }
        .rf-box textarea { width: 100%; min-height: 110px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical; }
        .rf-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
        .rf-btns button { font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        @media (max-width: 640px) { .sos-card { flex-direction: column; align-items: stretch; } .sos-actions { flex-direction: row; } .sos-actions button { flex: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='my-courses.html'">내 수강 목록</div>
                <div class="side-menu-tab" onclick="window.location.href='my-certs.html'">내 수료증</div>
                <div class="side-menu-tab" onclick="window.location.href='my-exams.html'">시험 결과</div>
                <div class="side-menu-tab" onclick="window.location.href='my-field-courses.html'">내 현장교육 신청</div>

                <div class="side-menu-tab">내 정보</div>
            </div>

        <section class="flex-1 min-w-0">
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm mb-6 flex items-center overflow-x-auto no-scrollbar">
                <div class="tab-item active" data-tab="ALL" onclick="setTab('ALL')">전체</div>
                <div class="tab-item" data-tab="대기중" onclick="setTab('대기중')">대기중</div>
                <div class="tab-item" data-tab="매칭됨" onclick="setTab('매칭됨')">매칭됨</div>
                <div class="tab-item" data-tab="완료" onclick="setTab('완료')">완료</div>
                <div class="tab-item" data-tab="취소됨" onclick="setTab('취소됨')">취소됨</div>
                <div class="tab-item" data-tab="환불" onclick="setTab('환불')">환불</div>
            </div>

            <!-- ★ 2026-11: 상담료 환불 요청 창 -->
            <div id="rf-modal" class="rf-modal" onclick="if(event.target===this) closeRefund()">
                <div class="rf-box">
                    <h3>상담료 환불 요청</h3>
                    <p id="rf-desc" style="font-size:13.5px;color:#4b5563;margin:0 0 12px;line-height:1.6;"></p>
                    <textarea id="rf-reason" maxlength="500" placeholder="환불을 요청하는 이유를 적어 주세요. (예: 전문가와 통화 연결이 되지 않았습니다)"></textarea>
                    <p style="font-size:12px;color:#9ca3af;margin:6px 0 0;">협회가 확인한 뒤 승인되면 차감된 포인트로 돌려드립니다. 한 접수 건에 한 번만 요청할 수 있습니다.</p>
                    <div class="rf-btns">
                        <button type="button" onclick="closeRefund()" style="background:#fff;border:1px solid #cbd5e1;color:#475569;">취소</button>
                        <button type="button" id="rf-submit" onclick="submitRefund()" style="background:#b45309;border:1px solid #b45309;color:#fff;">환불 요청하기</button>
                    </div>
                </div>
            </div>

            <div id="sos-list">
                <div class="text-center py-20 text-gray-400 text-sm bg-white border border-gray-200 rounded">데이터를 불러오는 중입니다...</div>
            </div>
    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>
        </section>
    </main>

    </div>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;
        let allRequests = [];
        let currentTab = 'ALL';
        let refundable = {};        // 접수번호 → 환불 가능 금액 (서버 계산)
        let refundTarget = null;

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }

        function requireLogin() {
            if (!currentUser) {
                window.location.href = '{{BASE}}login.html';
                return false;
            }
            return true;
        }

        async function fetchRequests() {
            const { data, error } = await supabaseClient
                .from('sos_requests')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('내 SOS 내역 조회 오류:', error);
                return [];
            }
            return data || [];
        }

        // ★ 2026-11: 접수 건별 환불 가능 금액 (상담료가 실제로 차감된 건만 0보다 큼)
        async function fetchRefundInfo() {
            try {
                const { data, error } = await supabaseClient.rpc('my_sos_refund_info');
                if (error) throw error;
                const map = {};
                (data || []).forEach(x => { map[x.request_id] = Number(x.refundable) || 0; });
                return map;
            } catch (e) {
                console.error('환불 가능 금액 조회 오류:', e);
                return {};
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function statusBadge(status) {
            const s = status || '대기중';
            const map = {
                '대기중': 'bg-red-100 text-red-600',
                '매칭됨': 'bg-blue-100 text-blue-700',
                '완료': 'bg-green-100 text-green-700',
                '취소됨': 'bg-gray-100 text-gray-500'
            };
            // 환불 상태는 영문 코드로 저장됨 → 한글로 표시
            if (s === 'refund_requested') return '<span class="px-3 py-1.5 rounded text-[12px] font-bold whitespace-nowrap" style="background:#fef3c7;color:#b45309;">환불 요청됨</span>';
            if (s === 'refund_completed') return '<span class="px-3 py-1.5 rounded text-[12px] font-bold whitespace-nowrap" style="background:#ede9fe;color:#6d28d9;">환불 완료</span>';
            const cls = map[s] || 'bg-gray-100 text-gray-500';
            return `<span class="${cls} px-3 py-1.5 rounded text-[12px] font-bold whitespace-nowrap">${KC.esc(s)}</span>`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str || '';
            return div.innerHTML;
        }

        // 서비스 방식 + 출동비(선차감/확정/환불) 상태를 한 줄로 보여준다
        function feeLine(r) {
            const isDispatch = r.service_type === 'dispatch';
            const svc = isDispatch ? '전화상담 및 출동서비스' : '전화상담만';
            let fee = '';
            const amount = Number(r.hold_amount || 0).toLocaleString();
            if (isDispatch) {
                if (r.hold_status === 'held') fee = `출동비 ${amount}원 선차감 중`;
                else if (r.hold_status === 'captured') fee = `출동비 ${amount}원 확정`;
                else if (r.hold_status === 'refunded') fee = `출동비 ${amount}원 환불됨`;
            }
            const feeHtml = fee ? ` <span class="text-blue-600 font-bold">· ${fee}</span>` : '';
            return `<div class="text-[12.5px] text-gray-500 mt-1 truncate">${svc}${feeHtml}</div>`;
        }

        function renderList() {
            const container = document.getElementById('sos-list');
            let filtered = allRequests;
            if (currentTab === '환불') filtered = allRequests.filter(r => String(r.status || '').startsWith('refund_') || r.refund_reject_reason);
            else if (currentTab !== 'ALL') filtered = allRequests.filter(r => (r.status || '대기중') === currentTab);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24 bg-white border border-gray-200 rounded">
                        <i class="fas fa-triangle-exclamation text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium">해당 조건의 SOS 접수 내역이 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(r => `
                <div class="sos-card">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            ${statusBadge(r.status)}
                            <span class="text-[12px] text-gray-500 font-medium">${formatDateTime(r.created_at)}</span>
                        </div>
                        <div class="font-bold text-[15.5px] text-[#0B2A5B] mb-1 truncate">${escapeHtml(r.category) || '-'}</div>
                        <div class="text-[13px] text-gray-500 truncate">${escapeHtml(r.region) || '-'} · ${escapeHtml(r.contact_phone) || '-'}</div>
                        ${feeLine(r)}
                        ${refundNote(r)}
                    </div>
                    <div class="sos-actions">
                        <button onclick="location.href='{{BASE}}sos/sos-room.html?request_id=${KC.esc(r.id)}'" class="shrink-0 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-5 rounded transition-colors whitespace-nowrap">자세히 보기</button>
                        ${canRefund(r) ? `<button class="btn-refund" onclick="openRefund('${KC.esc(r.id)}')">환불 요청</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function canRefund(r) {
            const st = String(r.status || '');
            return (refundable[r.id] || 0) > 0 && !st.startsWith('refund_') && !r.refund_reject_reason;
        }

        function refundNote(r) {
            const st = String(r.status || '');
            if (st === 'refund_requested') {
                return `<div class="refund-note" style="color:#b45309;">환불 요청 접수됨 (${formatDateTime(r.refund_requested_at)}) · 협회 확인 중입니다.<br><span style="color:#6b7280;">사유: ${escapeHtml(r.refund_reason)}</span></div>`;
            }
            if (st === 'refund_completed') {
                return '<div class="refund-note" style="color:#6d28d9;">상담료가 포인트로 환불되었습니다.</div>';
            }
            if (r.refund_reject_reason) {
                return `<div class="refund-note" style="color:#dc2626;">환불 반려: ${escapeHtml(r.refund_reject_reason)}<br><span style="color:#6b7280;">다시 요청하시려면 협회로 문의해 주세요.</span></div>`;
            }
            return '';
        }

        window.openRefund = function (id) {
            refundTarget = allRequests.find(r => String(r.id) === String(id));
            if (!refundTarget) return;
            const amt = (refundable[refundTarget.id] || 0).toLocaleString();
            document.getElementById('rf-desc').innerHTML =
                `${escapeHtml(refundTarget.category) || 'SOS'} · ${formatDateTime(refundTarget.created_at)} 접수<br>환불 요청 금액: <b style="color:#b45309;">${amt}원</b> (포인트로 돌려드림)`;
            document.getElementById('rf-reason').value = '';
            document.getElementById('rf-modal').classList.add('open');
            setTimeout(() => document.getElementById('rf-reason').focus(), 50);
        };

        window.closeRefund = function () {
            document.getElementById('rf-modal').classList.remove('open');
            refundTarget = null;
        };

        window.submitRefund = async function () {
            if (!refundTarget) return;
            const reason = document.getElementById('rf-reason').value.trim();
            if (reason.length < 5) { alert('환불 사유를 5자 이상 적어 주세요.'); return; }
            const btn = document.getElementById('rf-submit');
            btn.disabled = true; btn.textContent = '요청 중...';
            try {
                const { data, error } = await supabaseClient.rpc('sos_request_refund', { p_request_id: refundTarget.id, p_reason: reason });
                if (error) throw error;
                alert((data && data.message) || '처리되었습니다.');
                if (data && data.ok) {
                    closeRefund();
                    allRequests = await fetchRequests();
                    refundable = await fetchRefundInfo();
                    renderList();
                }
            } catch (e) {
                console.error('환불 요청 오류:', e);
                alert('환불 요청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            } finally {
                btn.disabled = false; btn.textContent = '환불 요청하기';
            }
        };

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderList();
        }

        async function init() {
            await fetchUser();
            if (!requireLogin()) return;

            [allRequests, refundable] = await Promise.all([fetchRequests(), fetchRefundInfo()]);
            renderList();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
