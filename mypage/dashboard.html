    <style>
        /* [COMMON-VIEW-TRANSITION] 자동 생성됨 — 이 내용을 고치려면
           _partials/view-transition-css.html 파일만 고치고 build.js를 다시
           실행할 것. 절대 각 페이지에서 직접 고치지 말 것.

           ★★★ 2026-08 기준 크로스 문서 View Transition 기능을 완전히 껐음.
           이유: 헤더 안 움직임 → 서브헤더 흰 화면 → 본문 울렁임 → 헤더가
           오른쪽으로 갔다 돌아옴 → 입찰공고/구인구직 등 여전히 덜컹거림,
           이런 식으로 한 군데 고치면 다른 데서 새로운 미세한 어긋남이
           계속 튀어나왔음. 이 기능은 브라우저가 이전 페이지와 새 페이지의
           스크린샷을 직접 찍어서 애니메이션시키는 방식이라, 코드만 보고
           고치는 방식으로는 실제 브라우저에서 어떻게 보일지 확인이 안 되고
           끝없이 두더지잡기가 됨.

           그래서 아래 @view-transition 자체를 꺼서 그냥 "즉시 전환"(깜빡임
           없이 바로 바뀌는 일반적인 페이지 이동)으로 되돌림. 헤더/서브헤더가
           흔들리거나 밀리거나 울렁이는 문제가 구조적으로 있을 수 없음
           (애니메이션 자체가 없으니까). 아래의 view-transition-name /
           키프레임 코드들은 그대로 남겨뒀지만 @view-transition이 꺼져있는
           동안은 전부 아무 효과가 없음 — 나중에 다시 켜고 싶으면 아래
           @view-transition 블록의 주석만 풀면 됨. */
        /*
        @view-transition {
            navigation: auto;
        }
        */
        #main-header {
            view-transition-name: site-header;
        }
        #page-content {
            view-transition-name: page-content;
        }
        @keyframes page-content-out {
            to { opacity: 0; }
        }
        @keyframes page-content-in {
            from { opacity: 0; }
        }
        ::view-transition-old(page-content) {
            animation: 150ms ease-in both page-content-out;
        }
        ::view-transition-new(page-content) {
            animation: 200ms ease-out both page-content-in;
        }
        /* 핵심: 박스 크기/위치를 이전↔새 페이지 사이에서 자동으로
           보간(모핑)하는 기본 동작을 꺼서 "들썩임"을 없앰 */
        ::view-transition-group(page-content) {
            animation: none;
            width: 100%;
            height: 100%;
        }
        ::view-transition-group(site-header) {
            animation: none;
        }
        ::view-transition-old(site-header),
        ::view-transition-new(site-header) {
            animation: none;
        }
        /* ★ 2026-08: #sub-header-bar가 이제 header.html/header-close.html
           분할 구조 덕분에 #main-header의 "자식"으로 들어가 있음 (예전엔
           #page-content 쪽의 형제 요소였음). 그래서 따로 view-transition-name을
           줄 필요가 없어짐 — 부모인 site-header(#main-header)의 캡처 영역에
           자동으로 같이 포함됨. (오히려 여기 따로 이름을 주면 "이름표 붙은
           요소를 또 다른 이름표 붙은 요소 안에 중첩"시키는 예전에 버그났던
           패턴이 재발하니 절대 다시 추가하지 말 것 — 본문이 울렁이던 그 버그.) */
        /* 안전장치: 같은 페이지 안에서 사이드 탭(AJAX)만 바뀔 때는
           슬라이드 애니메이션이 절대 걸리지 않도록 강제로 끔.
           AJAX 탭 전환이 있는 페이지(job-list/resume-list/bid-list 등)의
           탭 전환 스크립트에서 이 클래스를 잠깐 추가했다가 제거해야 함. */
        html.no-page-transition #page-content,
        html.no-page-transition ::view-transition-group(page-content),
        html.no-page-transition ::view-transition-old(page-content),
        html.no-page-transition ::view-transition-new(page-content) {
            animation: none !important;
            transform: none !important;
        }
    </style>

        <header class="flex justify-between items-center px-4 md:px-8 max-w-[1400px] mx-auto w-full h-[70px]">

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // supabase가 없으면 함수 종료 (에러 방지)
            if (typeof supabase === 'undefined') {
                console.log("Supabase 객체를 찾을 수 없습니다. (스크립트 로딩 순서 확인 필요)");
                return;
            }
            
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (typeof supabase === 'undefined') return;
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await supabase
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 알림 개수 불러오기 실행
            fetchUnreadCount();

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;

        const dummyEnrollments = [
            {
                id: 'dummy-e1',
                status: 'ACTIVE',
                progress_rate: 62.5,
                enrolled_at: '2026-07-20T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전', edu_method: 'VOD' }
            },
            {
                id: 'dummy-e2',
                status: 'ACTIVE',
                progress_rate: 30,
                enrolled_at: '2026-08-01T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계', edu_method: 'MIX' }
            },
            {

                progress_rate: 100,
                enrolled_at: '2026-06-01T00:00:00Z',
                completed_at: '2026-06-25T00:00:00Z',
                cert_courses: { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선', edu_method: 'VOD' }
            }
        ];

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }

        function requireLogin() {
            if (!currentUser) {
                window.location.href = '../../login.html';
                return false;
            }
            return true;
        }

        function renderWelcome() {
            const name = (currentUser && (currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email)) || '회원';
            document.getElementById('welcome-msg').textContent = `${name}님, 안녕하세요!`;
        }

        async function fetchEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(*)')
                    .eq('user_id', currentUser.id)
                    .order('enrolled_at', { ascending: false });

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyEnrollments;
            } catch (e) {
                console.error('수강 목록 조회 실패:', e);
                return dummyEnrollments;
            }
        }

        async function fetchCertCount() {
            try {
                const { count, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', currentUser.id)
                    .eq('status', 'ISSUED');

                if (error) throw error;
                return count || 0;
            } catch (e) {
                console.error('자격증 수 조회 실패:', e);
                return 0;
            }
        }

        function renderStats(enrollments, certCount) {
            const activeCount = enrollments.filter(e => e.status === 'ACTIVE').length;
            const completedCount = enrollments.filter(e => e.status === 'COMPLETED').length;
            const avgProgress = enrollments.length > 0
                ? Math.round(enrollments.reduce((sum, e) => sum + (Number(e.progress_rate) || 0), 0) / enrollments.length)
                : 0;

            document.getElementById('stat-active').textContent = activeCount;
            document.getElementById('stat-completed').textContent = completedCount;
            document.getElementById('stat-cert').textContent = certCount;
            document.getElementById('stat-avg-progress').textContent = `${avgProgress}%`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function renderOngoingCourses(enrollments) {
            const container = document.getElementById('ongoing-course-list');
            const ongoing = enrollments.filter(e => e.status === 'ACTIVE').slice(0, 3);

            if (ongoing.length === 0) {
                container.innerHTML = '<div class="text-center py-14 text-gray-400 text-sm">수강 중인 과정이 없습니다.</div>';
                return;
            }

            container.innerHTML = ongoing.map(e => {
                const course = e.cert_courses || {};
                const rate = Number(e.progress_rate) || 0;
                return `
                    <div class="course-row">
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-[15px] text-[#0B2A5B] mb-2 truncate">${course.title || '-'}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${rate}%;"></div>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-[12.5px] text-gray-500">수강 시작일: ${formatDate(e.enrolled_at)}</span>
                                <span class="text-[12.5px] font-bold text-[#12387a]">${rate}%</span>
                            </div>
                        </div>
                        <button onclick="location.href='../cert/cert-player.html?enrollment_id=${e.id}'" class="shrink-0 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-4 rounded transition-colors whitespace-nowrap">이어서 학습하기</button>
                    </div>
                `;
            }).join('');
        }

        async function init() {
            await fetchUser();
            if (!requireLogin()) return;

            renderWelcome();

            const [enrollments, certCount] = await Promise.all([
                fetchEnrollments(),
                fetchCertCount()
            ]);

            renderStats(enrollments, certCount);
            renderOngoingCourses(enrollments);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
