<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>시험 결과 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">

    <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include view-transition-css -->

<!-- @include common-css -->

    <style>
        /* 이 페이지(시험 결과) 전용 CSS */
        html, body { overflow-y: scroll; }

        .tab-item { padding: 10px 22px; font-size: 14.5px; font-weight: 700; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab-item:hover { color: #12387a; }
        .tab-item.active { color: #12387a; border-bottom-color: #12387a; }

        .exam-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 22px 24px; display: flex; align-items: center; gap: 20px; margin-bottom: 14px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-box { background: #fff; border-radius: 10px; max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 30px; }
        .review-item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-bottom: 12px; }
        .review-item.correct { border-left: 5px solid #10b981; }
        .review-item.incorrect { border-left: 5px solid #ef4444; }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                마이페이지
            </div>
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col">



    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='my-courses.html'">내 수강 목록</div>
                <div class="side-menu-tab" onclick="window.location.href='my-certs.html'">내 자격증</div>
                <div class="side-menu-tab-active">시험 결과</div>
                <div class="side-menu-tab">내 정보</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0">
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm mb-6 flex items-center overflow-x-auto no-scrollbar">
                <div class="tab-item active" data-tab="ALL" onclick="setTab('ALL')">전체</div>
                <div class="tab-item" data-tab="PASS" onclick="setTab('PASS')">합격</div>
                <div class="tab-item" data-tab="FAIL" onclick="setTab('FAIL')">불합격</div>
            </div>

            <div id="exam-list">
                <div class="text-center py-20 text-gray-400 text-sm bg-white border border-gray-200 rounded">데이터를 불러오는 중입니다...</div>
            </div>
        </section>
    </main>

    </div>
    <!-- 핑크박스 끝 -->

    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="flex items-center justify-between mb-5">
                <div class="text-lg font-black text-[#0B2A5B]" id="modal-title">시험 결과 상세</div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;
        let allAttempts = [];
        let currentTab = 'ALL';

        const dummyAttempts = [
            {
                id: 'dummy-a1',
                attempt_no: 1,
                score: 85.0,
                total_points: 100,
                is_passed: true,
                submitted_at: '2026-08-05T10:20:00Z',
                answers: [
                    { question_id: 1, selected_option: 3, is_correct: true },
                    { question_id: 2, selected_option: 2, is_correct: false }
                ],
                cert_exams: {
                    id: 'dummy-exam-1',
                    title: '기전당직실무관리사 자격 평가',
                    pass_score: 60,
                    cert_courses: { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)' }
                }
            },
            {
                id: 'dummy-a2',
                attempt_no: 1,
                score: 45.0,
                total_points: 100,
                is_passed: false,
                submitted_at: '2026-07-28T14:10:00Z',
                answers: [],
                cert_exams: {
                    id: 'dummy-exam-2',
                    title: '기계설비유지관리사 자격 평가',
                    pass_score: 60,
                    cert_courses: { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정' }
                }
            },
            {
                id: 'dummy-a3',
                attempt_no: 2,
                score: 72.5,
                total_points: 100,
                is_passed: true,
                submitted_at: '2026-06-20T09:40:00Z',
                answers: [],
                cert_exams: {
                    id: 'dummy-exam-3',
                    title: '영선실무관리사 자격 평가',
                    pass_score: 60,
                    cert_courses: { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정' }
                }
            }
        ];

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }

        function requireLogin() {
            if (!currentUser) {
                window.location.href = '{{BASE}}login.html';
                return false;
            }
            return true;
        }

        async function fetchAttempts() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_exam_attempts')
                    .select('*, cert_exams(id, title, pass_score, cert_courses(id, title))')
                    .eq('user_id', currentUser.id)
                    .order('submitted_at', { ascending: false });

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyAttempts;
            } catch (e) {
                console.error('시험 응시 기록 조회 실패:', e);
                return dummyAttempts;
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function resultBadge(isPassed) {
            return isPassed
                ? '<span class="bg-green-600 text-white px-3 py-1.5 rounded text-[12px] font-bold whitespace-nowrap"><i class="fas fa-circle-check mr-1"></i>합격</span>'
                : '<span class="bg-red-500 text-white px-3 py-1.5 rounded text-[12px] font-bold whitespace-nowrap"><i class="fas fa-circle-xmark mr-1"></i>불합격</span>';
        }

        function renderList() {
            const container = document.getElementById('exam-list');
            let filtered = allAttempts;
            if (currentTab === 'PASS') filtered = allAttempts.filter(a => a.is_passed);
            if (currentTab === 'FAIL') filtered = allAttempts.filter(a => !a.is_passed);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24 bg-white border border-gray-200 rounded">
                        <i class="fas fa-file-circle-question text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium">아직 응시한 시험이 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(a => {
                const exam = a.cert_exams || {};
                const course = exam.cert_courses || {};
                const score = a.score !== null && a.score !== undefined ? a.score : '-';

                return `
                    <div class="exam-card">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                ${resultBadge(a.is_passed)}
                                <span class="text-[12px] text-gray-500 font-medium">응시 ${a.attempt_no || 1}회차 · ${formatDate(a.submitted_at)}</span>
                            </div>
                            <div class="font-bold text-[15.5px] text-[#0B2A5B] mb-1 truncate">${course.title || '-'}</div>
                            <div class="text-[13px] text-gray-500 truncate">${exam.title || '-'}</div>
                        </div>
                        <div class="shrink-0 text-center px-4">
                            <div class="text-2xl font-black text-[#12387a]">${score}<span class="text-sm text-gray-400 font-bold">점</span></div>
                            <div class="text-[11.5px] text-gray-400">합격기준 ${exam.pass_score ?? 60}점</div>
                        </div>
                        <button onclick='openDetail(${JSON.stringify(a).replace(/'/g, "&apos;")})' class="shrink-0 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-5 rounded transition-colors whitespace-nowrap">상세 보기</button>
                    </div>
                `;
            }).join('');
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderList();
        }

        function openDetail(attempt) {
            const exam = attempt.cert_exams || {};
            const course = exam.cert_courses || {};
            document.getElementById('modal-title').textContent = `${course.title || '시험 결과'} - 상세 결과`;

            const answers = attempt.answers || [];
            let bodyHtml = `
                <div class="grid grid-cols-3 gap-3 mb-6 bg-gray-50 border border-gray-100 rounded-lg p-4 text-center">
                    <div><div class="text-[12px] text-gray-500 mb-1">점수</div><div class="font-black text-lg text-[#12387a]">${attempt.score ?? '-'}점</div></div>
                    <div><div class="text-[12px] text-gray-500 mb-1">합격 여부</div><div class="font-black text-lg">${attempt.is_passed ? '<span class=\\'text-green-600\\'>합격</span>' : '<span class=\\'text-red-500\\'>불합격</span>'}</div></div>
                    <div><div class="text-[12px] text-gray-500 mb-1">응시일</div><div class="font-black text-lg text-[#0B2A5B]">${formatDate(attempt.submitted_at)}</div></div>
                </div>
            `;

            if (answers.length > 0) {
                bodyHtml += `<div class="text-sm font-bold text-gray-700 mb-3">문제별 정답/오답</div>`;
                bodyHtml += answers.map((r, idx) => `
                    <div class="review-item ${r.is_correct ? 'correct' : 'incorrect'}">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-gray-700 text-sm">문제 ${idx + 1}</span>
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${r.is_correct ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">${r.is_correct ? '정답' : '오답'}</span>
                        </div>
                        <div class="text-[13px] text-gray-500 mt-1">선택: ${r.selected_option ?? '-'}번</div>
                    </div>
                `).join('');
            } else {
                bodyHtml += `<div class="text-center text-gray-400 text-sm py-8">문제별 상세 데이터가 없습니다.</div>`;
            }

            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        async function init() {
            await fetchUser();
            if (!requireLogin()) return;

            allAttempts = await fetchAttempts();
            renderList();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
