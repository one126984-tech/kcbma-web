<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 시험 결과</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- 상단 네비게이션 바 -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <div class="flex items-center gap-6">
        <h1 class="text-xl font-black text-[#1e3a8a]">KCBMA 대한집합건물관리협회</h1>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span class="font-bold">회원님, 안녕하세요!</span>
        <button class="bg-gray-700 text-white px-3 py-1.5 rounded font-bold hover:bg-gray-800">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto mt-8 px-4 flex flex-col md:flex-row gap-8 pb-20">
    
    <!-- 좌측 사이드바 -->
    <aside class="w-full md:w-64 flex-shrink-0">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <ul class="flex flex-col text-center font-bold text-gray-600">
          <li><a href="dashboard.html" class="block py-4 hover:bg-gray-50 border-b">대시보드</a></li>
          <li><a href="my-courses.html" class="block py-4 hover:bg-gray-50 border-b">내 수강 목록</a></li>
          <li><a href="my-certs.html" class="block py-4 hover:bg-gray-50 border-b">내 자격증</a></li>
          <!-- 현재 메뉴 활성화 -->
          <li><a href="my-exams.html" class="block py-4 bg-[#2563eb] text-white border-b shadow-inner">시험 결과</a></li>
          <li><a href="my-field-courses.html" class="block py-4 hover:bg-gray-50 border-b">내 현장교육 신청</a></li>
          <li><a href="my-sos.html" class="block py-4 hover:bg-gray-50 border-b">내 SOS 내역</a></li>
          <li><a href="#" class="block py-4 hover:bg-gray-50">내 정보</a></li>
        </ul>
      </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <section class="flex-1">
      <h2 class="text-2xl font-bold text-[#1e3a8a] mb-4">시험 결과</h2>

      <!-- 탭 메뉴 -->
      <div class="bg-white rounded-t-lg shadow-sm border border-gray-200 flex px-6 pt-4 gap-8 text-gray-500 font-bold border-b">
        <button class="pb-3 border-b-2 border-blue-600 text-blue-800">전체</button>
        <button class="pb-3 border-b-2 border-transparent hover:text-blue-600">합격</button>
        <button class="pb-3 border-b-2 border-transparent hover:text-blue-600">불합격</button>
      </div>

      <!-- 리스트 (예시 데이터) -->
      <div class="bg-white border border-t-0 border-gray-200 rounded-b-lg p-6 space-y-4">
        <div class="border border-gray-200 rounded-lg p-5 flex justify-between items-center hover:bg-gray-50 transition cursor-pointer" onclick="openExamModal()">
          <div>
            <div class="flex items-center gap-3 mb-2">
              <span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-black">합격</span>
              <span class="text-sm text-gray-500 font-medium">2026. 08. 15</span>
            </div>
            <h3 class="text-lg font-bold text-gray-900">제1회 건물관리사 자격시험</h3>
            <p class="text-sm text-gray-500 mt-1">점수: 85점 / 100점</p>
          </div>
          <div class="text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 💡 시험 결과 상세 모달 (X 버튼에 onclick 이벤트 추가) -->
  <div id="examDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative">
      
      <!-- 닫기 버튼: onclick="closeExamModal()" 가 모달을 닫게 만듭니다 -->
      <button onclick="closeExamModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 transition bg-gray-100 hover:bg-gray-200 rounded-full p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      
      <h3 class="text-xl font-bold text-gray-900 mb-6">시험 결과 상세</h3>
      
      <div class="space-y-4 text-sm">
        <div class="flex justify-between border-b pb-2">
          <span class="text-gray-500">시험명</span>
          <span class="font-bold text-gray-900">제1회 건물관리사 자격시험</span>
        </div>
        <div class="flex justify-between border-b pb-2">
          <span class="text-gray-500">응시일자</span>
          <span class="font-bold text-gray-900">2026. 08. 15</span>
        </div>
        <div class="flex justify-between border-b pb-2">
          <span class="text-gray-500">총점</span>
          <span class="font-bold text-blue-600 text-lg">85점</span>
        </div>
        <div class="flex justify-between pb-2">
          <span class="text-gray-500">결과</span>
          <span class="font-bold text-green-600 bg-green-100 px-2 py-1 rounded">최종 합격</span>
        </div>
      </div>

      <div class="mt-8">
        <button onclick="closeExamModal()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
          확인
        </button>
      </div>
    </div>
  </div>

  <script>
    // 모달 열기
    function openExamModal() {
      document.getElementById('examDetailModal').classList.remove('hidden');
    }

    // 모달 닫기
    function closeExamModal() {
      document.getElementById('examDetailModal').classList.add('hidden');
    }
  </script>
</body>
</html>
