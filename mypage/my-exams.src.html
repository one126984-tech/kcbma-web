<script>
/* [번쩍임 방지] 로그인 정보가 없으면 화면을 그리기 전에 곧바로 로그인 화면으로 보냄
   (예전엔 마이페이지가 잠깐 보였다가 로그인 화면으로 넘어가 화면이 번쩍였음)
   실제 로그인 여부는 아래 페이지 스크립트가 서버 기준으로 다시 확인함 */
(function () {
    try {
        // ★ 카카오/구글 로그인에서 막 돌아온 경우(주소에 ?code= 등)는 아직 로그인 정보가 저장되기 전이므로
        //   절대 돌려보내지 않음 — 페이지 스크립트가 로그인 처리를 끝내도록 둠
        if (/[?&](code|error|error_description)=/.test(location.search) || /access_token=|error=/.test(location.hash)) return;
        if (!localStorage.getItem('sb-ehrahnnowwjkgycvlbzk-auth-token')) {
            localStorage.setItem('returnUrl', location.pathname + location.search);
            location.replace('{{BASE}}login.html');
        }
    } catch (e) {}
})();
</script>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;
        let allAttempts = [];
        let examMap = {};    // exam_id → 시험 정보
        let courseMap = {};  // course_id → 과정 정보
        let currentTab = 'ALL';

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }

        // 내 응시 기록 + 시험명/과정명 (조회 실패 시 빈 목록 — 가짜 데이터는 보여주지 않음)
        async function fetchAttempts() {
            const { data, error } = await supabaseClient
                .from('cert_exam_attempts')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });
            if (error) {
                console.error('시험 결과 조회 오류:', error);
                return null;
            }
            const rows = data || [];

            const examIds = [...new Set(rows.map(r => r.exam_id).filter(v => v != null))];
            if (examIds.length) {
                const { data: exams, error: e1 } = await supabaseClient.from('cert_exams').select('*').in('id', examIds);
                if (e1) console.error('시험 정보 조회 오류:', e1);
                (exams || []).forEach(x => { examMap[x.id] = x; });

                const courseIds = [...new Set((exams || []).map(x => x.course_id).filter(v => v != null))];
                if (courseIds.length) {
                    const { data: courses, error: e2 } = await supabaseClient.from('cert_courses').select('id, title').in('id', courseIds);
                    if (e2) console.error('과정 정보 조회 오류:', e2);
                    (courses || []).forEach(c => { courseMap[c.id] = c; });
                }
            }
            return rows;
        }

        // 제출 안 한 응시(시험 도중 나감 등)는 '미제출'
        function stateOf(a) {
            if (!a.submitted_at) return 'WAIT';
            return a.is_passed ? 'PASS' : 'FAIL';
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function scoreOf(a) {
            const v = a.score != null ? a.score : (a.total_score != null ? a.total_score : null);
            return v == null ? null : Number(v);
        }

        function renderList() {
            const container = document.getElementById('exam-list');
            if (allAttempts === null) {
                container.innerHTML = `
                    <div class="text-center py-24 bg-white border border-gray-200 rounded">
                        <i class="fas fa-circle-exclamation text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium">시험 결과를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
                    </div>`;
                return;
            }

            const filtered = currentTab === 'ALL' ? allAttempts : allAttempts.filter(a => stateOf(a) === currentTab);

            if (filtered.length === 0) {
                const msg = allAttempts.length === 0
                    ? '아직 응시한 시험이 없습니다.<br>수강을 마친 과정은 <b>내 수강 목록</b>에서 시험을 볼 수 있습니다.'
                    : '해당 조건의 시험 기록이 없습니다.';
                container.innerHTML = `
                    <div class="text-center py-24 bg-white border border-gray-200 rounded">
                        <i class="fas fa-file-pen text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium leading-relaxed">${msg}</p>
                        ${allAttempts.length === 0 ? `<button onclick="location.href='my-courses.html'" class="exam-btn mt-5">내 수강 목록 가기</button>` : ''}
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(a => {
                const exam = examMap[a.exam_id] || {};
                const course = courseMap[exam.course_id] || {};
                const st = stateOf(a);
                const score = scoreOf(a);
                const passScore = exam.pass_score || 60;
                const badge = st === 'PASS' ? '<span class="badge badge-pass">합격</span>'
                            : st === 'FAIL' ? '<span class="badge badge-fail">불합격</span>'
                            : '<span class="badge badge-wait">미제출</span>';
                const color = st === 'PASS' ? '#15803d' : st === 'FAIL' ? '#dc2626' : '#9ca3af';
                const scoreHtml = (st !== 'WAIT' && score != null)
                    ? `<div class="num" style="color:${color}">${KC.esc(score)}<span style="font-size:14px">점</span></div><div class="sub">합격 ${KC.esc(passScore)}점</div>`
                    : `<div class="num" style="color:${color}">-</div><div class="sub">점수 없음</div>`;

                // 버튼: 합격 → 내 수료증 / 불합격·미제출 → 다시 응시(시험 화면에서 남은 횟수 확인)
                let btn = '';
                if (st === 'PASS') {
                    btn = `<button class="exam-btn" onclick="location.href='my-certs.html'"><i class="fas fa-award mr-1"></i>내 수료증</button>`;
                } else if (exam.id) {
                    btn = `<button class="exam-btn light" onclick="location.href='../cert/cert-exam.html?exam_id=${encodeURIComponent(exam.id)}'"><i class="fas fa-rotate-right mr-1"></i>다시 응시</button>`;
                }

                return `
                <div class="exam-card">
                    <div class="exam-score">${scoreHtml}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            ${badge}
                            <span class="text-[12px] text-gray-500 font-medium">${formatDateTime(a.submitted_at || a.created_at)}</span>
                            ${a.attempt_no ? `<span class="text-[12px] text-gray-400">· ${KC.esc(a.attempt_no)}회차</span>` : ''}
                        </div>
                        <div class="font-bold text-[15.5px] text-[#0B2A5B] mb-1 truncate">${KC.esc(exam.title || '수료 평가')}</div>
                        <div class="text-[13px] text-gray-500 truncate">${KC.esc(course.title || '')}</div>
                    </div>
                    ${btn}
                </div>`;
            }).join('');
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderList();
        }

        async function init() {
            await fetchUser();
            if (!currentUser) {
                window.location.href = '{{BASE}}login.html';
                return;
            }
            allAttempts = await fetchAttempts();
            renderList();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
