    <style>
        /* 이 페이지(내 수강 목록) 전용 CSS */
        html, body { overflow-y: scroll; }

        .tab-item { padding: 10px 22px; font-size: 14.5px; font-weight: 700; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab-item:hover { color: #12387a; }
        .tab-item.active { color: #12387a; border-bottom-color: #12387a; }
        .course-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 16px; transition: box-shadow 0.2s, transform 0.2s; }
        @media (min-width: 768px) { .course-card { flex-direction: row; align-items: center; gap: 24px; } }
        .course-card:hover { box-shadow: 0 6px 18px rgba(15,23,42,0.06); }
        .progress-bar-bg { width: 100%; height: 8px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #274bce, #12387a); border-radius: 6px; transition: width 0.4s; }
        .pay-badge-pending { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        .pay-badge-confirmed { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .pay-badge-issued { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .cert-account-mini { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: #475569; margin-top: 8px; }
        .cert-account-mini b { color: #12387a; }
        .empty-state { text-align: center; padding: 80px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; color: #6b7280; }
        .empty-state i { font-size: 40px; color: #cbd5e1; margin-bottom: 16px; display: block; }
        .cert-loading-box { text-align: center; padding: 80px 20px; color: #6b7280; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; }
        .cert-spinner { width: 36px; height: 36px; border: 4px solid #dbe4f5; border-top-color: #12387a; border-radius: 50%; margin: 0 auto 14px; animation: cert-spin 0.8s linear infinite; }
        @keyframes cert-spin { to { transform: rotate(360deg); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 9998; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.show { opacity: 1; }
        .modal-box { background: #fff; border-radius: 14px; padding: 32px; width: 90%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); transform: translateY(10px); transition: transform 0.2s; }
        .modal-overlay.show .modal-box { transform: translateY(0); }
        .modal-title { font-size: 18px; font-weight: 900; color: #0B2A5B; margin-bottom: 6px; }
        .modal-desc { font-size: 13.5px; color: #6b7280; margin-bottom: 18px; line-height: 1.6; }
        .modal-input { width: 100%; border: 1.5px solid #d1d5db; border-radius: 8px; padding: 12px 14px; font-size: 15px; margin-bottom: 18px; transition: border-color 0.15s; }
        .modal-input:focus { outline: none; border-color: #12387a; }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>

<div id="page-content" class="flex-1 flex flex-col">



    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='dashboard.html'">대시보드</div>
                <div class="side-menu-tab-active">내 수강 목록</div>
                <div class="side-menu-tab" onclick="window.location.href='my-certs.html'">내 자격증</div>
                <div class="side-menu-tab" onclick="window.location.href='my-exams.html'">시험 결과</div>
                <div class="side-menu-tab">내 정보</div>
            </div>
        </aside>
        <section class="flex-1 min-w-0">
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm mb-6 flex items-center overflow-x-auto no-scrollbar">
                <div class="tab-item active" data-status="ALL" onclick="setTab('ALL')">전체</div>
                <div class="tab-item" data-status="ACTIVE" onclick="setTab('ACTIVE')">수강 중</div>
                <div class="tab-item" data-status="COMPLETED" onclick="setTab('COMPLETED')">수료</div>
                <div class="tab-item" data-status="EXPIRED" onclick="setTab('EXPIRED')">만료</div>
            </div>
            <div id="course-list">
                <div class="cert-loading-box">
                    <div class="cert-spinner"></div>
                    <p>데이터를 불러오는 중입니다...</p>
                </div>
            </div>
        </section>

    </div>
    <!-- 핑크박스 끝 -->

    <div id="issue-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title"><i class="fas fa-award mr-1 text-[#12387a]"></i> 자격증 발급 신청</div>
            <p class="modal-desc" id="issue-modal-desc">입금하신 <b>입금자명</b>을 입력해 주세요. 관리자가 입금 확인 후 자격증을 발급해 드립니다.</p>
            <input type="text" id="depositor-name-input" class="modal-input" placeholder="입금자명 (예: 홍길동)">
            <div class="flex gap-3">
                <button onclick="closeIssueModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition">취소</button>
                <button id="issue-modal-submit" onclick="submitIssueRequest()" class="flex-1 py-3 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold rounded-lg transition">발급 신청</button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;
        let allEnrollments = [];
        let currentTab = 'ALL';
        let passedCourseIds = new Set();
        let certificateByCourse = {};
        const dummyEnrollments = [
            {
                id: 'dummy-e1',
                status: 'ACTIVE',
                progress_rate: 62.5,
                enrolled_at: '2026-07-20T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전', edu_method: 'VOD', cert_price: 250000 }
            },
            {
                id: 'dummy-e2',
                status: 'ACTIVE',
                progress_rate: 30,
                enrolled_at: '2026-08-01T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계', edu_method: 'MIX', cert_price: 250000 }
            },
            {
                id: 'dummy-e3',
                status: 'COMPLETED',
                progress_rate: 100,
                enrolled_at: '2026-06-01T00:00:00Z',
                completed_at: '2026-06-25T00:00:00Z',
                cert_courses: { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선', edu_method: 'VOD', cert_price: 250000 }
            },
            {
                id: 'dummy-e4',
                status: 'EXPIRED',
                progress_rate: 45,
                enrolled_at: '2026-03-01T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-5', title: '배관시설관리사 실무 심화과정 (Zoom 화상강의)', category: '배관', edu_method: 'LIVE', cert_price: 250000 }
            }
        ];
        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }
        function requireLogin() {
            if (!currentUser) {
                window.location.href = '{{BASE}}login.html';
                return false;
            }
            return true;
        }
        async function fetchEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(*)')
                    .eq('user_id', currentUser.id)
                    .order('enrolled_at', { ascending: false });
                if (error) throw error;
                return (data && data.length > 0) ? data : dummyEnrollments;
            } catch (e) {
                console.error('수강 목록 조회 실패:', e);
                return dummyEnrollments;
            }
        }
        async function fetchPassedCourseIds() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_exam_attempts')
                    .select('is_passed, cert_exams(course_id)')
                    .eq('user_id', currentUser.id)
                    .eq('is_passed', true);
                if (error) throw error;
                const set = new Set();
                (data || []).forEach(row => {
                    const cid = row.cert_exams && row.cert_exams.course_id;
                    if (cid !== undefined && cid !== null) set.add(cid);
                });
                return set;
            } catch (e) {
                console.error('시험 합격 여부 조회 실패:', e);
                return new Set();
            }
        }
        async function fetchCertificatesByCourse() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .in('status', ['PENDING_PAYMENT', 'PAYMENT_CONFIRMED', 'ISSUED']);
                if (error) throw error;
                const map = {};
                (data || []).forEach(row => { map[row.course_id] = row; });
                return map;
            } catch (e) {
                console.error('자격증 발급 내역 조회 실패:', e);
                return {};
            }
        }
        let pendingIssueCourseId = null;
        function openIssueModal(courseId, certPrice) {
            pendingIssueCourseId = courseId;
            const amt = (certPrice !== undefined && certPrice !== null) ? certPrice : CERT_PAYMENT_ACCOUNT.amount;
            document.getElementById('issue-modal-desc').innerHTML = `
                ${renderCertAccountBox(amt)}
                입금 후 <b>입금자명</b>을 입력하고 발급 신청 버튼을 눌러주세요.
            `;
            document.getElementById('depositor-name-input').value = '';
            const modal = document.getElementById('issue-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }
        function closeIssueModal() {
            const modal = document.getElementById('issue-modal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 200);
            pendingIssueCourseId = null;
        }
        async function submitIssueRequest() {
            const name = document.getElementById('depositor-name-input').value.trim();
            if (!name) {
                showToast('입금자명을 입력해 주세요.', 'error');
                return;
            }
            if (!pendingIssueCourseId) return;
            const btn = document.getElementById('issue-modal-submit');
            const originalLabel = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 처리 중...';
            try {
                const { data, error } = await supabaseClient.rpc('issue_certificate', {
                    p_course_id: pendingIssueCourseId,
                    p_depositor_name: name
                });
                if (error) throw error;
                if (!data || data.success === false) {
                    showToast((data && data.error) || '자격증 발급 신청에 실패했습니다.', 'error');
                    return;
                }
                certificateByCourse[pendingIssueCourseId] = {
                    status: 'PENDING_PAYMENT',
                    payment_amount: data.payment_amount,
                    depositor_name: name
                };
                showToast('자격증 발급 신청이 접수되었습니다.\n입금 확인 후 발급될 예정입니다.', 'success');
                closeIssueModal();
                renderList();
            } catch (e) {
                console.error('자격증 발급 신청 실패:', e);
                showToast('발급 신청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalLabel;
            }
        }
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }
        function statusBadge(status) {
            if (status === 'ACTIVE') return '<span class="bg-blue-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">수강중</span>';
            if (status === 'COMPLETED') return '<span class="bg-green-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">수료</span>';
            if (status === 'EXPIRED') return '<span class="bg-gray-400 text-white px-2.5 py-1 rounded text-[11px] font-bold">만료</span>';
            if (status === 'CANCELLED') return '<span class="bg-red-400 text-white px-2.5 py-1 rounded text-[11px] font-bold">취소</span>';
            return '<span class="bg-gray-300 text-white px-2.5 py-1 rounded text-[11px] font-bold">-</span>';
        }
        function methodText(method) {
            if (method === 'VOD') return '동영상(VOD)';
            if (method === 'LIVE') return '실시간(Zoom)';
            if (method === 'MIX') return '혼합형';
            return '-';
        }
        function actionButton(e) {
            const course = e.cert_courses || {};
            const courseId = course.id;
            const certPrice = (course.cert_price !== undefined && course.cert_price !== null) ? course.cert_price : CERT_PAYMENT_ACCOUNT.amount;
            if (e.status === 'ACTIVE') {
                return `<button onclick="location.href='../cert/cert-player.html?enrollment_id=${e.id}'" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-5 rounded-lg transition-colors whitespace-nowrap"><i class="fas fa-play mr-1"></i>학습하기</button>`;
            }
            if (e.status === 'COMPLETED') {
                const cert = certificateByCourse[courseId];
                if (cert && cert.status === 'ISSUED') {
                    return `
                        <div class="flex flex-col items-end gap-1.5">
                            <span class="pay-badge-issued text-[12.5px] font-bold px-3 py-1.5 rounded whitespace-nowrap">
                                <i class="fas fa-certificate mr-1"></i>자격증 발급 완료
                            </span>
                            <span class="text-[11.5px] text-gray-500 whitespace-nowrap">번호: ${cert.cert_number || '-'}</span>
                            <a href="../cert/cert-verify.html" class="text-[12px] text-[#12387a] font-bold underline whitespace-nowrap">진위확인 페이지</a>
                        </div>
                    `;
                }
                if (cert && cert.status === 'PAYMENT_CONFIRMED') {
                    return `
                        <div class="flex flex-col items-end gap-1.5">
                            <span class="pay-badge-confirmed text-[12.5px] font-bold px-3 py-1.5 rounded whitespace-nowrap">
                                <i class="fas fa-gear mr-1"></i>발급 진행 중
                            </span>
                            <span class="text-[11px] text-gray-400 whitespace-nowrap">입금 확인 완료 · 자격증 발급 대기</span>
                        </div>
                    `;
                }
                if (cert && cert.status === 'PENDING_PAYMENT') {
                    return `
                        <div class="flex flex-col items-end gap-1.5">
                            <span class="pay-badge-pending text-[12.5px] font-bold px-3 py-1.5 rounded whitespace-nowrap">
                                <i class="fas fa-clock mr-1"></i>입금 확인 대기 중
                            </span>
                            <span class="text-[11px] text-gray-400 whitespace-nowrap">입금자명: ${cert.depositor_name || '-'}</span>
                        </div>
                    `;
                }
                if (passedCourseIds.has(courseId)) {
                    return `
                        <div class="flex flex-col items-end gap-2">
                            <button onclick="openIssueModal('${courseId}', ${certPrice})" class="bg-[#0B2A5B] hover:bg-[#081f45] text-white font-bold text-[13px] py-2.5 px-5 rounded-lg transition-colors whitespace-nowrap shadow-sm">
                                <i class="fas fa-award mr-1"></i>자격증 발급 신청 (${certPrice.toLocaleString()}원)
                            </button>
                            <div class="cert-account-mini text-right">
                                <b>${CERT_PAYMENT_ACCOUNT.bank} ${CERT_PAYMENT_ACCOUNT.number}</b><br>예금주: ${CERT_PAYMENT_ACCOUNT.holder}
                            </div>
                        </div>
                    `;
                }
                return `<button onclick="location.href='../cert/cert-exam.html?course_id=${courseId || ''}'" class="bg-green-600 hover:bg-green-700 text-white font-bold text-[13px] py-2.5 px-5 rounded-lg transition-colors whitespace-nowrap"><i class="fas fa-pen mr-1"></i>시험 응시</button>`;
            }
            return `<button onclick="location.href='../cert/cert-detail.html?id=${courseId || ''}'" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-[13px] py-2.5 px-5 rounded-lg transition-colors whitespace-nowrap">과정 보기</button>`;
        }
        function renderList() {
            const container = document.getElementById('course-list');
            const filtered = currentTab === 'ALL' ? allEnrollments : allEnrollments.filter(e => e.status === currentTab);
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p class="font-bold text-gray-500 mb-1">해당 조건의 수강 내역이 없습니다.</p>
                        <p class="text-[13px] text-gray-400 mb-5">관심 있는 자격증 과정을 둘러보세요.</p>
                        <a href="../cert/cert-list.html" class="inline-block bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-6 rounded-lg transition-colors">자격증 과정 보러가기</a>
                    </div>
                `;
                return;
            }
            container.innerHTML = filtered.map(e => {
                const course = e.cert_courses || {};
                const rate = Number(e.progress_rate) || 0;
                return `
                    <div class="course-card">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                ${statusBadge(e.status)}
                                <span class="text-[12px] text-gray-500 font-medium">${course.category || '-'} · ${methodText(course.edu_method)}</span>
                            </div>
                            <div class="font-bold text-[16px] text-[#0B2A5B] mb-3 truncate">${course.title || '-'}</div>
                            <div class="progress-bar-bg mb-2">
                                <div class="progress-bar-fill" style="width:${rate}%;"></div>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 md:gap-4 text-[12.5px] text-gray-500">
                                <span>진도율 <strong class="text-[#12387a]">${rate}%</strong></span>
                                <span>수강 시작일 ${formatDate(e.enrolled_at)}</span>
                                ${e.completed_at ? `<span>수료일 ${formatDate(e.completed_at)}</span>` : ''}
                            </div>
                        </div>
                        <div class="shrink-0">${actionButton(e)}</div>
                    </div>
                `;
            }).join('');
        }
        function setTab(status) {
            currentTab = status;
            document.querySelectorAll('.tab-item').forEach(el => {
                el.classList.toggle('active', el.dataset.status === status);
            });
            renderList();
        }
        async function init() {
            await fetchUser();
            if (!requireLogin()) return;
            allEnrollments = await fetchEnrollments();
            passedCourseIds = await fetchPassedCourseIds();
            certificateByCourse = await fetchCertificatesByCourse();
            renderList();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
