<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>네이버 로그인 처리중...</title>
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="margin-top: 100px; text-align: center;">
        <h3>로그인 처리 중입니다. 잠시만 기다려주세요...</h3>
    </div>

    <script>
      // 1. Supabase 세팅
      const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      // 2. 네이버 정보 받아오기 세팅
      const naverLogin = new naver.LoginWithNaverId({
        clientId: "VD2UEjPCJu9cGeA6Ywdr",
        callbackUrl: window.location.origin + "/callback.html",
        isPopup: false
      });
      naverLogin.init();

      // 3. 로그인 정보 처리
      window.addEventListener('load', function () {
        naverLogin.getLoginStatus(async function (status) {
          if (status) {
            const email = naverLogin.user.getEmail();
            const naverId = naverLogin.user.getId(); 
            const name = naverLogin.user.getName();
            
            try {
                // (1) 먼저 로그인을 시도합니다.
                const { data: signInData, error: signInError } = await _supabase.auth.signInWithPassword({
                    email: email, 
                    password: naverId 
                });

                // (2) 로그인 실패 시 (가입된 적이 없거나 정보가 다를 때) 회원가입을 시도합니다.
                if (signInError) {
                    const { data: signUpData, error: signUpError } = await _supabase.auth.signUp({
                        email: email, 
                        password: naverId, 
                        options: { data: { full_name: name } }
                    });

                    if (signUpError) {
                        console.error("회원가입 에러:", signUpError.message);
                        alert("로그인 처리 중 문제가 발생했습니다.");
                        window.location.replace('index.html');
                        return;
                    }
                    
                    // 회원가입 직후 세션이 없다면 Supabase 설정 문제입니다. (2단계에서 해결)
                    if (!signUpData.session) {
                        alert("회원가입은 성공했으나, Supabase의 '이메일 인증(Confirm Email)' 설정이 켜져 있어 로그인이 보류되었습니다.");
                        window.location.replace('index.html');
                        return;
                    }
                }

                // (3) 처리가 끝나면 원래 페이지(또는 메인 페이지)로 자연스럽게 돌아갑니다.
                const returnUrl = localStorage.getItem('returnUrl') || 'index.html';
                localStorage.removeItem('returnUrl');
                window.location.replace(returnUrl); 

            } catch (e) {
                console.error("처리 중 예외 발생:", e);
                window.location.replace('index.html');
            }
          } else {
             alert("네이버 로그인에 실패했습니다.");
             window.location.replace('index.html');
          }
        });
      });
    </script>
</body>
</html>
