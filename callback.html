<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8">
    <title>네이버 로그인 처리중...</title>
    <!-- 네이버 및 Supabase SDK -->
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <p>로그인 처리 중입니다. 잠시만 기다려주세요...</p>

    <script>
      // 1. Supabase 세팅
      const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      // 2. 네이버 정보 받아오기 세팅
      // ★ 로그인 버튼(login.src.html의 startNaverLogin)이 현재 접속 도메인 기준으로
      //   콜백 주소를 동적으로 만들어 네이버에 보내는데, 여기서는 항상 운영 도메인으로
      //   고정되어 있어서 로컬(127.0.0.1:5500 등)에서 테스트하면 주소가 서로 어긋나
      //   네이버 로그인이 아예 시작되지 않는 문제가 있었음. 동일하게 동적으로 맞춤.
      const naverLogin = new naver.LoginWithNaverId({
        clientId: "VD2UEjPCJu9cGeA6Ywdr", // ★ 2026-09: 새 네이버 앱으로 교체 (기존 앱 client info invalid 문제)
        callbackUrl: window.location.origin + "/callback.html",
        isPopup: false
      });
      naverLogin.init();

      // 3. 로그인 정보 처리 및 원래 페이지로 돌려보내기
      window.addEventListener('load', function () {
        naverLogin.getLoginStatus(async function (status) {
          try {
          if (status) {
            const email = naverLogin.user.getEmail();
            const naverId = naverLogin.user.getId(); 
            const name = naverLogin.user.getName();
            // ★★ 임시 진단 코드 ★★
            alert("네이버에서 받은 정보\n이메일: " + email + "\n아이디: " + naverId);
            
            // Supabase 로그인/가입 처리
            const { data, error } = await _supabase.auth.signInWithPassword({
              email: email, password: naverId 
            });

            // ★★ 임시 진단 코드 — 원인 파악되면 삭제 예정 ★★
            if (error) {
              console.log('[네이버→Supabase 로그인] signIn 에러:', error);
            } else {
              console.log('[네이버→Supabase 로그인] signIn 성공, 세션 있음?', !!data?.session);
            }

            if (error && error.message.includes("Invalid login credentials")) {
                const signUpResult = await _supabase.auth.signUp({
                  email: email, password: naverId, options: { data: { full_name: name } }
                });
                // ★★ 임시 진단 코드 — 원인 파악되면 삭제 예정 ★★
                console.log('[네이버→Supabase 로그인] signUp 결과:', signUpResult);
                if (signUpResult.error) {
                  alert("네이버 계정 연동 중 오류가 발생했습니다.\n\n" + signUpResult.error.message);
                } else if (!signUpResult.data.session) {
                  alert("계정은 생성됐지만 로그인 세션이 만들어지지 않았습니다.\n(이메일 인증이 필요한 설정일 수 있음)\n\n이메일: " + email);
                }
            } else if (error) {
              alert("네이버 계정 연동 로그인 중 오류가 발생했습니다.\n\n" + error.message + "\n\n이메일: " + email);
            }

            // ★★ 임시 진단 코드 — 리다이렉트 직전 실제 세션 상태를 한 번 더 확인 ★★
            const { data: finalCheck } = await _supabase.auth.getSession();
            alert("리다이렉트 직전 세션 상태: " + (finalCheck.session ? "있음 (" + finalCheck.session.user.email + ")" : "없음"));

            // 처리가 끝났으므로, 처음에 저장해둔 원래 페이지(예: 구인구직) 주소를 꺼내서 그곳으로 이동시킵니다.
            const returnUrl = localStorage.getItem('returnUrl') || '/';
            localStorage.removeItem('returnUrl'); // 쓴 주소는 청소
            window.location.href = returnUrl; 
          } else {
             alert("네이버 로그인에 실패했습니다.");
             window.location.href = '/';
          }
          } catch (e) {
            // ★★ 임시 진단 코드 — 조용히 죽는 예외를 잡아서 보여줌 ★★
            alert("처리 중 예외 발생:\n" + e.message);
            console.error(e);
          }
        });
      });
    </script>
</body>
</html>
