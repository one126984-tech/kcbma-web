<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS 전문가 상황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
    
    /* 🚨 새 호출 시 깜빡이는 효과 */
    @keyframes flash-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.5); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .new-alert {
      animation: flash-red 1.5s infinite;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- 보안 경고 모달 (임시 로그인 역할) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl max-w-md w-full text-center shadow-2xl">
      <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-2xl font-black text-gray-900 mb-2">전문가 전용 구역</h2>
      <p class="text-gray-500 mb-6">협회에 등록된 전문가만 접근 가능합니다.<br>비밀번호를 입력해 주세요.</p>
      <input type="password" id="admin-pw" class="w-full border-2 border-gray-300 rounded-xl p-3 mb-4 text-center text-lg tracking-widest focus:border-red-500 focus:outline-none" placeholder="비밀번호 입력">
      <button onclick="checkAuth()" class="w-full bg-[#23344e] text-white font-bold py-3.5 rounded-xl text-lg hover:bg-[#1a2639] transition">접속하기</button>
      <p class="text-xs text-gray-400 mt-4">* 테스트용 비밀번호: 1234</p>
    </div>
  </div>

  <!-- 헤더 -->
  <header class="bg-[#23344e] text-white p-4 shadow-md flex justify-between items-center shrink-0">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-satellite-dish mr-2 text-red-400"></i>전문가 긴급 관제센터</h1>
      <span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded animate-pulse">수신 중</span>
    </div>
    <div class="flex items-center gap-4 text-sm font-medium">
      <button id="sound-toggle" onclick="toggleSound()" class="text-white hover:text-gray-300 transition flex items-center gap-2">
        <i class="fa-solid fa-bell"></i> 알림음 켜짐
      </button>
      <span>접속자: 이배관 대표님</span>
    </div>
  </header>

  <!-- 대시보드 본문 -->
  <main class="flex-1 p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
      
      <div class="flex justify-between items-end mb-6">
        <div>
          <h2 class="text-2xl font-black text-gray-800">현재 대기 중인 SOS</h2>
          <p class="text-gray-500 text-sm mt-1">접수 후 5분 이내에 수락하지 않으면 다른 전문가에게 넘어갑니다.</p>
        </div>
        <div class="text-xl font-bold text-red-600 bg-red-100 px-4 py-2 rounded-full border border-red-200">
          대기: <span id="waiting-count">0</span>건
        </div>
      </div>

      <!-- 리스트 컨테이너 -->
      <div id="request-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- 빈 상태 메시지 -->
        <div id="empty-state" class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
          <i class="fa-regular fa-face-smile-wink text-5xl mb-4"></i>
          <p class="text-lg font-medium">현재 접수된 긴급 호출이 없습니다.</p>
        </div>
        
        <!-- 데이터가 여기에 추가됩니다 -->
      </div>
      
    </div>
  </main>

  <script>
    // --- 1. 보안 (임시 로그인) ---
    function checkAuth() {
      const pw = document.getElementById('admin-pw').value;
      if(pw === '1234') { // 테스트용 단순 비번
        document.getElementById('auth-modal').style.display = 'none';
        initSupabase(); // 로그인 성공 시 DB 연결 시작
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    // --- 2. 알람음 설정 ---
    let soundEnabled = true;
    const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); // 경쾌하고 명확한 알림음
    
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle');
      if(soundEnabled) {
        btn.innerHTML = '<i class="fa-solid fa-bell"></i> 알림음 켜짐';
        btn.classList.remove('text-gray-400');
      } else {
        btn.innerHTML = '<i class="fa-solid fa-bell-slash"></i> 알림음 꺼짐';
        btn.classList.add('text-gray-400');
      }
    }

    function playAlert() {
      if(soundEnabled) {
        alertSound.currentTime = 0; // 처음부터 다시 재생
        alertSound.play().catch(e => console.log('브라우저 정책으로 소리 자동재생 차단됨. 사용자가 화면을 클릭해야 함.'));
      }
    }

    // --- 3. Supabase 연동 및 화면 그리기 ---
    // 🔴 중요: 본인의 URL과 KEY를 입력하세요.
    const SUPABASE_URL = '여기에_URL_입력';
    const SUPABASE_ANON_KEY = '여기에_ANON_KEY_입력';
    let supabaseClient;

    function initSupabase() {
      if (SUPABASE_URL.startsWith('http')) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        fetchRequests(); // 최초 1회 불러오기
        subscribeToNewRequests(); // 실시간 감지 켜기
      } else {
        console.warn('⚠️ Supabase 키가 없어 로컬 테스트 모드로 실행됩니다.');
        // 테스트용 가짜 데이터 그리기
        setTimeout(() => {
          renderCard({
            id: 'test-123',
            category: '누수',
            region: '서울 강남구 역삼동',
            created_at: new Date().toISOString(),
            status: '대기중'
          }, true);
        }, 1000);
      }
    }

    async function fetchRequests() {
      const { data, error } = await supabaseClient
        .from('sos_requests')
        .select('*')
        .eq('status', '대기중')
        .order('created_at', { ascending: false });

      if (data && data.length > 0) {
        document.getElementById('empty-state').style.display = 'none';
        data.forEach(req => renderCard(req, false));
        updateCount(data.length);
      }
    }

    // 실시간 감지 로직
    function subscribeToNewRequests() {
      supabaseClient
        .channel('dashboard_requests')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'sos_requests' },
          (payload) => {
            document.getElementById('empty-state').style.display = 'none';
            // 🚨 새 데이터가 들어오면 카드 그리고 소리 재생!
            renderCard(payload.new, true); 
            playAlert(); 
            updateCount(1, true); // 카운트 +1
          }
        )
        .subscribe();
    }

    function updateCount(num, isAdd = false) {
      const el = document.getElementById('waiting-count');
      const current = parseInt(el.innerText);
      el.innerText = isAdd ? current + num : num;
    }

    // 카드 그리기
    function renderCard(req, isNew = false) {
      const list = document.getElementById('request-list');
      const timeStr = new Date(req.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      
      const div = document.createElement('div');
      // 새 호출이면 'new-alert' 클래스를 붙여서 빨갛게 깜빡이게 만듦
      div.className = `bg-white rounded-2xl shadow-md p-5 border ${isNew ? 'new-alert' : 'border-gray-200'} flex flex-col justify-between`;
      div.id = `card-${req.id}`;
      
      // 카테고리에 따른 색상/아이콘
      let badgeHtml = '';
      if(req.category === '화재') badgeHtml = '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">🔥 화재/소방</span>';
      else if(req.category === '누수') badgeHtml = '<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">💦 누수/배관</span>';
      else badgeHtml = `<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold">⚡ ${req.category}</span>`;

      div.innerHTML = `
        <div>
          <div class="flex justify-between items-start mb-4">
            ${badgeHtml}
            <span class="text-sm font-bold text-red-600">${timeStr} 접수</span>
          </div>
          <h3 class="text-lg font-bold text-gray-900 mb-2 truncate" title="${req.region}">${req.region}</h3>
          <p class="text-sm text-gray-500 bg-gray-50 p-2 rounded">
            선조치 후결제 동의 완료 건
          </p>
        </div>
        <div class="mt-5">
          <button onclick="acceptRequest('${req.id}', this)" class="w-full bg-[#111827] text-white font-bold py-3 rounded-xl hover:bg-black transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-yellow-400"></i> 내가 수락하기 (채팅방 이동)
          </button>
        </div>
      `;
      
      // 리스트의 맨 앞에 추가
      list.insertBefore(div, list.firstChild);
    }

    // 수락 처리
    async function acceptRequest(id, btnElement) {
      if(!confirm('이 건을 수락하고 상황실(채팅방)로 이동하시겠습니까?')) return;

      btnElement.innerText = '수락 처리 중...';
      btnElement.disabled = true;

      if(supabaseClient) {
        // DB 상태를 '진행중'으로 변경
        await supabaseClient
          .from('sos_requests')
          .update({ status: '진행중' })
          .eq('id', id);
      }

      // 채팅방으로 이동
      window.location.href = `sos-room.html?request_id=${id}`;
    }
  </script>
</body>
</html>
