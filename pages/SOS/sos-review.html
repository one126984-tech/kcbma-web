<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS 상담 종료 및 평가</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    /* 커스텀 체크박스 크기 조절 */
    input[type="checkbox"] {
      width: 1.75rem;
      height: 1.75rem;
      cursor: pointer;
    }
    .break-keep { word-break: keep-all; }
    
    /* 별점 호버 효과 */
    .star-btn { transition: color 0.2s; cursor: pointer; }
    .star-btn:hover, .star-btn.active { color: #facc15; /* Tailwind yellow-400 */ }
  </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen p-4">

  <!-- 중앙 컨테이너 -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col relative">

    <!-- 1. 상단 종료 안내 헤더 -->
    <div class="bg-[#23344e] text-white text-center py-8 px-5">
      <h1 class="text-2xl font-black mb-2 tracking-tight">상담이 종료되었습니다</h1>
      <p class="text-gray-300 text-[15px]">긴급 상황이 무사히 해결되셨기를 바랍니다.</p>
    </div>

    <!-- 2. 전문가 별점 평가 영역 -->
    <div class="p-6 text-center border-b border-gray-100">
      <h2 class="text-lg font-bold text-gray-800 mb-4">상담 전문가 평가</h2>
      <div class="flex justify-center gap-3 text-4xl text-gray-300 mb-3" id="star-rating">
        <i class="fa-solid fa-star star-btn active" data-value="1"></i>
        <i class="fa-solid fa-star star-btn active" data-value="2"></i>
        <i class="fa-solid fa-star star-btn active" data-value="3"></i>
        <i class="fa-solid fa-star star-btn active" data-value="4"></i>
        <i class="fa-solid fa-star star-btn active" data-value="5"></i>
      </div>
      <p class="text-gray-500 font-bold text-sm" id="rating-text">매우 만족 (5점)</p>
    </div>

    <!-- 3. 현장 사례집 공개 동의 (개편된 영역) -->
    <div class="p-5 md:p-6 bg-white">
      
      <label class="block bg-[#f4f9ff] border-2 border-[#bcdcff] rounded-2xl p-5 md:p-6 cursor-pointer hover:border-[#3b82f6] transition-colors shadow-sm relative overflow-hidden group">
        
        <div class="flex items-start gap-3 md:gap-4">
          <!-- 체크박스 -->
          <input type="checkbox" id="case-share-agree" checked class="mt-1 rounded text-blue-600 focus:ring-blue-500 border-gray-300 w-6 h-6 shrink-0 cursor-pointer">
          
          <div class="flex-1">
            <!-- 제목 -->
            <h3 class="font-black text-gray-900 text-[18px] md:text-[20px] mb-3 flex items-center gap-2 tracking-tight">
              <span class="border-b-2 border-gray-900 pb-0.5">현장 사례집 공개 동의</span>
              <span class="bg-gray-200 text-gray-600 text-[12px] font-bold px-2 py-1 rounded-md">선택</span>
            </h3>
            
            <div class="space-y-4">
              <!-- 강력한 호소 문구 -->
              <p class="text-[15.5px] text-gray-900 font-bold leading-relaxed break-keep">
                여러분의 소중한 경험을 같은 상황에 처한 분들께 공유해서 도움을 주시겠습니까?<br>
                <span class="text-red-600 font-black text-[17px] mt-1 block">지금 간절하게 도움이 필요합니다!!</span>
              </p>
              
              <!-- 💡 혜택 및 추가 안내문 -->
              <div class="bg-white p-4 rounded-xl border border-blue-100 shadow-sm mt-3">
                <div class="space-y-3">
                  <p class="text-[15px] text-gray-800 font-bold break-keep flex items-start gap-2">
                    <span class="text-lg">💡</span> 
                    <span><span class="text-blue-600 font-black text-[17px] underline decoration-blue-300 decoration-2 underline-offset-2">익명으로 공개</span> 됩니다.</span>
                  </p>
                  
                  <p class="text-[15px] text-gray-800 font-bold break-keep flex items-start gap-2">
                    <span class="text-lg">🎁</span> 
                    <span>동의하신 분들께 감사의 <span class="text-blue-600 font-black text-[17px] underline decoration-blue-300 decoration-2 underline-offset-2">할인쿠폰</span>을 넣어 드립니다.</span>
                  </p>
                  
                  <p class="text-[14px] text-gray-600 font-medium pl-7 pt-1 break-keep">
                    다음에 이용할 때 할인권 사용하세요
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </label>

    </div>

    <!-- 4. 하단 완료 버튼 -->
    <div class="p-5 md:p-6 pt-0 mt-2">
      <button onclick="submitReview()" class="w-full bg-[#db2724] text-white font-black text-lg py-4 rounded-xl shadow-lg hover:bg-red-700 transition active:scale-95">
        평가 완료 및 메인으로 이동
      </button>
    </div>

  </div>

  <script>
    // 별점 클릭 로직
    const stars = document.querySelectorAll('.star-btn');
    const ratingText = document.getElementById('rating-text');
    let currentRating = 5;

    const ratingDescriptions = {
      1: '매우 불만족 (1점)',
      2: '불만족 (2점)',
      3: '보통 (3점)',
      4: '만족 (4점)',
      5: '매우 만족 (5점)'
    };

    stars.forEach(star => {
      star.addEventListener('click', function() {
        const value = parseInt(this.getAttribute('data-value'));
        currentRating = value;
        
        stars.forEach(s => {
          if (parseInt(s.getAttribute('data-value')) <= value) {
            s.classList.add('active', 'text-yellow-400');
            s.classList.remove('text-gray-300');
          } else {
            s.classList.remove('active', 'text-yellow-400');
            s.classList.add('text-gray-300');
          }
        });
        
        ratingText.innerText = ratingDescriptions[value];
      });
    });

    // 제출 버튼 로직
    function submitReview() {
      const isAgreed = document.getElementById('case-share-agree').checked;
      
      // DB 전송 로직이 들어갈 자리 (현재는 알림 후 메인 이동)
      let msg = `별점 ${currentRating}점으로 평가가 완료되었습니다.\n`;
      if (isAgreed) {
        msg += "사례집 공개에 동의해 주셔서 감사합니다! 혜택이 지급될 예정입니다.";
      }
      
      alert(msg);
      window.location.href = '../../index.html'; // 메인 페이지로 이동
    }
  </script>
</body>
</html>
