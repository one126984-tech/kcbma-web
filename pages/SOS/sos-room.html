<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>긴급 실시간 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* 마이크 작동 시 깜빡임 효과 */
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording {
      animation: pulse-mic 1.5s infinite;
      background-color: #fef2f2 !important; /* 아주 연한 빨강 배경 */
      border-color: #ef4444 !important;
      transform: scale(0.98);
    }
    
    /* 카카오톡 스타일 채팅방 배경 */
    .chat-bg {
      background-color: #bacee0; 
    }
  </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden">

  <!-- 1. 상단 헤더 영역 -->
  <header class="bg-[#db2724] text-white p-4 shadow-md flex justify-between items-center shrink-0 z-20">
    <div class="flex items-center gap-3">
      <button onclick="endConsultation()" class="hover:bg-red-700 p-2 rounded-full transition">
        <i class="fa-solid fa-arrow-left text-xl"></i>
      </button>
      <h1 class="text-xl font-bold tracking-wide">🚨 실시간 긴급 상담</h1>
    </div>
    <button onclick="endConsultation()" class="bg-white text-red-600 text-sm font-bold px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">
      상황 종료
    </button>
  </header>

  <!-- 2. 입력 및 컨트롤 영역 (기획하신 대로 상단에 크게 배치) -->
  <section class="bg-white px-4 py-5 shadow-sm z-10 shrink-0 border-b-2 border-gray-200">
    <div class="max-w-3xl mx-auto flex flex-col gap-5">
      
      <!-- 안내 문구 -->
      <div class="text-center text-[22px] md:text-2xl font-medium tracking-tight text-gray-800">
        전문가와 연결됩니다. <span class="text-green-600 font-bold">편한 방법</span>을 선택해서 상담하세요
      </div>

      <!-- 직관적인 초대형 선택 버튼 2개 -->
      <div class="grid grid-cols-2 gap-4">
        <!-- 🎤 말로 하기 버튼 -->
        <button id="btn-speak" class="flex flex-col items-center justify-center gap-3 bg-white border-2 border-red-500 text-red-600 py-6 md:py-8 rounded-2xl transition shadow-[0_4px_10px_rgba(239,68,68,0.15)] focus:outline-none">
          <i class="fa-solid fa-microphone text-4xl"></i>
          <span class="text-[22px] font-bold tracking-tight" id="speak-text">말로 하기</span>
        </button>
        
        <!-- 💬 글로 하기 버튼 -->
        <button id="btn-type" class="flex flex-col items-center justify-center gap-3 bg-white border-2 border-[#3b82f6] text-[#3b82f6] py-6 md:py-8 rounded-2xl transition shadow-[0_4px_10px_rgba(59,130,246,0.15)] focus:outline-none">
          <i class="fa-solid fa-comment-dots text-4xl"></i>
          <span class="text-[22px] font-bold tracking-tight">글로 하기</span>
        </button>
      </div>

      <!-- 텍스트 입력창 & 전송 버튼 -->
      <div class="flex gap-2 bg-gray-100 p-2 rounded-2xl border border-gray-200">
        <input type="text" id="chat-input" class="flex-1 bg-transparent px-3 py-2 text-lg font-medium text-gray-800 focus:outline-none placeholder-gray-400" placeholder="내용 확인 후 전송을 누르세요.">
        
        <button id="send-btn" class="shrink-0 w-16 bg-[#374151] text-white font-bold rounded-xl flex items-center justify-center hover:bg-black transition-colors shadow-sm focus:outline-none py-2">
          <i class="fa-solid fa-paper-plane text-xl"></i>
        </button>
      </div>
      
    </div>
  </section>

  <!-- 3. 카카오톡 스타일 채팅 메시지 표시 영역 -->
  <main id="chat-messages" class="chat-bg flex-1 overflow-y-auto p-4 space-y-4">
    <!-- 안내 시스템 메시지 -->
    <div class="flex justify-center mt-2">
      <span class="bg-black/20 text-white text-xs px-4 py-1.5 rounded-full text-center shadow-sm backdrop-blur-sm">
        이 박스 안에 카카오톡처럼 글자가 나타납니다.
      </span>
    </div>
    <!-- 자바스크립트가 메시지를 이 곳에 추가합니다 -->
  </main>

  <script>
    // --- 설정 영역 ---
    // 🔴 본인의 Supabase URL과 KEY를 입력하세요. (입력하지 않아도 화면 테스트는 가능합니다)
    const SUPABASE_URL = '여기에_URL_입력'; 
    const SUPABASE_ANON_KEY = '여기에_ANON_KEY_입력'; 

    let supabaseClient;
    
    // 키 유무에 따른 에러 방지용 안전장치
    if (SUPABASE_URL.startsWith('http')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
      console.warn('⚠️ Supabase 키가 없어 로컬 테스트 모드로 실행됩니다.');
      // 임시 모드 클라이언트
      supabaseClient = {
        from: () => ({
          insert: async (data) => { 
            // DB에 안 가고 화면에 바로 띄워주기 (테스트용)
            setTimeout(() => appendMessage(data[0]), 100); 
            return { error: null }; 
          },
          select: () => ({ eq: () => ({ order: async () => ({ data: [], error: null }) }) })
        }),
        channel: () => ({ on: () => ({ subscribe: () => {} }) })
      };
    }

    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id') || 'test-room'; // 테스트용 임시 ID

    // --- UI 요소 ---
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const btnSpeak = document.getElementById('btn-speak');
    const btnType = document.getElementById('btn-type');
    const speakText = document.getElementById('speak-text');

    // --- 🎙️ 음성 인식 (STT) 로직 ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR'; 
      recognition.interimResults = false; 

      btnSpeak.addEventListener('click', () => {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      });

      // 인식 시작 시 UI 변경
      recognition.onstart = () => {
        btnSpeak.classList.add('recording');
        speakText.innerText = "말씀하세요!";
        chatInput.placeholder = "듣고 있습니다...";
        // 글로 하기 버튼은 잠시 흐리게
        btnType.style.opacity = '0.5';
      };

      // 인식 성공 시 입력창에 텍스트 채우기
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value += (chatInput.value.length > 0 ? ' ' : '') + transcript;
      };

      // 인식 종료 시 UI 원상복구
      recognition.onend = () => {
        btnSpeak.classList.remove('recording');
        speakText.innerText = "말로 하기";
        chatInput.placeholder = "내용 확인 후 전송을 누르세요.";
        btnType.style.opacity = '1';
        
        // 말이 끝나면 즉시 전송하고 싶다면 아래 주석을 푸세요!
        // sendMessage(); 
      };

      recognition.onerror = (event) => {
        btnSpeak.classList.remove('recording');
        speakText.innerText = "다시 누르세요";
        chatInput.placeholder = "인식 실패. 다시 시도해주세요.";
        btnType.style.opacity = '1';
      };
    } else {
      btnSpeak.style.display = 'none';
      chatInput.placeholder = "브라우저가 음성 인식을 지원하지 않습니다.";
    }

    // --- 💬 채팅 로직 ---
    // '글로 하기' 버튼 누르면 키보드 올리기
    btnType.addEventListener('click', () => {
      chatInput.focus();
    });

    chatInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = ''; // 입력창 비우기

      // Supabase DB에 저장
      const { error } = await supabaseClient
        .from('sos_messages')
        .insert([{ 
          request_id: requestId, 
          message: text,
          sender: 'requester' // 소장님(나)
        }]);

      if (error) console.error('메시지 전송 실패:', error);
    }

    // 카카오톡 스타일 말풍선 그리기
    function appendMessage(msg) {
      const isMe = msg.sender === 'requester';
      const div = document.createElement('div');
      div.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
      
      // isMe(나) : 노란색 배경 (카카오톡 스타일)
      // 상대방 : 흰색 배경
      div.innerHTML = `
        <div class="max-w-[75%] rounded-2xl px-4 py-2.5 shadow-sm text-[15px] leading-relaxed 
          ${isMe ? 'bg-[#fef01b] text-black rounded-tr-sm' : 'bg-white text-black rounded-tl-sm border border-gray-200'}">
          ${msg.message}
        </div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight; // 스크롤 맨 아래로
    }

    // 기존 메시지 불러오기
    async function fetchMessages() {
      if(!requestId || requestId === 'test-room') return;
      const { data, error } = await supabaseClient
        .from('sos_messages')
        .select('*')
        .eq('request_id', requestId)
        .order('created_at', { ascending: true });

      if (data) {
        data.forEach(appendMessage);
      }
    }

    // 실시간 새 메시지 감지 (Supabase Realtime)
    if(requestId && requestId !== 'test-room') {
      supabaseClient
        .channel('messages_channel')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'sos_messages', filter: `request_id=eq.${requestId}` },
          (payload) => appendMessage(payload.new)
        )
        .subscribe();
      
      fetchMessages();
    }

    // 상황 종료 
    function endConsultation() {
      if(confirm('상담을 종료하고 평가 페이지로 이동하시겠습니까?')) {
        window.location.href = `sos-review.html?request_id=${requestId}`;
      }
    }
  </script>
</body>
</html>
