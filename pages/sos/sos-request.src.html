<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>긴급 SOS 호출 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

  <!-- 이 페이지 전용 빨간 배너도 즉시 칠해지도록 미리 고정 -->
  <style>
      #sos-top-banner { background-color: #dc2626; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- @include view-transition-css -->

<!-- @include common-css -->

  <style>
    /* 이 페이지(긴급 SOS) 전용 CSS */
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
    }

    input[type="checkbox"] { width: 1.75rem; height: 1.75rem; cursor: pointer; }
    input[type="checkbox"]:checked { background-color: #ef4444; border-color: #ef4444; }
    .break-keep { word-break: keep-all; }

    @keyframes shake-red {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    .error-shake {
      animation: shake-red 0.5s;
      background-color: #fef2f2 !important; 
      border-color: #ef4444 !important; 
    }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <!-- ----------------------------------------------------
         헤더 아래 전체 영역 (파란 서브헤더 + 본문)
         페이지 이동 시 이 영역 전체만 슬라이드 전환됨 (헤더는 고정)
         ---------------------------------------------------- -->
    <div id="sticky-top-bar" class="w-full flex flex-col shrink-0 bg-transparent z-[900]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center shadow-md">
            <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center h-full">
                <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl tracking-wide flex items-center md:justify-center h-full">
                    긴급SOS 호출
                </div>
            </div>
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">



    <!-- 파란 바와 빨간 배너 사이 간격 -->
    <div class="w-full bg-gray-100 shrink-0" style="height:14px;"></div>

    <main id="main-content" class="flex-1 w-full overflow-y-auto custom-scroll bg-gray-100">

        <!-- 중앙 SOS 모바일 사이즈 컨테이너 -->
        <div class="w-full max-w-md mx-auto bg-white min-h-full shadow-lg flex flex-col relative">

            <!-- 페이지 내부 안내 바 -->
            <div id="sos-top-banner" class="text-white py-5 shadow-sm shrink-0 flex items-center justify-center relative z-20">
                <button onclick="history.back()" class="absolute left-4 top-1/2 -translate-y-1/2 hover:bg-red-700 p-2 rounded-full transition">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-[22px] font-bold tracking-wider flex items-center gap-2">
                    <span class="bg-[#FFFF00] text-red-600 px-3.5 py-1 rounded-full text-[15px] font-black shadow-sm">24시간</span>
                    긴급 SOS 호출
                </h1>
            </div>

            <!-- [1단계] 면책 조항 및 이용 안내 화면 -->
            <div id="step-1-terms" class="flex-1 flex flex-col bg-gray-50">

                <div class="p-5 flex-1 space-y-5">
                    <div class="bg-white py-6 px-4 rounded-xl shadow-sm border border-gray-200 text-center">
                        <p class="font-bold text-gray-800 text-lg md:text-xl leading-relaxed break-keep">
                        <span class="inline-block mx-1">🔥 화재,</span>
                        <span class="inline-block mx-1">💦 누수,</span>
                        <span class="inline-block mx-1">⚡ 정전 등</span><br>
                        긴급상황 발생 시 <br>
                        <span class="text-red-600 font-black text-xl md:text-2xl mt-1 block">즉시 전문가를 연결해 드립니다.</span>
                        </p>
                    </div>

                    <div class="bg-gray-900 rounded-xl p-5 shadow-md border-4 border-red-600">
                        <h3 class="flex items-center justify-center gap-2 text-yellow-400 font-black mb-4 text-xl tracking-tight">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i> 플랫폼 면책 고지
                        <span class="text-[#00ff00] text-sm font-bold ml-1">*필수확인사항*</span>
                        </h3>
                        <div class="space-y-4">
                            <p class="text-gray-200 text-lg font-medium text-center break-keep leading-relaxed">
                                대한집합건물관리협회는 <span class="text-white font-bold underline decoration-yellow-400 decoration-2 underline-offset-4">단순 매칭(연결)만 제공</span> 하므로 <span class="text-[#FFFF00] font-bold underline decoration-yellow-400 decoration-2 underline-offset-4">민·형사상의 어떠한 법적책임도 지지 않는다는 것을 고지합니다!!</span>
                            </p>
                            <div class="border-2 border-red-600 p-4 rounded-lg text-center shadow-inner" style="background-color: #FFFF00;">
                                <p class="font-black text-[22px] leading-snug break-keep">
                                <span class="text-gray-900">전문가의 상담 및 현장 조치<br>결과로 발생하는</span><br>
                                <span class="text-red-600">모든 민·형사상 책임에 대해</span><br>
                                <span class="text-gray-900">협회는 어떠한 경우에도</span><br>
                                <span class="text-red-600 underline decoration-4 underline-offset-4">일체의 책임을 지지 않습니다.</span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 pb-4">
                        <label class="flex items-start gap-3 p-4 bg-white border-2 border-gray-300 rounded-xl cursor-pointer hover:bg-red-50 transition agree-box" id="agree-label-1">
                        <input type="checkbox" id="agree-1" class="mt-0.5 rounded border-gray-400 text-red-600 focus:ring-red-500 transition">
                        <span class="text-gray-900 font-bold text-[17px] leading-tight break-keep select-none">
                            [필수] 위 플랫폼 면책 조항(협회의 법적 책임 없음) 내용을 명확히 읽고 인지하였습니다.
                        </span>
                        </label>
                        <label class="flex items-start gap-3 p-4 bg-white border-2 border-gray-300 rounded-xl cursor-pointer hover:bg-red-50 transition agree-box" id="agree-label-2">
                        <input type="checkbox" id="agree-2" class="mt-0.5 rounded border-gray-400 text-red-600 focus:ring-red-500 transition">
                        <span class="text-gray-900 font-bold text-[17px] leading-tight break-keep select-none">
                            [필수] 어떠한 상황에서도 협회에 법적 책임을 묻지 않는 것에 전적으로 동의합니다.
                        </span>
                        </label>
                    </div>
                </div>

                <div class="sticky bottom-0 p-4 bg-gray-50 border-t border-gray-200 z-10">
                    <button id="next-step-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black text-xl py-4 rounded-xl shadow-lg transition duration-300 flex justify-center items-center gap-2">
                        <span>모두 동의하고 호출하기</span> <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- [2단계] 실제 호출 화면 -->
            <div id="step-2-form" class="hidden flex-1 flex-col bg-gray-50">

                <div class="p-6 flex-1 space-y-6 pb-8">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800 mb-3">1. 어떤 긴급 상황인가요?</h2>
                        <div class="grid grid-cols-2 gap-3" id="category-grid">
                            <button class="cat-btn border-2 border-gray-200 rounded-xl py-4 flex flex-col items-center gap-2 hover:border-red-400 focus:border-red-500 focus:bg-red-50 transition" data-cat="화재">
                                <span class="text-3xl">🔥</span><span class="font-bold text-gray-700">화재 / 소방</span>
                            </button>
                            <button class="cat-btn border-2 border-gray-200 rounded-xl py-4 flex flex-col items-center gap-2 hover:border-blue-400 focus:border-blue-500 focus:bg-blue-50 transition" data-cat="누수">
                                <span class="text-3xl">💦</span><span class="font-bold text-gray-700">누수 / 배관</span>
                            </button>
                            <button class="cat-btn border-2 border-gray-200 rounded-xl py-4 flex flex-col items-center gap-2 hover:border-yellow-400 focus:border-yellow-500 focus:bg-yellow-50 transition" data-cat="전기">
                                <span class="text-3xl">⚡</span><span class="font-bold text-gray-700">전기 / 정전</span>
                            </button>
                            <button class="cat-btn border-2 border-gray-200 rounded-xl py-4 flex flex-col items-center gap-2 hover:border-purple-400 focus:border-purple-500 focus:bg-purple-50 transition" data-cat="승강기">
                                <span class="text-3xl">🛗</span><span class="font-bold text-gray-700">승강기 / 기타</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-lg font-bold text-gray-800 mb-3">2. 현장 위치</h2>
                        <div class="flex gap-2">
                            <input type="text" id="location-input" placeholder="예: 서울특별시 강남구 역삼동 OOO건물" class="flex-1 border-2 border-gray-300 rounded-xl p-4 text-base focus:outline-none focus:border-red-500 transition">
                            <button type="button" onclick="getCurrentLocation()" id="gps-btn" class="shrink-0 bg-gray-800 text-white px-4 rounded-xl font-bold hover:bg-black transition flex flex-col items-center justify-center gap-1 w-[90px]">
                            <i class="fa-solid fa-location-crosshairs text-xl"></i>
                            <span class="text-xs">내 위치</span>
                            </button>
                        </div>
                        <p id="gps-status" class="text-xs text-gray-500 mt-2 hidden"></p>
                    </div>

                    <div class="bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" id="payment-agreement" class="mt-1 w-6 h-6 text-red-600 rounded border-gray-300 focus:ring-red-500">
                            <div>
                                <h3 class="font-bold text-gray-800 text-[15px]">선조치 후결제 진행 동의 (필수)</h3>
                                <p class="text-xs text-gray-500 mt-1 leading-relaxed break-keep">
                                위급 상황 해결을 위해 <strong class="text-red-600">즉시 전문가가 매칭</strong>됩니다. 상황 종료 후 청구되는 소정의 비용 결제에 동의합니다.
                                </p>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="sticky bottom-0 p-4 bg-gray-50 border-t border-gray-200 z-10">
                    <button id="sos-submit-btn" class="w-full bg-red-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:bg-red-700 transition active:scale-95 flex justify-center items-center gap-2">
                        <span>🚨 대기 중인 전문가 찾기</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    </div>
    <!-- page-content 끝 -->

  <script>
    const agree1 = document.getElementById('agree-1');
    const agree2 = document.getElementById('agree-2');
    const label1 = document.getElementById('agree-label-1');
    const label2 = document.getElementById('agree-label-2');
    const nextBtn = document.getElementById('next-step-btn');
    const step1 = document.getElementById('step-1-terms');
    const step2 = document.getElementById('step-2-form');

    function clearErrorState(chk, label) {
      if(chk.checked) {
        label.classList.remove('error-shake', 'border-red-500', 'bg-red-50', 'border-gray-300', 'bg-white');
        label.classList.add('border-blue-500', 'bg-blue-50'); 
      } else {
        label.classList.remove('error-shake', 'border-blue-500', 'bg-blue-50');
        label.classList.add('border-gray-300', 'bg-white');
      }
    }

    agree1.addEventListener('change', () => clearErrorState(agree1, label1));
    agree2.addEventListener('change', () => clearErrorState(agree2, label2));

    nextBtn.addEventListener('click', function() {
      if (!agree1.checked || !agree2.checked) {
        alert("면책 조항에 동의해야만 긴급 호출 서비스를 이용하실 수 있습니다.");

        if(!agree1.checked) {
          label1.classList.remove('error-shake'); 
          void label1.offsetWidth; 
          label1.classList.add('error-shake'); 
        }
        if(!agree2.checked) {
          label2.classList.remove('error-shake');
          void label2.offsetWidth;
          label2.classList.add('error-shake');
        }
        return; 
      }

      step1.classList.add('hidden');
      step1.classList.remove('flex');
      step2.classList.remove('hidden');
      step2.classList.add('flex');

      document.getElementById('main-content').scrollTo(0, 0);
    });

    const KAKAO_REST_API_KEY = 'YOUR_KAKAO_REST_API_KEY';

    function getCurrentLocation() {
      const gpsBtn = document.getElementById('gps-btn');
      const gpsStatus = document.getElementById('gps-status');
      const locationInput = document.getElementById('location-input');

      if (!navigator.geolocation) {
        alert('사용 중인 브라우저가 위치 정보를 지원하지 않습니다. 직접 주소를 입력해 주세요.');
        return;
      }

      gpsBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xl"></i><span class="text-xs">찾는중</span>';
      gpsBtn.disabled = true;
      gpsStatus.classList.remove('hidden');
      gpsStatus.innerText = '위치 정보를 가져오는 중입니다...';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if(KAKAO_REST_API_KEY !== 'YOUR_KAKAO_REST_API_KEY') {
            getAddressFromCoords(lat, lng);
          } else {
             setTimeout(() => {
                locationInput.value = "서울특별시 강남구 역삼동 (현재 위치)";
                resetGpsBtn();
                gpsStatus.innerText = '✅ 위치 입력이 완료되었습니다.';
             }, 1000);
          }
        },
        (error) => {
          console.error("위치 정보 에러:", error);
          resetGpsBtn();
          gpsStatus.classList.add('text-red-500');

          let errMsg = '위치 정보를 가져올 수 없습니다. ';
          if(error.code === 1) errMsg += '위치 권한을 허용해 주세요.';
          gpsStatus.innerText = errMsg;
          alert('위치 권한이 거부되었거나 오류가 발생했습니다. 주소를 직접 입력해 주세요.');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    async function getAddressFromCoords(lat, lng) {
      const gpsStatus = document.getElementById('gps-status');
      const locationInput = document.getElementById('location-input');

      try {
        const response = await fetch(`https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}`, {
          headers: {
            "Authorization": `KakaoAK ${KAKAO_REST_API_KEY}`
          }
        });
        const data = await response.json();

        if (data.documents && data.documents.length > 0) {
          const address = data.documents[0].road_address 
                          ? data.documents[0].road_address.address_name 
                          : data.documents[0].address.address_name;

          locationInput.value = address;
          gpsStatus.innerText = '✅ 위치가 자동으로 입력되었습니다.';
          gpsStatus.classList.remove('text-red-500');
          gpsStatus.classList.add('text-green-600');
        } else {
          throw new Error('주소를 찾을 수 없습니다.');
        }
      } catch (error) {
        console.error("API 변환 에러:", error);
        gpsStatus.innerText = '주소 변환에 실패했습니다. 직접 입력해 주세요.';
        gpsStatus.classList.add('text-red-500');
      } finally {
        resetGpsBtn();
      }
    }

    function resetGpsBtn() {
      const gpsBtn = document.getElementById('gps-btn');
      gpsBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-xl"></i><span class="text-xs">내 위치</span>';
      gpsBtn.disabled = false;
    }

    const SUPABASE_URL = '여기에_URL_입력';
    const SUPABASE_ANON_KEY = '여기에_ANON_KEY_입력';
    let supabaseClient;
    if (SUPABASE_URL.startsWith('http')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let selectedCategory = '';

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ring-2', 'ring-red-500', 'bg-red-50'));
        this.classList.add('ring-2', 'ring-red-500', 'bg-red-50');
        selectedCategory = this.getAttribute('data-cat');
      });
    });

    document.getElementById('sos-submit-btn').addEventListener('click', async function() {
      const location = document.getElementById('location-input').value;
      const isAgreed = document.getElementById('payment-agreement').checked;

      if(!selectedCategory) return alert('긴급 상황 유형을 선택해주세요.');
      if(!location) return alert('현장 위치를 입력해주세요.');
      if(!isAgreed) return alert('선조치 후결제 진행에 동의해주셔야 호출이 가능합니다.');

      this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 전문가 찾는 중...';
      this.disabled = true;

      if(supabaseClient) {
        const { data, error } = await supabaseClient
          .from('sos_requests')
          .insert([{ category: selectedCategory, region: location, status: '대기중' }])
          .select();

        if (!error && data) {
          window.location.href = `sos-room.html?request_id=${data[0].id}`;
          return;
        }
      } 

      setTimeout(() => {
        window.location.href = 'sos-match.html';
      }, 1500);
    });
  </script>
</body>
</html>
