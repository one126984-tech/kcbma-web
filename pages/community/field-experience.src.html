<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">



    <!-- 메인 레이아웃 -->
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-8 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden">

        <!-- 좌측 사이드바 (LNB) -->
        <aside class="w-full md:w-[232px] shrink-0 h-full left-scroll-area z-40">
            <div class="left-scroll-content">
                <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">

                    <div class="side-menu-tab-active">현장경험 나누어요</div>
                    <div class="side-menu-tab" onclick="location.href='work-qna.html'">업무 Q&A</div>
                    <div class="side-menu-tab" onclick="location.href='data-room.html'">서식/자료실</div>
                </div>
            </div>
        </aside>

        <!-- 우측 전체를 감싸는 스크롤 영역 -->
        <div class="flex-1 min-w-0 h-full main-scroll-area relative flex flex-col">

            <section class="flex-1 shrink-0 max-w-[900px] w-full pb-8">

                <div class="flex justify-between items-end mb-6 border-b border-gray-200 pb-4">
                    <div>
                        <h2 class="text-2xl font-bold text-[#12387a] flex items-center gap-2">
                            <i class="fas fa-hand-holding-heart text-[#ff6b00]"></i> 현장경험 나누어요
                        </h2>
                        <p class="text-gray-500 text-sm mt-2 hidden md:block">동료 소장님들의 생생한 현장 대처 노하우를 확인하고 공감해 보세요.</p>
                    </div>

                    <!-- 글쓰기 버튼 -->
                    <button onclick="location.href='field-experience-write.html'" class="px-5 py-2.5 bg-[#ff6b00] hover:bg-[#e66000] text-white font-bold rounded-lg shadow-sm transition flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-pen"></i> 경험 공유하기
                    </button>
                </div>

                <!-- 게시글 리스트가 동적으로 들어갈 컨테이너 -->
                <div id="post-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
                    <!-- 로딩 중 표시 -->
                    <div class="col-span-1 md:col-span-2 text-center py-20 text-gray-500">

                </div>

            </section>

            <!-- 푸터 영역 -->

            <script src="../../assets/js/footer.js?v=1.3"></script>

    </div>
    <!-- 핑크박스 끝 -->

    <!-- Supabase 데이터 불러오기 스크립트 -->
    <script>
        // supabase-config.js에서 설정한 sb 객체를 사용합니다.
        const supabaseClient = window.sb;

        async function loadPosts() {
            const container = document.getElementById('post-list-container');

            if (!supabaseClient) {
                container.innerHTML = '<div class="col-span-2 text-center py-10 text-red-500">데이터베이스(Supabase) 연결이 필요합니다. 설정 파일을 확인해주세요.</div>';
                return;
            }

            try {
                // master_board 테이블에서 experience 데이터만 가져옵니다.
                const { data, error } = await supabaseClient
                    .from('master_board')
                    .select('*')
                    .eq('board_type', 'experience')
                    .order('likes_count', { ascending: false }) // 1순위: 하트 많은 순
                    .order('created_at', { ascending: false }); // 2순위: 하트 수가 같으면 최신순

                if (error) throw error;

                // 작성된 글이 없을 때 UI
                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-2 text-center py-24 bg-gray-50 border border-gray-200 rounded-xl">
                            <div class="text-gray-400 text-5xl mb-4"><i class="far fa-folder-open"></i></div>
                            <p class="text-gray-600 font-medium">아직 등록된 경험 공유 글이 없습니다.</p>
                            <p class="text-sm text-gray-500 mt-2">첫 번째 노하우를 공유해 주시는 주인공이 되어보세요!</p>
                        </div>`;
                    return;
                }

                // 데이터가 있으면 카드로 만들어서 화면에 그리기
                let html = '';
                data.forEach(post => {
                    // 날짜 포맷팅
                    const d = new Date(post.created_at);
                    const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;

                    html += `
                    <div class="bg-white border border-gray-200 rounded-xl p-5 hover:border-[#12387a] hover:shadow-md transition cursor-pointer flex flex-col h-full relative" 
                         onclick="location.href='field-experience-detail.html?id=${post.id}'">
                        
                        <!-- 분류 및 날짜 -->
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2.5 py-1 bg-[#f0f4fb] text-[#12387a] font-bold text-xs rounded">${post.category || '기타'}</span>
                            <span class="text-xs text-gray-400 font-medium">${dateStr}</span>
                        </div>
                        
                        <!-- 제목 -->
                        <h3 class="text-lg font-bold text-gray-900 mb-4 line-clamp-2 leading-snug break-keep">${post.title}</h3>
                        
                        <!-- 작성자 및 공감수 -->
                        <div class="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                            <div class="flex items-center gap-1.5 text-sm text-gray-600">
                                <i class="fas fa-user-circle text-gray-300 text-lg"></i>
                                <span class="font-medium">${post.author_name || '익명 소장님'}</span>
                            </div>
                            <div class="flex items-center gap-1 text-red-500 font-bold text-sm bg-red-50 px-2 py-1 rounded">
                                <i class="fas fa-heart"></i> ${post.likes_count || 0}
                            </div>
                        </div>
                    </div>
                    `;
                });
                
                // 완성된 HTML을 화면에 꽂아넣기
                container.innerHTML = html;

            } catch (err) {
                console.error('글 목록 불러오기 실패:', err);
                container.innerHTML = '<div class="col-span-2 text-center py-10 text-red-500">데이터를 불러오는 중 오류가 발생했습니다. 개발자 도구(F12)를 확인해주세요.</div>';
            }
        }

        // 페이지 로딩 완료 시 실행
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
