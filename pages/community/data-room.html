    <style>
        /* ★ (1) 전체 화면 고정 (body 스크롤 방지) */
        html, body { overflow: hidden; height: 100%; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }
        
        /* ★ (2) 좌측 메뉴 독립 스크롤 및 스크롤바 왼쪽 배치 */
        .left-scroll-area {
            direction: rtl; /* 스크롤바를 왼쪽으로 이동 */
            overflow-y: auto;
            height: 100%; /* 부모 컨테이너 높이에 맞춤 */
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar {
            width: 6px;
        }
        .left-scroll-area::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        .left-scroll-area::-webkit-scrollbar-track {
            background-color: transparent;
        }
        .left-scroll-content {
            direction: ltr; /* 내부 콘텐츠 방향은 원래대로(좌->우) 복구 */
            padding-left: 12px; /* 왼쪽 스크롤바와 콘텐츠 사이 여백 */
        }

        /* ★ (1) 우측 본문 영역 독립 스크롤 */
        .main-scroll-area {
            overflow-y: auto;
            height: 100%;
            padding-right: 6px;
        }
        .main-scroll-area::-webkit-scrollbar {
            width: 8px;
        }
        .main-scroll-area::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 4px;
        }
        .main-scroll-area::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* 좌측 메뉴 스타일 */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: all 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: default; }
        
        /* -------------------------------------
           공통 헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }
    </style>
</head>

    <script>
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
                document.body.style.overflow = '';
            } else {
                menu.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }
        });
    </script>
