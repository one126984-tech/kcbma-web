<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장경험 공유하기 글쓰기 - 대한집합건물관리협회</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 상단 타이틀 바 -->
    <div class="bg-[#1e3a8a] py-5 shadow-md">
        <div class="max-w-7xl mx-auto px-4 md:px-6">
            <h1 class="text-white text-2xl md:text-3xl font-bold">커뮤니티</h1>
        </div>
    </div>

    <!-- 메인 컨텐츠 (글쓰기 폼) -->
    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-10">
            
            <!-- 페이지 헤더 -->
            <div class="mb-8 border-b pb-5">
                <h2 class="text-2xl font-bold text-gray-900 flex items-center">
                    <span class="mr-2">✍️</span> 현장경험 공유하기
                </h2>
                <p class="text-gray-500 mt-2 text-sm leading-relaxed">
                    동료 관리자님들의 생생한 현장 대처 노하우를 작성해주세요. <br class="md:hidden">
                    작성하신 글은 설정하신 <strong class="text-blue-600">건물 형태와 닉네임</strong>으로 안전하게 게시됩니다.
                </p>
            </div>

            <!-- 글쓰기 폼 -->
            <form id="experienceForm">
                
                <!-- 카테고리 -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">카테고리 <span class="text-red-500">*</span></label>
                    <select id="category" class="w-full md:w-1/3 border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                        <option value="">카테고리를 선택하세요</option>
                        <option value="민원 대처">민원 대처</option>
                        <option value="시설/안전 관리">시설/안전 관리</option>
                        <option value="인사/노무">인사/노무</option>
                        <option value="행정/법률">행정/법률</option>
                        <option value="기타">기타</option>
                    </select>
                </div>

                <!-- 제목 -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="title" placeholder="핵심 내용을 요약할 수 있는 직관적인 제목을 적어주세요." class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                </div>

                <!-- ★ 작성자 정보 및 비밀번호 (나란히 배치) ★ -->
                <div class="mb-6 border-b border-gray-100 pb-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 작성자 닉네임 입력칸 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">작성자 정보</label>
                        <div class="flex gap-2">
                            <select id="building_type" class="w-1/3 border border-gray-300 rounded-md px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-white">
                                <option value="아파트">아파트</option>
                                <option value="주상복합">주상복합</option>
                                <option value="오피스텔">오피스텔</option>
                                <option value="일반상가">일반상가</option>
                                <option value="오피스빌딩">오피스빌딩</option>
                                <option value="지식산업센터">지식산업센터</option>
                                <option value="기타">기타</option>
                            </select>
                            <input type="text" id="author_name" placeholder="예: 김포 기전기사, 파주 소장" class="w-2/3 border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                        </div>
                    </div>
                    
                    <!-- 비밀번호 입력칸 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">게시글 비밀번호 <span class="text-red-500">*</span></label>
                        <input type="password" id="post_password" placeholder="수정/삭제 시 사용할 비밀번호 (4자리 이상)" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required minlength="4">
                        <p class="text-xs text-red-500 mt-2 font-medium">※ 향후 본인 글의 수정 및 삭제를 위해 반드시 필요합니다.</p>
                    </div>
                </div>

                <!-- 발생 상황 및 대처 과정 (본문) -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">발생 상황 및 대처 과정 <span class="text-red-500">*</span></label>
                    <textarea id="main_content" rows="8" placeholder="어떤 문제가 발생했고, 어떻게 대처하셨는지 시간 순서나 흐름에 따라 자유롭게 서술해 주세요." class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm resize-y" required></textarea>
                </div>

                <!-- 느끼고 터득한 점 (강조 포인트) -->
                <div class="mb-6 bg-blue-50 rounded-lg p-5 md:p-6 border border-blue-100">
                    <label class="block text-base font-bold text-blue-900 mb-2 flex items-center">
                        💡 느끼고 터득한 점 (인사이트)
                    </label>
                    <p class="text-xs md:text-sm text-blue-700 mb-4 leading-relaxed">
                        이번 경험을 통해 얻은 교훈, 아쉬웠던 점, 혹은 동료 관리자님들께 꼭 추천하고 싶은 실무 노하우를 남겨주세요.
                    </p>
                    <textarea id="lesson_content" rows="4" placeholder="예: 초기 대응의 중요성을 뼈저리게 느꼈습니다. 유사 상황 발생 시 반드시 관리사무소 차원의 공문을 먼저 발송하는 것을 추천합니다." class="w-full border border-blue-200 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm resize-y bg-white"></textarea>
                </div>

                <!-- 첨부파일 -->
                <div class="mb-10">
                    <label class="block text-sm font-bold text-gray-700 mb-2">첨부파일</label>
                    <input type="file" id="attachment" class="w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 cursor-pointer border border-gray-300 rounded-md text-sm">
                    <p class="text-xs text-gray-400 mt-2">※ 주의: 단지명, 입주민 개인정보 등이 포함된 문서는 반드시 마스킹(가림) 처리 후 업로드해 주세요.</p>
                </div>

                <!-- 하단 버튼 영역 -->
                <div class="flex justify-center gap-3 border-t border-gray-100 pt-8">
                    <button type="button" onclick="location.href='field-experience.html'" class="px-6 md:px-10 py-3 bg-gray-100 text-gray-700 font-bold rounded-md hover:bg-gray-200 transition-colors text-sm md:text-base">
                        취소
                    </button>
                    <button type="submit" class="px-6 md:px-10 py-3 bg-[#f97316] text-white font-bold rounded-md hover:bg-orange-600 transition-colors text-sm md:text-base shadow-sm">
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Supabase 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('experienceForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault(); 

                const category = document.getElementById('category').value;
                const title = document.getElementById('title').value;
                const mainContent = document.getElementById('main_content').value;
                const lessonContent = document.getElementById('lesson_content').value;
                
                // ★ 비밀번호 및 작성자 정보 가져오기 ★
                const postPassword = document.getElementById('post_password').value;
                const buildingType = document.getElementById('building_type').value;
                const authorNameInput = document.getElementById('author_name').value;
                const finalAuthorName = authorNameInput.trim() === '' 
                    ? `[${buildingType}] 익명 관리인` 
                    : `[${buildingType}] ${authorNameInput}`;

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = '등록 중...';
                submitBtn.classList.replace('bg-[#f97316]', 'bg-gray-400');

                try {
                    const { data, error } = await supabaseClient
                        .from('master_board')
                        .insert([
                            {
                                board_type: 'experience',
                                category: category,
                                title: title,
                                content: mainContent,
                                lesson_content: lessonContent,
                                author_name: finalAuthorName,
                                password: postPassword // 비밀번호 전송
                            }
                        ]);

                    if (error) throw error;

                    alert('소중한 경험이 성공적으로 등록되었습니다.');
                    window.location.href = 'field-experience.html'; 

                } catch (error) {
                    console.error('에러 발생:', error);
                    alert('글 등록에 실패했습니다.');
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    submitBtn.classList.replace('bg-gray-400', 'bg-[#f97316]');
                }
            });
        });
    </script>
</body>
</html>
