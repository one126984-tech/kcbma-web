<!-- Supabase 연동 로직 시작 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // 1. 본인의 Supabase 프로젝트 URL과 API 키
    const SUPABASE_URL ='https://ehrahnnowwjkgycvlbzk.supabase.co'; 
    const SUPABASE_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchNotices(keyword = '') {
        const tbody = document.getElementById('notice-list-body');
        
        try {
            // 2. 호출 시 supabaseClient 사용
            let query = supabaseClient
                .from('notices')
                .select('*')
                .order('is_pinned', { ascending: false })
                .order('created_at', { ascending: false });

            // 검색어가 입력되었다면 제목에서 부분 일치(ilike) 검색
            if (keyword) {
                query = query.ilike('title', `%${keyword}%`);
            }

            const { data, error } = await query;

            if (error) throw error;

            // 데이터가 아예 없을 때의 화면 처리
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-gray-500">등록된 공지사항이 없거나 검색 결과가 없습니다.</td>
                    </tr>
                `;
                return;
            }

            // 3. 기존 하드코딩된 임시 데이터를 지우고 새 데이터로 화면 그리기
            tbody.innerHTML = ''; 
            
            data.forEach((notice, index) => {
                // 날짜 포맷팅 (YYYY.MM.DD)
                const date = new Date(notice.created_at);
                const formattedDate = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
                
                // 공지 뱃지 또는 역순 번호 매기기
                const numberOrBadge = notice.is_pinned 
                    ? '<span class="bg-red-500 text-white text-[11px] px-2 py-0.5 rounded font-bold">공지</span>' 
                    : (data.length - index);

                const tr = document.createElement('tr');
                tr.className = notice.is_pinned ? 'hover:bg-gray-50 cursor-pointer bg-red-50/30' : 'hover:bg-gray-50 cursor-pointer';

                // ★ 이 한 줄을 추가해 주세요! (글 클릭 시 이동)
                tr.onclick = () => location.href = `notice-detail.html?id=${notice.id}`;

                // 테이블 칸(td) 채우기
                tr.innerHTML = `
                    <td class="py-3 px-2 hidden md:table-cell">${numberOrBadge}</td>
                    <td class="py-3 px-4 text-left font-bold text-gray-900 truncate">${notice.title}</td>
                    <td class="py-3 px-2">관리자</td>
                    <td class="py-3 px-2 hidden sm:table-cell">${formattedDate}</td>
                    <td class="py-3 px-2 hidden lg:table-cell">${notice.views || 0}</td>
                `;
                
                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error("데이터를 불러오는 중 오류가 발생했습니다:", error.message);
            tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500">데이터 연동에 실패했습니다.</td></tr>`;
        }
    }

    // 4. 페이지가 로드되면 즉시 데이터 불러오기 실행
    document.addEventListener('DOMContentLoaded', () => fetchNotices());

    // 5. 검색 버튼 클릭 및 엔터키 이벤트 연결
    document.getElementById('search-btn').addEventListener('click', () => {
        const keyword = document.getElementById('search-input').value;
        fetchNotices(keyword);
    });

    document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const keyword = document.getElementById('search-input').value;
            fetchNotices(keyword);
        }
    });
</script>
