    <style>
        html, body { overflow-x: hidden; height: 100%; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 56px; }

        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        
        .left-scroll-area { direction: rtl; overflow-y: auto; height: 100%; padding-bottom: 2rem; }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn { background-color: #2c3e50; color: #ffffff; font-weight: 700; padding: 6px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background-color 0.15s; }
        .login-btn:hover { background-color: #1a252f; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden page-community">

    <!-- 1. 상단 글로벌 헤더 -->
    <div class="sticky top-0 z-[1000] w-full flex flex-col bg-white border-b border-gray-200 shadow-sm shrink-0" id="main-header">
        <header class="flex justify-between items-center px-4 md:px-8 max-w-[1400px] mx-auto w-full h-[70px]">
            <div class="flex items-center h-full cursor-pointer shrink-0 mr-4" onclick="location.href='../../index.html'">
            <img src="../../assets/img/관리협회.png" class="h-[38px] md:h-[44px] w-auto object-contain" alt="대한집합건물관리협회" onerror="this.src='../../방패로고.jpg'">
            </div>

            <nav class="hidden lg:flex flex-1 justify-center lg:justify-between items-center px-6 xl:px-12 font-medium text-[15px] xl:text-[16px] text-gray-700 whitespace-nowrap">
            <div data-menu="about" onclick="if(!location.pathname.endsWith('about.html')) location.href='../../pages/about/about.html'" class="gnb-item nav-about cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">협회소개</div>
            <div data-menu="jobs" onclick="if(!location.pathname.endsWith('job-list.html') && !location.pathname.endsWith('resume-list.html')) location.href='../../pages/jobs/job-list.html'" class="gnb-item nav-jobs cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">구인구직</div>
            <div data-menu="bid" onclick="if(!location.pathname.endsWith('bid-list.html')) location.href='../../pages/bid/bid-list.html'" class="gnb-item nav-bid cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">입찰공고</div>
            <div data-menu="cert" onclick="if(!location.pathname.endsWith('cert-list.html')) location.href='../../pages/cert/cert-list.html'" class="gnb-item nav-cert cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">자격증</div>
            <div data-menu="board" onclick="if(!location.pathname.endsWith('board-corner.html')) location.href='../../pages/board/board-corner.html'" class="gnb-item nav-board cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">관리단 코너</div>
            <div data-menu="community" onclick="if(!location.pathname.endsWith('field-experience.html')) location.href='../../pages/community/field-experience.html'" class="gnb-item nav-community cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">커뮤니티</div>
            <div onclick="if(!location.pathname.endsWith('sos-request.html')) location.href='../../pages/sos/sos-request.html'" class="sos-btn nav-sos">
                <i class="fa-solid fa-phone-volume" style="font-size:13px;"></i><span>긴급 SOS 호출</span>
            </div>
            </nav>

            <div class="hidden sm:flex items-center gap-3 shrink-0 ml-2 whitespace-nowrap font-medium text-gray-700">
            <div class="relative cursor-pointer flex items-center justify-center w-[36px] h-[36px] rounded-full hover:bg-gray-100 transition-colors" title="알림 확인">
                <i class="fa-regular fa-bell text-gray-700 text-[18px]"></i>
                <span class="absolute top-[2px] right-[2px] flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white border-2 border-white">2</span>
            </div>
            <div onclick="if(!location.pathname.endsWith('dashboard.html')) location.href='../../pages/mypage/dashboard.html'" class="cursor-pointer text-[14px] hover:text-[#0088cc]">마이페이지</div>
            <div onclick="if(!location.pathname.endsWith('login.html')) location.href='../../login.html'" class="login-btn">로그인</div>
            </div>
        </header>

        <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center relative z-[800] shrink-0">
            <div class="max-w-[1400px] mx-auto w-full px-4 flex gap-4 md:gap-8 items-center h-full">
                <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide h-full">
                    커뮤니티
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 메인 컨텐츠 영역 -->
    <div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
        <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 pt-8 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden">

            <!-- 좌측 사이드 메뉴 -->
            <aside class="w-full md:w-[220px] shrink-0 h-full left-scroll-area z-40">
                <div class="left-scroll-content">
                    <div class="bg-white border border-gray-200 rounded shadow-sm mb-6">
                        <div class="side-menu-item mx-4 border-b border-gray-100" onclick="location.href='notice.html'">공지사항</div>
                        <div class="side-menu-active shadow-sm z-10 relative" onclick="location.href='free-board.html'">자유게시판</div>
                        <div class="side-menu-item mx-4 border-b border-gray-100" onclick="location.href='field-experience.html'">현장경험 나누어요</div>
                        <div class="side-menu-item mx-4 border-b border-gray-100" onclick="location.href='work-qna.html'">업무 Q&A</div>
                        <div class="side-menu-item mx-4" onclick="location.href='data-room.html'">서식/자료실</div>
                    </div>
                </div>
            </aside>

            <!-- 우측 글쓰기 폼 영역 -->
            <div class="flex-1 min-w-0 h-full main-scroll-area relative flex flex-col">
                <section class="flex-1 shrink-0 pb-8 flex flex-col">
                    
                    <div class="flex items-center gap-2 mb-4 border-b-2 border-[#1e293b] pb-2">
                        <h2 class="text-2xl font-bold text-gray-800">게시글 작성</h2>
                        <span class="text-gray-500 text-sm mt-1">자유게시판</span>
                    </div>

                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
                        
                        <!-- ★ 추가된 부분: 작성자와 비밀번호 나란히 배치 -->
                        <div class="mb-4 flex flex-col sm:flex-row gap-4 border-b border-gray-100 pb-4">
                            <div class="flex items-center">
                                <label for="author" class="w-24 shrink-0 font-bold text-gray-700">작성자</label>
                                <input type="text" id="author" placeholder="이름/닉네임" class="w-full sm:w-48 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" />
                            </div>
                            <div class="flex items-center">
                                <label for="password" class="w-24 sm:w-24 shrink-0 font-bold text-gray-700 sm:text-center">비밀번호 <span class="text-red-500">*</span></label>
                                <input type="password" id="password" placeholder="숫자 4자리" maxlength="4" class="w-full sm:w-32 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" />
                            </div>
                        </div>
                        
                        <div class="mb-4 flex items-center border-b border-gray-100 pb-4">
                            <label for="title" class="w-24 shrink-0 font-bold text-gray-700">제목 <span class="text-red-500">*</span></label>
                            <input type="text" id="title" placeholder="제목을 입력해 주세요." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" />
                        </div>

                        <div class="mb-4 flex items-start">
                            <label for="content" class="w-24 shrink-0 font-bold text-gray-700 pt-2">내용 <span class="text-red-500">*</span></label>
                            <textarea id="content" placeholder="상호 존중과 배려가 담긴 따뜻한 언어를 사용해 주세요. (정치, 종교 등 분란 조장 글은 삭제될 수 있습니다.)" class="w-full h-80 border border-gray-300 rounded px-3 py-3 text-sm focus:outline-none focus:border-[#12387a] resize-none"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-center gap-3 mt-6">
                        <button onclick="location.href='free-board.html'" class="px-6 py-2.5 border border-gray-300 rounded text-gray-700 font-medium hover:bg-gray-50 transition-colors">취소</button>
                        <button onclick="submitPost()" class="px-6 py-2.5 bg-[#12387a] rounded text-white font-bold hover:bg-[#0b224f] transition-colors">등록하기</button>
                    </div>

                </section>
                <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
            </div>
        </main>
    </div>

    <!-- 3. Supabase 글 등록 로직 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL ='https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function submitPost() {
            const authorValue = document.getElementById('author').value.trim();
            const passwordValue = document.getElementById('password').value.trim();
            const titleValue = document.getElementById('title').value.trim();
            const contentValue = document.getElementById('content').value.trim();

            // ★ 필수 입력값 체크 로직 추가
            if (!passwordValue) {
                alert("게시글 수정/삭제 시 사용할 비밀번호를 입력해 주세요.");
                document.getElementById('password').focus();
                return;
            }
            if (!titleValue) {
                alert("제목을 입력해 주세요.");
                document.getElementById('title').focus();
                return;
            }
            if (!contentValue) {
                alert("내용을 입력해 주세요.");
                document.getElementById('content').focus();
                return;
            }

            try {
                // DB Insert (password 포함)
                const { error } = await supabaseClient
                    .from('free_board')
                    .insert([{ 
                        title: titleValue, 
                        content: contentValue, 
                        author: authorValue || '회원',
                        password: passwordValue, // 방금 추가한 비밀번호 저장
                        is_pinned: false,
                        views: 0
                    }]);

                if (error) throw error;
                alert("게시글이 성공적으로 등록되었습니다.");
                location.href = 'free-board.html';

            } catch (error) {
                console.error("저장 중 오류 발생:", error.message);
                alert("게시글 등록에 실패했습니다. 잠시 후 다시 시도해 주세요.");
            }
        }
    </script>
</body>
</html>
