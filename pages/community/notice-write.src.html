    </div>
    <!-- 핑크박스 끝 -->

    <!-- Supabase 연동 스크립트 -->
    <script>
        const supabaseClient = window.sb;

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const titleValue = document.getElementById('title-input').value.trim();
            const contentValue = document.getElementById('content-input').value.trim();
            const isPinned = document.getElementById('pin-check').checked;

            if (!titleValue) {
                alert("제목을 입력해 주세요.");
                document.getElementById('title-input').focus();
                return;
            }
            if (!contentValue) {
                alert("내용을 입력해 주세요.");
                document.getElementById('content-input').focus();
                return;
            }

            try {
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = true;
                submitBtn.innerText = "등록 중...";

                const { error } = await supabaseClient
                    .from('notices')
                    .insert([
                        {
                            title: titleValue,
                            content: contentValue,
                            is_pinned: isPinned,
                            views: 0
                        }
                    ]);

                if (error) throw error;

                alert("공지사항이 성공적으로 등록되었습니다.");
                location.href = 'notice.html';

            } catch (error) {
                console.error("등록 실패:", error.message);
                alert("등록 중 문제가 발생했습니다: " + error.message);

                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = false;
                submitBtn.innerText = "등록하기";
            }
        });
    </script>
