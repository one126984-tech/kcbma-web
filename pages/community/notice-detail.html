<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>공지사항 상세 | 대한집합건물관리협회 커뮤니티</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- 상단 헤더 영역 -->
    <div class="sticky top-0 z-[1000] w-full flex flex-col bg-white border-b border-gray-200 shadow-sm shrink-0" id="main-header">
        <header class="flex justify-between items-center px-4 max-w-[1400px] mx-auto w-full h-[70px]">
            <div class="flex items-center h-full cursor-pointer shrink-0 mr-4" onclick="location.href='../../index.html'">
                <span class="font-bold text-xl text-[#12387a]">대한집합건물관리협회</span>
            </div>
        </header>
        <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center relative z-[800] shrink-0">
            <div class="max-w-[1400px] mx-auto w-full px-4 flex gap-4 md:gap-8 items-center h-full">
                <div class="shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide h-full">
                    커뮤니티 - 공지사항
                </div>
            </div>
        </div>
    </div>

    <!-- 본문 영역 -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-[1000px] mx-auto bg-white border border-gray-200 rounded-lg shadow-sm">
            
            <!-- 글 제목 및 정보 헤더 -->
            <div class="border-b border-gray-200 p-6 md:p-8">
                <h2 id="detail-title" class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">로딩 중...</h2>
                <div class="flex items-center text-sm text-gray-500 gap-4">
                    <span><i class="fa-solid fa-user mr-1"></i>관리자</span>
                    <span><i class="fa-regular fa-clock mr-1"></i><span id="detail-date">-</span></span>
                    <span><i class="fa-regular fa-eye mr-1"></i><span id="detail-views">0</span></span>
                </div>
            </div>

            <!-- 글 내용 -->
            <div class="p-6 md:p-8 min-h-[300px] text-gray-700 leading-relaxed whitespace-pre-wrap" id="detail-content">
                내용을 불러오는 중입니다...
            </div>

            <!-- 하단 버튼 -->
            <div class="bg-gray-50 p-4 border-t border-gray-200 flex justify-center">
                <button onclick="location.href='notice.src.html'" class="px-8 py-2.5 rounded-md bg-[#12387a] text-white font-bold hover:bg-[#0b224f] transition-colors shadow-sm">목록으로</button>
            </div>

        </div>
    </div>

    <!-- Supabase 연동 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ★ 본인의 Supabase 정보로 변경하세요!
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        
        // 에러 방지를 위해 여기도 supabaseClient 이름 사용
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadNoticeDetail() {
            // 주소창에서 글 번호(id) 가져오기
            const urlParams = new URLSearchParams(window.location.search);
            const noticeId = urlParams.get('id');

            if (!noticeId) {
                alert("잘못된 접근입니다.");
                location.href = 'notice.src.html';
                return;
            }

            try {
                // 1. 해당 ID의 데이터 불러오기
                const { data, error } = await supabaseClient
                    .from('notices')
                    .select('*')
                    .eq('id', noticeId)
                    .single();

                if (error) throw error;

                // 2. 화면에 데이터 채우기
                document.getElementById('detail-title').innerText = data.title;
                document.getElementById('detail-content').innerText = data.content;
                
                const date = new Date(data.created_at);
                document.getElementById('detail-date').innerText = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                document.getElementById('detail-views').innerText = data.views || 0;

                // 3. 조회수 1 증가시키기
                await supabaseClient
                    .from('notices')
                    .update({ views: (data.views || 0) + 1 })
                    .eq('id', noticeId);

            } catch (error) {
                console.error("오류 발생:", error.message);
                document.getElementById('detail-title').innerText = "데이터를 불러올 수 없습니다.";
                document.getElementById('detail-content').innerText = "삭제되었거나 존재하지 않는 글입니다.";
            }
        }

        document.addEventListener('DOMContentLoaded', loadNoticeDetail);
    </script>
</body>
</html>
