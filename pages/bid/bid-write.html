            from { opacity: 0; }
        }
        ::view-transition-old(page-content) {

        ::view-transition-new(page-content) {

        }

        ::view-transition-new(site-header) {

        html.no-page-transition #page-content,

            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }

        document.addEventListener('DOMContentLoaded', function() {
            const headerEl = document.getElementById('main-header');

            const updateHeaderHeightVar = () => {
                const h = headerEl.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--header-actual-height', h + 'px');

            updateHeaderHeightVar();
            const ro = new ResizeObserver(updateHeaderHeightVar);
            ro.observe(headerEl);

    <script>
        // Supabase 초기화
        const dummyStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: dummyStorage}}) : null;

        // DB 테이블명 (현재 임시로 jobs 사용 중. 앞서 안내한 SQL로 bids 테이블 생성 후 'bids'로 변경 추천)
        const DB_TABLE_NAME = 'jobs'; 

        document.addEventListener('DOMContentLoaded', () => {
            initForm();
        });

        function initForm() {
            // 1. 공고일 기본값을 '오늘'로 세팅
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const todayStr = new Date(today.getTime() - offset).toISOString().split('T')[0];
            document.getElementById('f-start-date').value = todayStr;

            // 2. 지역(대분류) 셀렉트 박스 채우기
            const regionSelect = document.getElementById('f-region');
            if (typeof regionData !== 'undefined') {
                for (const major in regionData) {
                    const option = document.createElement('option');
                    option.value = major;
                    option.text = major;
                    regionSelect.appendChild(option);
                }
            } else {
                // regionData가 로드되지 않았을 경우를 대비한 하드코딩 백업
                const defaultRegions = ['서울', '경기', '인천', '부산', '대구', '광주', '대전', '울산', '세종', '강원', '경남', '경북', '전남', '전북', '충남', '충북', '제주'];
                defaultRegions.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r;
                    option.text = r;
                    regionSelect.appendChild(option);
                });
            }
        }

        async function submitBid(event) {
            event.preventDefault(); // 폼 기본 제출 방지

            if(!supabaseClient) {
                alert('데이터베이스 연결에 실패했습니다.');
                return;
            }

            // 값 수집
            const title = document.getElementById('f-title').value.trim();
            const company = document.getElementById('f-company').value.trim();
            const category = document.getElementById('f-category').value;
            const region = document.getElementById('f-region').value;
            const locationStr = document.getElementById('f-location').value.trim();
            const startDate = document.getElementById('f-start-date').value;
            const endDate = document.getElementById('f-end-date').value;
            const description = document.getElementById('f-description').value.trim();

            // 시작일과 마감일 유효성 검사
            if (new Date(startDate) > new Date(endDate)) {
                alert('마감일은 공고 시작일 이후여야 합니다.');
                return;
            }

            // 제출 버튼 비활성화 (중복 등록 방지)
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerText = '등록 중...';
            submitBtn.style.opacity = '0.7';

            try {
                // 데이터 INSERT
                const { data, error } = await supabaseClient
                    .from(DB_TABLE_NAME)
                    .insert([
                        {
                            title: title,
                            company_name: company,
                            category: category,
                            region: region,
                            location: locationStr,
                            start_date: startDate,
                            end_date: endDate,
                            description: description,
                            status: 'OPEN', // 기본 상태
                            views: 0
                        }
                    ]);

                if (error) throw error;

                alert('입찰공고가 성공적으로 등록되었습니다.');
                window.location.href = 'bid-list.html'; // 리스트 페이지로 이동

            } catch (error) {
                console.error('Insert error:', error);
                alert('공고 등록 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                
                // 버튼 원상복구
                submitBtn.disabled = false;
                submitBtn.innerText = '등록하기';
                submitBtn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
