<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>마이페이지 | 대한집합건물관리협회</title>

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>

    <!-- ★ 표준 헤더 연동 -->
    <script>window.BASE_PATH = '../../';</script>
    <script src="../../assets/js/header.js?v=1.9" defer></script>

    <style>
        html, body { overflow-y: scroll; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: all 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active-wrapper { padding: 10px; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; }

        .summary-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
        .summary-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .summary-value { font-size: 26px; font-weight: 900; color: #0B2A5B; }
        .summary-label { font-size: 13.5px; color: #6b7280; font-weight: 500; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }
        .section-title { font-size: 18px; font-weight: 900; color: #12387a; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; justify-content: space-between; }

        .progress-bar-bg { width: 100%; height: 8px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #274bce, #12387a); border-radius: 6px; transition: width 0.4s; }

        .course-row { display: flex; align-items: center; gap: 18px; padding: 18px 0; border-bottom: 1px dashed #e5e7eb; }
        .course-row:last-child { border-bottom: none; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 1. 표준 헤더 영역 (header.js로 연동) -->
    <div id="header-container" class="w-full bg-white shrink-0"></div>

    <!-- 2. 파란색 서브 헤더 -->
    <div class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                마이페이지
            </div>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 -->
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border rounded shadow-sm mb-6">
                <div class="side-menu-active-wrapper border-b"><div class="side-menu-active shadow-sm">대시보드</div></div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='my-courses.html'">내 수강 목록</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='my-certs.html'">내 자격증</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='my-exams.html'">시험 결과</div>
                <div class="side-menu-item mx-4 border-b">내 정보</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <!-- 환영 메시지 -->
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]" id="welcome-msg">안녕하세요!</div>

            <!-- 요약 카드 4개 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="summary-card">
                    <div class="summary-icon bg-blue-100 text-blue-700"><i class="fas fa-book-open"></i></div>
                    <div class="summary-value" id="stat-active">0</div>
                    <div class="summary-label">수강 중인 과정</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-green-100 text-green-700"><i class="fas fa-graduation-cap"></i></div>
                    <div class="summary-value" id="stat-completed">0</div>
                    <div class="summary-label">수료한 과정</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-indigo-100 text-indigo-700"><i class="fas fa-certificate"></i></div>
                    <div class="summary-value" id="stat-cert">0</div>
                    <div class="summary-label">취득한 자격증</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-amber-100 text-amber-700"><i class="fas fa-chart-line"></i></div>
                    <div class="summary-value" id="stat-avg-progress">0%</div>
                    <div class="summary-label">전체 평균 진도율</div>
                </div>
            </div>

            <!-- 수강 중인 과정 목록 -->
            <div class="section-card">
                <div class="section-title">
                    <span>수강 중인 과정</span>
                    <a href="my-courses.html" class="text-[13.5px] text-gray-500 hover:text-[#12387a] font-bold">전체 보기 <i class="fas fa-chevron-right text-[11px] ml-0.5"></i></a>
                </div>
                <div id="ongoing-course-list">
                    <div class="text-center py-14 text-gray-400 text-sm">데이터를 불러오는 중입니다...</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;

        const dummyEnrollments = [
            {
                id: 'dummy-e1',
                status: 'ACTIVE',
                progress_rate: 62.5,
                enrolled_at: '2026-07-20T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전', edu_method: 'VOD' }
            },
            {
                id: 'dummy-e2',
                status: 'ACTIVE',
                progress_rate: 30,
                enrolled_at: '2026-08-01T00:00:00Z',
                completed_at: null,
                cert_courses: { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계', edu_method: 'MIX' }
            },
            {
                id: 'dummy-e3',
                status: 'COMPLETED',
                progress_rate: 100,
                enrolled_at: '2026-06-01T00:00:00Z',
                completed_at: '2026-06-25T00:00:00Z',
                cert_courses: { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선', edu_method: 'VOD' }
            }
        ];

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }

        function requireLogin() {
            if (!currentUser) {
                window.location.href = '../../login.html';
                return false;
            }
            return true;
        }

        function renderWelcome() {
            const name = (currentUser && (currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email)) || '회원';
            document.getElementById('welcome-msg').textContent = `${name}님, 안녕하세요!`;
        }

        async function fetchEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(*)')
                    .eq('user_id', currentUser.id)
                    .order('enrolled_at', { ascending: false });

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyEnrollments;
            } catch (e) {
                console.error('수강 목록 조회 실패:', e);
                return dummyEnrollments;
            }
        }

        async function fetchCertCount() {
            try {
                const { count, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', currentUser.id)
                    .eq('status', 'ISSUED');

                if (error) throw error;
                return count || 0;
            } catch (e) {
                console.error('자격증 수 조회 실패:', e);
                return 0;
            }
        }

        function renderStats(enrollments, certCount) {
            const activeCount = enrollments.filter(e => e.status === 'ACTIVE').length;
            const completedCount = enrollments.filter(e => e.status === 'COMPLETED').length;
            const avgProgress = enrollments.length > 0
                ? Math.round(enrollments.reduce((sum, e) => sum + (Number(e.progress_rate) || 0), 0) / enrollments.length)
                : 0;

            document.getElementById('stat-active').textContent = activeCount;
            document.getElementById('stat-completed').textContent = completedCount;
            document.getElementById('stat-cert').textContent = certCount;
            document.getElementById('stat-avg-progress').textContent = `${avgProgress}%`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function renderOngoingCourses(enrollments) {
            const container = document.getElementById('ongoing-course-list');
            const ongoing = enrollments.filter(e => e.status === 'ACTIVE').slice(0, 3);

            if (ongoing.length === 0) {
                container.innerHTML = '<div class="text-center py-14 text-gray-400 text-sm">수강 중인 과정이 없습니다.</div>';
                return;
            }

            container.innerHTML = ongoing.map(e => {
                const course = e.cert_courses || {};
                const rate = Number(e.progress_rate) || 0;
                return `
                    <div class="course-row">
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-[15px] text-[#0B2A5B] mb-2 truncate">${course.title || '-'}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${rate}%;"></div>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-[12.5px] text-gray-500">수강 시작일: ${formatDate(e.enrolled_at)}</span>
                                <span class="text-[12.5px] font-bold text-[#12387a]">${rate}%</span>
                            </div>
                        </div>
                        <button onclick="location.href='../cert/cert-player.html?enrollment_id=${e.id}'" class="shrink-0 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 px-4 rounded transition-colors whitespace-nowrap">이어서 학습하기</button>
                    </div>
                `;
            }).join('');
        }

        async function init() {
            await fetchUser();
            if (!requireLogin()) return;

            renderWelcome();

            const [enrollments, certCount] = await Promise.all([
                fetchEnrollments(),
                fetchCertCount()
            ]);

            renderStats(enrollments, certCount);
            renderOngoingCourses(enrollments);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
