    <style>
        /* 이 페이지(내 자격증) 전용 CSS */
        html, body { overflow-y: scroll; }

        .cert-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid #12387a;
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(11, 42, 91, 0.08);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cert-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(11, 42, 91, 0.14); }
        .cert-card.pending { border-color: #f59e0b; }
        .cert-card.pending::before { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .cert-card.confirmed { border-color: #3b82f6; }
        .cert-card.confirmed::before { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .cert-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #274bce, #12387a);
        }
        .cert-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px 26px 16px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .cert-emblem {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: #12387a;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(11,42,91,0.3);
        }
        .cert-card.pending .cert-emblem { background: #f59e0b; }
        .cert-card.confirmed .cert-emblem { background: #3b82f6; }
        .cert-org-name { font-size: 12px; font-weight: 700; color: #6b7280; letter-spacing: 0.5px; }
        .cert-title { font-size: 17px; font-weight: 900; color: #0B2A5B; margin-top: 2px; }
        .cert-card-body { padding: 20px 26px; }
        .cert-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13.5px; border-bottom: 1px dotted #e5e7eb; }
        .cert-row:last-child { border-bottom: none; }
        .cert-row .label { color: #6b7280; font-weight: 500; }
        .cert-row .value { color: #1f2937; font-weight: 700; }
        .cert-card-footer { padding: 16px 26px; background: #f8fafc; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
        .seal-watermark {
            position: absolute;
            right: 20px; top: 20px;
            width: 70px; height: 70px;
            border: 3px solid rgba(18, 56, 122, 0.12);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: rgba(18, 56, 122, 0.12);
            font-size: 11px;
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            transform: rotate(-12deg);
        }
        .empty-state { text-align: center; padding: 90px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; color: #6b7280; }
        .cert-loading-box { text-align: center; padding: 90px 20px; color: #6b7280; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; }
        .cert-spinner { width: 36px; height: 36px; border: 4px solid #dbe4f5; border-top-color: #12387a; border-radius: 50%; margin: 0 auto 14px; animation: cert-spin 0.8s linear infinite; }
        @keyframes cert-spin { to { transform: rotate(360deg); } }
    </style>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let currentUser = null;
        const dummyCertificates = [
            {
                id: 'dummy-c1',
                cert_number: 'KCBMA-2026-ELC-00001',
                cert_name: '기전당직실무관리사',
                holder_name: '홍*동',
                status: 'ISSUED',
                issued_at: '2026-07-01T00:00:00Z',
                created_at: '2026-06-20T00:00:00Z',
                payment_amount: 250000,
                depositor_name: '홍길동',
                pdf_url: null,
                cert_courses: { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전' }
            },
            {
                id: 'dummy-c2',
                cert_number: 'KCBMA-2026-PLM-00007',
                cert_name: '영선실무관리사',
                holder_name: '홍*동',
                status: 'ISSUED',
                issued_at: '2026-06-25T00:00:00Z',
                created_at: '2026-06-15T00:00:00Z',
                payment_amount: 250000,
                depositor_name: '홍길동',
                pdf_url: null,
                cert_courses: { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선' }
            },
            {
                id: 'dummy-c3',
                cert_number: null,
                cert_name: '기계설비유지관리사',
                holder_name: '홍*동',
                status: 'PENDING_PAYMENT',
                issued_at: null,
                created_at: '2026-08-05T00:00:00Z',
                payment_amount: 250000,
                depositor_name: '홍길동',
                pdf_url: null,
                cert_courses: { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계' }
            }
        ];
        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                console.error('사용자 조회 실패:', e);
                currentUser = null;
            }
        }
        function requireLogin() {
            if (!currentUser) {
                window.location.href = '{{BASE}}login.html';
                return false;
            }
            return true;
        }
        async function fetchCertificates() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*, cert_courses(id, title, category)')
                    .eq('user_id', currentUser.id)
                    .in('status', ['PENDING_PAYMENT', 'PAYMENT_CONFIRMED', 'ISSUED'])
                    .order('created_at', { ascending: false });
                if (error) throw error;
                return (data && data.length > 0) ? data : dummyCertificates;
            } catch (e) {
                console.error('자격증 조회 실패:', e);
                return dummyCertificates;
            }
        }
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }
        function statusBadge(status) {
            if (status === 'ISSUED') return '<span class="bg-green-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">발급완료</span>';
            if (status === 'PAYMENT_CONFIRMED') return '<span class="bg-blue-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">발급 진행 중</span>';
            if (status === 'PENDING_PAYMENT') return '<span class="bg-amber-500 text-white px-2.5 py-1 rounded text-[11px] font-bold">입금 대기 중</span>';
            if (status === 'REVOKED') return '<span class="bg-red-500 text-white px-2.5 py-1 rounded text-[11px] font-bold">발급취소</span>';
            return '<span class="bg-gray-400 text-white px-2.5 py-1 rounded text-[11px] font-bold">-</span>';
        }
        function renderEmpty() {
            return `
                <div class="col-span-full empty-state">
                    <i class="fas fa-certificate text-4xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500 font-medium mb-1">아직 발급된 자격증이 없습니다.</p>
                    <p class="text-[13px] text-gray-400 mb-5">과정 수료 후 시험에 합격하면 자격증을 신청할 수 있습니다.</p>
                    <a href="../cert/cert-list.html" class="inline-block bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[14px] py-3 px-7 rounded-lg transition-colors">
                        <i class="fas fa-graduation-cap mr-1.5"></i>자격증 과정 바로가기
                    </a>
                </div>
            `;
        }
        function renderList(certs) {
            const container = document.getElementById('cert-list');
            if (!certs || certs.length === 0) {
                container.innerHTML = renderEmpty();
                return;
            }
            container.innerHTML = certs.map(cert => {
                const course = cert.cert_courses || {};
                const cardClass = cert.status === 'PENDING_PAYMENT' ? 'pending' : (cert.status === 'PAYMENT_CONFIRMED' ? 'confirmed' : '');
                const emblemIcon = cert.status === 'ISSUED' ? 'fa-award' : (cert.status === 'PAYMENT_CONFIRMED' ? 'fa-gear' : 'fa-clock');
                const dateRow = cert.status === 'ISSUED'
                    ? `<div class="cert-row"><span class="label">발급일</span><span class="value">${formatDate(cert.issued_at)}</span></div>`
                    : `<div class="cert-row"><span class="label">신청일</span><span class="value">${formatDate(cert.created_at)}</span></div>`;
                const numberRow = cert.status === 'ISSUED'
                    ? `<div class="cert-row"><span class="label">자격증번호</span><span class="value font-mono">${cert.cert_number || '-'}</span></div>`
                    : `<div class="cert-row"><span class="label">발급비</span><span class="value">${(cert.payment_amount || 250000).toLocaleString()}원</span></div>`;
                const footerHtml = cert.status === 'ISSUED' ? `
                    <a href="../cert/cert-verify.html" class="flex-1 text-center bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2.5 rounded-lg transition-colors">
                        <i class="fas fa-shield-halved mr-1"></i>진위확인 페이지
                    </a>
                    <button disabled title="추후 지원 예정" class="flex-1 bg-gray-200 text-gray-400 font-bold text-[13px] py-2.5 rounded-lg cursor-not-allowed">
                        <i class="fas fa-file-pdf mr-1"></i>PDF 다운로드
                    </button>
                ` : `
                    <div class="flex-1 text-center text-gray-500 font-bold text-[13px] py-2.5">
                        <i class="fas fa-info-circle mr-1"></i>${cert.status === 'PENDING_PAYMENT' ? '입금 확인 후 발급이 진행됩니다.' : '자격증 발급을 준비 중입니다.'}
                    </div>
                `;
                return `
                    <div class="cert-card ${cardClass}">
                        <div class="seal-watermark">KCBMA<br>OFFICIAL</div>
                        <div class="cert-card-header">
                            <div class="cert-emblem"><i class="fas ${emblemIcon}"></i></div>
                            <div>
                                <div class="cert-org-name">대한집합건물관리협회 공식 인증</div>
                                <div class="cert-title">${cert.cert_name || course.title || '-'}</div>
                            </div>
                        </div>
                        <div class="cert-card-body">
                            ${numberRow}
                            <div class="cert-row"><span class="label">취득자명</span><span class="value">${cert.holder_name || '-'}</span></div>
                            ${dateRow}
                            <div class="cert-row"><span class="label">상태</span><span class="value">${statusBadge(cert.status)}</span></div>
                        </div>
                        <div class="cert-card-footer">
                            ${footerHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }
        async function init() {
            await fetchUser();
            if (!requireLogin()) return;
            const certs = await fetchCertificates();
            renderList(certs);
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
