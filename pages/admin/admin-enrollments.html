    <style>
        /* [COMMON-CSS-CRITICAL] 자동 생성됨 — 이 내용을 고치려면
           _partials/critical-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐).

           ⚠ 여기에 opacity 0→1 페이드 같은 "로딩 후 서서히 나타내기" 트릭을
              다시 넣지 말 것. resume-list.html 원본 주석에 남아있듯,
              그런 트릭을 View Transition(아래 view-transition-css 파샬)과
              같이 쓰면 "이중 페이드"로 오히려 흰 화면이 더 도드라져 보이는
              버그가 실제로 있었음. 이 파일은 순수 배경색 즉시 고정 용도로만
              쓸 것. */
        #main-header { background-color: #ffffff; }
        #sub-header-bar {
            background-color: #12387a; height: 56px;
            /* ★ 2026-08: 이제 #sub-header-bar는 header.html/header-close.html
               분할 덕분에 #main-header의 "자식"으로 들어가 있어서 (예전엔
               형제 요소였음) 따로 sticky를 줄 필요가 없어짐 — 부모인
               #main-header가 통째로 sticky라 자동으로 같이 고정됨.
               (예전에 시도했던 position:sticky 오버라이드는 제거함) */
        }

        /* ★★★ 2026-08 추가 → 이후 되돌림: Tailwind CDN 스크립트가 렌더링을
           막고있는 동안(로드 전) 페이지가 스타일 없이 날것으로 보이는 문제를
           고치려고 script에 defer를 붙여봤었는데, 그러면 오른쪽 유틸리티
           영역(알림·마이페이지·로그인)처럼 이 스킈레톤이 못 커버한 부분이
           Tailwind 로드 전에 잠깐 글자가 겹쳐 보이는 "새로운" 버그가 생겨서
           defer는 다시 뺐음 (지금은 원래대로 blocking script).
           이 스킈레톤 CSS 자체는 혹시 CDN이 막히거나 느릴 때를 대비한
           안전망으로 그냥 남겨둠 (blocking 상태에선 어차피 Tailwind와 거의
           동시에 적용되니 해 될 거 없음).

           ⚠ 진짜 근본 해결책은 여전히 Tailwind를 CDN 스크립트가 아니라
           미리 빌드한 정적 CSS 파일로 self-host 하는 것 (Tailwind 공식문서도
           CDN 스크립트는 프로덕션에 쓰지 말라고 명시함). 이 프로젝트 루트의
           tailwind.config.js 파일 안 주석에 실행 방법 적어뒀음 — 인터넷 되는
           PC에서 딱 한 번만 빌드하면 이 시리즈의 모든 "튀고 흔들리는" 문제가
           구조적으로 끝남. */
        #main-header header {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto; width: 100%; height: 70px;
            padding: 0 16px;
        }
        #main-header nav {
            display: none; flex: 1; justify-content: space-between; align-items: center;
            padding: 0 24px; white-space: nowrap;
        }
        @media (min-width: 1024px) {
            #main-header nav { display: flex; }
        }
        #main-header .sos-btn {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        #main-header > header > button { display: block; }
        @media (min-width: 1024px) {
            #main-header > header > button { display: none; }
        }
        #sub-header-bar {
            display: flex; align-items: center; width: 100%;
        }
        #sub-header-bar > div {
            max-width: 1400px; margin: 0 auto; width: 100%;
            display: flex; align-items: center; height: 100%; padding: 0 16px;
        }
    </style>

    <style>
        /* [COMMON-CSS] 자동 생성됨 — 이 내용을 고치려면
           _partials/common-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐). */

        html, body { overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 56px; }

        /* ★ 사이드 탭 메뉴 — 패턴 A: AJAX 탭 전환용 (job-list / resume-list) */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        /* ★ 사이드 탭 메뉴 — 패턴 B: 목록형 (bid-list / field-experience 등)
           패턴 A와 이름/스타일이 다름. 두 패턴이 실제로 공존 중이라 둘 다 남겨둠.
           (장기적으로는 하나로 통일하는 걸 권장 — README 참고) */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        .side-menu-active-wrapper { padding: 10px; }

        /* ★ 좌측 메뉴 독립 스크롤 (스크롤바 왼쪽 배치) — cert-list/field-experience/dashboard 공통 */
        .left-scroll-area {
            direction: rtl;
            overflow-y: auto;
            height: 100%;
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        /* ★ 우측 본문 영역 독립 스크롤 */
        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }

        /* 스크롤바 숨김 유틸리티 */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* -------------------------------------
           공통 헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }
    </style>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // 현재 페이지에 해당하는 GNB 메뉴를 파란색으로 강조 + 헤더 높이 계산
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }
        });
    </script>

    <script>
        const supabaseClient = window.sb;
        let allEnrollments = [], filteredEnrollments = [], allCourses = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '../../index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function enrollStatusBadge(status) {
            if (status === 'ACTIVE') return '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[11px] font-bold">수강중</span>';
            if (status === 'COMPLETED') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">수료</span>';
            if (status === 'EXPIRED') return '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[11px] font-bold">만료</span>';
            if (status === 'CANCELLED') return '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[11px] font-bold">취소</span>';
            return '<span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[11px] font-bold">-</span>';
        }

        const dummyCourses = [
            { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정' },
            { id: 'dummy-2', title: '전기방재안전관리사 실시간 화상 강의 과정' },
            { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정' }
        ];

        const dummyEnrollments = [
            { id: 'de1', user_id: '3f2a1b90-aaaa-bbbb-cccc-user1', course_id: 'dummy-1', enrolled_at: '2026-08-15T09:00:00Z', completed_at: null, status: 'ACTIVE', progress_rate: 42.5, cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } },
            { id: 'de2', user_id: '9c8d7e60-aaaa-bbbb-cccc-user2', course_id: 'dummy-2', enrolled_at: '2026-08-14T15:30:00Z', completed_at: '2026-08-20T10:00:00Z', status: 'COMPLETED', progress_rate: 100, cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } },
            { id: 'de3', user_id: 'a1b2c3d4-aaaa-bbbb-cccc-user3', course_id: 'dummy-3', enrolled_at: '2026-08-14T11:20:00Z', completed_at: null, status: 'ACTIVE', progress_rate: 15, cert_courses: { title: '기계설비유지관리사 이론 및 실무 종합과정' } },
            { id: 'de4', user_id: 'b5c6d7e8-aaaa-bbbb-cccc-user4', course_id: 'dummy-1', enrolled_at: '2026-07-13T18:05:00Z', completed_at: null, status: 'EXPIRED', progress_rate: 30, cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } },
            { id: 'de5', user_id: 'f1e2d3c4-aaaa-bbbb-cccc-user5', course_id: 'dummy-2', enrolled_at: '2026-08-13T10:40:00Z', completed_at: null, status: 'CANCELLED', progress_rate: 0, cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } }
        ];

        async function fetchCourseOptions() {
            try {
                const { data, error } = await supabaseClient.from('cert_courses').select('id, title').order('title', { ascending: true });
                if (error) throw error;
                allCourses = (data && data.length > 0) ? data : dummyCourses;
            } catch (e) {
                console.error('과정 목록 조회 실패:', e);
                allCourses = dummyCourses;
            }

            const select = document.getElementById('course-filter');
            allCourses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.title;
                select.appendChild(opt);
            });
        }

        async function fetchEnrollments() {
            const tbody = document.getElementById('enrollment-list-body');
            tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(title)')
                    .order('enrolled_at', { ascending: false });

                if (error) throw error;
                allEnrollments = (data && data.length > 0) ? data : dummyEnrollments;
                applyFilters();
            } catch (e) {
                console.error('수강생 목록 조회 실패:', e);
                allEnrollments = dummyEnrollments;
                applyFilters();
            }
        }

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'ALL';
        }

        function applyFilters() {
            const status = getRadioValue('status_filter');
            const courseId = document.getElementById('course-filter').value;
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredEnrollments = allEnrollments.filter(item => {
                const matchStatus = status === 'ALL' || item.status === status;
                const matchCourse = courseId === 'ALL' || String(item.course_id) === String(courseId);
                const matchKeyword = !keyword || String(item.user_id || '').toLowerCase().includes(keyword);
                return matchStatus && matchCourse && matchKeyword;
            });

            renderEnrollments();
        }

        function renderEnrollments() {
            const tbody = document.getElementById('enrollment-list-body');

            if (!filteredEnrollments || filteredEnrollments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">조건에 맞는 수강생이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredEnrollments.map((item, idx) => {
                const course = item.cert_courses || {};
                return `
                <tr>
                    <td class="text-gray-400">${idx + 1}</td>
                    <td class="text-gray-500" title="${item.user_id || ''}">${item.user_id ? String(item.user_id).slice(0, 8) + '...' : '-'}</td>
                    <td class="text-left font-bold text-[#0B2A5B]">${course.title || '-'}</td>
                    <td>${Number(item.progress_rate || 0).toFixed(1)}%</td>
                    <td>
                        <select class="status-select" onchange="changeStatus('${item.id}', this.value)">
                            <option value="ACTIVE" ${item.status === 'ACTIVE' ? 'selected' : ''}>수강중</option>
                            <option value="COMPLETED" ${item.status === 'COMPLETED' ? 'selected' : ''}>수료</option>
                            <option value="EXPIRED" ${item.status === 'EXPIRED' ? 'selected' : ''}>만료</option>
                            <option value="CANCELLED" ${item.status === 'CANCELLED' ? 'selected' : ''}>취소</option>
                        </select>
                    </td>
                    <td class="text-gray-500">${formatDate(item.enrolled_at)}</td>
                    <td class="text-gray-500">${formatDate(item.completed_at)}</td>
                    <td>
                        <span class="btn-manage btn-delete" onclick="deleteEnrollment('${item.id}')">삭제</span>
                    </td>
                </tr>
            `;
            }).join('');
        }

        async function changeStatus(id, newStatus) {
            const payload = { status: newStatus };
            if (newStatus === 'COMPLETED') payload.completed_at = new Date().toISOString();

            try {
                const { error } = await supabaseClient.from('cert_enrollments').update(payload).eq('id', id);
                if (error) throw error;
                alert('상태가 변경되었습니다.');
                fetchEnrollments();
            } catch (e) {
                console.error('상태 변경 실패:', e);
                alert('상태 변경 중 오류가 발생했습니다.');
            }
        }

        async function deleteEnrollment(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_enrollments').delete().eq('id', id);
                if (error) throw error;
                alert('삭제되었습니다.');
                fetchEnrollments();
            } catch (e) {
                console.error('삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            await fetchCourseOptions();
            fetchEnrollments();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
