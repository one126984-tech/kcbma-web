    <style>
        /* 이 페이지(수강생 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }

        .filter-table { width: 100%; border-top: 2px solid #e5e7eb; background: #fff; border-collapse: collapse; margin-bottom: 15px; }
        .filter-table th { background: #f9fafb; color: #1e3a8a; font-weight: bold; width: 80px; min-width: 80px; text-align: center; border-bottom: 1px dashed #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 15px; padding: 16px 5px; vertical-align: middle; }
        .filter-table td { padding: 16px 20px; border-bottom: 1px dashed #e5e7eb; font-size: 14px; vertical-align: middle; }

        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 8px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }

        .status-select { border: 1px solid #d1d5db; border-radius: 4px; padding: 3px 6px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                관리자

<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab-active">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">수강생 관리</div>

            <table class="filter-table shadow-sm">
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">상태</th>
                    <td style="border-bottom: 2px solid #e5e7eb;">
                        <div class="flex gap-5 flex-wrap">
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ALL" checked onchange="applyFilters()"> 전체</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ACTIVE" onchange="applyFilters()"> 수강중</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="COMPLETED" onchange="applyFilters()"> 수료</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="EXPIRED" onchange="applyFilters()"> 만료</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="CANCELLED" onchange="applyFilters()"> 취소</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">과정</th>
                    <td style="border-bottom: 2px solid #e5e7eb;">
                        <select id="course-filter" class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" onchange="applyFilters()">
                            <option value="ALL">전체 과정</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">검색</th>
                    <td style="background-color: #f8fafc;">
                        <div class="flex gap-2">
                            <input type="text" id="search-keyword" placeholder="사용자ID 입력" class="flex-1 max-w-[320px] border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" onkeydown="if(event.key==='Enter') applyFilters()">
                            <button onclick="applyFilters()" class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13px] py-2 px-4 rounded transition-colors"><i class="fas fa-search mr-1"></i>검색</button>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="section-card">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>사용자ID</th>
                                <th>과정명</th>
                                <th>진도율</th>
                                <th>상태</th>
                                <th>신청일</th>
                                <th>수료일</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="enrollment-list-body">
                            <tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let allEnrollments = [], filteredEnrollments = [], allCourses = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function enrollStatusBadge(status) {
            if (status === 'ACTIVE') return '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[11px] font-bold">수강중</span>';
            if (status === 'COMPLETED') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">수료</span>';
            if (status === 'EXPIRED') return '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[11px] font-bold">만료</span>';
            if (status === 'CANCELLED') return '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[11px] font-bold">취소</span>';
            return '<span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[11px] font-bold">-</span>';
        }

        const dummyCourses = [
            { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정' },
            { id: 'dummy-2', title: '전기방재안전관리사 실시간 화상 강의 과정' },
            { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정' }
        ];

        const dummyEnrollments = [
            { id: 'de1', user_id: '3f2a1b90-aaaa-bbbb-cccc-user1', course_id: 'dummy-1', enrolled_at: '2026-08-15T09:00:00Z', completed_at: null, status: 'ACTIVE', progress_rate: 42.5, cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } },
            { id: 'de2', user_id: '9c8d7e60-aaaa-bbbb-cccc-user2', course_id: 'dummy-2', enrolled_at: '2026-08-14T15:30:00Z', completed_at: '2026-08-20T10:00:00Z', status: 'COMPLETED', progress_rate: 100, cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } },
            { id: 'de3', user_id: 'a1b2c3d4-aaaa-bbbb-cccc-user3', course_id: 'dummy-3', enrolled_at: '2026-08-14T11:20:00Z', completed_at: null, status: 'ACTIVE', progress_rate: 15, cert_courses: { title: '기계설비유지관리사 이론 및 실무 종합과정' } },
            { id: 'de4', user_id: 'b5c6d7e8-aaaa-bbbb-cccc-user4', course_id: 'dummy-1', enrolled_at: '2026-07-13T18:05:00Z', completed_at: null, status: 'EXPIRED', progress_rate: 30, cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } },
            { id: 'de5', user_id: 'f1e2d3c4-aaaa-bbbb-cccc-user5', course_id: 'dummy-2', enrolled_at: '2026-08-13T10:40:00Z', completed_at: null, status: 'CANCELLED', progress_rate: 0, cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } }
        ];

        async function fetchCourseOptions() {
            try {
                const { data, error } = await supabaseClient.from('cert_courses').select('id, title').order('title', { ascending: true });
                if (error) throw error;
                allCourses = (data && data.length > 0) ? data : dummyCourses;
            } catch (e) {
                console.error('과정 목록 조회 실패:', e);
                allCourses = dummyCourses;
            }

            const select = document.getElementById('course-filter');
            allCourses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.title;
                select.appendChild(opt);
            });
        }

        async function fetchEnrollments() {
            const tbody = document.getElementById('enrollment-list-body');
            tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(title)')
                    .order('enrolled_at', { ascending: false });

                if (error) throw error;
                allEnrollments = (data && data.length > 0) ? data : dummyEnrollments;
                applyFilters();
            } catch (e) {
                console.error('수강생 목록 조회 실패:', e);
                allEnrollments = dummyEnrollments;
                applyFilters();
            }
        }

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'ALL';
        }

        function applyFilters() {
            const status = getRadioValue('status_filter');
            const courseId = document.getElementById('course-filter').value;
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredEnrollments = allEnrollments.filter(item => {
                const matchStatus = status === 'ALL' || item.status === status;
                const matchCourse = courseId === 'ALL' || String(item.course_id) === String(courseId);
                const matchKeyword = !keyword || String(item.user_id || '').toLowerCase().includes(keyword);
                return matchStatus && matchCourse && matchKeyword;
            });

            renderEnrollments();
        }

        function renderEnrollments() {
            const tbody = document.getElementById('enrollment-list-body');

            if (!filteredEnrollments || filteredEnrollments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">조건에 맞는 수강생이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredEnrollments.map((item, idx) => {
                const course = item.cert_courses || {};
                return `
                <tr>
                    <td class="text-gray-400">${idx + 1}</td>
                    <td class="text-gray-500" title="${item.user_id || ''}">${item.user_id ? String(item.user_id).slice(0, 8) + '...' : '-'}</td>
                    <td class="text-left font-bold text-[#0B2A5B]">${course.title || '-'}</td>
                    <td>${Number(item.progress_rate || 0).toFixed(1)}%</td>
                    <td>
                        <select class="status-select" onchange="changeStatus('${item.id}', this.value)">
                            <option value="ACTIVE" ${item.status === 'ACTIVE' ? 'selected' : ''}>수강중</option>
                            <option value="COMPLETED" ${item.status === 'COMPLETED' ? 'selected' : ''}>수료</option>
                            <option value="EXPIRED" ${item.status === 'EXPIRED' ? 'selected' : ''}>만료</option>
                            <option value="CANCELLED" ${item.status === 'CANCELLED' ? 'selected' : ''}>취소</option>
                        </select>
                    </td>
                    <td class="text-gray-500">${formatDate(item.enrolled_at)}</td>
                    <td class="text-gray-500">${formatDate(item.completed_at)}</td>
                    <td>
                        <span class="btn-manage btn-delete" onclick="deleteEnrollment('${item.id}')">삭제</span>
                    </td>
                </tr>
            `;
            }).join('');
        }

        async function changeStatus(id, newStatus) {
            const payload = { status: newStatus };
            if (newStatus === 'COMPLETED') payload.completed_at = new Date().toISOString();

            try {
                const { error } = await supabaseClient.from('cert_enrollments').update(payload).eq('id', id);
                if (error) throw error;
                alert('상태가 변경되었습니다.');
                fetchEnrollments();
            } catch (e) {
                console.error('상태 변경 실패:', e);
                alert('상태 변경 중 오류가 발생했습니다.');
            }
        }

        async function deleteEnrollment(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_enrollments').delete().eq('id', id);
                if (error) throw error;
                alert('삭제되었습니다.');
                fetchEnrollments();
            } catch (e) {
                console.error('삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            await fetchCourseOptions();
            fetchEnrollments();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
