<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>커리큘럼 관리 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include common-css -->

    <style>
        /* 이 페이지(커리큘럼 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 8px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-edit { background: #e0e7ff; color: #1e3a8a; }
        .btn-edit:hover { background: #c7d2fe; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 8px; width: 92%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 28px; }
        .form-label { font-size: 13px; font-weight: bold; color: #1e3a8a; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 12px; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #12387a; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                관리자
            </div>
        </div>
    </div>
<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab-active">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <div>
                    <div class="text-xl md:text-2xl font-black text-[#0B2A5B]" id="course-title">커리큘럼 관리</div>
                    <a href="admin-courses.html" class="text-[13px] text-gray-500 hover:text-[#12387a] font-bold"><i class="fas fa-chevron-left text-[10px] mr-1"></i>과정 목록으로</a>
                </div>
                <button onclick="openModal()" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[14px] py-2.5 px-5 rounded transition-colors shadow-sm"><i class="fas fa-plus mr-1.5"></i>차시 추가</button>
            </div>

            <div class="section-card">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>차시</th>
                                <th>강의 제목</th>
                                <th>시간(분)</th>
                                <th>유형</th>
                                <th>영상URL</th>
                                <th>Zoom링크</th>
                                <th>미리보기</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="curriculum-list-body">
                            <tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <div class="modal-overlay" id="curriculum-modal">
        <div class="modal-box">
            <div class="flex items-center justify-between mb-5">
                <div class="text-lg font-black text-[#0B2A5B]" id="modal-title">차시 추가</div>
                <i class="fas fa-times text-gray-400 cursor-pointer hover:text-gray-700" onclick="closeModal()"></i>
            </div>
            <form id="curriculum-form" class="flex flex-col gap-4" onsubmit="saveCurriculum(event)">
                <input type="hidden" id="f-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">차시 번호 *</label>
                        <input type="number" id="f-chapter_no" class="form-input" required min="1">
                    </div>
                    <div>
                        <label class="form-label">정렬 순서</label>
                        <input type="number" id="f-sort_order" class="form-input" value="0">
                    </div>
                </div>
                <div>
                    <label class="form-label">강의 제목 *</label>
                    <input type="text" id="f-title" class="form-input" required placeholder="예: 1강. 총론 및 개요">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">강의 시간(분) *</label>
                        <input type="number" id="f-duration_min" class="form-input" required min="0" value="0">
                    </div>
                    <div>
                        <label class="form-label">콘텐츠 유형 *</label>
                        <select id="f-content_type" class="form-input" onchange="toggleTypeFields()">
                            <option value="VOD">VOD (동영상)</option>
                            <option value="LIVE">LIVE (실시간)</option>
                            <option value="DOCUMENT">DOCUMENT (문서)</option>
                        </select>
                    </div>
                </div>
                <div id="field-video_url">
                    <label class="form-label">영상 URL</label>
                    <input type="text" id="f-video_url" class="form-input" placeholder="https://...">
                </div>
                <div id="field-zoom" class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Zoom 링크</label>
                        <input type="text" id="f-zoom_link" class="form-input" placeholder="https://zoom.us/...">
                    </div>
                    <div>
                        <label class="form-label">Zoom 일시</label>
                        <input type="datetime-local" id="f-zoom_datetime" class="form-input">
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="f-is_preview" class="w-4 h-4 accent-[#12387a]">
                    <label for="f-is_preview" class="text-[13.5px] font-medium text-gray-700 cursor-pointer">미리보기 가능</label>
                </div>
                <div class="flex justify-end gap-2 mt-2 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="py-2.5 px-5 rounded font-bold text-[14px] bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">취소</button>
                    <button type="submit" class="py-2.5 px-6 rounded font-bold text-[14px] bg-[#12387a] text-white hover:bg-[#0e2b61] transition-colors">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabaseClient = window.sb;
        const params = new URLSearchParams(location.search);
        const courseId = params.get('course_id');
        let curriculumList = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function typeBadge(type) {
            if (type === 'VOD') return '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[11px] font-bold">VOD</span>';
            if (type === 'LIVE') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">LIVE</span>';
            if (type === 'DOCUMENT') return '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[11px] font-bold">문서</span>';
            return '-';
        }

        function truncateUrl(url) {
            if (!url) return '-';
            return url.length > 24 ? url.slice(0, 24) + '...' : url;
        }

        const dummyCourse = { id: courseId || 'dummy', title: '기전당직실무관리사 자격 취득 과정' };

        const dummyCurriculum = [
            { id: 'dc1', course_id: courseId, chapter_no: 1, title: '1강. 총론 및 개요', duration_min: 45, content_type: 'VOD', video_url: 'https://youtube.com/watch?v=abc123', zoom_link: null, zoom_datetime: null, is_preview: true, sort_order: 1 },
            { id: 'dc2', course_id: courseId, chapter_no: 2, title: '2강. 관련 법령 이해', duration_min: 50, content_type: 'VOD', video_url: 'https://youtube.com/watch?v=def456', zoom_link: null, zoom_datetime: null, is_preview: false, sort_order: 2 },
            { id: 'dc3', course_id: courseId, chapter_no: 3, title: '3강. 실무 사례 연구 (실시간 화상강의)', duration_min: 90, content_type: 'LIVE', video_url: null, zoom_link: 'https://zoom.us/j/1234567890', zoom_datetime: '2026-08-20T14:00:00Z', is_preview: false, sort_order: 3 },
            { id: 'dc4', course_id: courseId, chapter_no: 4, title: '4강. 참고 자료 및 서식', duration_min: 0, content_type: 'DOCUMENT', video_url: null, zoom_link: null, zoom_datetime: null, is_preview: false, sort_order: 4 }
        ];

        async function fetchCourseTitle() {
            if (!courseId) return;
            try {
                const { data, error } = await supabaseClient
                    .from('cert_courses')
                    .select('title')
                    .eq('id', courseId)
                    .single();
                if (error) throw error;
                document.getElementById('course-title').textContent = (data && data.title) ? `커리큘럼 관리 - ${data.title}` : '커리큘럼 관리';
            } catch (e) {
                console.error('과정 정보 조회 실패:', e);
                document.getElementById('course-title').textContent = `커리큘럼 관리 - ${dummyCourse.title}`;
            }
        }

        async function fetchCurriculum() {
            const tbody = document.getElementById('curriculum-list-body');
            tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                let query = supabaseClient.from('cert_curriculum').select('*').order('chapter_no', { ascending: true });
                if (courseId) query = query.eq('course_id', courseId);
                const { data, error } = await query;
                if (error) throw error;
                curriculumList = (data && data.length > 0) ? data : dummyCurriculum;
                renderCurriculum();
            } catch (e) {
                console.error('커리큘럼 조회 실패:', e);
                curriculumList = dummyCurriculum;
                renderCurriculum();
            }
        }

        function renderCurriculum() {
            const tbody = document.getElementById('curriculum-list-body');
            if (!curriculumList || curriculumList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">등록된 차시가 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = curriculumList.map(item => `
                <tr>
                    <td class="font-bold text-[#12387a]">${item.chapter_no}</td>
                    <td class="text-left font-medium text-[#0B2A5B]">${item.title || '-'}</td>
                    <td>${item.duration_min || 0}</td>
                    <td>${typeBadge(item.content_type)}</td>
                    <td class="text-gray-500" title="${item.video_url || ''}">${truncateUrl(item.video_url)}</td>
                    <td class="text-gray-500" title="${item.zoom_link || ''}">${truncateUrl(item.zoom_link)}</td>
                    <td>${item.is_preview ? '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[11px] font-bold">가능</span>' : '<span class="text-gray-400 text-[11px]">-</span>'}</td>
                    <td>
                        <div class="flex flex-wrap gap-1.5 justify-center">
                            <span class="btn-manage btn-edit" onclick='editCurriculum(${JSON.stringify(item).replace(/'/g, "&#39;")})'>수정</span>
                            <span class="btn-manage btn-delete" onclick="deleteCurriculum('${item.id}')">삭제</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function toggleTypeFields() {
            const type = document.getElementById('f-content_type').value;
            document.getElementById('field-video_url').style.display = (type === 'VOD') ? '' : 'none';
            document.getElementById('field-zoom').style.display = (type === 'LIVE') ? 'grid' : 'none';
        }

        function toLocalDatetimeInput(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function openModal() {
            document.getElementById('modal-title').textContent = '차시 추가';
            document.getElementById('curriculum-form').reset();
            document.getElementById('f-id').value = '';
            document.getElementById('f-content_type').value = 'VOD';
            const nextChapter = curriculumList.length > 0 ? Math.max(...curriculumList.map(c => c.chapter_no || 0)) + 1 : 1;
            document.getElementById('f-chapter_no').value = nextChapter;
            document.getElementById('f-sort_order').value = nextChapter;
            toggleTypeFields();
            document.getElementById('curriculum-modal').classList.add('active');
        }

        function editCurriculum(item) {
            document.getElementById('modal-title').textContent = '차시 수정';
            document.getElementById('f-id').value = item.id;
            document.getElementById('f-chapter_no').value = item.chapter_no || 1;
            document.getElementById('f-title').value = item.title || '';
            document.getElementById('f-duration_min').value = item.duration_min || 0;
            document.getElementById('f-content_type').value = item.content_type || 'VOD';
            document.getElementById('f-video_url').value = item.video_url || '';
            document.getElementById('f-zoom_link').value = item.zoom_link || '';
            document.getElementById('f-zoom_datetime').value = toLocalDatetimeInput(item.zoom_datetime);
            document.getElementById('f-is_preview').checked = !!item.is_preview;
            document.getElementById('f-sort_order').value = item.sort_order || 0;
            toggleTypeFields();
            document.getElementById('curriculum-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('curriculum-modal').classList.remove('active');
        }

        async function saveCurriculum(e) {
            e.preventDefault();
            const id = document.getElementById('f-id').value;
            const zoomDatetimeVal = document.getElementById('f-zoom_datetime').value;

            const payload = {
                course_id: courseId,
                chapter_no: parseInt(document.getElementById('f-chapter_no').value, 10) || 1,
                title: document.getElementById('f-title').value.trim(),
                duration_min: parseInt(document.getElementById('f-duration_min').value, 10) || 0,
                content_type: document.getElementById('f-content_type').value,
                video_url: document.getElementById('f-video_url').value.trim() || null,
                zoom_link: document.getElementById('f-zoom_link').value.trim() || null,
                zoom_datetime: zoomDatetimeVal ? new Date(zoomDatetimeVal).toISOString() : null,
                is_preview: document.getElementById('f-is_preview').checked,
                sort_order: parseInt(document.getElementById('f-sort_order').value, 10) || 0
            };

            try {
                let error;
                if (id) {
                    ({ error } = await supabaseClient.from('cert_curriculum').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('cert_curriculum').insert(payload));
                }
                if (error) throw error;
                alert('저장되었습니다.');
                closeModal();
                fetchCurriculum();
            } catch (e2) {
                console.error('차시 저장 실패:', e2);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function deleteCurriculum(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_curriculum').delete().eq('id', id);
                if (error) throw error;
                alert('삭제되었습니다.');
                fetchCurriculum();
            } catch (e) {
                console.error('차시 삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCourseTitle();
            fetchCurriculum();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
