<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>과정 관리 | 대한집합건물관리협회</title>

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>

    <style>
        html, body { overflow-y: scroll; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: all 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active-wrapper { padding: 10px; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }

        .filter-table { width: 100%; border-top: 2px solid #e5e7eb; background: #fff; border-collapse: collapse; margin-bottom: 15px; }
        .filter-table th { background: #f9fafb; color: #1e3a8a; font-weight: bold; width: 80px; min-width: 80px; text-align: center; border-bottom: 1px dashed #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 15px; padding: 16px 5px; vertical-align: middle; }
        .filter-table td { padding: 16px 20px; border-bottom: 1px dashed #e5e7eb; font-size: 14px; vertical-align: middle; }

        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 8px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-edit { background: #e0e7ff; color: #1e3a8a; }
        .btn-edit:hover { background: #c7d2fe; }
        .btn-curriculum { background: #dcfce7; color: #15803d; }
        .btn-curriculum:hover { background: #bbf7d0; }
        .btn-exam { background: #fef3c7; color: #92400e; }
        .btn-exam:hover { background: #fde68a; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 1. 메인 헤더 -->
    <header class="w-full bg-white shadow-sm border-b border-gray-200 z-[100] relative">
        <div class="max-w-[1400px] mx-auto px-4 h-[70px] flex items-center gap-4 md:gap-8">
            <div class="w-full md:w-[220px] shrink-0 flex items-center cursor-pointer" onclick="window.location.href='../../index.html'">
                <img src="../../assets/img/관리협회.png" alt="대한집합건물관리협회 로고" class="max-h-[50px]">
            </div>
            <nav class="hidden lg:flex flex-1 justify-start items-center gap-8 font-bold text-[17px] text-gray-700">
                <a href="#" class="hover:text-[#0088cc] transition-colors">협회소개</a>
                <a href="#" class="hover:text-[#0088cc] transition-colors">정보교류</a>
                <a href="../bid/bid-list.html" class="hover:text-[#0088cc] transition-colors">입찰공고</a>
                <a href="../jobs/job-list.html" class="hover:text-[#0088cc] transition-colors">구인구직</a>
                <a href="../edu/edu-online-list.html" class="hover:text-[#0088cc] transition-colors">교육/실습</a>
                <a href="../cert/cert-list.html" class="hover:text-[#0088cc] transition-colors">자격증</a>
                <a href="#" class="hover:text-[#0088cc] transition-colors">커뮤니티</a>
            </nav>
            <div class="hidden lg:flex items-center gap-2 shrink-0 ml-auto">
                <a href="../mypage/dashboard.html" class="text-gray-600 hover:text-[#0088cc] font-bold text-[13.5px] transition-colors mr-1">마이페이지</a>
                <a href="../../login.html" class="bg-[#2c3e50] hover:bg-[#1a252f] text-white font-bold py-[7px] px-5 rounded text-[13.5px] transition-colors shadow-sm">로그인</a>
                <a href="https://cafe.naver.com/kcbma114" target="_blank" class="bg-[#03c75a] hover:bg-[#02b350] text-white font-bold py-[7px] px-4 rounded text-[13.5px] transition-colors shadow-sm">네이버카페</a>
            </div>
        </div>
    </header>

    <!-- 2. 파란색 서브 헤더 -->
    <div class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                관리자
            </div>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 -->
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border rounded shadow-sm mb-6">
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-active-wrapper border-b"><div class="side-menu-active shadow-sm">과정 관리</div></div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">과정 관리</div>
                <button onclick="location.href='admin-course-edit.html'" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[14px] py-2.5 px-5 rounded transition-colors shadow-sm"><i class="fas fa-plus mr-1.5"></i>새 과정 등록</button>
            </div>

            <!-- 검색/필터 -->
            <table class="filter-table shadow-sm">
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">상태</th>
                    <td style="border-bottom: 2px solid #e5e7eb;">
                        <div class="flex gap-5 flex-wrap">
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ALL" checked onchange="applyFilters()"> 전체</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="OPEN" onchange="applyFilters()"> 접수중</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="CLOSED" onchange="applyFilters()"> 마감</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="UPCOMING" onchange="applyFilters()"> 준비중</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">검색</th>
                    <td style="background-color: #f8fafc;">
                        <div class="flex gap-2">
                            <input type="text" id="search-keyword" placeholder="과정명 키워드 입력" class="flex-1 max-w-[320px] border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" onkeydown="if(event.key==='Enter') applyFilters()">
                            <button onclick="applyFilters()" class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13px] py-2 px-4 rounded transition-colors"><i class="fas fa-search mr-1"></i>검색</button>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="section-card">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>자격증명</th>
                                <th>분야</th>
                                <th>방식</th>
                                <th>상태</th>
                                <th>수강생</th>
                                <th>조회수</th>
                                <th>등록일</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="course-list-body">
                            <tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseClient = window.sb;
        let allCourses = [], filteredCourses = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '../../index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function statusBadge(status) {
            if (status === 'OPEN') return '<span class="bg-blue-600 text-white px-2 py-0.5 rounded text-[11px] font-bold">접수중</span>';
            if (status === 'CLOSED') return '<span class="bg-gray-500 text-white px-2 py-0.5 rounded text-[11px] font-bold">마감</span>';
            return '<span class="bg-yellow-400 text-white px-2 py-0.5 rounded text-[11px] font-bold">준비중</span>';
        }

        function methodText(method) {
            if (method === 'VOD') return '동영상(VOD)';
            if (method === 'LIVE') return '실시간(Zoom)';
            if (method === 'MIX') return '혼합형';
            return '-';
        }

        const dummyCourses = [
            { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전', edu_method: 'VOD', status: 'OPEN', enroll_count: 42, view_count: 342, created_at: '2026-07-01T00:00:00Z' },
            { id: 'dummy-2', title: '전기방재안전관리사 실시간 화상 강의 과정', category: '전기방재', edu_method: 'LIVE', status: 'OPEN', enroll_count: 28, view_count: 198, created_at: '2026-07-05T00:00:00Z' },
            { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계', edu_method: 'MIX', status: 'OPEN', enroll_count: 35, view_count: 256, created_at: '2026-07-10T00:00:00Z' },
            { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선', edu_method: 'VOD', status: 'CLOSED', enroll_count: 51, view_count: 174, created_at: '2026-06-01T00:00:00Z' },
            { id: 'dummy-5', title: '배관시설관리사 실무 심화과정 (Zoom 화상강의)', category: '배관', edu_method: 'LIVE', status: 'OPEN', enroll_count: 19, view_count: 91, created_at: '2026-07-20T00:00:00Z' },
            { id: 'dummy-6', title: '공동주택관리행정사 이론 및 사례 연구', category: '행정', edu_method: 'VOD', status: 'OPEN', enroll_count: 60, view_count: 312, created_at: '2026-06-15T00:00:00Z' },
            { id: 'dummy-7', title: '환경위생관리사 위생관리 실무 종합과정', category: '환경위생', edu_method: 'MIX', status: 'UPCOMING', enroll_count: 0, view_count: 143, created_at: '2026-08-01T00:00:00Z' }
        ];

        async function fetchCourses() {
            const tbody = document.getElementById('course-list-body');
            tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_courses')
                    .select('*')
                    .order('sort_order', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allCourses = (data && data.length > 0) ? data : dummyCourses;
                applyFilters();
            } catch (e) {
                console.error('과정 목록 조회 실패:', e);
                allCourses = dummyCourses;
                applyFilters();
            }
        }

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'ALL';
        }

        function applyFilters() {
            const status = getRadioValue('status_filter');
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredCourses = allCourses.filter(item => {
                const matchStatus = status === 'ALL' || item.status === status;
                const matchKeyword = !keyword || (item.title || '').toLowerCase().includes(keyword);
                return matchStatus && matchKeyword;
            });

            renderCourses();
        }

        function renderCourses() {
            const tbody = document.getElementById('course-list-body');

            if (!filteredCourses || filteredCourses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">조건에 맞는 과정이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredCourses.map((item, idx) => `
                <tr>
                    <td class="text-gray-400">${idx + 1}</td>
                    <td class="text-left font-bold text-[#0B2A5B]">${item.title || '-'}</td>
                    <td>${item.category || '-'}</td>
                    <td>${methodText(item.edu_method)}</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>${item.enroll_count || 0}</td>
                    <td>${item.view_count || 0}</td>
                    <td class="text-gray-500">${formatDate(item.created_at)}</td>
                    <td>
                        <div class="flex flex-wrap gap-1.5 justify-center">
                            <span class="btn-manage btn-edit" onclick="location.href='admin-course-edit.html?id=${item.id}'">수정</span>
                            <span class="btn-manage btn-curriculum" onclick="location.href='admin-curriculum.html?course_id=${item.id}'">커리큘럼</span>
                            <span class="btn-manage btn-exam" onclick="location.href='admin-exams.html?course_id=${item.id}'">시험관리</span>
                            <span class="btn-manage btn-delete" onclick="deleteCourse('${item.id}')">삭제</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteCourse(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            try {
                const { error } = await supabaseClient
                    .from('cert_courses')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                alert('삭제되었습니다.');
                fetchCourses();
            } catch (e) {
                console.error('과정 삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCourses();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
