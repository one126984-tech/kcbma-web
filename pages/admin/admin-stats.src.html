                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-item mx-4 border-b" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <div class="section-card">
                    <div class="section-title"><span>과정별 수료율</span></div>
                    <div class="chart-box"><canvas id="chart-completion-rate"></canvas></div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title"><span>월별 수강 신청 추이 (최근 6개월)</span></div>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        const dummyCourses = [
            { id: 1, title: '기전당직실무관리사 자격 취득 과정' },
            { id: 2, title: '전기방재안전관리사 실시간 화상 강의 과정' },
            { id: 3, title: '기계설비유지관리사 이론 및 실무 종합과정' },
            { id: 4, title: '영선실무관리사 자격증 취득 과정' },
            { id: 5, title: '배관시설관리사 실무 심화과정' }
        ];

        function genDummyEnrollments() {
            const list = [];
            let id = 1;
            const now = new Date();
            dummyCourses.forEach((course, ci) => {
                const total = 20 + ci * 6;
                for (let i = 0; i < total; i++) {
                    const monthsAgo = Math.floor(Math.random() * 6);
                    const d = new Date(now.getFullYear(), now.getMonth() - monthsAgo, 1 + Math.floor(Math.random() * 27));
                    const isCompleted = Math.random() < (0.35 + ci * 0.05);
                    list.push({
                        id: id++,
                        course_id: course.id,
                        enrolled_at: d.toISOString(),
                        status: isCompleted ? 'COMPLETED' : 'ACTIVE'
                    });
                }
            });
            return list;
        }

        function genDummyCertificates(enrollments) {
            return enrollments
                .filter(e => e.status === 'COMPLETED' && Math.random() < 0.85)
                .map((e, i) => ({ id: i + 1, course_id: e.course_id }));
        }

        function genDummyExamAttempts() {
            const list = [];
            let id = 1;
            dummyCourses.forEach((course, ci) => {
                const total = 15 + ci * 5;
                for (let i = 0; i < total; i++) {
                    list.push({
                        id: id++,
                        course_id: course.id,
                        is_passed: Math.random() < (0.5 + ci * 0.06)
                    });
                }
            });
            return list;
        }

        const dummyEnrollments = genDummyEnrollments();
        const dummyCertificates = genDummyCertificates(dummyEnrollments);
        const dummyExamAttempts = genDummyExamAttempts();

        async function fetchAllData() {
            try {
                const [coursesRes, enrollmentsRes, certificatesRes, attemptsRes, examsRes] = await Promise.all([
                    supabaseClient.from('cert_courses').select('id, title'),
                    supabaseClient.from('cert_enrollments').select('id, course_id, status, enrolled_at'),
                    supabaseClient.from('cert_certificates').select('id, course_id'),
                    supabaseClient.from('cert_exam_attempts').select('id, exam_id, is_passed'),
                    supabaseClient.from('cert_exams').select('id, course_id')
                ]);

                const errors = [coursesRes, enrollmentsRes, certificatesRes, attemptsRes, examsRes]
                    .map(r => r.error).filter(Boolean);
                if (errors.length > 0) throw errors[0];

                const courses = (coursesRes.data && coursesRes.data.length > 0) ? coursesRes.data : dummyCourses;
                const enrollments = (enrollmentsRes.data && enrollmentsRes.data.length > 0) ? enrollmentsRes.data : dummyEnrollments;
                const certificates = (certificatesRes.data && certificatesRes.data.length > 0) ? certificatesRes.data : dummyCertificates;
                const exams = examsRes.data || [];

                const examToCourse = {};
                exams.forEach(ex => { examToCourse[ex.id] = ex.course_id; });

                let attempts = attemptsRes.data || [];
                if (attempts.length > 0 && exams.length > 0) {
                    attempts = attempts.map(a => ({ ...a, course_id: examToCourse[a.exam_id] }));
                } else {
                    attempts = dummyExamAttempts;
                }

                return { courses, enrollments, certificates, attempts };
            } catch (e) {
                console.error('통계 데이터 조회 실패:', e);
                return {
                    courses: dummyCourses,
                    enrollments: dummyEnrollments,
                    certificates: dummyCertificates,
                    attempts: dummyExamAttempts
                };
            }
        }

        function buildCourseStats(data) {
            const { courses, enrollments, certificates, attempts } = data;

            return courses.map(course => {
                const courseEnrollments = enrollments.filter(e => e.course_id === course.id);
                const totalEnroll = courseEnrollments.length;
                const completed = courseEnrollments.filter(e => e.status === 'COMPLETED').length;
                const completionRate = totalEnroll > 0 ? (completed / totalEnroll * 100) : 0;

                const certCount = certificates.filter(c => c.course_id === course.id).length;

                const courseAttempts = attempts.filter(a => a.course_id === course.id);
                const totalAttempts = courseAttempts.length;
                const passedAttempts = courseAttempts.filter(a => a.is_passed === true).length;
                const passRate = totalAttempts > 0 ? (passedAttempts / totalAttempts * 100) : 0;

                return {
                    id: course.id,
                    title: course.title,
                    totalEnroll,
                    completed,
                    completionRate,
                    certCount,
                    passRate,
                    totalAttempts
                };
            });
        }

        function buildMonthlyTrend(enrollments) {
            const now = new Date();
            const months = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: `${d.getMonth() + 1}월`, count: 0 });
            }
            const monthMap = {};
            months.forEach(m => { monthMap[m.key] = m; });

            enrollments.forEach(e => {
                if (!e.enrolled_at) return;
                const d = new Date(e.enrolled_at);
                if (isNaN(d.getTime())) return;
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                if (monthMap[key]) monthMap[key].count++;
            });

            return months;
        }

        function renderSummary(courseStats) {
            const totalEnroll = courseStats.reduce((sum, c) => sum + c.totalEnroll, 0);
            const totalCompleted = courseStats.reduce((sum, c) => sum + c.completed, 0);
            const totalCerts = courseStats.reduce((sum, c) => sum + c.certCount, 0);
            const overallRate = totalEnroll > 0 ? (totalCompleted / totalEnroll * 100) : 0;

            document.getElementById('stat-total-enrollments').textContent = totalEnroll.toLocaleString();
            document.getElementById('stat-completed').textContent = totalCompleted.toLocaleString();
            document.getElementById('stat-certificates').textContent = totalCerts.toLocaleString();
            document.getElementById('stat-completion-rate').textContent = overallRate.toFixed(1) + '%';
        }

        function renderCourseTable(courseStats) {
            const tbody = document.getElementById('course-stats-body');
            if (!courseStats || courseStats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">과정 데이터가 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = courseStats.map(c => `
                <tr>
                    <td class="text-left font-medium text-[#0B2A5B]">${c.title}</td>
                    <td>${c.totalEnroll.toLocaleString()}</td>
                    <td>${c.completed.toLocaleString()}</td>
                    <td class="font-bold text-[#12387a]">${c.completionRate.toFixed(1)}%</td>
                    <td>${c.certCount.toLocaleString()}</td>
                    <td class="font-bold text-[#12387a]">${c.totalAttempts > 0 ? c.passRate.toFixed(1) + '%' : '-'}</td>
                </tr>
            `).join('');
        }

        const CHART_COLORS = ['#274bce', '#12387a', '#2563eb', '#0ea5e9', '#0891b2', '#059669', '#d97706', '#dc2626'];

        function renderCharts(courseStats, monthlyTrend) {
            const shortTitle = (t) => (t && t.length > 14) ? t.slice(0, 14) + '…' : t;

            new Chart(document.getElementById('chart-enrollments-by-course'), {
                type: 'bar',
                data: {
                    labels: courseStats.map(c => shortTitle(c.title)),
                    datasets: [{
                        label: '수강 신청 수',
                        data: courseStats.map(c => c.totalEnroll),
                        backgroundColor: '#274bce',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            new Chart(document.getElementById('chart-monthly-trend'), {
                type: 'line',
                data: {
                    labels: monthlyTrend.map(m => m.label),
                    datasets: [{
                        label: '수강 신청 수',
                        data: monthlyTrend.map(m => m.count),
                        borderColor: '#12387a',
                        backgroundColor: 'rgba(18,56,122,0.1)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#12387a'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            new Chart(document.getElementById('chart-completion-rate'), {
                type: 'doughnut',
                data: {
                    labels: courseStats.map(c => shortTitle(c.title)),
                    datasets: [{
                        label: '수료율(%)',
                        data: courseStats.map(c => Number(c.completionRate.toFixed(1))),
                        backgroundColor: courseStats.map((c, i) => CHART_COLORS[i % CHART_COLORS.length])
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw}%` } }
                    }
                }
            });
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;

            const data = await fetchAllData();
            const courseStats = buildCourseStats(data);
            const monthlyTrend = buildMonthlyTrend(data.enrollments);

            renderSummary(courseStats);
            renderCourseTable(courseStats);
            renderCharts(courseStats, monthlyTrend);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
