     원본은 푸터가 아예 없었음 — 다른 admin 페이지들과 통일하려고 표준 footer.js 추가. -->

<!-- @include common-css -->

    <style>
        /* 이 페이지(관리자 대시보드) 전용 CSS */
        html, body { overflow-y: scroll; }

        .summary-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
        .summary-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .summary-value { font-size: 26px; font-weight: 900; color: #0B2A5B; }

        .section-title { font-size: 18px; font-weight: 900; color: #12387a; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; justify-content: space-between; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 10px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 10px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                관리자
            </div>
        </div>
    </div>
<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab-active">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">관리자 대시보드</div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="summary-card">
                    <div class="summary-icon bg-blue-100 text-blue-700"><i class="fas fa-list"></i></div>
                    <div class="summary-value" id="stat-total-courses">0</div>
                    <div class="summary-label">전체 과정 수</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-green-100 text-green-700"><i class="fas fa-door-open"></i></div>
                    <div class="summary-value" id="stat-open-courses">0</div>
                    <div class="summary-label">접수중 과정 수</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-indigo-100 text-indigo-700"><i class="fas fa-user-graduate"></i></div>
                    <div class="summary-value" id="stat-total-enrollments">0</div>
                    <div class="summary-label">전체 수강생 수</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-amber-100 text-amber-700"><i class="fas fa-graduation-cap"></i></div>
                    <div class="summary-value" id="stat-completed">0</div>
                    <div class="summary-label">수료 완료 수</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-rose-100 text-rose-700"><i class="fas fa-certificate"></i></div>
                    <div class="summary-value" id="stat-certificates">0</div>
                    <div class="summary-label">발급된 자격증 수</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon bg-cyan-100 text-cyan-700"><i class="fas fa-user-plus"></i></div>
                    <div class="summary-value" id="stat-today-new">0</div>
                    <div class="summary-label">오늘 신규 수강</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <span>최근 수강 신청</span>
                    <a href="admin-enrollments.html" class="text-[13.5px] text-gray-500 hover:text-[#12387a] font-bold">전체 보기 <i class="fas fa-chevron-right text-[11px] ml-0.5"></i></a>
                </div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>수강생 (User ID)</th>
                                <th>과정명</th>
                                <th>신청일</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="recent-enrollments-body">
                            <tr><td colspan="4" class="py-10 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <span>최근 발급 자격증</span>
                    <a href="admin-certs.html" class="text-[13.5px] text-gray-500 hover:text-[#12387a] font-bold">전체 보기 <i class="fas fa-chevron-right text-[11px] ml-0.5"></i></a>
                </div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>자격증번호</th>
                                <th>과정명</th>
                                <th>발급일</th>
                            </tr>
                        </thead>
                        <tbody id="recent-certificates-body">
                            <tr><td colspan="3" class="py-10 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function enrollStatusBadge(status) {
            if (status === 'ACTIVE') return '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[11px] font-bold">수강중</span>';
            if (status === 'COMPLETED') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">수료</span>';
            if (status === 'EXPIRED') return '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[11px] font-bold">만료</span>';
            if (status === 'CANCELLED') return '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[11px] font-bold">취소</span>';
            return '<span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[11px] font-bold">-</span>';
        }

        const dummyStats = {
            totalCourses: 10,
            openCourses: 7,
            totalEnrollments: 128,
            completed: 46,
            certificates: 38,
            todayNew: 5
        };

        const dummyEnrollments = [
            { id: 'de1', user_id: '3f2a1b90-....-user1', enrolled_at: '2026-08-15T09:00:00Z', status: 'ACTIVE', cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } },
            { id: 'de2', user_id: '9c8d7e60-....-user2', enrolled_at: '2026-08-14T15:30:00Z', status: 'COMPLETED', cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } },
            { id: 'de3', user_id: 'a1b2c3d4-....-user3', enrolled_at: '2026-08-14T11:20:00Z', status: 'ACTIVE', cert_courses: { title: '기계설비유지관리사 이론 및 실무 종합과정' } },
            { id: 'de4', user_id: 'b5c6d7e8-....-user4', enrolled_at: '2026-08-13T18:05:00Z', status: 'ACTIVE', cert_courses: { title: '영선실무관리사 자격증 취득 과정' } },
            { id: 'de5', user_id: 'f1e2d3c4-....-user5', enrolled_at: '2026-08-13T10:40:00Z', status: 'COMPLETED', cert_courses: { title: '배관시설관리사 실무 심화과정' } }
        ];

        const dummyCertificates = [
            { id: 'dc1', cert_number: 'KCBMA-2026-ELC-00038', issued_at: '2026-08-14T00:00:00Z', cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } },
            { id: 'dc2', cert_number: 'KCBMA-2026-MEC-00037', issued_at: '2026-08-13T00:00:00Z', cert_courses: { title: '기계설비유지관리사 이론 및 실무 종합과정' } },
            { id: 'dc3', cert_number: 'KCBMA-2026-PLB-00036', issued_at: '2026-08-12T00:00:00Z', cert_courses: { title: '배관시설관리사 실무 심화과정' } },
            { id: 'dc4', cert_number: 'KCBMA-2026-REP-00035', issued_at: '2026-08-11T00:00:00Z', cert_courses: { title: '영선실무관리사 자격증 취득 과정' } },
            { id: 'dc5', cert_number: 'KCBMA-2026-ELE-00034', issued_at: '2026-08-10T00:00:00Z', cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } }
        ];

        async function fetchStats() {
            try {
                const todayStart = new Date();
                todayStart.setHours(0, 0, 0, 0);

                const [
                    totalCoursesRes,
                    openCoursesRes,
                    totalEnrollmentsRes,
                    completedRes,
                    certificatesRes,
                    todayNewRes
                ] = await Promise.all([
                    supabaseClient.from('cert_courses').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('cert_courses').select('*', { count: 'exact', head: true }).eq('status', 'OPEN'),
                    supabaseClient.from('cert_enrollments').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('cert_enrollments').select('*', { count: 'exact', head: true }).eq('status', 'COMPLETED'),
                    supabaseClient.from('cert_certificates').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('cert_enrollments').select('*', { count: 'exact', head: true }).gte('enrolled_at', todayStart.toISOString())
                ]);

                const errors = [totalCoursesRes, openCoursesRes, totalEnrollmentsRes, completedRes, certificatesRes, todayNewRes]
                    .map(r => r.error).filter(Boolean);
                if (errors.length > 0) throw errors[0];

                return {
                    totalCourses: totalCoursesRes.count || 0,
                    openCourses: openCoursesRes.count || 0,
                    totalEnrollments: totalEnrollmentsRes.count || 0,
                    completed: completedRes.count || 0,
                    certificates: certificatesRes.count || 0,
                    todayNew: todayNewRes.count || 0
                };
            } catch (e) {
                console.error('통계 조회 실패:', e);
                return dummyStats;
            }
        }

        async function fetchRecentEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*, cert_courses(title)')
                    .order('enrolled_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyEnrollments;
            } catch (e) {
                console.error('최근 수강 신청 조회 실패:', e);
                return dummyEnrollments;
            }
        }

        async function fetchRecentCertificates() {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*, cert_courses(title)')
                    .order('issued_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyCertificates;
            } catch (e) {
                console.error('최근 발급 자격증 조회 실패:', e);
                return dummyCertificates;
            }
        }

        function renderStats(stats) {
            document.getElementById('stat-total-courses').textContent = stats.totalCourses;
            document.getElementById('stat-open-courses').textContent = stats.openCourses;
            document.getElementById('stat-total-enrollments').textContent = stats.totalEnrollments;
            document.getElementById('stat-completed').textContent = stats.completed;
            document.getElementById('stat-certificates').textContent = stats.certificates;
            document.getElementById('stat-today-new').textContent = stats.todayNew;
        }

        function renderRecentEnrollments(list) {
            const tbody = document.getElementById('recent-enrollments-body');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-gray-400">최근 수강 신청 내역이 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(item => {
                const course = item.cert_courses || {};
                const userId = item.user_id ? String(item.user_id).slice(0, 8) + '...' : '-';
                return `
                    <tr>
                        <td class="text-gray-500">${userId}</td>
                        <td class="text-left font-medium text-[#0B2A5B]">${course.title || '-'}</td>
                        <td class="text-gray-500">${formatDate(item.enrolled_at)}</td>
                        <td>${enrollStatusBadge(item.status)}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderRecentCertificates(list) {
            const tbody = document.getElementById('recent-certificates-body');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="py-10 text-gray-400">발급된 자격증이 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(item => {
                const course = item.cert_courses || {};
                return `
                    <tr>
                        <td class="font-bold text-[#12387a]">${item.cert_number || '-'}</td>
                        <td class="text-left font-medium text-[#0B2A5B]">${course.title || '-'}</td>
                        <td class="text-gray-500">${formatDate(item.issued_at)}</td>
                    </tr>
                `;
            }).join('');
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;

            const [stats, enrollments, certificates] = await Promise.all([
                fetchStats(),
                fetchRecentEnrollments(),
                fetchRecentCertificates()
            ]);

            renderStats(stats);
            renderRecentEnrollments(enrollments);
            renderRecentCertificates(certificates);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
