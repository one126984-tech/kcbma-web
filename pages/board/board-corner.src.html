<!-- 파일명: board-corner.src.html (빌드 전 소스. 실제 배포 파일은 build.js가 만드는 board-corner.html)
     이 페이지는 헤더 GNB의 "관리단 코너" 메뉴가 가리키는 실제 페이지.
     ★ 사용자 요청으로 예전 디자인(남색 통짜 서브헤더 + 흰색 사이드 메뉴 박스 +
        결제 모달 방식)으로 되돌림. 서브헤더의 "관리단 코너" 타이틀은 아래
        사이드바(위탁관리사 선정 등, w-[280px])와 가운데 정렬 기준을 맞춤
        (다른 커뮤니티 계열 페이지의 sub-header-bar 패턴과 동일하게 justify-center 적용).
        ★ 2026-08: 위 타이틀 박스가 w-[280px]로 돼 있었는데, 실제 사이드바는
        v13에서 이미 220px로 통일되어 있었음(주석만 예전 값 그대로 남아있던
        것) — 다른 모든 섹션과 동일하게 220px로 맞춰서 "관리단 코너" 글자가
        페이지 이동 시 좌우로 튀지 않도록 수정. -->
<!-- @var PAGE_CLASS: page-board -->
<!-- @var BASE: ../../ -->
<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>관리단 코너 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>

<!-- @include view-transition-css -->

<!-- @include common-css -->

    <style>
        /* 이 페이지(관리단 코너) 전용 CSS */
        html, body { overflow: hidden; height: 100%; }

        /* 좌측 사이드 메뉴는 구인구직(job-list) 페이지와 동일한
           .side-menu-tab / .side-menu-tab-active (common-css.html)를
           그대로 사용하므로 이 페이지 전용 스타일은 더 이상 필요 없음. */
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <!-- ----------------------------------------------------
         핑크박스: 헤더 아래 전체 영역 (서브헤더+사이드바+콘텐츠)
         페이지 이동 시 이 영역 전체가 View Transition으로 전환됨
         ---------------------------------------------------- -->
    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center relative z-40 shrink-0 shadow-sm">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex items-center h-full">
            <div class="w-full md:w-[220px] shrink-0 flex items-center justify-center">
                <div class="text-white font-bold text-xl md:text-2xl tracking-wide px-1">
                    관리단 코너
                </div>
            </div>
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">



    <!-- ★ 스크롤 영역 시작 -->
    <div class="flex-1 custom-scrollbar w-full relative flex flex-col bg-[#F8FAFC]">

        <!-- 메인 콘텐츠 레이아웃 -->
        <main class="max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-8 pb-12 flex flex-col md:flex-row gap-8 flex-1 items-start">

            <!-- 좌측 사이드바 (LNB 삼단 배너) — 구인구직(job-list) 사이드 메뉴와
                 완전히 동일한 폭(220px)으로 통일, 아이콘 제거 -->
            <aside class="w-full md:w-[220px] shrink-0 h-auto z-40 relative">
                <div id="side-menu-container" class="bg-white border border-gray-200 rounded shadow-sm p-3 flex flex-col gap-1 sticky top-0 mt-0">
                        <div class="side-menu-tab-active" onclick="switchTab('management')">
                            <span>위탁관리사 선정</span>
                        </div>
                        <div class="side-menu-tab" onclick="switchTab('evote')">
                            <span>전자투표·총회 대행</span>
                        </div>
                        <div class="side-menu-tab" onclick="switchTab('legal')">
                            <span>법률·회계 자문</span>
                        </div>
                    </div>
            </aside>

            <!-- 우측 전체 콘텐츠 영역 -->
            <div class="flex-1 min-w-0 h-auto relative flex flex-col mt-0">

                <section class="flex-1 shrink-0 pb-8">
                    <!-- 상단 타이틀 영역 -->
                    <div id="main-title-box" class="flex justify-between items-end pb-3 mb-6 border-b-2 border-[#2f66e0]">
                        <h3 id="content-title" class="text-[22px] font-bold text-[#2f66e0]">위탁관리사 모집공고 및 매칭</h3>
                        <div class="text-[15px] text-gray-500 pb-1">
                            총 <span class="font-bold text-gray-900">12</span>건이 등록된 현장
                        </div>
                    </div>

                    <!-- 콘텐츠 리스트 영역 -->
                    <div class="space-y-4">
                        <!-- 아이템 1 -->
                        <div class="bg-white border border-gray-200 rounded-md p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-green-300 transition shadow-sm">
                            <div>
                                <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-sm mb-2.5 inline-block">모집중</span>
                                <h4 class="text-[17px] font-bold text-gray-900 mb-1.5">[경기 김포시] OO오피스텔 관리단 위탁관리사 공개경쟁 입찰 공고</h4>
                                <p class="text-[14px] text-gray-500">연면적 약 15,000㎡ 오피스텔 | 현재 관리소장 직영 마감 임박</p>
                            </div>
                            <button onclick="openPaymentModal(this)" class="bg-[#dcfce7] hover:bg-[#bbf7d0] text-gray-900 text-[14px] font-bold px-5 py-3 rounded-md shrink-0 transition flex items-center gap-2">
                                <i class="fas fa-lock"></i> 상세정보 열람
                            </button>
                        </div>

                        <!-- 아이템 2 -->
                        <div class="bg-white border border-gray-200 rounded-md p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-green-300 transition shadow-sm">
                            <div>
                                <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-sm mb-2.5 inline-block">모집중</span>
                                <h4 class="text-[17px] font-bold text-gray-900 mb-1.5">[인천 서구] OO복합상가 입주자대표회의 관리업체 변경 설명회 안내</h4>
                                <p class="text-[14px] text-gray-500">상가 전문 위탁관리사 우대 | 제안서 접수 진행중</p>
                            </div>
                            <button onclick="openPaymentModal(this)" class="bg-[#dcfce7] hover:bg-[#bbf7d0] text-gray-900 text-[14px] font-bold px-5 py-3 rounded-md shrink-0 transition flex items-center gap-2">
                                <i class="fas fa-lock"></i> 상세정보 열람
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- 푸터 영역 -->
        <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
        <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    </div>
    <!-- ★ 스크롤 영역 종료 -->

    </div>
    <!-- 핑크박스 끝 -->

    <!-- ================= 결제 및 열람용 모달창 (숨김 처리) ================= -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[9999] hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-[480px] shadow-xl text-center">
            <h2 class="text-xl font-bold mb-4 text-gray-800">상세정보 열람 수수료 결제</h2>
            <div class="mb-6">
                <p class="text-[15px] text-gray-700 whitespace-nowrap mb-1">담당자 연락처 및 상세 제안 내역을 열람하시겠습니까?</p>
                <p class="text-[14px] text-red-500 font-semibold">소정의 열람 수수료가 적용됩니다.</p>
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="closePaymentModal()" class="px-5 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-md hover:bg-gray-300 transition">취소</button>
                <button onclick="processPayment()" class="px-5 py-2.5 bg-[#dbeafe] text-black font-bold rounded-md hover:bg-[#bfdbfe] transition">결제 진행하기</button>
            </div>
        </div>
    </div>
    <!-- ==================================================================== -->

    <!-- 스크립트 -->
    <script>
        let currentTargetBtn = null;

        /* 모달 열기/닫기 처리 로직 */
        function openPaymentModal(btn) {
            currentTargetBtn = btn;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            currentTargetBtn = null;
        }

        /* 수수료 결제 가상 처리 로직 */
        function processPayment() {
            document.getElementById('payment-modal').classList.add('hidden');

            alert("결제가 완료되었습니다.\n상세 정보 및 연락처가 노출됩니다.");

            if (currentTargetBtn) {
                currentTargetBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white text-[14px] font-bold px-5 py-3 rounded-md shrink-0 transition flex items-center gap-2';
                currentTargetBtn.innerHTML = `<i class="fas fa-check-circle"></i> 열람 완료 (담당자: 010-1234-5678)`;
                currentTargetBtn.onclick = null;
            }
        }

        /* 탭 전환 로직 */
        function switchTab(type) {
            document.querySelectorAll('#side-menu-container .side-menu-tab, #side-menu-container .side-menu-tab-active').forEach(el => {
                el.className = 'side-menu-tab';
            });

            const titleEl = document.getElementById('content-title');
            event.currentTarget.className = 'side-menu-tab-active';

            if(type === 'management') {
                titleEl.innerText = "위탁관리사 모집공고 및 매칭";
            } else if(type === 'evote') {
                titleEl.innerText = "전자투표 및 총회 개최 지원 서비스";
            } else if(type === 'legal') {
                titleEl.innerText = "법률 및 회계 분쟁 자문 매칭";
            }
        }
    </script>
</body>
</html>
