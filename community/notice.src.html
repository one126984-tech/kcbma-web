    <script>
        const supabaseClient = window.sb;
        let allPosts = [];

        async function loadPosts() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('notices').select('*').order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
                if (error) throw error;
                allPosts = data || [];
                applyFilters();
            } catch (err) {
                console.error(err);
            }
        }

        window.applyFilters = function() {
            let filteredPosts = [...allPosts];
            const startDateStr = document.getElementById('start-date').value;
            const endDateStr = document.getElementById('end-date').value;
            if (startDateStr) {
                const sd = new Date(startDateStr); sd.setHours(0, 0, 0, 0);
                filteredPosts = filteredPosts.filter(c => c.created_at && new Date(c.created_at) >= sd);
            }
            if (endDateStr) {
                const ed = new Date(endDateStr); ed.setHours(23, 59, 59, 999);
                filteredPosts = filteredPosts.filter(c => c.created_at && new Date(c.created_at) <= ed);
            }
            renderList(filteredPosts);
        };

        window.setPeriod = function(period, btnElement) {
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('border-[#3b5bdb]', 'text-[#3b5bdb]', 'bg-blue-50', 'font-bold');
                btn.classList.add('border-gray-300', 'text-gray-600');
            });
            if (btnElement) {
                btnElement.classList.remove('border-gray-300', 'text-gray-600');
                btnElement.classList.add('border-[#3b5bdb]', 'text-[#3b5bdb]', 'bg-blue-50', 'font-bold');
            }
            const startInput = document.getElementById('start-date');
            const endInput = document.getElementById('end-date');
            if (period === 'all') {
                startInput.value = ''; endInput.value = '';
            } else {
                const end = new Date(); const start = new Date();
                if (period === '1w') start.setDate(start.getDate() - 7);
                else if (period === '1m') start.setMonth(start.getMonth() - 1);
                else if (period === '2m') start.setMonth(start.getMonth() - 2);
                else if (period === '6m') start.setMonth(start.getMonth() - 6);
                const offset = start.getTimezoneOffset() * 60000;
                startInput.value = new Date(start.getTime() - offset).toISOString().split('T')[0];
                endInput.value = new Date(end.getTime() - offset).toISOString().split('T')[0];
            }
            applyFilters();
        };

        function renderList(posts) {
            const container = document.getElementById('post-list-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24">
                        <p class="text-gray-600 font-medium">조건에 맞는 공지사항이 없습니다.</p>
                    </div>`;
                return;
            }
            let html = '';
            posts.forEach(post => {
                const d = new Date(post.created_at);
                const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
                const pinnedBadge = post.is_pinned ? '<span class="px-2 py-0.5 mr-2 bg-red-50 text-red-600 text-[11px] font-bold rounded shrink-0">공지</span>' : '';
                html += `
                <div class="flex flex-col md:flex-row md:items-center px-6 py-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition cursor-pointer" onclick="location.href='notice-detail.html?id=${post.id}'">
                    <div class="flex-1 flex items-center font-medium text-gray-800 min-w-0">
                        ${pinnedBadge}
                        <span class="truncate">${post.title}</span>
                    </div>
                    <div class="flex md:contents justify-between mt-2 md:mt-0 text-xs md:text-sm text-gray-400">
                        <span class="md:w-32 md:text-center">${dateStr}</span>
                        <span class="md:w-20 md:text-center">${post.views || 0}</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
    <script>window.BASE_PATH = '/';</script>
