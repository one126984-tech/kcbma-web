        .search-box input { flex: 1; border: 1px solid #d1d5db; border-radius: 4px; padding: 9px 12px; font-size: 14px; outline: none; }

<script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

<script>
    // ★ 2026-11: 예전엔 견적의뢰 목록을 복사해 만든 가짜(샘플) 입찰 공고가 보였음 → 실제 notices 테이블에서 불러오도록 새로 작성
    let allPosts = [];
    let filteredPosts = [];
    let currentPage = 1;
    const itemsPerPage = 20;

    async function getClient() {
        if (typeof ensureAuthClient === 'function') return await ensureAuthClient();
        return window.sb || null;
    }

    function fmtDate(v) {
        const d = new Date(v);
        if (isNaN(d)) return '-';
        return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }
    function isNew(v) { const d = new Date(v); return !isNaN(d) && (Date.now() - d.getTime()) < 7 * 24 * 60 * 60 * 1000; }

    async function loadNotices() {
        const tbody = document.getElementById('list-body');
        try {
            const sb = await getClient();
            if (!sb) throw new Error('데이터베이스 연결에 실패했습니다.');
            const { data, error } = await sb
                .from('notices')
                .select('id, title, content, is_pinned, views, created_at')
                .order('is_pinned', { ascending: false })
                .order('created_at', { ascending: false });
            if (error) throw error;
            allPosts = data || [];
            applyFilters();
        } catch (e) {
            console.error('공지사항 불러오기 실패:', e);
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500">공지사항을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</td></tr>';
        }
    }

    function applyFilters() {
        const kw = (document.getElementById('search-input').value || '').trim().toLowerCase();
        filteredPosts = !kw ? allPosts.slice() : allPosts.filter(p =>
            (p.title || '').toLowerCase().includes(kw) || (p.content || '').toLowerCase().includes(kw));
        currentPage = 1;
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('total-count').textContent = filteredPosts.length;
        const tbody = document.getElementById('list-body');
        if (filteredPosts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500">등록된 공지사항이 없습니다.</td></tr>';
            renderPagination(0);
            return;
        }
        const normalCount = filteredPosts.filter(p => !p.is_pinned).length;
        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredPosts.slice(start, start + itemsPerPage);
        let normalIndex = filteredPosts.slice(0, start).filter(p => !p.is_pinned).length;

        tbody.innerHTML = pageItems.map(p => {
            let noCell;
            if (p.is_pinned) {
                noCell = '<span class="status-badge status-open">필독</span>';
            } else {
                noCell = String(normalCount - normalIndex);
                normalIndex++;
            }
            const newMark = isNew(p.created_at) ? '<span class="new-dot">N</span>' : '';
            return `<tr class="${p.is_pinned ? 'pinned' : ''}" onclick="location.href='notice-detail.html?id=${encodeURIComponent(p.id)}'">
                <td>${noCell}</td>
                <td class="title-cell">${p.is_pinned ? '<b>' : ''}${KC.esc(p.title || '')}${p.is_pinned ? '</b>' : ''}${newMark}</td>
                <td>협회 사무국</td>
                <td>${fmtDate(p.created_at)}</td>
                <td>${Number(p.views || 0).toLocaleString()}</td>
            </tr>`;
        }).join('');
        renderPagination(filteredPosts.length);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        const container = document.getElementById('pagination-container');
        if (!container) return;
        let html = `<button onclick="changePage(${Math.max(1, currentPage - 1)})" class="w-8 h-8 flex items-center justify-center border border-gray-300 bg-white rounded text-xs hover:bg-gray-50 text-gray-600 transition"><i class="fas fa-chevron-left"></i></button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += (i === currentPage)
                ? `<button class="w-8 h-8 flex items-center justify-center border border-[#0B2A5B] bg-[#0B2A5B] text-white rounded text-xs font-bold shadow-sm">${i}</button>`
                : `<button onclick="changePage(${i})" class="w-8 h-8 flex items-center justify-center border border-gray-300 bg-white rounded text-xs hover:bg-gray-50 text-gray-600 transition">${i}</button>`;
        }
        html += `<button onclick="changePage(${Math.min(totalPages, currentPage + 1)})" class="w-8 h-8 flex items-center justify-center border border-gray-300 bg-white rounded text-xs hover:bg-gray-50 text-gray-600 transition"><i class="fas fa-chevron-right"></i></button>`;
        container.innerHTML = html;
    }

    function changePage(page) { currentPage = page; updateDisplay(); }

    document.addEventListener('DOMContentLoaded', loadNotices);
</script>
