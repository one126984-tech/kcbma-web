           Tailwind CDN <script> 태그를 전부 걷어내고, 미리 빌드해둔 정적

    <style>
        /* [COMMON-VIEW-TRANSITION] 자동 생성됨 — 이 내용을 고치려면
           _partials/view-transition-css.html 파일만 고치고 build.js를 다시
           실행할 것. 절대 각 페이지에서 직접 고치지 말 것.

           ★★★ 2026-08 기준 크로스 문서 View Transition 기능을 완전히 껐음.
           이유: 헤더 안 움직임 → 서브헤더 흰 화면 → 본문 울렁임 → 헤더가
           오른쪽으로 갔다 돌아옴 → 입찰공고/구인구직 등 여전히 덜컹거림,
           이런 식으로 한 군데 고치면 다른 데서 새로운 미세한 어긋남이
           계속 튀어나왔음. 이 기능은 브라우저가 이전 페이지와 새 페이지의
           스크린샷을 직접 찍어서 애니메이션시키는 방식이라, 코드만 보고
           고치는 방식으로는 실제 브라우저에서 어떻게 보일지 확인이 안 되고
           끝없이 두더지잡기가 됨.

           그래서 아래 @view-transition 자체를 꺼서 그냥 "즉시 전환"(깜빡임
           없이 바로 바뀌는 일반적인 페이지 이동)으로 되돌림. 헤더/서브헤더가
           흔들리거나 밀리거나 울렁이는 문제가 구조적으로 있을 수 없음
           (애니메이션 자체가 없으니까). 아래의 view-transition-name /
           키프레임 코드들은 그대로 남겨뒀지만 @view-transition이 꺼져있는
           동안은 전부 아무 효과가 없음 — 나중에 다시 켜고 싶으면 아래
           @view-transition 블록의 주석만 풀면 됨. */
        /*
        @view-transition {
            navigation: auto;
        }
        */
        #main-header {
            view-transition-name: site-header;
        }
        #page-content {
            view-transition-name: page-content;
        }
        @keyframes page-content-out {
            to { opacity: 0; }
        }
        @keyframes page-content-in {
            from { opacity: 0; }
        }
        ::view-transition-old(page-content) {
            animation: 150ms ease-in both page-content-out;
        }
        ::view-transition-new(page-content) {
            animation: 200ms ease-out both page-content-in;
        }
        /* 핵심: 박스 크기/위치를 이전↔새 페이지 사이에서 자동으로
           보간(모핑)하는 기본 동작을 꺼서 "들썩임"을 없앰 */
        ::view-transition-group(page-content) {
            animation: none;
            width: 100%;
            height: 100%;
        }
        ::view-transition-group(site-header) {
            animation: none;
        }
        ::view-transition-old(site-header),
        ::view-transition-new(site-header) {
            animation: none;
        }
        /* ★ 2026-08: #sub-header-bar가 이제 header.html/header-close.html
           분할 구조 덕분에 #main-header의 "자식"으로 들어가 있음 (예전엔
           #page-content 쪽의 형제 요소였음). 그래서 따로 view-transition-name을
           줄 필요가 없어짐 — 부모인 site-header(#main-header)의 캡처 영역에
           자동으로 같이 포함됨. (오히려 여기 따로 이름을 주면 "이름표 붙은
           요소를 또 다른 이름표 붙은 요소 안에 중첩"시키는 예전에 버그났던
           패턴이 재발하니 절대 다시 추가하지 말 것 — 본문이 울렁이던 그 버그.) */
        /* 안전장치: 같은 페이지 안에서 사이드 탭(AJAX)만 바뀔 때는
           슬라이드 애니메이션이 절대 걸리지 않도록 강제로 끔.
           AJAX 탭 전환이 있는 페이지(job-list/resume-list/bid-list 등)의
           탭 전환 스크립트에서 이 클래스를 잠깐 추가했다가 제거해야 함. */
        html.no-page-transition #page-content,
        html.no-page-transition ::view-transition-group(page-content),
        html.no-page-transition ::view-transition-old(page-content),
        html.no-page-transition ::view-transition-new(page-content) {
            animation: none !important;
            transform: none !important;
        }
    </style>


    <style>
        /* [COMMON-CSS] 자동 생성됨 — 이 내용을 고치려면
           _partials/common-css.html 파일만 고치고 build.js를 다시 실행할 것.

        html, body { overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 6px; }

        /* ★ 사이드 탭 메뉴 — 패턴 A: AJAX 탭 전환용 (job-list / resume-list) */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {

        /* ★ 사이드 탭 메뉴 — 패턴 B: 목록형 (bid-list / field-experience 등)
           패턴 A와 이름/스타일이 다름. 두 패턴이 실제로 공존 중이라 둘 다 남겨둠.
           (장기적으로는 하나로 통일하는 걸 권장 — README 참고) */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: background-color 0.2s, color 0.2s; }

        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        .side-menu-active-wrapper { padding: 10px; }

        /* ★ 좌측 메뉴 독립 스크롤 (스크롤바 왼쪽 배치) — cert-list/field-experience/dashboard 공통 */
        .left-scroll-area {
            direction: rtl;
            overflow-y: auto;
            height: 100%;
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        /* ★ 우측 본문 영역 독립 스크롤 */
        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }

        /* 스크롤바 숨김 유틸리티 */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 로그인 상태에 따라 헤더의 로그인/로그아웃 버튼을 갱신 ---
        // (예전엔 header.js가 이 역할을 했으나, header.js를 걷어내면서
        //  이 로직이 통째로 사라졌던 문제 수정. 페이지마다 따로 만든
        //  supabase 클라이언트(dummyStorage 사용 등)와 충돌하지 않도록,
        //  세션 확인용 클라이언트는 window.sb 하나만 공유해서 씀 —
        //  assets/js/supabase-config.js를 먼저 불러온 페이지는 그 window.sb를
        //  그대로 재사용하고, 없으면 여기서 한 번만 만듦.)
        async function ensureAuthClient() {
            if (window.sb) return window.sb;
            if (!window.supabase) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            if (!window.sb) {
                window.sb = window.supabase.createClient(
                    'https://ehrahnnowwjkgycvlbzk.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk'
                );
            }
            return window.sb;
        }

        function applyAuthUI(session) {
            document.querySelectorAll('[data-auth-btn]').forEach(btn => {
                if (session) {
                    btn.textContent = '로그아웃';
                    btn.onclick = async (e) => {
                        e.stopPropagation();
                        await window.sb.auth.signOut();
                        window.location.reload();
                    };
                } else {
                    btn.textContent = '로그인';
                    btn.onclick = () => { location.href = '../../login.html'; };
                }
            });
        }

        async function initAuthUI() {
            const client = await ensureAuthClient();
            const { data: { session } } = await client.auth.getSession();
            applyAuthUI(session);
            client.auth.onAuthStateChange((_event, session) => applyAuthUI(session));
            return session;
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // 로그인 상태가 아니면(=window.sb가 아직 없으면) 종료 (에러 방지)
            if (!window.sb) {
                return;
            }
            
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (!window.sb) return;
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await window.sb
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await window.sb
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 로그인/로그아웃 버튼 상태 갱신 후, 알림 개수 불러오기 실행
            initAuthUI().then(fetchUnreadCount).catch(console.error);

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>

                </div>

            </section>

            <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
            <script src="../../assets/js/footer.js?v=1.3"></script>

        </div>
    </main>

    </div>
    <!-- 핑크박스 끝 -->

    <!-- Supabase 연동 로직 -->
    <script>
        const supabaseClient = window.sb;

        let currentPostId = null;
        let postPassword = '';

        async function fetchPostDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');

            if (!currentPostId) {
                alert("잘못된 접근입니다.");
                location.href = 'free-board.html';
                return;
            }

            try {
                const { data: post, error } = await supabaseClient.from('free_board').select('*').eq('id', currentPostId).single();
                if (error) throw error;

                postPassword = post.password || '';

                const newViews = (post.views || 0) + 1;
                await supabaseClient.from('free_board').update({ views: newViews }).eq('id', currentPostId);

                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-author').innerText = post.author || '회원';
                document.getElementById('post-views').innerText = newViews;
                document.getElementById('post-content').innerText = post.content;

                const date = new Date(post.created_at);
                document.getElementById('post-date').innerText = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

                const editBtn = document.getElementById('edit-btn');
                editBtn.classList.remove('hidden');
                editBtn.onclick = () => {
                    const inputPw = prompt("글 작성 시 입력한 비밀번호 4자리를 입력해 주세요.");
                    if (inputPw === null) return;
                    if (inputPw === postPassword) {
                        location.href = `free-board-edit.html?id=${currentPostId}`;
                    } else {
                        alert("비밀번호가 일치하지 않습니다.");
                    }
                };

                const deleteBtn = document.getElementById('delete-btn');
                deleteBtn.classList.remove('hidden');
                deleteBtn.onclick = async () => {
                    const inputPw = prompt("정말 삭제하시겠습니까? 글 작성 시 입력한 비밀번호 4자리를 입력해 주세요.");
                    if (inputPw === null) return;
                    if (inputPw === postPassword) {
                        await supabaseClient.from('free_board').delete().eq('id', currentPostId);
                        alert("삭제되었습니다.");
                        location.href = 'free-board.html';
                    } else {
                        alert("비밀번호가 일치하지 않습니다.");
                    }
                };

                fetchComments();

            } catch (error) {
                console.error("오류 발생:", error.message);
                alert("게시글을 불러오는 중 오류가 발생했습니다.");
                location.href = 'free-board.html';
            }
        }

        async function fetchComments() {
            try {
                const { data: comments, error } = await supabaseClient
                    .from('free_board_comments')
                    .select('*')
                    .eq('post_id', currentPostId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                document.getElementById('comment-count').innerText = comments.length;
                const commentList = document.getElementById('comment-list');
                commentList.innerHTML = '';

                if (comments.length === 0) {
                    commentList.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">등록된 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>';
                    return;
                }

                comments.forEach(comment => {
                    const cDate = new Date(comment.created_at);
                    const formattedDate = `${cDate.getFullYear()}.${String(cDate.getMonth() + 1).padStart(2, '0')}.${String(cDate.getDate()).padStart(2, '0')} ${String(cDate.getHours()).padStart(2, '0')}:${String(cDate.getMinutes()).padStart(2, '0')}`;

                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'border-b border-gray-200 pb-3 last:border-0';
                    commentDiv.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-gray-800 text-sm">${comment.author}</span>
                            <span class="text-[11px] text-gray-400">${formattedDate}</span>
                        </div>
                        <div class="text-gray-700 text-sm break-all">${comment.content}</div>
                    `;
                    commentList.appendChild(commentDiv);
                });
            } catch (error) {
                console.error("댓글 불러오기 오류:", error.message);
            }
        }

        async function submitComment() {
            const authorVal = document.getElementById('comment-author').value.trim();
            const contentVal = document.getElementById('comment-content').value.trim();

            if (!contentVal) {
                alert("댓글 내용을 입력해 주세요.");
                document.getElementById('comment-content').focus();
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('free_board_comments')
                    .insert([{ post_id: currentPostId, author: authorVal || '회원', content: contentVal }]);

                if (error) throw error;

                document.getElementById('comment-author').value = '';
                document.getElementById('comment-content').value = '';
                fetchComments();

            } catch (error) {
                console.error("댓글 등록 오류:", error.message);
                alert("댓글 등록에 실패했습니다.");
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPostDetail);
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>

</body>
</html>
