    <!-- Supabase 글 수정 로직 -->
    <script>
        const supabaseClient = window.sb;

        let currentPostId = null;

        async function fetchPostForEdit() {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');

            if (!currentPostId) {
                alert("잘못된 접근입니다.");
                location.href = 'free-board.html';
                return;
            }

            try {
                const { data: post, error } = await supabaseClient
                    .from('free_board')
                    .select('*')
                    .eq('id', currentPostId)
                    .single();

                if (error) throw error;

                document.getElementById('title').value = post.title;
                document.getElementById('author').value = post.author || '';
                document.getElementById('content').value = post.content;

            } catch (error) {
                console.error("게시글 불러오기 실패:", error.message);
                alert("게시글 정보를 불러오는 데 실패했습니다.");
                history.back();
            }
        }

        async function updatePost() {
            const authorValue = document.getElementById('author').value.trim();
            const titleValue = document.getElementById('title').value.trim();
            const contentValue = document.getElementById('content').value.trim();

            if (!titleValue) {
                alert("제목을 입력해 주세요.");
                document.getElementById('title').focus();
                return;
            }
            if (!contentValue) {
                alert("내용을 입력해 주세요.");
                document.getElementById('content').focus();
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('free_board')
                    .update({
                        title: titleValue,
                        content: contentValue,
                        author: authorValue || '회원'
                    })
                    .eq('id', currentPostId);

                if (error) throw error;
                alert("게시글이 성공적으로 수정되었습니다.");
                location.href = `free-board-detail.html?id=${currentPostId}`;

            } catch (error) {
                console.error("수정 중 오류 발생:", error.message);
                alert("게시글 수정에 실패했습니다. 잠시 후 다시 시도해 주세요.");
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPostForEdit);
    </script>
