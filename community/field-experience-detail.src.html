        <aside class="w-full md:w-[232px] shrink-0 h-full left-scroll-area z-40">

                <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">

                <div class="p-6 md:p-8">

                    <h3 class="text-lg font-bold text-blue-900 mb-4 border-l-4 border-[#12387a] pl-3">💡 느끼고 터득한 점 (인사이트)</h3>
                    <div class="bg-blue-50 rounded-lg p-5 border border-blue-100 text-blue-800 leading-relaxed whitespace-pre-wrap" id="post-lesson"></div>

    <!-- 핑크박스 끝 -->

    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPostData = null;
        let currentLikes = 0;
        let hasLiked = false;

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!postId) {
                alert('잘못된 접근입니다.');
                location.href = 'field-experience.html';
                return;
            }
            await fetchPostDetail();
        });

        async function fetchPostDetail() {
            try {
                const { data, error } = await supabaseClient
                    .from('master_board')
                    .select('*')
                    .eq('id', postId)
                    .single();

                if (error) throw error;
                currentPostData = data;

                currentLikes = data.likes_count || 0;
                document.getElementById('like-count-display').textContent = currentLikes;

                if (localStorage.getItem(`liked_${postId}`) === 'true') {
                    hasLiked = true;
                    const btn = document.getElementById('like-btn');
                    btn.classList.replace('bg-red-50', 'bg-red-500');
                    btn.classList.replace('text-red-500', 'text-white');
                }

                const d = new Date(data.created_at);
                const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                document.getElementById('post-category').textContent = data.category || '기타';
                document.getElementById('post-title').textContent = data.title;
                document.getElementById('post-author').textContent = data.author_name;
                document.getElementById('post-date').textContent = dateStr;
                document.getElementById('post-content').textContent = data.content;
                document.getElementById('post-lesson').textContent = data.lesson_content || '작성된 내용이 없습니다.';

            } catch (error) {
                console.error('글 불러오기 에러:', error);
                alert('글을 불러오지 못했습니다.');
                location.href = 'field-experience.html';
            }
        }

        async function toggleLike() {
            if (hasLiked) {
                alert('이미 공감하신 게시물입니다.');
                return;
            }

            const newLikes = currentLikes + 1;

            try {
                const { error } = await supabaseClient
                    .from('master_board')
                    .update({ likes_count: newLikes })
                    .eq('id', postId);

                if (error) throw error;

                currentLikes = newLikes;
                hasLiked = true;
                localStorage.setItem(`liked_${postId}`, 'true');

                document.getElementById('like-count-display').textContent = currentLikes;
                const btn = document.getElementById('like-btn');
                btn.classList.replace('bg-red-50', 'bg-red-500');
                btn.classList.replace('text-red-500', 'text-white');

            } catch (error) {
                console.error('하트 업데이트 에러:', error);
                alert('공감을 처리하는 중 오류가 발생했습니다.');
            }
        }

        async function deletePost() {
            const inputPw = prompt('글을 삭제하려면 작성 시 입력한 비밀번호를 입력해주세요.');
            if (inputPw === null || inputPw.trim() === '') return;

            if (inputPw !== currentPostData.password) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            if (confirm('정말로 이 글을 삭제하시겠습니까?')) {
                try {
                    const { error } = await supabaseClient
                        .from('master_board')
                        .delete()
                        .eq('id', postId);

                    if (error) throw error;

                    alert('글이 성공적으로 삭제되었습니다.');
                    location.href = 'field-experience.html';
                } catch (error) {
                    console.error('삭제 에러:', error);
                    alert('삭제 중 오류가 발생했습니다.');
                }
            }
        }

        function editPost() {
            const inputPw = prompt('글을 수정하려면 작성 시 입력한 비밀번호를 입력해주세요.');
            if (inputPw === null || inputPw.trim() === '') return;

            if (inputPw !== currentPostData.password) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            location.href = `field-experience-edit.html?id=${postId}`;
        }
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>
</body>
