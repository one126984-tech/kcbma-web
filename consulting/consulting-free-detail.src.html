<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>지식컨설팅 상세 | 대한집합건물관리협회</title>

<!-- @include critical-css -->
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">

<!-- @include view-transition-css -->
<!-- @include common-css -->

    <style>
        .qna-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: -0.2px; margin-right: 5px; vertical-align: middle; }
        .badge-field { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge-free { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-paid { background: #fff5f5; color: #dc2626; border: 1px solid #feb2b2; }
        .badge-waiting { background: #f1f5f9; color: #64748b; }
        .badge-answered { background: #eef2ff; color: #4338ca; }
        #d-like-btn { cursor: pointer; }
        #d-like-btn:hover { color: #ef4444; }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->
    <div class="shrink-0 w-full flex flex-col bg-white shadow-md z-[900] relative">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center h-[50px]"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0 bg-[#F8FAFC]">
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-6 pb-0 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden relative items-start">
        
        <aside class="w-full md:w-[240px] shrink-0 md:h-full overflow-y-auto hide-scrollbar pb-8">
            <div class="pr-1 pt-1 flex flex-col gap-4">
                <div id="consult-type-container" class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                    <div class="side-menu-tab cursor-pointer" onclick="location.href='consulting-field.html'">
                        <i class="fas fa-people-group"></i> <span>현장경험 공유하기</span>
                    </div>
                    <div class="side-menu-tab-active cursor-pointer" onclick="location.href='consulting-free.html'">
                        <i class="fas fa-comment-dots"></i> <span>무보상 질문하기</span>
                    </div>
                    <div class="side-menu-tab cursor-pointer" onclick="location.href='consulting-paid.html'">
                        <i class="fas fa-user-tie"></i> <span>내공걸고 질문하기</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="content-area flex-1 min-w-0 md:h-full overflow-visible md:overflow-y-auto custom-scroll pr-2 pb-10">
            
            <div class="border-b-2 border-[#12387a] pb-5 mb-8">
                <div class="flex items-center gap-2 mb-3">
                    <span id="d-badges"></span>
                    <span id="d-meta" class="text-[13.5px] text-gray-500 font-bold ml-2"></span>
                </div>

                <h2 id="d-title" class="text-2xl md:text-3xl font-bold text-gray-900 mb-5 leading-snug">불러오는 중...</h2>

                <div class="flex flex-wrap justify-between items-center text-[13.5px] text-gray-500 bg-gray-50 px-4 py-3 rounded">
                    <div class="flex items-center gap-5">
                        <span class="font-bold text-gray-700"><i class="fas fa-user-circle text-gray-400 mr-1.5 text-lg align-middle"></i> <span id="d-author"></span></span>
                        <span><i class="far fa-clock mr-1.5"></i> <span id="d-date"></span></span>
                    </div>
                    <div class="flex items-center gap-5 mt-2 sm:mt-0">
                        <span><i class="far fa-eye mr-1.5"></i> 조회 <span id="d-views">0</span></span>
                        <span id="d-like-btn" title="관심 표시"><i class="far fa-heart mr-1.5"></i> 관심 <span id="d-likes">0</span></span>
                    </div>
                </div>
            </div>

            <!-- 본문 내용 -->
            <div id="d-content" class="py-4 text-[15.5px] leading-loose text-gray-800 min-h-[250px] border-b border-gray-200 mb-8 whitespace-pre-line"></div>

            <div class="flex justify-between items-center mb-12">
                <button onclick="location.href='consulting-free.html'" class="px-6 py-2.5 border border-gray-300 rounded text-[14px] font-bold text-gray-700 hover:bg-gray-50 transition-colors"><i class="fas fa-list mr-1"></i> 목록으로</button>
                <div class="flex gap-2">
                    <button id="d-edit-btn" style="display:none" class="px-5 py-2.5 border border-gray-300 rounded text-[14px] font-bold text-gray-600 hover:bg-gray-50">수정</button>
                    <button id="d-delete-btn" style="display:none" class="px-5 py-2.5 border border-red-300 text-red-500 rounded text-[14px] font-bold hover:bg-red-50">삭제</button>
                </div>
            </div>

            <!-- 답변 영역 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 md:p-8">
                <h3 class="text-lg font-bold text-[#12387a] mb-6">등록된 답변 <span id="d-answer-count" class="text-red-500 ml-1">0</span></h3>

                <div id="d-answers"></div>

                <!-- 답변 등록 폼 -->
                <div class="bg-white border border-gray-300 rounded p-1 mb-2 focus-within:border-[#12387a]">
                    <textarea id="d-answer-input" class="w-full px-4 py-3 h-32 text-[14px] resize-none outline-none leading-relaxed" placeholder="답변을 입력해주세요. 따뜻한 지식 나눔에 감사드립니다."></textarea>
                </div>
                <div class="flex justify-end">
                    <button id="d-answer-submit" class="px-8 py-3 bg-[#12387a] text-white font-bold rounded text-[14px] hover:bg-[#0a2046] transition-colors">답변 등록하기</button>
                </div>
            </div>
            
            <div id="footer-container" class="mt-10 border-t border-gray-200 pt-6"></div>
            
        </section>
    </main>
</div>

<script src="{{BASE}}assets/js/footer.js?v=1.3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{BASE}}assets/js/supabase-config.js"></script>
<script src="{{BASE}}assets/js/consulting-board.js?v=1"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => ConsultBoard.initDetail('FREE'));
</script>
<script>
    window.BASE_PATH = '/';
</script>

</body>
</html>
