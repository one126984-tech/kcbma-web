<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>지식컨설팅 공고 등록하기 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">

<!-- @include view-transition-css -->
<!-- @include common-css -->

    <style>
        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; white-space: nowrap; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }
        .custom-checkbox { display: flex; align-items: flex-start; gap: 6px; cursor: pointer; color: #4b5563; font-size: 14px; word-break: keep-all; line-height: 1.4; }
        .custom-checkbox input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; margin-top: 2px; accent-color: #1e3a8a; }
        .custom-checkbox input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.7; }
        
</style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <div class="shrink-0 w-full flex flex-col bg-white shadow-md z-[900] relative">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center h-[50px]"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0 bg-[#F8FAFC]">
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-6 pb-0 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden relative items-start">
        
        <!-- 좌측 사이드바 (삼단바) -->
        <aside class="w-full md:w-[240px] shrink-0 md:h-full overflow-y-auto hide-scrollbar pb-8">
            <div class="pr-1 pt-1 flex flex-col gap-4">
                <div id="consult-type-container" class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                    <div class="side-menu-tab cursor-pointer" onclick="location.href='consulting-field-write.html'">
                        <i class="fas fa-people-group"></i> <span>현장경험 공유하기</span>
                    </div>
                    <div class="side-menu-tab-active cursor-pointer" onclick="location.href='consulting-free-write.html'">
                        <i class="fas fa-comment-dots"></i> <span>무보상 질문하기</span>
                    </div>
                    <div class="side-menu-tab cursor-pointer" onclick="location.href='consulting-paid-write.html'">
                        <i class="fas fa-user-tie"></i> <span>내공걸고 질문하기</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 우측 폼 영역 (스크롤 영역) -->
        <section class="content-area flex-1 min-w-0 md:h-full overflow-visible md:overflow-y-auto custom-scroll pr-2 pb-10">
            
            <div class="flex items-center gap-3 border-b-2 border-[#12387a] pb-4 mb-6">
                <i class="fas fa-pen-square text-[#12387a] text-2xl"></i>
                <h2 class="text-2xl font-bold text-gray-900">무보상 질문 작성하기</h2>
            </div>

            <form id="consult-write-form" class="flex flex-col gap-6 bg-white p-6 md:p-8 rounded shadow-sm border border-gray-200">
                <input type="hidden" name="post_type" value="FREE">

                <!-- 분류 -->
                <div class="flex flex-col md:flex-row gap-6 border-b border-gray-100 pb-6">
                    <div class="flex flex-col md:flex-row gap-4 md:items-center w-full">
                        <span class="w-32 font-bold text-gray-700">분류 <span class="text-red-500">*</span></span>
                        <select class="flex-1 border border-gray-300 rounded px-3 py-2.5 text-[14px] outline-none focus:border-[#12387a] max-w-[300px]">
                            <option value="">분류 선택</option>
                            <option>관리소장 실무</option><option>경리회계</option><option>환경미화</option>
                            <option>기전영선</option><option>전기실무</option><option>기타</option>
                        </select>
                    </div>
                </div>

                <!-- 제목 -->
                <div class="flex flex-col md:flex-row gap-4 md:items-center border-b border-gray-100 pb-6">
                    <span class="w-32 font-bold text-gray-700">제목 <span class="text-red-500">*</span></span>
                    <input type="text" class="flex-1 border border-gray-300 rounded px-3 py-2.5 text-[14px] outline-none focus:border-[#12387a]" placeholder="제목을 입력하세요 (최대 100자)">
                </div>

                <!-- 내용 -->
                <div class="flex flex-col gap-3 pb-4">
                    <div class="flex justify-between items-end">
                        <span class="font-bold text-gray-700">내용 <span class="text-red-500">*</span></span>
                        <span class="text-[12px] text-gray-400">민감한 개인정보(이름, 단지명 등)는 포함하지 마세요.</span>
                    </div>
                    <textarea class="w-full border border-gray-300 rounded px-4 py-3 h-80 text-[14.5px] resize-none outline-none focus:border-[#12387a] leading-relaxed" placeholder="질문 내용을 상세히 적어주시면 더 정확한 답변을 받을 수 있습니다."></textarea>
                </div>

                <!-- 경험 공유 안내 및 동의 섹션 -->
                <div id="share-agree-section" class="flex flex-col md:flex-row gap-4 md:items-center border-b border-gray-100 pb-6 bg-green-50/30 p-5 rounded border border-green-100">
                    <span class="w-28 font-bold text-green-800">경험 공유</span>
                    <div class="flex flex-1 items-center" id="share-content-area">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="agree-share" checked disabled>
                            <span class="text-[14px] text-gray-700 font-bold">무보상 질문은 지식 나눔을 위해 답변 완료 후 '현장경험 공유'에 자동 공유됩니다.</span>
                        </label>
                    </div>
                </div>

                <!-- 하단 버튼 -->
                <div class="flex justify-center gap-3 mt-4">
                    <button type="button" onclick="history.back()" class="px-10 py-3.5 border border-gray-300 text-gray-600 font-bold rounded text-[15px] hover:bg-gray-50 transition-colors">취소</button>
                    <button type="button" onclick="submitForm()" class="px-10 py-3.5 bg-[#0B2A5B] text-white font-bold rounded text-[15px] hover:bg-[#12387a] transition-colors">질문 등록하기</button>
                </div>
            </form>
            
            <div id="footer-container" class="mt-10 border-t border-gray-200 pt-6"></div>
        </section>
    </main>
</div>

<script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

<script>
    function submitForm() {
        alert('성공적으로 등록되었습니다.');
        location.href = 'consulting-free.html';
    }
</script>

<script>
    window.BASE_PATH = '{{BASE}}';
</script>

</body>
</html>
