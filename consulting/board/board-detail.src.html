    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const biddingId = urlParams.get('id');

            if (!biddingId) {
                alert('잘못된 접근입니다.');
                location.href = 'board-corner.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('management_biddings')
                .select('*')
                .eq('id', biddingId)
                .single();

            if (error || !data) {
                alert('데이터를 불러오는데 실패했습니다.');
                return;
            }

            document.getElementById('detail-status').innerText = data.status;
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-summary').innerText = data.building_summary;
            document.getElementById('detail-contact').innerText = `${data.contact_person} (${data.contact_phone})`;

            let formattedProposal = data.detailed_proposal.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
            document.getElementById('detail-proposal').innerHTML = formattedProposal;
        });
    </script>
