<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채용 공고 상세 보기 및 수정</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .detail-wrapper { max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 상단 헤더 영역 */
        .header-section { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #004080; padding-bottom: 20px; margin-bottom: 30px; }
        .title-area { flex-grow: 1; margin-right: 20px; width: 100%; }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; color: white; margin-bottom: 15px; }
        .status-badge.open { background-color: #28a745; }
        .status-badge.closed { background-color: #6c757d; }
        .post-title { font-size: 24px; font-weight: bold; color: #333; margin: 0; }
        
        /* 공통 버튼 디자인 */
        .action-btns { display: flex; gap: 10px; margin-bottom: 0; flex-shrink: 0; }
        .btn-action { padding: 8px 16px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .btn-action:hover { background: #f8f9fa; }
        .btn-save { border-color: #004080; color: #004080; }
        .btn-save:hover { background: #004080; color: white; }
        
        /* 삭제 버튼 디자인 */
        .btn-delete { border-color: #dc3545; color: #dc3545; }
        .btn-delete:hover { background: #dc3545; color: white; }

        /* 💡 하단 버튼 영역 정렬 (완벽한 중앙 정렬을 위해 클래스 독립) */
        .bottom-btn-area { display: flex; justify-content: center; gap: 10px; margin-top: 30px; width: 100%; }
        
        /* 전체 정보 그리드 레이아웃 (2열 그리드) */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        /* 개별 행(좌우 카드) 디자인 */
        .info-row { display: flex; background: #ffffff; border: 1px solid #dce4ec; border-radius: 6px; overflow: hidden; align-items: stretch; min-height: 50px; }
        
        /* 왼쪽 라벨 전체 박스 */
        .info-label-box { 
            width: 40%; 
            background-color: #e3eef8; 
            border-right: 1px solid #dce4ec; 
            display: flex; 
            align-items: center; 
            color: #111111; 
            box-sizing: border-box; 
            padding: 12px 10px;
        }

        .info-label-box .icon-box { font-size: 20px; width: 35px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .info-label-box .text-box { font-size: 14px; font-weight: bold; line-height: 1.4; padding-left: 4px; word-break: keep-all; }
        
        /* 오른쪽 내용 영역 */
        .info-value-box { width: 60%; padding: 10px 15px; display: flex; flex-direction: column; justify-content: center; font-size: 15px; color: #333; background-color: #ffffff; box-sizing: border-box; line-height: 1.4; word-break: break-all; }
        
        .content-section { margin-top: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 6px; background-color: #fff; line-height: 1.6; min-height: 200px; }

        /* ======== 수정 모드 관련 클래스 ======== */
        .edit-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; margin-top: 2px; }
        textarea.edit-input { resize: vertical; min-height: 200px; }
        .edit-row { display: flex; gap: 5px; width: 100%; }

        /* 기본 상태: 보기 요소 보임, 수정 요소 숨김 */
        .edit-only { display: none !important; }
        .view-only { display: block; }
        
        /* 수정 모드 상태: 보기 요소 숨김, 수정 요소 보임 */
        .edit-mode-active .edit-only { display: block !important; }
        .edit-mode-active .edit-only.row-layout { display: flex !important; flex-direction: row; gap: 5px; }
        .edit-mode-active button.edit-only { display: inline-block !important; }
        .edit-mode-active .view-only { display: none !important; }
    </style>
</head>
<body id="page_body">

<div class="detail-wrapper">
    <!-- 상단 헤더 영역 -->
    <div class="header-section">
        <div class="title-area">
            <div id="view_status" class="view-only"></div>
            
            <!-- 수정용 상태 변경 -->
            <select id="edit_status" class="edit-input edit-only" style="width: auto; margin-bottom: 10px; font-weight: bold;">
                <option value="OPEN">채용중</option>
                <option value="CLOSED">마감</option>
            </select>

            <h1 class="post-title view-only" id="view_title">공고 제목을 불러오는 중...</h1>
            <input type="text" id="edit_title" class="edit-input edit-only" style="font-size: 18px; font-weight: bold;" placeholder="채용 제목을 입력하세요">
        </div>

        <div class="action-btns">
            <!-- 상단 3개 버튼 (보기 모드) -->
            <button class="btn-action btn-delete view-only" onclick="deletePost()">삭제하기</button>
            <button class="btn-action view-only" onclick="toggleEdit(true)">수정하기</button>
            <button class="btn-action view-only" onclick="window.location.href='job-list.html'">목록으로 돌아가기</button>
            
            <!-- 수정 모드 버튼 -->
            <button class="btn-action edit-only" onclick="toggleEdit(false)">취소하기</button>
            <button class="btn-action btn-save edit-only" onclick="saveChanges()">저장하기</button>
        </div>
    </div>

    <!-- 정보 그리드 -->
    <div class="info-grid">
        <!-- 1행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">🏢</div><div class="text-box">근무지 (건물명)</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_building"></span>
                <div class="edit-only row-layout">
                    <input type="text" id="edit_address" class="edit-input" placeholder="근무지역(예:김포시)">
                    <input type="text" id="edit_building_name" class="edit-input" placeholder="건물명">
                </div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">📍</div><div class="text-box">건물규모 및 종류</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_location_scale"></span>
                <input type="text" id="edit_location_scale" class="edit-input edit-only" placeholder="예: 18층, 360세대, 오피스텔">
            </div>
        </div>

        <!-- 2행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">💼</div><div class="text-box">모집 부문 및<br>고용 형태</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_job_type"></span>
                <div class="edit-only row-layout">
                    <input type="text" id="edit_job_category" class="edit-input" placeholder="모집부문(예:시설기사)">
                    <input type="text" id="edit_employment_type" class="edit-input" placeholder="고용형태(예:계약직)">
                </div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">💰</div><div class="text-box">급여 조건</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_salary"></span>
                <input type="text" id="edit_salary" class="edit-input edit-only" placeholder="예: 월 280만원">
            </div>
        </div>

        <!-- 3행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">🎓</div><div class="text-box">학력 조건</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_education"></span>
                <input type="text" id="edit_education" class="edit-input edit-only" placeholder="예: 무관">
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">💼</div><div class="text-box">경력 조건</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_experience"></span>
                <input type="text" id="edit_experience" class="edit-input edit-only" placeholder="예: 1년 이상">
            </div>
        </div>

        <!-- 4행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">🪪</div><div class="text-box">필수 자격증</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_certifications"></span>
                <input type="text" id="edit_certifications" class="edit-input edit-only" placeholder="예: 전기기능사">
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">🎖️</div><div class="text-box">우대 사항</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_preferred"></span>
                <input type="text" id="edit_preferred" class="edit-input edit-only" placeholder="예: 인근 거주자">
            </div>
        </div>

        <!-- 5행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">📅</div><div class="text-box">접수 기간</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_dates"></span>
                <div class="edit-only row-layout">
                    <input type="date" id="edit_start_date" class="edit-input">
                    <span style="align-self: center;">~</span>
                    <input type="date" id="edit_end_date" class="edit-input">
                </div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">✉️</div><div class="text-box">지원서 보낼 곳</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_contact"></span>
                <div class="edit-only row-layout">
                    <input type="text" id="edit_manager_name" class="edit-input" placeholder="담당자 이름">
                    <input type="text" id="edit_contact_email" class="edit-input" placeholder="이메일">
                </div>
            </div>
        </div>
        
        <!-- 6행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">⏰</div><div class="text-box">근무 형태 및 시간</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_work_hours"></span>
                <div class="edit-only row-layout">
                    <input type="text" id="edit_shift_type" class="edit-input" placeholder="형태(예:격일제)">
                    <input type="text" id="edit_work_hours" class="edit-input" placeholder="시간(예:40시간)">
                </div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">🎁</div><div class="text-box">복리후생</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_benefits"></span>
                <input type="text" id="edit_benefits" class="edit-input edit-only" placeholder="예: 4대 보험">
            </div>
        </div>

        <!-- 7행 -->
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">📄</div><div class="text-box">제출 서류</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_documents"></span>
                <input type="text" id="edit_documents" class="edit-input edit-only" placeholder="예: 이력서">
            </div>
        </div>
        <div class="info-row">
            <div class="info-label-box"><div class="icon-box">📞</div><div class="text-box">전화문의</div></div>
            <div class="info-value-box">
                <span class="view-only" id="view_inquiries"></span>
                <input type="text" id="edit_inquiries" class="edit-input edit-only" placeholder="예: 010-1234-5678">
            </div>
        </div>
    </div>

    <h3 style="color: #004080; border-bottom: 2px solid #004080; padding-bottom: 5px;">상세 모집 요강</h3>
    
    <!-- 본문 내용 (보기용 / 수정용) -->
    <div class="content-section view-only" id="view_content">내용을 불러오는 중입니다...</div>
    <textarea id="edit_content" class="edit-input edit-only" style="margin-top:20px;" placeholder="상세 내용을 입력하세요."></textarea>

    <!-- 💡 수정된 하단 영역 버튼 세트 -->
    <div class="bottom-btn-area">
        <!-- 하단 3개 버튼 (보기 모드) -->
        <button class="btn-action btn-delete view-only" onclick="deletePost()">삭제하기</button>
        <button class="btn-action view-only" onclick="toggleEdit(true)">수정하기</button>
        <button class="btn-action view-only" onclick="window.location.href='job-list.html'">목록으로 돌아가기</button>
        
        <!-- 하단 수정 모드 버튼 -->
        <button class="btn-action edit-only" onclick="toggleEdit(false)">취소하기</button>
        <button class="btn-action btn-save edit-only" onclick="saveChanges()">저장하기</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('id');

let currentPostData = null; 

async function fetchDetail() {
    if (!postId) {
        alert("잘못된 접근입니다.");
        window.location.href = "job-list.html";
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from('master_board')
            .select('*')
            .eq('id', postId)
            .single();

        if (error) throw error;
        currentPostData = data;
        loadDetail(data);
    } catch (error) {
        console.error("상세 데이터 불러오기 실패:", error);
        alert("글을 불러오지 못했습니다.");
    }
}

function loadDetail(data) {
    const cData = typeof data.custom_data === 'string' ? JSON.parse(data.custom_data) : (data.custom_data || {});
    
    const statusDiv = document.getElementById('view_status');
    statusDiv.innerHTML = data.status === 'OPEN' || !data.status 
        ? '<span class="status-badge open">채용중</span>' 
        : '<span class="status-badge closed">마감</span>';
        
    document.getElementById('view_title').innerText = data.title || '';

    const locationText = cData.address_short || '';
    const buildingText = cData.building_name || '';
    document.getElementById('view_building').innerText = [locationText, buildingText].filter(Boolean).join(' / ') || '-';
    
    document.getElementById('view_location_scale').innerText = cData.building_scale || '-';
    
    const jobText = cData.job_category || '';
    const empText = cData.employment_type || '';
    document.getElementById('view_job_type').innerText = [jobText, empText ? `(${empText})` : ''].filter(Boolean).join(' ') || '-';
    
    document.getElementById('view_salary').innerText = cData.salary || '-';
    document.getElementById('view_education').innerText = cData.education || '무관';
    document.getElementById('view_experience').innerText = cData.experience || '무관';
    document.getElementById('view_certifications').innerText = cData.certification || '무관';
    document.getElementById('view_preferred').innerText = cData.preferred_qualifications || '-';
    document.getElementById('view_dates').innerText = `${cData.start_date || ''} ~ ${cData.end_date || ''}`;
    
    const contactList = [cData.manager_name, cData.contact_email].filter(Boolean).join(' ');
    document.getElementById('view_contact').innerText = contactList || '-';

    document.getElementById('view_work_hours').innerText = `${cData.shift_type || '-'} / ${cData.work_hours || '-'}`;
    document.getElementById('view_benefits').innerText = cData.benefits || '-';
    document.getElementById('view_documents').innerText = cData.required_documents || '-';
    document.getElementById('view_inquiries').innerText = cData.inquiries || '-';
    
    document.getElementById('view_content').innerHTML = data.content ? data.content.replace(/\n/g, '<br>') : '';

    document.getElementById('edit_status').value = data.status || 'OPEN';
    document.getElementById('edit_title').value = data.title || '';
    document.getElementById('edit_address').value = cData.address_short || '';
    document.getElementById('edit_building_name').value = cData.building_name || '';
    document.getElementById('edit_location_scale').value = cData.building_scale || '';
    document.getElementById('edit_job_category').value = cData.job_category || '';
    document.getElementById('edit_employment_type').value = cData.employment_type || '';
    document.getElementById('edit_salary').value = cData.salary || '';
    document.getElementById('edit_education').value = cData.education || '';
    document.getElementById('edit_experience').value = cData.experience || '';
    document.getElementById('edit_certifications').value = cData.certification || '';
    document.getElementById('edit_preferred').value = cData.preferred_qualifications || '';
    document.getElementById('edit_start_date').value = cData.start_date || '';
    document.getElementById('edit_end_date').value = cData.end_date || '';
    document.getElementById('edit_manager_name').value = cData.manager_name || '';
    document.getElementById('edit_contact_email').value = cData.contact_email || '';
    document.getElementById('edit_shift_type').value = cData.shift_type || '';
    document.getElementById('edit_work_hours').value = cData.work_hours || '';
    document.getElementById('edit_benefits').value = cData.benefits || '';
    document.getElementById('edit_documents').value = cData.required_documents || '';
    document.getElementById('edit_inquiries').value = cData.inquiries || '';
    document.getElementById('edit_content').value = data.content || '';
}

function toggleEdit(isEdit) {
    const bodyEl = document.getElementById('page_body');
    if (isEdit) {
        bodyEl.classList.add('edit-mode-active');
    } else {
        if(currentPostData) loadDetail(currentPostData);
        bodyEl.classList.remove('edit-mode-active');
    }
}

async function saveChanges() {
    if (!confirm("수정된 내용을 저장하시겠습니까?")) return;

    const updatedCustomData = {
        address_short: document.getElementById('edit_address').value,
        building_name: document.getElementById('edit_building_name').value,
        building_scale: document.getElementById('edit_location_scale').value,
        job_category: document.getElementById('edit_job_category').value,
        employment_type: document.getElementById('edit_employment_type').value,
        salary: document.getElementById('edit_salary').value,
        education: document.getElementById('edit_education').value,
        experience: document.getElementById('edit_experience').value,
        certification: document.getElementById('edit_certifications').value,
        preferred_qualifications: document.getElementById('edit_preferred').value,
        start_date: document.getElementById('edit_start_date').value,
        end_date: document.getElementById('edit_end_date').value,
        manager_name: document.getElementById('edit_manager_name').value,
        contact_email: document.getElementById('edit_contact_email').value,
        shift_type: document.getElementById('edit_shift_type').value,
        work_hours: document.getElementById('edit_work_hours').value,
        benefits: document.getElementById('edit_benefits').value,
        required_documents: document.getElementById('edit_documents').value,
        inquiries: document.getElementById('edit_inquiries').value
    };

    const updateData = {
        title: document.getElementById('edit_title').value,
        status: document.getElementById('edit_status').value,
        content: document.getElementById('edit_content').value,
        custom_data: updatedCustomData 
    };

    try {
        const { error } = await supabaseClient
            .from('master_board')
            .update(updateData)
            .eq('id', postId);

        if (error) throw error;
        
        alert("성공적으로 저장되었습니다.");
        
        window.location.href = 'job-list.html';

    } catch (error) {
        console.error("저장 실패:", error);
        alert("저장에 실패했습니다. 다시 시도해주세요.");
    }
}

async function deletePost() {
    if (!confirm("정말로 이 공고를 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.")) {
        return;
    }

    try {
        const { error } = await supabaseClient
            .from('master_board')
            .delete()
            .eq('id', postId);

        if (error) throw error;
        
        alert("공고가 성공적으로 삭제되었습니다.");
        window.location.href = 'job-list.html';

    } catch (error) {
        console.error("삭제 실패:", error);
        alert("삭제에 실패했습니다. 다시 시도해주세요.");
    }
}

window.onload = fetchDetail;
</script>
</body>
</html>
