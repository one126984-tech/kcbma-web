    <style>
        .side-menu-tab { display: flex; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: 700; font-size: 15px; cursor: pointer; transition: background-color .2s, color .2s; }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active { display: flex; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }

        html, body { overflow-y: scroll; }
        .detail-header { border-bottom: 2px solid #12387a; padding-bottom: 20px; margin-bottom: 25px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 12px; }
        .status-badge.open { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .status-badge.closed { background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; }
        .detail-title { font-size: 24px; font-weight: 900; color: #111; margin-bottom: 12px; }

        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border-top: 1px solid #e5e7eb; }
        .info-table th { width: 140px; background: #f8fafc; color: #333; font-weight: bold; text-align: left; padding: 14px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        .info-table td { padding: 14px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14px; color: #4b5563; }

        .content-area { min-height: 200px; padding: 30px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 15px; line-height: 1.8; color: #333; margin-bottom: 40px; white-space: pre-wrap; }
        .contact-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 25px; text-align: center; margin-bottom: 30px; }
        .btn-call-large { display: inline-flex; align-items: center; justify-content: center; background: #12387a; color: white; padding: 14px 36px; font-size: 18px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(18, 56, 122, 0.2); transition: all 0.2s; cursor: pointer; text-decoration: none; }
        .btn-call-large:hover { background: #0B2A5B; transform: translateY(-2px); color: white; }

        .btn-wrap { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .btn-list { padding: 12px 40px; background: #fff; border: 1px solid #cbd5e1; color: #333; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-list:hover { background: #f8fafc; border-color: #94a3b8; }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

<!-- @include header -->
    <div class="w-full flex flex-col bg-white shadow-md relative z-[800]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col">
    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[90px] h-fit z-40">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="location.href='job-list.html'"><span>구인 (채용)</span></div>
                <div class="h-px bg-gray-100 mx-2 my-1"></div>
                <div class="side-menu-tab-active" onclick="location.href='resume-list.html'"><span>구직 (인재)</span></div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 bg-white p-6 md:p-8 border border-gray-200 rounded shadow-sm">
            <div id="loading-spinner" class="text-center py-20 text-gray-500 font-bold">데이터를 불러오는 중입니다...</div>
            <div id="detail-container" style="display: none;">
                <div class="detail-header">
                    <span id="resume-status" class="status-badge open">구직중</span>
                    <h1 class="detail-title"><span id="resume-title"></span></h1>
                    <div class="flex gap-3 text-sm text-gray-500 font-bold">
                        <span id="resume-job-category" class="text-blue-700"></span><span>|</span>
                        <span id="resume-region"></span><span>|</span>
                        <span><i class="fas fa-eye mr-1"></i><span id="resume-views">0</span></span>
                    </div>
                </div>

                <div class="contact-box">
                    <p class="text-gray-500 text-sm font-bold mb-4">채용 관련 문의는 아래 버튼으로 연락처를 확인해 주세요. (로그인 회원 전용 · 채용 목적 외 사용 시 법적 제재 대상)</p>
                    <a id="btn-call" class="btn-call-large"><i class="fas fa-phone-alt mr-2"></i> 연락하기 클릭</a>
                    <p id="contact-note" style="font-size:13px;color:#6b7280;margin-top:12px;display:none;"></p>
                </div>

                <table class="info-table">
                    <tbody>
                        <tr><th>이름</th><td id="info-name"></td><th>이메일</th><td id="info-email"></td></tr>
                        <tr><th>현재 거주지</th><td id="info-address"></td><th>희망 근무 형태</th><td id="info-employment-type"></td></tr>
                        <tr><th>희망 급여</th><td id="info-salary"></td><th>총 경력</th><td id="info-experience"></td></tr>
                        <tr><th>최종 학력</th><td id="info-education"></td><th>출근 가능일</th><td id="info-immediate-start"></td></tr>
                        <tr><th>보유 자격증</th><td colspan="3" id="info-certification"></td></tr>
                        <tr><th>기타 우대사항</th><td colspan="3" id="info-skills"></td></tr>
                    </tbody>
                </table>

                <h3 class="text-[17px] font-bold text-gray-800 mb-3 ml-1">자기소개 및 상세 경력</h3>
                <div id="resume-content" class="content-area"></div>

                <div class="btn-wrap">
                    <button class="btn-list" onclick="location.href='resume-list.html'">목록으로 돌아가기</button>
                </div>
            </div>
    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>
        </section>
    </main>
</div>

    <script>
        const SUPABASE_URL = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
        const DB_TABLE_NAME = 'master_board'; 

        document.addEventListener('DOMContentLoaded', () => { fetchResumeDetail(); });

        async function fetchResumeDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const resumeId = urlParams.get('id');

            if (!resumeId || !supabaseClient) { renderMockData(); return; }

            try {
                // 이력서는 서버 함수로 조회 (비로그인이면 연락처 제외·이름 가림)
                const { data, error } = await supabaseClient.rpc('resume_get', { p_id: String(resumeId) });

                if (error) throw error;
                if (!data) throw new Error('Data not found');

                renderResumeDetail(data);

                // ★ view_count로 명칭 통합
                supabaseClient.rpc('master_board_increment_view', { p_id: String(resumeId) })
                    .then(({ error }) => { if (error) console.error('조회수 업데이트 실패:', error); });

            } catch (error) { console.error(error); renderMockData(); }
        }

        // ★ view_count로 명칭 통합
        function getDisplayViews(resume) {
            return Number(resume.view_count) || 0;   // 실제 조회수만 표시
        }

        function renderResumeDetail(data) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('detail-container').style.display = 'block';

            const cData = typeof data.custom_data === 'string' ? JSON.parse(data.custom_data) : (data.custom_data || {});
            const isOpen = data.status === 'OPEN' || !data.status;

            const statusEl = document.getElementById('resume-status');
            statusEl.textContent = isOpen ? '구직중' : '취업완료';
            statusEl.className = isOpen ? 'status-badge open' : 'status-badge closed';

            document.getElementById('resume-title').innerText = data.title || '-';
            document.getElementById('resume-job-category').innerText = cData.job_category || '-';
            document.getElementById('resume-region').innerText = cData.address_short || cData.address || '-';
            document.getElementById('resume-views').innerText = getDisplayViews(data);

            // ★ 2026-11 개인정보 공개 범위 v2
            //   전화·이메일은 목록/상세 자료에 아예 들어 있지 않고, '연락처 보기'를 눌렀을 때만
            //   서버 함수(resume_contact)가 조건을 확인한 뒤 내려줍니다. (열람 기록 남음, 하루 30건)
            const btnCall = document.getElementById('btn-call');
            const note = document.getElementById('contact-note');
            const emailCell = document.getElementById('info-email');
            const showNote = (t) => { note.textContent = t; note.style.display = t ? 'block' : 'none'; };
            const setOff = (html) => {
                btnCall.innerHTML = html; btnCall.removeAttribute('href'); btnCall.onclick = null;
                btnCall.style.backgroundColor = '#9ca3af'; btnCall.style.cursor = 'not-allowed';
            };
            const showContact = (phone, email) => {
                emailCell.innerText = email || '-';
                if (phone) {
                    btnCall.innerHTML = `<i class="fas fa-phone-alt mr-2"></i> ${KC.esc(phone)}`;
                    btnCall.href = `tel:${String(phone).replace(/[^0-9+]/g, '')}`; btnCall.onclick = null;
                    btnCall.style.backgroundColor = '#12387a'; btnCall.style.cursor = 'pointer';
                } else {
                    setOff('<i class="fas fa-phone-slash mr-2"></i> 연락처 없음');
                }
            };
            const goLogin = () => { try { localStorage.setItem('returnUrl', location.pathname + location.search); } catch (e) {} location.href = '/login.html'; };
            const st = cData.contact_status || (cData.contact_locked ? 'login' : 'available');

            if (st === 'admin') {
                // 관리자: 전부 보임
                showContact(cData.phone, cData.email);
                showNote('관리자 화면: 연락처·상세주소가 모두 보입니다.');
            } else if (st === 'login') {
                btnCall.innerHTML = '<i class="fas fa-lock mr-2"></i> 로그인하면 연락처 보기';
                btnCall.removeAttribute('href'); btnCall.style.backgroundColor = '#12387a'; btnCall.style.cursor = 'pointer';
                btnCall.onclick = goLogin;
                emailCell.innerText = '로그인 후 확인';
            } else if (st === 'private') {
                setOff('<i class="fas fa-user-lock mr-2"></i> 연락처 비공개');
                emailCell.innerText = '비공개';
                showNote('이 구직자는 연락처를 공개하지 않았습니다.');
            } else if (st === 'closed') {
                setOff('<i class="fas fa-user-check mr-2"></i> 취업완료 · 연락처 비공개');
                emailCell.innerText = '비공개';
            } else {
                btnCall.innerHTML = '<i class="fas fa-address-card mr-2"></i> 연락처 보기';
                btnCall.removeAttribute('href'); btnCall.style.backgroundColor = '#12387a'; btnCall.style.cursor = 'pointer';
                emailCell.innerText = '연락처 보기를 누르면 표시';
                showNote('연락처를 열어 보면 열람 기록이 남습니다. 채용 목적 외 사용은 금지됩니다.');
                btnCall.onclick = async (e) => {
                    e.preventDefault();
                    btnCall.style.pointerEvents = 'none';
                    try {
                        const { data: r, error } = await supabaseClient.rpc('resume_contact', { p_id: String(data.id) });
                        if (error) throw error;
                        const res = r || {};
                        if (res.status === 'ok') { showContact(res.phone, res.email); showNote('열람 기록이 남았습니다. 채용 목적 외 사용은 금지됩니다.'); }
                        else if (res.status === 'login') goLogin();
                        else if (res.status === 'private') { setOff('<i class="fas fa-user-lock mr-2"></i> 연락처 비공개'); showNote('이 구직자는 연락처를 공개하지 않았습니다.'); }
                        else if (res.status === 'closed') setOff('<i class="fas fa-user-check mr-2"></i> 취업완료 · 연락처 비공개');
                        else if (res.status === 'limit') showNote('하루에 열어 볼 수 있는 이력서 연락처(30건)를 넘었습니다. 내일 다시 이용해 주세요.');
                        else showNote('이력서를 찾을 수 없습니다.');
                    } catch (err) {
                        console.error(err);
                        showNote('연락처를 불러오지 못했습니다. 로그인 상태를 확인하고 다시 시도해 주세요.');
                    } finally { btnCall.style.pointerEvents = ''; }
                };
            }

            document.getElementById('info-name').innerText = cData.name || '-';
            document.getElementById('info-address').innerText = st === 'admin' ? (cData.address || '-') : (cData.address_short || '-');
            document.getElementById('info-employment-type').innerText = cData.employment_type || '무관';
            document.getElementById('info-salary').innerText = cData.desired_salary || '-';
            document.getElementById('info-experience').innerText = cData.experience || '-';
            document.getElementById('info-education').innerText = cData.education || '-';
            document.getElementById('info-immediate-start').innerText = cData.immediate_start || '-'; 
            document.getElementById('info-certification').innerText = cData.certification || '-';
            document.getElementById('info-skills').innerText = cData.skills || '-';

            document.getElementById('resume-content').innerText = data.content || '작성된 내용이 없습니다.';
        }

        // 이력서를 못 찾았을 때: 예전엔 가짜 이력서(홍 모씨 예시)를 보여줬음 → 안내 문구로 교체
        function renderMockData() {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) spinner.style.display = 'none';
            const box = document.getElementById('detail-container');
            if (box) {
                box.style.display = 'block';
                box.innerHTML = `<div style="text-align:center;padding:70px 20px;color:#4b5563;">
                    <div style="font-size:18px;font-weight:800;color:#0B2A5B;margin-bottom:8px;">이력서를 찾을 수 없습니다</div>
                    <div style="font-size:14px;">삭제되었거나 주소가 잘못되었습니다.</div>
                    <a href="resume-list.html" style="display:inline-block;margin-top:18px;background:#12387a;color:#fff;font-weight:700;padding:10px 22px;border-radius:8px;text-decoration:none;">이력서 목록으로</a>
                </div>`;
            }
        }
    </script>
    <script>window.BASE_PATH = '/';</script>
</body>
</html>
