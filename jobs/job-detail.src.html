    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        function ddayText(endDate) {
            if (!endDate) return '상시채용';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const d = new Date(endDate);
            const diffDays = Math.ceil((d - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return '마감';
            if (diffDays === 0) return '오늘마감';
            return `D-${diffDays}`;
        }

        function renderList(elementId, text) {
            const ul = document.getElementById(elementId);
            const lines = (text || '').split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) {
                ul.innerHTML = '<li>등록된 내용이 없습니다.</li>';
                return;
            }
            ul.innerHTML = lines.map(l => `<li>${l}</li>`).join('');
        }

        async function fetchJobDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('id');

            if (!jobId) {
                alert('잘못된 접근입니다.');
                location.href = 'job-list.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('id', jobId)
                .single();

            if (error || !data) {
                alert('채용정보를 불러오는데 실패했습니다.');
                location.href = 'job-list.html';
                return;
            }

            document.getElementById('detail-company').innerText = data.company_name || '';
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-viewcount').innerText = `조회수 ${(data.view_count || 0) + 1}`;
            document.getElementById('detail-dday').innerText = ddayText(data.end_date);

            document.getElementById('detail-career').innerText = data.career_level || '무관';
            document.getElementById('detail-education').innerText = data.education_level || '무관';
            document.getElementById('detail-employment-type').innerText = data.employment_type || '-';
            document.getElementById('detail-work-schedule').innerText = data.work_schedule || '-';
            document.getElementById('detail-salary').innerText = data.salary || '-';
            document.getElementById('detail-region').innerText = data.region || data.location || '-';
            document.getElementById('detail-insurance').innerText = data.insurance_benefits || '-';
            document.getElementById('detail-other-benefits').innerText = data.other_benefits || '-';

            renderList('detail-job-duties', data.job_duties);
            renderList('detail-qualifications', data.qualifications);

            if (data.notice) {
                document.getElementById('detail-notice').innerText = data.notice;
                document.getElementById('detail-notice-box').classList.remove('hidden');
            }

            // 조회수 +1 (실패해도 화면 표시에는 영향 없음)
            supabaseClient.from('jobs').update({ view_count: (data.view_count || 0) + 1 }).eq('id', jobId).then(() => {});
        }

        document.addEventListener('DOMContentLoaded', fetchJobDetail);
    </script>
