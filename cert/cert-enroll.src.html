    <style>
        /* 이 페이지(수강 신청) 전용 CSS */
        html, body { overflow-y: scroll; overflow-anchor: none; }
        /* ★ 2026-08: aside의 md:sticky 오프셋은 이제 아래 aside 태그의
           md:top-[126px] 유틸리티 클래스로 직접 고정함(126px = 헤더 70px +
           서브헤더 56px, 사이트 전체 공통 값). 예전엔 --header-actual-height
           CSS변수를 JS(ResizeObserver)로 측정해서 "변수+56px"로 계산했는데,
           그 변수가 header.html/header-close.html 구조 개편 이후로 이미
           "헤더+서브헤더 합산 높이"(126px)를 담게 되면서 거기에 56px를 또
           더해 이중으로 계산되는 버그가 있었음(값이 182px까지 부풀어서
           사이드바 카드가 다른 자격증 페이지보다 훨씬 아래에서 시작하는
           원인이었음). 값이 페이지마다 동적으로 변하지 않는 고정 레이아웃이라
           JS 측정 없이 그냥 고정값으로 박아두는 게 더 안정적. */

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 30px; margin-bottom: 24px; }
        .section-title { font-size: 18px; font-weight: 900; color: #12387a; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; gap: 8px; }

        .agree-box { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .agree-label { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: #374151; cursor: pointer; }
        .agree-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #12387a; cursor: pointer; }
        .agree-all-box { background: #f0f4fb; border: 1px solid #dbe4f5; border-radius: 8px; padding: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .agree-all-box label { font-size: 15.5px; font-weight: 700; color: #12387a; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .agree-all-box input[type="checkbox"] { width: 20px; height: 20px; accent-color: #12387a; cursor: pointer; }
    </style>
</head>
<body class="flex flex-col min-h-screen {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sticky-top-bar" class="w-full flex flex-col relative z-[900] shrink-0 bg-transparent">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center shadow-md"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col">



    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-7 pb-8 flex flex-col md:flex-row gap-4 md:gap-8">

        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[126px] h-fit z-40">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab-active">자격증 과정</div>
                <div class="side-menu-tab" onclick="location.href='edu-field-list.html'">현장 교육</div>
                <div class="side-menu-tab" onclick="location.href='cert-verify.html'">진위 확인</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 max-w-[720px]" id="enroll-root">
            <div class="text-center py-24 text-gray-500 bg-white border border-gray-200 rounded">데이터를 불러오는 중입니다...</div>
        </section>
    </main>

    </div>
    <!-- 핑크박스 끝 -->

    <div id="footer-container" class="w-full mt-auto"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;

        const qs = new URLSearchParams(window.location.search);
        const courseId = qs.get('course_id') || qs.get('id');

        let currentCourse = null;
        let currentUser = null;

        const dummyCourse = {
            id: 'dummy-1',
            title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)',
            category: '기전',
            edu_method: 'VOD',
            original_price: 250000,
            discount_price: 0,
            is_free: true
        };

        function methodLabel(method) {
            if (method === 'VOD') return '동영상(VOD)';
            if (method === 'LIVE') return '실시간(Zoom)';
            if (method === 'MIX') return '혼합형';
            return '-';
        }

        function priceLabel(course) {
            const price = course.original_price || 0;
            const salePrice = (course.discount_price !== undefined && course.discount_price !== null) ? course.discount_price : price;
            if (course.is_free || salePrice === 0) return '100% 장학지원 무료';
            return `${salePrice.toLocaleString()}원`;
        }

        async function fetchCourse() {
            try {
                if (!courseId) throw new Error('과정 식별자 없음');
                const { data, error } = await supabaseClient
                    .from('cert_courses')
                    .select('*')
                    .eq('id', courseId)
                    .maybeSingle();
                if (error) throw error;
                currentCourse = data || dummyCourse;
            } catch (error) {
                console.error('과정 정보 조회 실패:', error);
                currentCourse = dummyCourse;
            }
        }

        async function fetchUser() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.auth.getUser();
            currentUser = data ? data.user : null;
        }

        function renderNotLoggedIn() {
            document.getElementById('enroll-root').innerHTML = `
                <div class="section-card text-center py-16">
                    <i class="fas fa-lock text-4xl text-gray-300 mb-4"></i>
                    <p class="text-lg font-bold text-gray-700 mb-2">로그인이 필요합니다</p>
                    <p class="text-sm text-gray-500 mb-6">수강 신청은 로그인 후 이용할 수 있습니다.</p>
                    <a href="{{BASE}}login.html" class="inline-block px-8 py-3 bg-[#12387a] text-white font-bold rounded-lg hover:bg-[#0e2b61] transition">로그인 하기</a>
                </div>
            `;
        }

        function renderForm() {
            const course = currentCourse;
            document.getElementById('enroll-root').innerHTML = `
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-file-alt"></i> 신청 과정 정보</div>
                    <div class="grid grid-cols-2 gap-4 text-sm bg-gray-50 border border-gray-100 rounded-lg p-5">
                        <div class="col-span-2"><div class="text-gray-500 mb-1">자격증명</div><div class="font-bold text-lg text-[#0B2A5B]">${course.title}</div></div>
                        <div><div class="text-gray-500 mb-1">분야</div><div class="font-bold text-gray-800">${course.category || '-'}</div></div>
                        <div><div class="text-gray-500 mb-1">수강 방식</div><div class="font-bold text-gray-800">${methodLabel(course.edu_method)}</div></div>
                        <div class="col-span-2"><div class="text-gray-500 mb-1">수강료</div><div class="font-black text-xl text-red-600">${priceLabel(course)}</div></div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title"><i class="fas fa-clipboard-check"></i> 약관 동의</div>

                    <div class="agree-all-box">
                        <label>
                            <input type="checkbox" id="agree-all" onchange="toggleAll(this.checked)">
                            전체 약관에 동의합니다
                        </label>
                    </div>

                    <div class="agree-box">
                        <label class="agree-label"><input type="checkbox" class="agree-item" onchange="syncAllCheckbox()"> <span class="text-red-500 font-bold">[필수]</span> 이용약관 동의</label>
                    </div>
                    <div class="agree-box">
                        <label class="agree-label"><input type="checkbox" class="agree-item" onchange="syncAllCheckbox()"> <span class="text-red-500 font-bold">[필수]</span> 개인정보 처리방침 동의</label>
                    </div>
                    <div class="agree-box">
                        <label class="agree-label"><input type="checkbox" class="agree-item" onchange="syncAllCheckbox()"> <span class="text-red-500 font-bold">[필수]</span> 수강 규정 동의</label>
                    </div>
                </div>

                <button id="submit-btn" onclick="submitEnroll()" class="w-full py-4 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-lg rounded-lg transition shadow-md">수강 신청 완료</button>
            `;
        }

        window.toggleAll = function(checked) {
            document.querySelectorAll('.agree-item').forEach(cb => cb.checked = checked);
        }

        window.syncAllCheckbox = function() {
            const items = document.querySelectorAll('.agree-item');
            const allChecked = Array.from(items).every(cb => cb.checked);
            document.getElementById('agree-all').checked = allChecked;
        }

        window.submitEnroll = async function() {
            const items = document.querySelectorAll('.agree-item');
            const allChecked = Array.from(items).every(cb => cb.checked);

            if (!allChecked) {
                alert('필수 약관에 모두 동의해야 신청할 수 있습니다.');
                return;
            }

            if (typeof currentCourse.id === 'string' && currentCourse.id.startsWith('dummy')) {
                alert('수강 신청이 완료되었습니다! (테스트 모드: 실제 DB에는 저장되지 않았습니다)');
                location.href = 'cert-detail.html?id=' + currentCourse.id;
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = '처리 중...';

            try {
                const { error } = await supabaseClient
                    .from('cert_enrollments')
                    .insert({
                        user_id: currentUser.id,
                        course_id: currentCourse.id,
                        status: 'ACTIVE',
                        payment_amount: (currentCourse.is_free ? 0 : (currentCourse.discount_price ?? currentCourse.original_price ?? 0))
                    });

                if (error) {
                    if (error.code === '23505') {
                        alert('이미 신청하신 과정입니다.');
                        location.href = 'cert-detail.html?id=' + currentCourse.id;
                        return;
                    }
                    throw error;
                }

                alert('수강 신청이 완료되었습니다!');
                location.href = 'cert-detail.html?id=' + currentCourse.id;
            } catch (error) {
                console.error('수강 신청 실패:', error);
                alert('수강 신청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                btn.disabled = false;
                btn.textContent = '수강 신청 완료';
            }
        }

        async function init() {
            await fetchCourse();
            await fetchUser();

            if (!currentUser && !(typeof currentCourse.id === 'string' && currentCourse.id.startsWith('dummy'))) {
                renderNotLoggedIn();
                return;
            }

            renderForm();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <script>
      window.BASE_PATH = '/';
    </script>
</body>
</html>
