    <style>
        /* [COMMON-VIEW-TRANSITION] 자동 생성됨 — 이 내용을 고치려면
           _partials/view-transition-css.html 파일만 고치고 build.js를 다시
           실행할 것. 절대 각 페이지에서 직접 고치지 말 것.

           ★★★ 2026-08 기준 크로스 문서 View Transition 기능을 완전히 껐음.
           이유: 헤더 안 움직임 → 서브헤더 흰 화면 → 본문 울렁임 → 헤더가
           오른쪽으로 갔다 돌아옴 → 입찰공고/구인구직 등 여전히 덜컹거림,
           이런 식으로 한 군데 고치면 다른 데서 새로운 미세한 어긋남이
           계속 튀어나왔음. 이 기능은 브라우저가 이전 페이지와 새 페이지의
           스크린샷을 직접 찍어서 애니메이션시키는 방식이라, 코드만 보고
           고치는 방식으로는 실제 브라우저에서 어떻게 보일지 확인이 안 되고
           끝없이 두더지잡기가 됨.

           그래서 아래 @view-transition 자체를 꺼서 그냥 "즉시 전환"(깜빡임
           없이 바로 바뀌는 일반적인 페이지 이동)으로 되돌림. 헤더/서브헤더가
           흔들리거나 밀리거나 울렁이는 문제가 구조적으로 있을 수 없음
           (애니메이션 자체가 없으니까). 아래의 view-transition-name /
           키프레임 코드들은 그대로 남겨뒀지만 @view-transition이 꺼져있는
           동안은 전부 아무 효과가 없음 — 나중에 다시 켜고 싶으면 아래
           @view-transition 블록의 주석만 풀면 됨. */
        /*
        @view-transition {
            navigation: auto;
        }
        */
        #main-header {
            view-transition-name: site-header;
        }
        #page-content {
            view-transition-name: page-content;
        }
        @keyframes page-content-out {
            to { opacity: 0; }
        }
        @keyframes page-content-in {
            from { opacity: 0; }
        }
        ::view-transition-old(page-content) {
            animation: 150ms ease-in both page-content-out;
        }
        ::view-transition-new(page-content) {
            animation: 200ms ease-out both page-content-in;
        }
        /* 핵심: 박스 크기/위치를 이전↔새 페이지 사이에서 자동으로
           보간(모핑)하는 기본 동작을 꺼서 "들썩임"을 없앰 */
        ::view-transition-group(page-content) {
            animation: none;
            width: 100%;
            height: 100%;
        }
        ::view-transition-group(site-header) {
            animation: none;
        }
        ::view-transition-old(site-header),
        ::view-transition-new(site-header) {
            animation: none;
        }
        /* ★ 2026-08: #sub-header-bar가 이제 header.html/header-close.html
           분할 구조 덕분에 #main-header의 "자식"으로 들어가 있음 (예전엔
           #page-content 쪽의 형제 요소였음). 그래서 따로 view-transition-name을
           줄 필요가 없어짐 — 부모인 site-header(#main-header)의 캡처 영역에
           자동으로 같이 포함됨. (오히려 여기 따로 이름을 주면 "이름표 붙은
           요소를 또 다른 이름표 붙은 요소 안에 중첩"시키는 예전에 버그났던
           패턴이 재발하니 절대 다시 추가하지 말 것 — 본문이 울렁이던 그 버그.) */
        /* 안전장치: 같은 페이지 안에서 사이드 탭(AJAX)만 바뀔 때는
           슬라이드 애니메이션이 절대 걸리지 않도록 강제로 끔.
           AJAX 탭 전환이 있는 페이지(job-list/resume-list/bid-list 등)의
           탭 전환 스크립트에서 이 클래스를 잠깐 추가했다가 제거해야 함. */
        html.no-page-transition #page-content,
        html.no-page-transition ::view-transition-group(page-content),
        html.no-page-transition ::view-transition-old(page-content),
        html.no-page-transition ::view-transition-new(page-content) {
            animation: none !important;
            transform: none !important;
        }
    </style>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 로그인 상태에 따라 헤더의 로그인/로그아웃 버튼을 갱신 ---
        // (예전엔 header.js가 이 역할을 했으나, header.js를 걷어내면서
        //  이 로직이 통째로 사라졌던 문제 수정. 페이지마다 따로 만든
        //  supabase 클라이언트(dummyStorage 사용 등)와 충돌하지 않도록,
        //  세션 확인용 클라이언트는 window.sb 하나만 공유해서 씀 —
        //  assets/js/supabase-config.js를 먼저 불러온 페이지는 그 window.sb를
        //  그대로 재사용하고, 없으면 여기서 한 번만 만듦.)
        async function ensureAuthClient() {
            if (window.sb) return window.sb;
            if (!window.supabase) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            if (!window.sb) {
                window.sb = window.supabase.createClient(
                    'https://ehrahnnowwjkgycvlbzk.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk'
                );
            }
            return window.sb;
        }

        function applyAuthUI(session) {
            document.querySelectorAll('[data-auth-btn]').forEach(btn => {
                if (session) {
                    btn.textContent = '로그아웃';
                    btn.onclick = async (e) => {
                        e.stopPropagation();
                        await window.sb.auth.signOut();
                        window.location.reload();
                    };
                } else {
                    btn.textContent = '로그인';
                    btn.onclick = () => { location.href = '../../login.html'; };
                }
            });
        }

        async function initAuthUI() {
            const client = await ensureAuthClient();
            const { data: { session } } = await client.auth.getSession();
            applyAuthUI(session);
            client.auth.onAuthStateChange((_event, session) => applyAuthUI(session));
            return session;
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // 로그인 상태가 아니면(=window.sb가 아직 없으면) 종료 (에러 방지)
            if (!window.sb) {
                return;
            }
            
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (!window.sb) return;
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await window.sb
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await window.sb
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 로그인/로그아웃 버튼 상태 갱신 후, 알림 개수 불러오기 실행
            initAuthUI().then(fetchUnreadCount).catch(console.error);

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>

    <script>
        const supabaseClient = window.sb;

        const qs = new URLSearchParams(window.location.search);
        const courseIdParam = qs.get('course_id');
        const examIdParam = qs.get('exam_id');

        let currentUser = null;
        let currentCourse = null;
        let currentEnrollment = null;
        let currentExam = null;
        let currentAttempts = [];
        let questions = [];

        let currentAttemptId = null;
        let currentQuestionIdx = 0;
        let userAnswers = {};
        let timerInterval = null;
        let remainingSeconds = 0;
        let examResult = null;
        let pendingCertPrice = null;

        const isDummyId = (id) => typeof id === 'string' && id.startsWith('dummy');

        const dummyCourse = {
            id: 'dummy-1',
            title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)',
            pass_criteria: { progress_rate: 80, exam_score: 60 }
        };

        const dummyExam = {
            id: 'dummy-exam-1',
            course_id: 'dummy-1',
            title: '기전당직실무관리사 자격 평가',
            time_limit_min: 30,
            pass_score: 60,
            max_attempts: 3,
            is_active: true
        };

        const dummyQuestions = [
            { id: 1, exam_id: 'dummy-exam-1', question_no: 1, question_text: '수변전설비의 정기 점검 주기로 가장 적절한 것은?', option_1: '매일', option_2: '주 1회', option_3: '월 1회', option_4: '연 1회', points: 20, correct_option: 3, explanation: '수변전설비는 관련 법령에 따라 월 1회 정기 점검을 실시하는 것이 일반적입니다.' },
            { id: 2, exam_id: 'dummy-exam-1', question_no: 2, question_text: '비상발전기의 정기 시운전 목적으로 가장 옳지 않은 것은?', option_1: '정전 시 즉시 가동 여부 확인', option_2: '연료 및 배터리 상태 점검', option_3: '건물 미관 개선', option_4: '부하 시험을 통한 성능 확인', points: 20, correct_option: 3, explanation: '비상발전기 시운전은 안전성과 성능 확인이 목적이며 미관과는 무관합니다.' },
            { id: 3, exam_id: 'dummy-exam-1', question_no: 3, question_text: '냉동기 운전 중 이상 진동이 발생했을 때 가장 먼저 취해야 할 조치는?', option_1: '즉시 운전 정지 후 원인 확인', option_2: '무시하고 계속 운전', option_3: '운전 속도를 높임', option_4: '다음 날 점검', points: 20, correct_option: 1, explanation: '이상 진동 발생 시 즉시 정지하여 안전을 확보하고 원인을 파악해야 합니다.' },
            { id: 4, exam_id: 'dummy-exam-1', question_no: 4, question_text: '당직 근무자의 일일 점검표 작성 시 포함되어야 할 항목이 아닌 것은?', option_1: '설비 가동 상태', option_2: '이상 발생 여부 및 조치 내용', option_3: '근무자의 개인 신상정보', option_4: '인수인계 사항', points: 20, correct_option: 3, explanation: '일일 점검표는 설비 운영과 관련된 항목으로 구성되며 개인 신상정보는 포함되지 않습니다.' },
            { id: 5, exam_id: 'dummy-exam-1', question_no: 5, question_text: '전기 고장 대응 시 가장 우선적으로 고려해야 할 사항은?', option_1: '신속한 설비 복구', option_2: '작업자 및 이용자의 안전 확보', option_3: '비용 절감', option_4: '보고서 작성', points: 20, correct_option: 2, explanation: '어떠한 고장 대응 상황에서도 안전 확보가 최우선입니다.' }
        ];

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function getPassCriteria(course) {
            let progressRate = 80, examScore = 60;
            try {
                const pc = course && course.pass_criteria;
                if (pc) {
                    progressRate = pc.progress_rate ?? 80;
                    examScore = pc.exam_score ?? 60;
                }
            } catch (e) {}
            return { progressRate, examScore };
        }

        async function fetchUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                currentUser = data ? data.user : null;
            } catch (e) {
                currentUser = null;
            }
        }

        async function fetchExamAndCourse() {
            try {
                if (examIdParam) {
                    const { data, error } = await supabaseClient
                        .from('cert_exams')
                        .select('*')
                        .eq('id', examIdParam)
                        .maybeSingle();
                    if (error) throw error;
                    if (!data) throw new Error('시험 없음');
                    currentExam = data;

                    const { data: courseData } = await supabaseClient
                        .from('cert_courses')
                        .select('*')
                        .eq('id', data.course_id)
                        .maybeSingle();
                    currentCourse = courseData || dummyCourse;
                } else if (courseIdParam) {
                    const { data: courseData, error: courseErr } = await supabaseClient
                        .from('cert_courses')
                        .select('*')
                        .eq('id', courseIdParam)
                        .maybeSingle();
                    if (courseErr) throw courseErr;
                    if (!courseData) throw new Error('과정 없음');
                    currentCourse = courseData;

                    const { data: examData, error: examErr } = await supabaseClient
                        .from('cert_exams')
                        .select('*')
                        .eq('course_id', courseIdParam)
                        .eq('is_active', true)
                        .maybeSingle();
                    if (examErr) throw examErr;
                    if (!examData) throw new Error('시험 없음');
                    currentExam = examData;
                } else {
                    throw new Error('식별자 없음');
                }
            } catch (error) {
                console.error('시험/과정 정보 조회 실패:', error);
                currentCourse = dummyCourse;
                currentExam = dummyExam;
            }
        }

        async function fetchEnrollment() {
            try {
                if (!currentUser || isDummyId(currentCourse.id)) return;
                const { data, error } = await supabaseClient
                    .from('cert_enrollments')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('course_id', currentCourse.id)
                    .maybeSingle();
                if (!error) currentEnrollment = data || null;
            } catch (error) {
                console.error('수강 정보 조회 실패:', error);
            }
        }

        async function fetchQuestions() {
            try {
                if (isDummyId(currentExam.id)) {
                    questions = dummyQuestions;
                    return;
                }
                const { data, error } = await supabaseClient
                    .from('cert_exam_questions_public')
                    .select('*')
                    .eq('exam_id', currentExam.id)
                    .order('question_no', { ascending: true });
                if (error) throw error;
                questions = (data && data.length > 0) ? data : dummyQuestions;
            } catch (error) {
                console.error('문제 조회 실패:', error);
                questions = dummyQuestions;
            }
        }

        async function fetchAttempts() {
            try {
                if (!currentUser || isDummyId(currentExam.id)) return;
                const { data, error } = await supabaseClient
                    .from('cert_exam_attempts')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('exam_id', currentExam.id)
                    .order('attempt_no', { ascending: false });
                if (!error) currentAttempts = data || [];
            } catch (error) {
                console.error('응시 기록 조회 실패:', error);
            }
        }

        function renderRoot(html) {
            document.getElementById('exam-root').innerHTML = html;
        }

        function blockedScreen(icon, title, desc, actions) {
            return `
                <div class="section-card text-center py-16">
                    <i class="fas ${icon} text-5xl text-gray-300 mb-5"></i>
                    <p class="text-xl font-bold text-gray-700 mb-2">${title}</p>
                    <p class="text-sm text-gray-500 mb-7 leading-relaxed">${desc}</p>
                    <div class="flex items-center justify-center gap-3">${actions}</div>
                </div>
            `;
        }

        function linkBtn(href, label, primary) {
            const cls = primary
                ? 'bg-[#12387a] hover:bg-[#0e2b61] text-white'
                : 'bg-gray-100 hover:bg-gray-200 text-gray-700';
            return `<a href="${href}" class="inline-block px-7 py-3 ${cls} font-bold rounded-lg transition">${label}</a>`;
        }

        function renderStartScreen() {
            const exam = currentExam;
            const attemptCount = currentAttempts.length;
            const remainingAttempts = Math.max(0, (exam.max_attempts || 0) - attemptCount);

            renderRoot(`
                <div class="section-card">
                    <div class="text-center mb-8">
                        <i class="fas fa-file-signature text-4xl text-[#12387a] mb-4"></i>
                        <h1 class="text-2xl font-black text-[#0B2A5B] mb-2">${exam.title || '자격 평가'}</h1>
                        <p class="text-sm text-gray-500">${currentCourse.title || ''}</p>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 bg-gray-50 border border-gray-100 rounded-lg p-5 text-sm">
                        <div class="text-center"><div class="text-gray-500 mb-1">문제 수</div><div class="font-black text-lg text-[#0B2A5B]">${questions.length}문항</div></div>
                        <div class="text-center"><div class="text-gray-500 mb-1">제한 시간</div><div class="font-black text-lg text-[#0B2A5B]">${exam.time_limit_min || 60}분</div></div>
                        <div class="text-center"><div class="text-gray-500 mb-1">합격 점수</div><div class="font-black text-lg text-[#0B2A5B]">${exam.pass_score || 60}점</div></div>
                        <div class="text-center"><div class="text-gray-500 mb-1">남은 응시 횟수</div><div class="font-black text-lg text-[#0B2A5B]">${remainingAttempts}회</div></div>
                    </div>

                    <div class="bg-[#fffbeb] border border-[#fde68a] rounded-lg p-5 mb-8 text-sm text-[#92400e] leading-relaxed">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        시험 시작 후에는 제한 시간 내에 모든 문제에 답변해야 합니다. 시간이 초과되면 자동으로 제출됩니다.
                        총 <b>${exam.max_attempts || 0}회</b> 중 <b>${attemptCount}회</b> 응시하였습니다.
                    </div>

                    <button id="start-exam-btn" onclick="startExam()" class="w-full py-4 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-lg rounded-lg transition shadow-md">
                        <i class="fas fa-play mr-2"></i>시험 시작
                    </button>
                </div>
            `);
        }

        async function startExam() {
            const btn = document.getElementById('start-exam-btn');
            if (btn) { btn.disabled = true; btn.textContent = '준비 중...'; }

            userAnswers = {};
            currentQuestionIdx = 0;
            remainingSeconds = (currentExam.time_limit_min || 60) * 60;

            try {
                if (isDummyId(currentExam.id) || !currentUser) {
                    currentAttemptId = 'dummy-attempt-' + Date.now();
                } else {
                    const nextAttemptNo = currentAttempts.length > 0
                        ? Math.max(...currentAttempts.map(a => a.attempt_no || 0)) + 1
                        : 1;

                    const { data, error } = await supabaseClient
                        .from('cert_exam_attempts')
                        .insert({
                            user_id: currentUser.id,
                            exam_id: currentExam.id,
                            enrollment_id: currentEnrollment.id,
                            attempt_no: nextAttemptNo
                        })
                        .select()
                        .single();

                    if (error) throw error;
                    currentAttemptId = data.id;
                }

                renderExamScreen();
                startTimer();
            } catch (error) {
                console.error('시험 시작 실패:', error);
                alert('시험을 시작하는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play mr-2"></i>시험 시작'; }
            }
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds -= 1;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert('제한 시간이 종료되어 자동으로 제출됩니다.');
                    submitExam(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const slot = document.getElementById('header-timer-slot');
            if (!slot) return;
            const warn = remainingSeconds <= 300;
            slot.innerHTML = `
                <div class="exam-timer ${warn ? 'timer-warn' : ''}">
                    <i class="fas fa-clock"></i> ${formatTime(Math.max(0, remainingSeconds))}
                </div>
            `;
        }

        function clearTimerDisplay() {
            const slot = document.getElementById('header-timer-slot');
            if (slot) slot.innerHTML = '';
        }

        function renderExamScreen() {
            const total = questions.length;
            const q = questions[currentQuestionIdx];
            const selected = userAnswers[q.id];

            const optionsHtml = [1, 2, 3, 4].map(n => {
                const text = q[`option_${n}`];
                const isSelected = selected === n;
                return `
                    <div class="option-row ${isSelected ? 'selected' : ''}" onclick="selectAnswer(${q.id}, ${n})">
                        <div class="option-num">${n}</div>
                        <div>${text}</div>
                    </div>
                `;
            }).join('');

            const navGrid = questions.map((qq, idx) => {
                const answered = userAnswers[qq.id] !== undefined;
                const isCurrent = idx === currentQuestionIdx;
                return `<div class="nav-cell ${answered ? 'answered' : ''} ${isCurrent ? 'current' : ''}" onclick="goToQuestion(${idx})">${qq.question_no}</div>`;
            }).join('');

            const answeredCount = Object.keys(userAnswers).length;

            renderRoot(`
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1 min-w-0">
                        <div class="question-card">
                            <div class="flex items-center gap-3">
                                <div class="question-no-badge">${q.question_no}</div>
                                <span class="text-sm text-gray-400 font-bold">${currentQuestionIdx + 1} / ${total} 문제 · 배점 ${q.points || 1}점</span>
                            </div>
                            <div class="question-text">${q.question_text}</div>
                            <div>${optionsHtml}</div>
                        </div>

                        <div class="flex items-center justify-between">
                            <button onclick="prevQuestion()" ${currentQuestionIdx === 0 ? 'disabled' : ''} class="px-6 py-3 bg-gray-100 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-gray-700 font-bold rounded-lg transition">
                                <i class="fas fa-chevron-left mr-1"></i> 이전 문제
                            </button>
                            <button onclick="nextQuestion()" ${currentQuestionIdx === total - 1 ? 'disabled' : ''} class="px-6 py-3 bg-gray-100 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-gray-700 font-bold rounded-lg transition">
                                다음 문제 <i class="fas fa-chevron-right ml-1"></i>
                            </button>
                        </div>
                    </div>

                    <aside class="w-full md:w-[240px] shrink-0">
                        <div class="section-card !p-5 md:sticky exam-nav-sticky">
                            <div class="text-sm font-bold text-gray-700 mb-3 flex items-center justify-between">
                                <span>문제 네비게이터</span>
                                <span class="text-[#12387a]">${answeredCount}/${total}</span>
                            </div>
                            <div class="nav-grid mb-5">${navGrid}</div>
                            <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">
                                <span class="inline-block w-3 h-3 rounded bg-[#12387a]"></span> 답변 완료
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-500 mb-5">
                                <span class="inline-block w-3 h-3 rounded bg-gray-300"></span> 미답변
                            </div>
                            <button onclick="handleSubmitClick()" class="w-full py-3 bg-[#dc2626] hover:bg-[#b91c1c] text-white font-bold rounded-lg transition">
                                <i class="fas fa-paper-plane mr-1"></i> 시험 제출
                            </button>
                        </div>
                    </aside>
                </div>
            `);
        }

        function selectAnswer(questionId, optionNum) {
            userAnswers[questionId] = optionNum;
            renderExamScreen();
        }

        function goToQuestion(idx) {
            currentQuestionIdx = idx;
            renderExamScreen();
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx -= 1;
                renderExamScreen();
            }
        }

        function nextQuestion() {
            if (currentQuestionIdx < questions.length - 1) {
                currentQuestionIdx += 1;
                renderExamScreen();
            }
        }

        function handleSubmitClick() {
            const unanswered = questions.length - Object.keys(userAnswers).length;
            if (unanswered > 0) {
                const ok = confirm(`아직 답변하지 않은 문제가 ${unanswered}개 있습니다. 그래도 제출하시겠습니까?`);
                if (!ok) return;
            } else {
                const ok = confirm('시험을 제출하시겠습니까? 제출 후에는 답안을 수정할 수 없습니다.');
                if (!ok) return;
            }
            submitExam(false);
        }

        async function submitExam(isTimeout) {
            if (timerInterval) clearInterval(timerInterval);
            clearTimerDisplay();

            const answersPayload = questions.map(q => ({
                question_id: q.id,
                selected_option: userAnswers[q.id] !== undefined ? userAnswers[q.id] : null
            }));

            renderRoot(`<div class="text-center py-24 text-gray-500 bg-white border border-gray-200 rounded"><i class="fas fa-spinner fa-spin mr-2"></i>채점 중입니다...</div>`);

            try {
                if (isDummyId(currentExam.id) || !currentUser) {
                    examResult = gradeDummyLocally(answersPayload);
                } else {
                    const { data, error } = await supabaseClient.rpc('grade_exam', {
                        p_attempt_id: currentAttemptId,
                        p_exam_id: currentExam.id,
                        p_answers: answersPayload
                    });
                    if (error) throw error;
                    examResult = data;
                }

                renderResultScreen(examResult);
            } catch (error) {
                console.error('채점 실패:', error);
                alert('채점 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                renderExamScreen();
                startTimer();
            }
        }

        function gradeDummyLocally(answersPayload) {
            let score = 0, total = 0;
            const results = questions.map(q => {
                total += q.points || 1;
                const found = answersPayload.find(a => a.question_id === q.id);
                const selected = found ? found.selected_option : null;
                const isCorrect = selected === q.correct_option;
                if (isCorrect) score += q.points || 1;
                return {
                    question_id: q.id,
                    selected,
                    correct: q.correct_option,
                    is_correct: isCorrect,
                    explanation: q.explanation
                };
            });
            const finalScore = total > 0 ? Math.round((score / total) * 1000) / 10 : 0;
            const passScore = currentExam.pass_score || 60;
            return {
                score: finalScore,
                total_points: total,
                pass_score: passScore,
                is_passed: finalScore >= passScore,
                results
            };
        }

        function renderResultScreen(result) {
            const passed = result.is_passed;

            const reviewHtml = questions.map(q => {
                const r = (result.results || []).find(x => x.question_id === q.id) || {};
                const optionText = (n) => q[`option_${n}`] || '';
                const isCorrect = r.is_correct;
                const selectedLabel = r.selected ? `${r.selected}번 (${optionText(r.selected)})` : '선택 안 함';
                const correctLabel = r.correct ? `${r.correct}번 (${optionText(r.correct)})` : '-';

                return `
                    <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="flex items-start justify-between gap-3 mb-2">
                            <div class="font-bold text-gray-800">${q.question_no}. ${q.question_text}</div>
                            <span class="shrink-0 text-xs font-bold px-3 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
                                ${isCorrect ? '정답' : '오답'}
                            </span>
                        </div>
                        <div class="text-sm text-gray-600 mb-1">내 답안: <span class="font-medium ${isCorrect ? 'text-emerald-700' : 'text-red-600'}">${selectedLabel}</span></div>
                        <div class="text-sm text-gray-600 mb-2">정답: <span class="font-medium text-[#12387a]">${correctLabel}</span></div>
                        ${r.explanation ? `<div class="text-sm text-gray-500 bg-gray-50 border border-gray-100 rounded p-3 mt-2"><i class="fas fa-lightbulb text-yellow-500 mr-1"></i> ${r.explanation}</div>` : ''}
                    </div>
                `;
            }).join('');

            const remainingAttempts = Math.max(0, (currentExam.max_attempts || 0) - (currentAttempts.length + 1));
            const certPrice = (currentCourse && currentCourse.cert_price !== undefined && currentCourse.cert_price !== null) ? currentCourse.cert_price : CERT_PAYMENT_ACCOUNT.amount;

            const heroHtml = passed ? `
                <div class="result-hero pass">
                    <i class="fas fa-trophy text-5xl text-emerald-500 mb-4"></i>
                    <h2 class="text-2xl font-black text-emerald-700 mb-2">축하합니다! 시험에 합격하셨습니다.</h2>
                    <p class="text-sm text-emerald-600 mb-5">자격증 발급을 위해 아래 계좌로 발급비를 입금해 주세요.</p>
                    <div class="text-4xl font-black text-emerald-700 mb-2">${result.score}점 <span class="text-base font-bold text-emerald-500">/ 합격 기준 ${result.pass_score}점</span></div>

                    ${renderCertAccountBox(certPrice)}
                    <p class="text-[13px] text-emerald-700 font-bold mb-5"><i class="fas fa-circle-info mr-1"></i>입금자명에 <b>본인 성명</b>을 기재해 주세요. 입금 완료 후 아래 버튼을 눌러주세요.</p>

                    <div class="flex items-center justify-center gap-3">
                        <button onclick="openIssueModal(${certPrice})" class="inline-block px-7 py-3 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold rounded-lg transition shadow-md">
                            <i class="fas fa-award mr-1"></i> 자격증 발급 신청
                        </button>
                        ${linkBtn('../mypage/my-courses.html', '내 수강 목록에서 확인', false)}
                    </div>
                </div>
            ` : `
                <div class="result-hero fail">
                    <i class="fas fa-times-circle text-5xl text-red-400 mb-4"></i>
                    <h2 class="text-2xl font-black text-red-600 mb-2">아쉽습니다. 불합격입니다</h2>
                    <p class="text-sm text-red-500 mb-5">합격 기준 점수에 도달하지 못했습니다. 남은 응시 횟수 내에 재응시할 수 있습니다.</p>
                    <div class="text-4xl font-black text-red-600 mb-2">${result.score}점 <span class="text-base font-bold text-red-400">/ 합격 기준 ${result.pass_score}점</span></div>
                    <div class="text-sm font-bold text-red-500 mb-6">남은 응시 횟수: ${remainingAttempts}회</div>
                    ${remainingAttempts > 0
                        ? linkBtn(window.location.pathname + window.location.search, '다시 응시하기', true)
                        : ''}
                </div>
            `;

            renderRoot(`
                ${heroHtml}
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-list-check"></i> 문제별 정답 리뷰</div>
                    ${reviewHtml}
                </div>
                <div class="text-center pb-4">
                    ${linkBtn(isDummyId(currentCourse.id) ? 'cert-list.html' : ('cert-detail.html?id=' + currentCourse.id), '과정 상세로 돌아가기', false)}
                </div>
            `);
        }

        function openIssueModal(certPrice) {
            const modal = document.getElementById('issue-modal');
            document.getElementById('depositor-name-input').value = '';
            pendingCertPrice = certPrice;
            const descEl = document.getElementById('issue-modal-desc');
            if (descEl) {
                descEl.innerHTML = `입금하신 <b>입금자명</b>을 입력해 주세요. (입금액: <b>${certPaymentAmountLabel(certPrice)}</b>) 관리자가 입금 확인 후 자격증을 발급해 드립니다.`;
            }
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }

        function closeIssueModal() {
            const modal = document.getElementById('issue-modal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 200);
        }

        async function submitIssueRequest() {
            const name = document.getElementById('depositor-name-input').value.trim();
            if (!name) {
                showToast('입금자명을 입력해 주세요.', 'error');
                return;
            }

            const btn = document.getElementById('issue-modal-submit');
            const originalLabel = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 처리 중...';

            try {
                if (!currentUser || isDummyId(currentCourse.id)) {
                    showToast('자격증 발급 신청이 접수되었습니다.\n입금 확인 후 발급될 예정입니다.', 'success');
                    closeIssueModal();
                    return;
                }

                const { data, error } = await supabaseClient.rpc('issue_certificate', {
                    p_course_id: currentCourse.id,
                    p_depositor_name: name
                });

                if (error) throw error;

                if (data && data.success) {
                    showToast('자격증 발급 신청이 접수되었습니다.\n입금 확인 후 발급될 예정입니다.', 'success');
                    closeIssueModal();
                } else {
                    showToast((data && data.error) || '발급 신청 중 오류가 발생했습니다.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('발급 신청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalLabel;
            }
        }

        async function init() {
            await fetchExamAndCourse();
            await fetchUser();

            const usingDummy = isDummyId(currentCourse.id) || isDummyId(currentExam.id);

            if (!currentUser && !usingDummy) {
                renderRoot(blockedScreen(
                    'fa-lock',
                    '로그인이 필요합니다',
                    '온라인 시험 응시는 로그인 후 이용할 수 있습니다.',
                    linkBtn('../../login.html', '로그인 하기', true)
                ));
                return;
            }

            await fetchEnrollment();

            if (!usingDummy) {
                if (!currentEnrollment || !['ACTIVE', 'COMPLETED'].includes(currentEnrollment.status)) {
                    renderRoot(blockedScreen(
                        'fa-user-graduate',
                        '수강 중인 과정이 아닙니다',
                        '온라인 시험은 수강 신청 후 응시할 수 있습니다.',
                        linkBtn('cert-detail.html?id=' + currentCourse.id, '과정 상세로 이동', true)
                    ));
                    return;
                }

                const { progressRate } = getPassCriteria(currentCourse);
                const myProgress = currentEnrollment.progress_rate || 0;
                if (myProgress < progressRate) {
                    renderRoot(blockedScreen(
                        'fa-chart-line',
                        '아직 수료 조건을 충족하지 않았습니다',
                        `시험 응시를 위해서는 진도율 ${progressRate}% 이상이 필요합니다. (현재 진도율: ${myProgress}%)`,
                        linkBtn('cert-player.html?course_id=' + currentCourse.id, '이어서 학습하기', true)
                    ));
                    return;
                }
            }

            await fetchQuestions();
            await fetchAttempts();

            const passedAttempt = currentAttempts.find(a => a.is_passed);
            if (passedAttempt) {
                renderRoot(blockedScreen(
                    'fa-certificate',
                    '이미 합격하셨습니다',
                    `해당 과정의 시험에 이미 합격하셨습니다. (획득 점수: ${passedAttempt.score ?? '-'}점) 자격증 발급 안내를 확인해 주세요.`,
                    linkBtn('../mypage/my-courses.html', '자격증 발급 안내 보기', true)
                ));
                return;
            }

            const maxAttempts = currentExam.max_attempts || 0;
            if (!usingDummy && maxAttempts > 0 && currentAttempts.length >= maxAttempts) {
                renderRoot(blockedScreen(
                    'fa-ban',
                    '응시 횟수를 초과했습니다',
                    `최대 응시 횟수(${maxAttempts}회)를 모두 사용하였습니다. 자세한 문의는 관리자에게 연락해 주세요.`,
                    linkBtn('cert-detail.html?id=' + currentCourse.id, '과정 상세로 이동', true)
                ));
                return;
            }

            renderStartScreen();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <script>
      window.BASE_PATH = '/';
    </script>
</body>
</html>
