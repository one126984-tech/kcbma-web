        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 30px; margin-bottom: 24px; transition: box-shadow 0.2s; }

        .detail-hero { height: 130px; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }

        .section-title { font-size: 19px; font-weight: 900; color: #12387a; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; gap: 8px; }

        .curr-table { width: 100%; border-collapse: collapse; font-size: 14px; }

        .curr-table td { padding: 12px; border-bottom: 1px solid #eef0f3; text-align: center; color: #374151; }
        .curr-table tr:hover td { background: #f8fafc; }

        .step-flow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
        .step-box { flex: 1; min-width: 150px; background: #f8fafc; border: 1px solid #e0e7ff; border-radius: 8px; padding: 20px 14px; text-align: center; transition: all 0.2s; }
        .step-box:hover { border-color: #93c5fd; transform: translateY(-2px); }
        .step-num { width: 32px; height: 32px; border-radius: 50%; background: #12387a; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .step-label { font-size: 13.5px; font-weight: 700; color: #1e3a8a; line-height: 1.4; }
        .step-arrow { color: #94a3b8; font-size: 18px; }

        .instructor-card { display: flex; gap: 20px; align-items: flex-start; }
        .instructor-photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: #e5e7eb; flex-shrink: 0; }

        .price-box-free { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 16px; }

        .progress-box-cert { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
        .progress-illust { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
        .progress-bar-track { width: 100%; height: 8px; background: #dbeafe; border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #12387a, #274bce); border-radius: 4px; transition: width 0.5s ease; }
        .cert-fee-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e5e7eb; font-size: 12.5px; color: #9ca3af; line-height: 1.6; }

        /* 공통 로딩/에러 */
        .cert-loading-box { text-align: center; padding: 96px 20px; color: #6b7280; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .cert-spinner { width: 38px; height: 38px; border: 4px solid #dbe4f5; border-top-color: #12387a; border-radius: 50%; margin: 0 auto 16px; animation: cert-spin 0.8s linear infinite; }
        @keyframes cert-spin { to { transform: rotate(360deg); } }
        .cert-error-box { text-align: center; padding: 80px 20px; color: #b91c1c; background: #fff; border: 1px solid #fecaca; border-radius: 8px; }
        .cert-error-box i { font-size: 32px; margin-bottom: 12px; display: block; }
        .cert-retry-btn { margin-top: 14px; background: #12387a; color: #fff; font-weight: 700; padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; }

        const dummyCourse = dummyCourseMap['dummy-1'];

        function statusBadgeHtml(status) {
            if (status === 'OPEN') return '<span class="bg-blue-600 text-white px-3 py-1 rounded text-[13px] font-bold">접수중</span>';
            if (status === 'CLOSED') return '<span class="bg-gray-500 text-white px-3 py-1 rounded text-[13px] font-bold">마감</span>';
            return '<span class="bg-yellow-400 text-white px-3 py-1 rounded text-[13px] font-bold">준비중</span>';
        }

        function methodLabel(method) {
            if (method === 'VOD') return '동영상(VOD)';
            if (method === 'LIVE') return '실시간(Zoom)';
            if (method === 'MIX') return '혼합형';
            return '-';
        }

        function contentTypeLabel(type) {
            if (type === 'VOD') return '<span class="text-gray-600">VOD</span>';
            if (type === 'LIVE') return '<span class="text-indigo-600 font-bold">실시간</span>';
            if (type === 'DOCUMENT') return '<span class="text-gray-600">문서</span>';
            return '-';
        }

        function priceHtml(course, enrollment) {
            let progressRate = 0;
            if (enrollment && enrollment.progress_rate !== undefined && enrollment.progress_rate !== null) {
                progressRate = Math.round(enrollment.progress_rate);
            } else if (isDummyId(course.id)) {
                progressRate = 45;
            }

            return `
                <div class="price-box-free">
                    <span class="text-[13px] text-gray-500 mr-2">수강료</span>
                    <span class="text-lg font-black text-green-600">무료 <span class="text-[12px] font-bold text-green-500">(100% 장학지원)</span></span>
                </div>

                </div>

        function resolveFallbackCourse() {
            if (courseId && dummyCourseMap[courseId]) return dummyCourseMap[courseId];
            if (courseSlug) {
                const bySlug = Object.values(dummyCourseMap).find(c => c.slug === courseSlug);
                if (bySlug) return bySlug;
            }
            return dummyCourse;
        }

        async function fetchCourse() {
            try {
                let query = supabaseClient.from('cert_courses').select('*');
                if (courseId) query = query.eq('id', courseId);
                else if (courseSlug) query = query.eq('slug', courseSlug);
                else throw new Error('식별자 없음');

                const { data, error } = await query.maybeSingle();
                if (error) throw error;

                currentCourse = data || resolveFallbackCourse();
            } catch (error) {
                console.error('과정 정보 조회 실패, 폴백 데이터로 대체합니다:', error);
                currentCourse = resolveFallbackCourse();
            }
        }

        async function fetchCurriculum() {
            try {
                const cid = currentCourse.id;
                if (typeof cid === 'string' && cid.startsWith('dummy')) {
                    return dummyCurriculumMap[cid] || dummyCurriculum;
                }
                const { data, error } = await supabaseClient
                    .from('cert_curriculum')
                    .select('*')
                    .eq('course_id', cid)
                    .order('chapter_no', { ascending: true });

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyCurriculum;
            } catch (error) {
                console.error('커리큘럼 조회 실패:', error);
                const cid = currentCourse && currentCourse.id;
                return dummyCurriculumMap[cid] || dummyCurriculum;
            }
        }

        async function fetchUserAndEnrollment() {
            try {
                const { data: userData } = await supabaseClient.auth.getUser();
                currentUser = userData ? userData.user : null;

                if (currentUser && currentCourse && typeof currentCourse.id !== 'string') {
                    const { data, error } = await supabaseClient
                        .from('cert_enrollments')
                        .select('*')
                        .eq('user_id', currentUser.id)
                        .eq('course_id', currentCourse.id)
                        .maybeSingle();

                    if (!error) currentEnrollment = data || null;
                }
            } catch (error) {
                console.error('사용자/수강 정보 조회 실패:', error);
            }
        }

        function renderEnrollButton() {
            const course = currentCourse;
            const status = course.status || 'OPEN';

            if (!currentUser) {
                return `
                    <div class="flex flex-col gap-2">
                        <button disabled class="w-full py-4 bg-gray-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">수강 신청하기</button>
                        <div class="text-center text-sm text-gray-500">로그인 후 신청 가능합니다. <a href="{{BASE}}login.html" class="text-[#12387a] font-bold underline">로그인 하기</a></div>
                    </div>
                `;
            }

            if (currentEnrollment && currentEnrollment.status === 'ACTIVE') {
                return `<button onclick="location.href='cert-player.html?course_id=${course.id}'" class="w-full py-4 bg-[#0B2A5B] hover:bg-[#153b80] text-white font-bold text-lg rounded-lg transition">수강 중입니다 - 이어서 학습하기</button>`;
            }

            if (currentEnrollment && currentEnrollment.status === 'COMPLETED') {
                return `<button onclick="location.href='cert-player.html?course_id=${course.id}'" class="w-full py-4 bg-gray-500 hover:bg-gray-600 text-white font-bold text-lg rounded-lg transition">수료 완료 - 강의 다시보기</button>`;
            }

            if (status === 'CLOSED') {
                return `<button disabled class="w-full py-4 bg-gray-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">접수 마감</button>`;
            }

            if (status === 'UPCOMING') {
                return `<button disabled class="w-full py-4 bg-yellow-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">준비중입니다</button>`;
            }

            return `<button onclick="location.href='cert-enroll.html?course_id=${course.id}'" class="w-full py-4 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-lg rounded-lg transition shadow-md">수강 신청하기</button>`;
        }

        function renderCurriculum(list) {
            const totalMin = list.reduce((sum, c) => sum + (c.duration_min || 0), 0);
            const hours = Math.floor(totalMin / 60);
            const mins = totalMin % 60;
            const totalLabel = hours > 0 ? `${hours}시간 ${mins}분` : `${mins}분`;

            const rows = list.map(c => `
                <tr>
                    <td class="font-bold text-[#12387a]">${c.chapter_no}차시</td>
                    <td class="text-left">${c.title}</td>
                    <td>${c.duration_min || 0}분</td>
                    <td>${contentTypeLabel(c.content_type)}</td>
                    <td>${c.is_preview ? '<button class="text-xs bg-[#e0e7ff] text-[#1e3a8a] font-bold px-3 py-1 rounded hover:bg-[#c7d2fe] transition">미리보기</button>' : '<span class="text-gray-300">-</span>'}</td>
                </tr>
            `).join('');

            return `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm text-gray-500">총 ${list.length}차시</span>
                    <span class="text-sm font-bold text-[#12387a]">총 강의시간 ${totalLabel}</span>

                                <th style="width:80px;">시간</th>
                                <th style="width:90px;">유형</th>
                                <th style="width:100px;">미리보기</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderInstructor(course) {
            if (!course.instructor_name) return '';
            const photo = course.instructor_img

            return `

            await render();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <script>
      window.BASE_PATH = '/';
    </script>
