    <style>
        /* [COMMON-VIEW-TRANSITION] 자동 생성됨 — 이 내용을 고치려면
           _partials/view-transition-css.html 파일만 고치고 build.js를 다시
           실행할 것. 절대 각 페이지에서 직접 고치지 말 것.

           ★★★ 2026-08 기준 크로스 문서 View Transition 기능을 완전히 껐음.
           이유: 헤더 안 움직임 → 서브헤더 흰 화면 → 본문 울렁임 → 헤더가
           오른쪽으로 갔다 돌아옴 → 입찰공고/구인구직 등 여전히 덜컹거림,
           이런 식으로 한 군데 고치면 다른 데서 새로운 미세한 어긋남이
           계속 튀어나왔음. 이 기능은 브라우저가 이전 페이지와 새 페이지의
           스크린샷을 직접 찍어서 애니메이션시키는 방식이라, 코드만 보고
           고치는 방식으로는 실제 브라우저에서 어떻게 보일지 확인이 안 되고
           끝없이 두더지잡기가 됨.

           그래서 아래 @view-transition 자체를 꺼서 그냥 "즉시 전환"(깜빡임
           없이 바로 바뀌는 일반적인 페이지 이동)으로 되돌림. 헤더/서브헤더가
           흔들리거나 밀리거나 울렁이는 문제가 구조적으로 있을 수 없음
           (애니메이션 자체가 없으니까). 아래의 view-transition-name /
           키프레임 코드들은 그대로 남겨뒀지만 @view-transition이 꺼져있는
           동안은 전부 아무 효과가 없음 — 나중에 다시 켜고 싶으면 아래
           @view-transition 블록의 주석만 풀면 됨. */
        /*
        @view-transition {
            navigation: auto;
        }
        */
        #main-header {
            view-transition-name: site-header;
        }
        #page-content {
            view-transition-name: page-content;
        }
        @keyframes page-content-out {
            to { opacity: 0; }
        }
        @keyframes page-content-in {
            from { opacity: 0; }
        }
        ::view-transition-old(page-content) {
            animation: 150ms ease-in both page-content-out;
        }
        ::view-transition-new(page-content) {
            animation: 200ms ease-out both page-content-in;
        }
        /* 핵심: 박스 크기/위치를 이전↔새 페이지 사이에서 자동으로
           보간(모핑)하는 기본 동작을 꺼서 "들썩임"을 없앰 */
        ::view-transition-group(page-content) {
            animation: none;
            width: 100%;
            height: 100%;
        }
        ::view-transition-group(site-header) {
            animation: none;
        }
        ::view-transition-old(site-header),
        ::view-transition-new(site-header) {
            animation: none;
        }
        /* ★ 2026-08: #sub-header-bar가 이제 header.html/header-close.html
           분할 구조 덕분에 #main-header의 "자식"으로 들어가 있음 (예전엔
           #page-content 쪽의 형제 요소였음). 그래서 따로 view-transition-name을
           줄 필요가 없어짐 — 부모인 site-header(#main-header)의 캡처 영역에
           자동으로 같이 포함됨. (오히려 여기 따로 이름을 주면 "이름표 붙은
           요소를 또 다른 이름표 붙은 요소 안에 중첩"시키는 예전에 버그났던
           패턴이 재발하니 절대 다시 추가하지 말 것 — 본문이 울렁이던 그 버그.) */
        /* 안전장치: 같은 페이지 안에서 사이드 탭(AJAX)만 바뀔 때는
           슬라이드 애니메이션이 절대 걸리지 않도록 강제로 끔.
           AJAX 탭 전환이 있는 페이지(job-list/resume-list/bid-list 등)의
           탭 전환 스크립트에서 이 클래스를 잠깐 추가했다가 제거해야 함. */
        html.no-page-transition #page-content,
        html.no-page-transition ::view-transition-group(page-content),
        html.no-page-transition ::view-transition-old(page-content),
        html.no-page-transition ::view-transition-new(page-content) {
            animation: none !important;
            transform: none !important;
        }
    </style>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // supabase가 없으면 함수 종료 (에러 방지)
            if (typeof supabase === 'undefined') {
                console.log("Supabase 객체를 찾을 수 없습니다. (스크립트 로딩 순서 확인 필요)");
                return;
            }
            
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (typeof supabase === 'undefined') return;
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await supabase
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 알림 개수 불러오기 실행
            fetchUnreadCount();

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>

        }

        async function fetchCourse() {
            try {
                let query = supabaseClient.from('cert_courses').select('*');
                if (courseId) query = query.eq('id', courseId);
                else if (courseSlug) query = query.eq('slug', courseSlug);
                else throw new Error('식별자 없음');

                const { data, error } = await query.maybeSingle();
                if (error) throw error;

                currentCourse = data || resolveFallbackCourse();
            } catch (error) {
                console.error('과정 정보 조회 실패, 폴백 데이터로 대체합니다:', error);
                currentCourse = resolveFallbackCourse();
            }
        }

        async function fetchCurriculum() {
            try {
                const cid = currentCourse.id;
                if (typeof cid === 'string' && cid.startsWith('dummy')) {
                    return dummyCurriculumMap[cid] || dummyCurriculum;
                }
                const { data, error } = await supabaseClient
                    .from('cert_curriculum')
                    .select('*')
                    .eq('course_id', cid)
                    .order('chapter_no', { ascending: true });

                if (error) throw error;
                return (data && data.length > 0) ? data : dummyCurriculum;
            } catch (error) {
                console.error('커리큘럼 조회 실패:', error);
                const cid = currentCourse && currentCourse.id;
                return dummyCurriculumMap[cid] || dummyCurriculum;
            }
        }

        async function fetchUserAndEnrollment() {
            try {
                const { data: userData } = await supabaseClient.auth.getUser();
                currentUser = userData ? userData.user : null;

                if (currentUser && currentCourse && typeof currentCourse.id !== 'string') {
                    const { data, error } = await supabaseClient
                        .from('cert_enrollments')
                        .select('*')
                        .eq('user_id', currentUser.id)
                        .eq('course_id', currentCourse.id)
                        .maybeSingle();

                    if (!error) currentEnrollment = data || null;
                }
            } catch (error) {
                console.error('사용자/수강 정보 조회 실패:', error);
            }
        }

        function renderEnrollButton() {
            const course = currentCourse;
            const status = course.status || 'OPEN';

            if (!currentUser) {
                return `
                    <div class="flex flex-col gap-2">
                        <button disabled class="w-full py-4 bg-gray-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">수강 신청하기</button>
                        <div class="text-center text-sm text-gray-500">로그인 후 신청 가능합니다. <a href="../../login.html" class="text-[#12387a] font-bold underline">로그인 하기</a></div>
                    </div>
                `;
            }

            if (currentEnrollment && currentEnrollment.status === 'ACTIVE') {
                return `<button onclick="location.href='cert-player.html?course_id=${course.id}'" class="w-full py-4 bg-[#0B2A5B] hover:bg-[#153b80] text-white font-bold text-lg rounded-lg transition">수강 중입니다 - 이어서 학습하기</button>`;
            }

            if (currentEnrollment && currentEnrollment.status === 'COMPLETED') {
                return `<button onclick="location.href='cert-player.html?course_id=${course.id}'" class="w-full py-4 bg-gray-500 hover:bg-gray-600 text-white font-bold text-lg rounded-lg transition">수료 완료 - 강의 다시보기</button>`;
            }

            if (status === 'CLOSED') {
                return `<button disabled class="w-full py-4 bg-gray-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">접수 마감</button>`;
            }

            if (status === 'UPCOMING') {
                return `<button disabled class="w-full py-4 bg-yellow-300 text-white font-bold text-lg rounded-lg cursor-not-allowed">준비중입니다</button>`;
            }

            return `<button onclick="location.href='cert-enroll.html?course_id=${course.id}'" class="w-full py-4 bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-lg rounded-lg transition shadow-md">수강 신청하기</button>`;
        }

        function renderCurriculum(list) {
            const totalMin = list.reduce((sum, c) => sum + (c.duration_min || 0), 0);
            const hours = Math.floor(totalMin / 60);
            const mins = totalMin % 60;
            const totalLabel = hours > 0 ? `${hours}시간 ${mins}분` : `${mins}분`;

            const rows = list.map(c => `
                <tr>
                    <td class="font-bold text-[#12387a]">${c.chapter_no}차시</td>
                    <td class="text-left">${c.title}</td>
                    <td>${c.duration_min || 0}분</td>
                    <td>${contentTypeLabel(c.content_type)}</td>
                    <td>${c.is_preview ? '<button class="text-xs bg-[#e0e7ff] text-[#1e3a8a] font-bold px-3 py-1 rounded hover:bg-[#c7d2fe] transition">미리보기</button>' : '<span class="text-gray-300">-</span>'}</td>
                </tr>
            `).join('');

            return `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm text-gray-500">총 ${list.length}차시</span>
                    <span class="text-sm font-bold text-[#12387a]">총 강의시간 ${totalLabel}</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="curr-table">
                        <thead>
                            <tr>
                                <th style="width:70px;">차시</th>
                                <th class="text-left" style="padding-left:16px;">강의 제목</th>
                                <th style="width:80px;">시간</th>
                                <th style="width:90px;">유형</th>
                                <th style="width:100px;">미리보기</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderInstructor(course) {
            if (!course.instructor_name) return '';
            const photo = course.instructor_img
                ? `<img src="${course.instructor_img}" alt="${course.instructor_name}" class="instructor-photo">`
                : `<div class="instructor-photo flex items-center justify-center text-gray-400"><i class="fas fa-user text-3xl"></i></div>`;

            return `
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-chalkboard-teacher"></i> 강사 소개</div>
                    <div class="instructor-card">
                        ${photo}
                        <div>
                            <div class="font-bold text-lg text-[#0B2A5B] mb-2">${course.instructor_name} 강사</div>
                            <div class="text-sm text-gray-600 leading-relaxed">${course.instructor_bio || '강사 소개 정보가 준비 중입니다.'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGuide(course) {
            let progressRate = 80, examScore = 60;
            try {
                const pc = course.pass_criteria;
                if (pc) {
                    progressRate = pc.progress_rate ?? 80;
                    examScore = pc.exam_score ?? 60;
                }
            } catch (e) {}

            return `
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-info-circle"></i> 수강 안내</div>
                    <div class="step-flow">
                        <div class="step-box"><div class="step-num">1</div><div class="step-label">수강 신청</div></div>
                        <div class="step-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="step-box"><div class="step-num">2</div><div class="step-label">강의 수강<br>(진도율 ${progressRate}%+)</div></div>
                        <div class="step-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="step-box"><div class="step-num">3</div><div class="step-label">온라인 시험<br>(${examScore}점+)</div></div>
                        <div class="step-arrow"><i class="fas fa-chevron-right"></i></div>
                        <div class="step-box"><div class="step-num">4</div><div class="step-label">자격증 발급</div></div>
                    </div>
                </div>
            `;
        }

        async function render() {
            const course = currentCourse;
            const curriculum = await fetchCurriculum();

            const root = document.getElementById('detail-root');
            const visual = CERT_VISUAL_MAP[course.id] || { icon: 'fa-certificate', gradient: 'linear-gradient(135deg,#12387a,#274bce)' };
            root.innerHTML = `
                <div class="detail-hero" style="background:${visual.gradient};">
                    <i class="fas ${visual.icon}"></i>
                </div>
                <div class="section-card" style="border-top-left-radius:0; border-top-right-radius:0; margin-top:-6px;">
                    <div class="flex items-center gap-3 mb-4">
                        ${statusBadgeHtml(course.status)}
                        <span class="text-sm text-gray-400"><i class="fas fa-eye mr-1"></i>조회 ${course.view_count || 0}</span>
                        <span class="text-sm text-gray-400"><i class="fas fa-user-graduate mr-1"></i>신청 ${course.enroll_count || 0}명</span>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-black text-[#0B2A5B] mb-5 leading-snug">${course.title}</h1>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-4 bg-gray-50 border border-gray-100 rounded-lg p-4 text-sm">
                        <div><div class="text-gray-500 mb-1">분야</div><div class="font-bold text-gray-800">${course.category || '-'}</div></div>
                        <div><div class="text-gray-500 mb-1">수강 방식</div><div class="font-bold text-gray-800">${methodLabel(course.edu_method)}</div></div>
                        <div><div class="text-gray-500 mb-1">수강 기간</div><div class="font-bold text-gray-800">${course.edu_period || '상시 수강'}</div></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${priceHtml(course, currentEnrollment)}</div>
                    ${renderEnrollButton()}
                </div>

                <div class="section-card">
                    <div class="section-title"><i class="fas fa-book-open"></i> 과정 소개</div>
                    <div class="text-[14.5px] leading-[1.9] text-gray-700">${course.description || '<p>과정 소개 정보가 준비 중입니다.</p>'}</div>
                    <div class="cert-fee-note">
                        <i class="fas fa-circle-info mt-[2px]"></i>
                        <span>본 과정은 수강료 없이 진행되며, 수료 및 시험 합격 후 자격증을 발급받으실 때 소정의 발급 수수료가 발생합니다.</span>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title"><i class="fas fa-list-ol"></i> 커리큘럼</div>
                    ${renderCurriculum(curriculum)}
                </div>

                ${renderInstructor(course)}

                ${renderGuide(course)}
            `;
        }

        async function init() {
            await fetchCourse();
            await fetchUserAndEnrollment();
            await render();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
