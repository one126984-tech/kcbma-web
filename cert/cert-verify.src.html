    <style>
        /* 이 페이지(자격증 진위확인) 전용 CSS */
        html, body { overflow: hidden; height: 100%; }

        .notice-box { border: 1px solid #e5e7eb; border-left: 4px solid #12387a; background: #f8fafc; padding: 25px 30px; display: flex; gap: 15px; align-items: flex-start; margin-bottom: 30px; border-radius: 6px; }
        .notice-icon-wrapper { width: 45px; height: 45px; background-color: #e0e7ff; color: #1e3a8a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .notice-content { flex: 1; }
        .notice-title { font-size: 16px; font-weight: 700; color: #12387a; margin-bottom: 12px; }
        .notice-list { list-style: none; padding: 0; margin: 0; }
        .notice-list li { position: relative; padding-left: 14px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.6; color: #4b5563; }
        .notice-list li::before { content: "-"; position: absolute; left: 0; top: 0; color: #94a3b8; font-weight: bold; }

        .search-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 30px; margin-bottom: 24px; }

        .result-card { border-radius: 8px; padding: 30px; margin-bottom: 24px; }
        .result-valid { background: #f0fdf4; border: 1px solid #86efac; }
        .result-invalid { background: #fef2f2; border: 1px solid #fca5a5; }
        .result-revoked { background: #fffbeb; border: 1px solid #fcd34d; }

        .cert-info-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .cert-info-table th { width: 130px; text-align: left; padding: 12px 10px; color: #166534; font-weight: 700; font-size: 14px; border-bottom: 1px solid #d1fae5; vertical-align: top; }
        .cert-info-table td { padding: 12px 10px; color: #1f2937; font-size: 14.5px; font-weight: 500; border-bottom: 1px solid #d1fae5; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center relative z-[800] shrink-0">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex items-center h-full">
            <div class="w-full md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide h-full">
                자격증
            </div>
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">



    <main class="flex-1 max-w-[1400px] mx-auto w-full pl-4 md:pl-5 pr-4 md:pr-8 pt-7 pb-0 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden">

        <aside class="w-full md:w-[232px] shrink-0 h-full left-scroll-area z-40">
            <div class="left-scroll-content">
                <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                    <div class="side-menu-tab" onclick="window.location.href='cert-list.html'">자격증 과정</div>
                    <div class="side-menu-tab" onclick="window.location.href='edu-field-list.html'">현장 교육</div>
                    <div class="side-menu-tab-active">진위 확인</div>
                </div>
            </div>
        </aside>

        <div class="flex-1 min-w-0 h-full main-scroll-area relative flex flex-col">

            <section class="flex-1 shrink-0 pb-8">
                <div class="notice-box">
                    <div class="notice-icon-wrapper"><i class="fas fa-shield-halved"></i></div>
                    <div class="notice-content">
                        <div class="notice-title">자격증 진위확인 서비스</div>
                        <ul class="notice-list">
                            <li>대한집합건물관리협회에서 발급한 자격증의 진위 여부를 조회할 수 있는 서비스입니다.</li>
                            <li>자격증 번호(예: KCBMA-2026-ELC-00001)를 정확히 입력해 주세요.</li>
                            <li>조회 결과는 협회 발급 기록을 기준으로 실시간으로 제공됩니다.</li>
                        </ul>
                    </div>
                </div>

                <div class="search-card shadow-sm">
                    <div class="flex flex-col md:flex-row gap-3">
                        <input id="cert-number-input" type="text" placeholder="자격증 번호를 입력하세요 (예: KCBMA-2026-ELC-00001)"
                            class="flex-1 border border-gray-300 rounded px-4 py-3 text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[#12387a] focus:border-transparent">
                        <button id="search-btn" onclick="handleSearch()" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold px-8 py-3 rounded transition-colors whitespace-nowrap">
                            <i class="fas fa-search mr-1"></i> 조회하기
                        </button>
                    </div>
                </div>

                <div id="result-area"></div>
            </section>

            <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
            <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

        </div>
    </main>

    </div>
    <!-- 핑크박스 끝 -->

    <script>
        const supabaseClient = window.sb;

        const dummyCertificates = [
            {
                cert_number: 'KCBMA-2026-ELC-00001',
                cert_name: '기전당직실무관리사',
                holder_name: '홍*동',
                status: 'ISSUED',
                issued_at: '2026-07-01T00:00:00Z',
                cert_courses: { title: '기전당직실무관리사', category: '기전' }
            },
            {
                cert_number: 'KCBMA-2026-FPE-00003',
                cert_name: '전기방재안전관리사',
                holder_name: '김*수',
                status: 'REVOKED',
                issued_at: '2026-06-15T00:00:00Z',
                cert_courses: { title: '전기방재안전관리사', category: '전기방재' }
            }
        ];

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function renderValid(cert) {
            const area = document.getElementById('result-area');
            area.innerHTML = `
                <div class="result-card result-valid shadow-sm">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-11 h-11 rounded-full bg-green-600 text-white flex items-center justify-center text-xl flex-shrink-0">
                            <i class="fas fa-check"></i>
                        </div>
                        <div>
                            <div class="font-black text-lg text-green-700">유효한 자격증입니다</div>
                            <div class="text-[13px] text-green-600">대한집합건물관리협회 공식 인증</div>
                        </div>
                    </div>
                    <table class="cert-info-table">
                        <tr><th>자격증명</th><td>${cert.cert_name || '-'}</td></tr>
                        <tr><th>자격증번호</th><td class="font-mono font-bold">${cert.cert_number}</td></tr>
                        <tr><th>취득자명</th><td>${cert.holder_name || '-'}</td></tr>
                        <tr><th>발급일</th><td>${formatDate(cert.issued_at)}</td></tr>
                        <tr><th>상태</th><td><span class="bg-green-600 text-white px-3 py-1 rounded text-[12px] font-bold">유효</span></td></tr>
                    </table>
                    <div class="mt-6 pt-5 border-t border-green-200 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#12387a] text-white flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-award"></i>
                        </div>
                        <div class="text-[13.5px] font-bold text-[#12387a]">대한집합건물관리협회 공식 인증 자격증입니다.</div>
                    </div>
                </div>
            `;
        }

        function renderRevoked(cert) {
            const area = document.getElementById('result-area');
            area.innerHTML = `
                <div class="result-card result-revoked shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-full bg-yellow-500 text-white flex items-center justify-center text-xl flex-shrink-0">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <div class="font-black text-lg text-yellow-700">해당 자격증은 취소되었습니다</div>
                            <div class="text-[13px] text-yellow-600">자격증번호: ${cert.cert_number}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInvalid() {
            const area = document.getElementById('result-area');
            area.innerHTML = `
                <div class="result-card result-invalid shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-full bg-red-600 text-white flex items-center justify-center text-xl flex-shrink-0">
                            <i class="fas fa-times"></i>
                        </div>
                        <div>
                            <div class="font-black text-lg text-red-700">해당 자격증 번호를 찾을 수 없습니다</div>
                            <div class="text-[13px] text-red-600">번호를 다시 확인한 후 조회해 주세요.</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function findCertificate(certNumber) {
            try {
                const { data, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*, cert_courses(title, category)')
                    .eq('cert_number', certNumber)
                    .maybeSingle();

                if (error) throw error;
                if (data) return data;

                return dummyCertificates.find(c => c.cert_number === certNumber) || null;
            } catch (error) {
                console.error('자격증 조회 실패:', error);
                return dummyCertificates.find(c => c.cert_number === certNumber) || null;
            }
        }

        async function handleSearch() {
            const input = document.getElementById('cert-number-input');
            const certNumber = input.value.trim();
            const area = document.getElementById('result-area');

            if (!certNumber) {
                area.innerHTML = `<div class="result-card result-invalid shadow-sm"><div class="font-bold text-red-600">자격증 번호를 입력해 주세요.</div></div>`;
                return;
            }

            area.innerHTML = '<div class="text-center py-16 text-gray-500 bg-white border border-gray-200 rounded shadow-sm">조회 중입니다...</div>';

            const cert = await findCertificate(certNumber);

            if (!cert) {
                renderInvalid();
                return;
            }

            if (cert.status === 'REVOKED') {
                renderRevoked(cert);
                return;
            }

            if (cert.status !== 'ISSUED') {
                renderInvalid();
                return;
            }

            renderValid(cert);
        }

        document.getElementById('cert-number-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
