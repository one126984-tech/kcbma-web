<!-- 파일명: cert-player.src.html — 자격증 과정 수강 화면 (2026-11 신규)
     cert_enrollments(수강 신청) + cert_curriculum(강의 목록)을 읽어 강의를 보여 줌.
     수강 중(ACTIVE)·수료(COMPLETED) 회원만 볼 수 있음. -->
<!-- @var PAGE_CLASS: page-cert -->
<!-- @var BASE: ../../ -->
<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>강의 수강 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include view-transition-css -->

<!-- @include common-css -->

    <style>
        html, body { overflow: hidden; height: 100%; }
        .pl-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; }
        .pl-title { font-size:22px; font-weight:900; color:#0B2A5B; margin:0 0 4px; }
        .pl-sub { font-size:13.5px; color:#6b7280; }
        .ch-item { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
        .ch-item:hover { background:#f8fafc; }
        .ch-item.active { background:#eef2ff; border-left:4px solid #12387a; padding-left:10px; }
        .ch-no { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:#e0e7ff; color:#1e3a8a; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
        .ch-name { font-size:14px; font-weight:700; color:#1f2937; line-height:1.45; }
        .ch-meta { font-size:12px; color:#6b7280; margin-top:2px; }
        .type-chip { display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; margin-right:4px; }
        .type-VOD { background:#eff6ff; color:#1d4ed8; }
        .type-LIVE { background:#fef2f2; color:#dc2626; }
        .type-DOCUMENT { background:#f0fdf4; color:#15803d; }
        .video-box { position:relative; width:100%; padding-top:56.25%; background:#0f172a; border-radius:10px; overflow:hidden; }
        .video-box iframe, .video-box video { position:absolute; inset:0; width:100%; height:100%; border:0; }
        .empty-box { background:#f8fafc; border:1px dashed #cbd5e1; border-radius:10px; padding:40px 20px; text-align:center; color:#475569; font-size:14.5px; line-height:1.7; }
        .pl-btn { display:inline-flex; align-items:center; gap:6px; background:#12387a; color:#fff; font-weight:800; font-size:14.5px; padding:12px 22px; border-radius:8px; text-decoration:none; }
        .pl-btn:hover { background:#0e2b61; }
        .pl-btn-gray { background:#fff; color:#374151; border:1px solid #d1d5db; }
        .pl-btn-gray:hover { background:#f3f4f6; }
        .pl-layout { display:flex; gap:20px; align-items:flex-start; }
        .pl-list { width:320px; flex-shrink:0; max-height:calc(100vh - 220px); overflow-y:auto; }
        .pl-view { flex:1; min-width:0; }
        @media (max-width: 900px) { .pl-layout { flex-direction:column-reverse; } .pl-list { width:100%; max-height:none; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center relative z-[800] shrink-0"></div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <main class="flex-1 max-w-[1400px] mx-auto w-full pl-4 md:pl-5 pr-4 md:pr-8 pt-7 pb-0 flex flex-col md:flex-row gap-4 md:gap-8 overflow-hidden">

        <aside class="w-full md:w-[232px] shrink-0 h-full left-scroll-area z-40">
            <div class="left-scroll-content">
                <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                    <div class="side-menu-tab-active" onclick="window.location.href='cert-list.html'">자격증 과정</div>
                    <div class="side-menu-tab" onclick="window.location.href='edu-field-list.html'">현장 교육</div>
                    <div class="side-menu-tab" onclick="window.location.href='cert-verify.html'">진위 확인</div>
                </div>
            </div>
        </aside>

        <div class="flex-1 min-w-0 h-full main-scroll-area relative flex flex-col">
            <section class="flex-1 shrink-0 pb-8">
                <div id="pl-head" class="mb-5">
                    <h2 id="pl-course-title" class="pl-title">강의를 불러오는 중...</h2>
                    <div id="pl-course-sub" class="pl-sub"></div>
                </div>
                <div id="pl-body"></div>
            </section>

            <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
            <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>
        </div>
    </main>
</div>

    <script>
    (function () {
        const sb = window.sb;
        const params = new URLSearchParams(location.search);
        const enrollmentId = params.get('enrollment_id');
        const courseIdParam = params.get('course_id');
        const $ = (id) => document.getElementById(id);
        let chapters = [];
        let course = null;
        let lastKey = '';

        function safeUrl(u) {
            const s = String(u || '').trim();
            return /^https?:\/\//i.test(s) ? s : '';
        }
        function youtubeEmbed(u) {
            const m = String(u).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
            return m ? 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0' : '';
        }
        function vimeoEmbed(u) {
            const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
            return m ? 'https://player.vimeo.com/video/' + m[1] : '';
        }
        function fmtDateTime(iso) {
            if (!iso) return '';
            const d = new Date(iso); if (isNaN(d)) return '';
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }
        const TYPE_LABEL = { VOD: '동영상', LIVE: '실시간 Zoom', DOCUMENT: '자료' };

        function showMessage(title, html, backHref) {
            $('pl-course-title').textContent = title;
            $('pl-course-sub').textContent = '';
            $('pl-body').innerHTML = `<div class="empty-box">${html}<div style="margin-top:18px;"><a class="pl-btn" href="${backHref || '../mypage/my-courses.html'}">내 강의실로 가기</a></div></div>`;
        }

        function renderList(activeIdx) {
            return chapters.map((c, i) => `
                <div class="ch-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}">
                    <div class="ch-no">${KC.esc(c.chapter_no || i + 1)}</div>
                    <div>
                        <div class="ch-name">${KC.esc(c.title || '제목 없음')}</div>
                        <div class="ch-meta"><span class="type-chip type-${KC.esc(c.content_type || 'VOD')}">${KC.esc(TYPE_LABEL[c.content_type] || c.content_type || '강의')}</span>${c.duration_min ? KC.esc(c.duration_min) + '분' : ''}</div>
                    </div>
                </div>`).join('');
        }

        function renderView(c) {
            const type = c.content_type || 'VOD';
            let main = '';
            const video = safeUrl(c.video_url);
            const zoom = safeUrl(c.zoom_link);
            if (type === 'LIVE') {
                const when = fmtDateTime(c.zoom_datetime);
                main = `<div class="empty-box">
                    <div style="font-size:40px;line-height:1;margin-bottom:10px;">🎥</div>
                    <div style="font-weight:800;font-size:16px;color:#0B2A5B;">실시간 Zoom 강의</div>
                    ${when ? `<div style="margin-top:6px;">강의 시간: <b>${KC.esc(when)}</b></div>` : ''}
                    <div style="margin-top:16px;">${zoom ? `<a class="pl-btn" href="${KC.esc(zoom)}" target="_blank" rel="noopener">Zoom 입장하기</a>` : '입장 링크가 아직 등록되지 않았습니다. 강의 시간 전에 다시 확인해 주세요.'}</div>
                    ${video ? `<div style="margin-top:12px;"><a class="pl-btn pl-btn-gray" href="${KC.esc(video)}" target="_blank" rel="noopener">지난 강의 다시보기</a></div>` : ''}
                </div>`;
            } else if (video) {
                const yt = youtubeEmbed(video), vm = vimeoEmbed(video);
                if (yt || vm) {
                    main = `<div class="video-box"><iframe src="${KC.esc(yt || vm)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
                } else if (/\.(mp4|webm|ogg)(\?|$)/i.test(video)) {
                    main = `<div class="video-box"><video src="${KC.esc(video)}" controls playsinline controlsList="nodownload"></video></div>`;
                } else {
                    main = `<div class="empty-box"><div style="font-size:40px;line-height:1;margin-bottom:10px;">${type === 'DOCUMENT' ? '📄' : '▶️'}</div>
                        <a class="pl-btn" href="${KC.esc(video)}" target="_blank" rel="noopener">${type === 'DOCUMENT' ? '자료 열기' : '강의 영상 열기'}</a>
                        <div style="margin-top:10px;font-size:12.5px;color:#6b7280;">새 창에서 열립니다.</div></div>`;
                }
            } else {
                main = `<div class="empty-box">이 강의의 영상(자료)이 아직 등록되지 않았습니다.<br>협회에서 준비 중이니 잠시 후 다시 확인해 주세요.</div>`;
            }
            return `<div class="pl-card" style="padding:18px;">
                <div style="margin-bottom:12px;">
                    <span class="type-chip type-${KC.esc(type)}">${KC.esc(TYPE_LABEL[type] || type)}</span>
                    <span style="font-size:13px;color:#6b7280;">${KC.esc(c.chapter_no || '')}강${c.duration_min ? ' · ' + KC.esc(c.duration_min) + '분' : ''}</span>
                    <h3 style="margin:6px 0 0;font-size:18px;font-weight:900;color:#111827;">${KC.esc(c.title || '제목 없음')}</h3>
                </div>
                ${main}
                <div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px;">
                    <button type="button" class="pl-btn pl-btn-gray" id="pl-prev">← 이전 강의</button>
                    <button type="button" class="pl-btn" id="pl-next">다음 강의 →</button>
                </div>
            </div>`;
        }

        function select(idx) {
            if (!chapters.length) return;
            idx = Math.max(0, Math.min(chapters.length - 1, idx));
            $('pl-body').innerHTML = `<div class="pl-layout">
                <div class="pl-list pl-card">${renderList(idx)}</div>
                <div class="pl-view">${renderView(chapters[idx])}</div>
            </div>`;
            document.querySelectorAll('.ch-item').forEach(el => el.addEventListener('click', () => select(Number(el.dataset.idx))));
            const prev = $('pl-prev'), next = $('pl-next');
            prev.disabled = idx === 0; prev.style.visibility = idx === 0 ? 'hidden' : '';
            next.disabled = idx === chapters.length - 1; next.style.visibility = idx === chapters.length - 1 ? 'hidden' : '';
            prev.addEventListener('click', () => select(idx - 1));
            next.addEventListener('click', () => select(idx + 1));
            try { localStorage.setItem(lastKey, String(idx)); } catch (e) {}
        }

        async function init() {
            if (!sb) { showMessage('연결 오류', '데이터베이스에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'); return; }
            const { data: { session } } = await sb.auth.getSession();
            const user = session && session.user;
            if (!user) {
                try { localStorage.setItem('returnUrl', location.pathname + location.search); } catch (e) {}
                showMessage('로그인이 필요합니다', '수강하려면 먼저 로그인해 주세요.', '{{BASE}}login.html');
                return;
            }

            let q = sb.from('cert_enrollments').select('id, status, course_id, user_id').eq('user_id', user.id);
            if (enrollmentId) q = q.eq('id', enrollmentId);
            else if (courseIdParam) q = q.eq('course_id', courseIdParam);
            else { showMessage('잘못된 접근입니다', '강의를 찾을 수 없습니다.'); return; }
            const { data: enrolls, error: eErr } = await q.limit(1);
            const enroll = enrolls && enrolls[0];
            if (eErr || !enroll) { showMessage('수강 정보가 없습니다', '이 과정을 수강 신청한 기록을 찾을 수 없습니다.<br>자격증 과정에서 먼저 수강 신청해 주세요.', 'cert-list.html'); return; }
            if (enroll.status !== 'ACTIVE' && enroll.status !== 'COMPLETED') {
                const why = enroll.status === 'PENDING_PAYMENT' ? '입금 확인 후 수강할 수 있습니다.' : '수강 기간이 끝났거나 취소된 과정입니다.';
                showMessage('지금은 수강할 수 없습니다', KC.esc(why));
                return;
            }

            const [{ data: courseRow }, { data: chs, error: cErr }] = await Promise.all([
                sb.from('cert_courses').select('id, title, category').eq('id', enroll.course_id).maybeSingle(),
                sb.from('cert_curriculum').select('*').eq('course_id', enroll.course_id).order('chapter_no', { ascending: true })
            ]);
            course = courseRow || {};
            chapters = (chs || []).slice().sort((a, b) => (a.chapter_no || 0) - (b.chapter_no || 0) || (a.sort_order || 0) - (b.sort_order || 0));
            $('pl-course-title').textContent = course.title || '자격증 과정';
            $('pl-course-sub').textContent = `${enroll.status === 'COMPLETED' ? '수료 완료 · 다시보기' : '수강 중'} · 총 ${chapters.length}강`;
            document.title = (course.title || '강의 수강') + ' | 대한집합건물관리협회';
            if (cErr || chapters.length === 0) {
                $('pl-body').innerHTML = '<div class="empty-box">아직 등록된 강의가 없습니다.<br>협회에서 강의를 준비 중이니 잠시 후 다시 확인해 주세요.</div>';
                return;
            }
            lastKey = 'cert_player_last_' + enroll.course_id;
            let start = 0;
            try { start = parseInt(localStorage.getItem(lastKey), 10) || 0; } catch (e) {}
            select(start);
        }
        init();
    })();
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>
</body>
</html>
