<!-- [COMMON-HEADER] 자동 생성됨 — 이 내용을 고치려면
         _partials/header.html 파일만 고치고 build.js를 다시 실행할 것.
         절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐). -->
<style>
  /* 1. 페이지 길이에 따른 좌우 흔들림(우측 스크롤바 생성/소멸) 원천 차단 */
  html {
    overflow-y: scroll !important;
  }

  /* 2. 헤더 내비게이션(GNB) 간섭 방지 */
  #main-header .gnb-item {
    margin: 0 !important;
    padding: 0 0 4px 0 !important;
    line-height: 1.5 !important;
    transform: none !important;
    font-size: inherit !important;
  }

  /* 3. 로그인 버튼 스타일 (자격증 페이지 등에서 버튼 크기가 작아지는 현상 방지) */
  #main-header .login-btn {
    background-color: #334155 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    padding: 7px 20px !important;
    border-radius: 4px !important;
    font-size: 14px !important;
    line-height: 1.5 !important;
    height: auto !important;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    transition: background-color 0.15s;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin: 0 0 0 4px !important;
    box-sizing: border-box !important;
    transform: none !important;
  }
  #main-header .login-btn:hover {
    background-color: #1e293b !important;
  }

  /* 4. 긴급 SOS 호출 버튼 스타일 보호 (견적의뢰 페이지 등에서 위로 움직이는 현상 방지) */
  #main-header .sos-btn {
    color: #ef4444 !important;
    font-weight: bold !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    margin: 0 0 0 8px !important;
    padding: 0 0 4px 0 !important;
    font-size: 15px !important; 
    line-height: 1.5 !important;
    transform: none !important; 
  }
  @media (min-width: 1280px) {
    #main-header .sos-btn {
      font-size: 16px !important;
    }
  }
  #main-header .sos-btn i {
    margin: 0 !important;
    padding: 0 !important;
    vertical-align: middle !important;
  }
</style>

<div class="sticky top-0 z-[1000] w-full flex flex-col bg-white border-b border-gray-200 shadow-sm shrink-0" id="main-header" style="box-sizing: border-box !important;">
    <header class="flex justify-between items-center px-4 md:px-6 max-w-[1400px] mx-auto w-full h-[70px]" style="margin: 0 auto !important; padding-top: 0 !important; padding-bottom: 0 !important;">

        <!-- 1) 좌측 로고 (흔들림 방지) -->
        <div class="flex items-center h-full cursor-pointer shrink-0 mr-4" onclick="location.href='{{BASE}}index.html'" style="margin-top: 0 !important; margin-bottom: 0 !important;">
            <img src="{{BASE}}assets/img/logo.png" class="h-[38px] md:h-[44px] w-auto object-contain" alt="대한집합건물관리협회" style="max-width: none !important; margin: 0 !important;">
        </div>

        <!-- 2) 중앙 메인 GNB (PC 메뉴 - 강제 중앙 정렬 및 정렬축 고정) -->
        <nav class="hidden lg:flex flex-1 justify-center items-center gap-6 xl:gap-9 font-medium text-[15px] xl:text-[16px] text-gray-700 whitespace-nowrap" style="justify-content: center !important; align-items: center !important; padding: 0 !important; margin: 0 !important;">
            <div data-menu="about" onclick="location.href='{{BASE}}about/about.html'" class="gnb-item nav-about cursor-pointer hover:text-[#0088cc] transition-colors">협회소개</div>
            <div data-menu="jobs" onclick="location.href='{{BASE}}jobs/job-list.html'" class="gnb-item nav-jobs cursor-pointer hover:text-[#0088cc] transition-colors">구인구직</div>
            <div data-menu="bid" onclick="location.href='{{BASE}}bid/bid-list.html'" class="gnb-item nav-bid cursor-pointer hover:text-[#0088cc] transition-colors">견적의뢰</div>
            <div data-menu="cert" onclick="location.href='{{BASE}}cert/cert-list.html'" class="gnb-item nav-cert cursor-pointer hover:text-[#0088cc] transition-colors">자격증</div>
            <div data-menu="board" onclick="location.href='{{BASE}}board/board-corner.html'" class="gnb-item nav-board cursor-pointer hover:text-[#0088cc] transition-colors">관리단 코너</div>
            <div data-menu="consulting" onclick="location.href='{{BASE}}consulting/consulting-field.html'" class="gnb-item nav-consulting cursor-pointer hover:text-[#0088cc] transition-colors">지식컨설팅</div>
            <div data-menu="community" onclick="location.href='{{BASE}}community/notice.html'" class="gnb-item nav-community cursor-pointer hover:text-[#0088cc] transition-colors">커뮤니티</div>

            <!-- 긴급 SOS 호출 -->
            <div onclick="location.href='{{BASE}}sos/sos-request.html'" class="sos-btn nav-sos cursor-pointer hover:text-[#b91c1c] transition-colors ml-2">
                <i class="fa-solid fa-phone-volume"></i>
                <span>긴급 SOS 호출</span>
            </div>
        </nav>

        <!-- 3) 우측 유틸리티 영역 (마이페이지/로그인 간격 및 크기 보호) -->
        <div class="hidden lg:flex items-center gap-4 shrink-0 ml-6 whitespace-nowrap font-medium text-gray-700" style="align-items: center !important; margin-top: 0 !important; margin-bottom: 0 !important;">
            <!-- 알림 종소리 및 드롭다운 컨테이너 -->
            <div id="bell-container" class="relative cursor-pointer flex items-center justify-center w-[36px] h-[36px] rounded-full hover:bg-gray-100 transition-colors" title="알림 확인" style="margin: 0 !important;">
                <i class="fa-regular fa-bell text-gray-700 text-[20px]" style="margin: 0 !important;"></i>
                <!-- 알림 개수 뱃지 -->
                <span id="notification-badge" class="hidden absolute top-[2px] right-[2px] flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white border-2 border-white" style="margin: 0 !important; padding: 0 !important;">
                    0
                </span>
                <!-- 알림 목록 드롭다운 창 -->
                <div id="notification-dropdown" class="absolute top-[45px] right-0 mt-2 w-72 bg-white border border-gray-200 shadow-lg rounded-md hidden z-50 text-left">
                    <div class="px-4 py-2 text-sm font-semibold text-gray-700 border-b">알림</div>
                    <ul id="notification-list" class="max-h-60 overflow-y-auto divide-y divide-gray-100 cursor-default"></ul>
                </div>
            </div>

            <div onclick="location.href='{{BASE}}mypage/dashboard.html'" class="cursor-pointer text-[15px] hover:text-[#0088cc]" style="margin: 0 !important; line-height: 1.5 !important;">마이페이지</div>
            <div id="header-login-btn" data-auth-btn="true" onclick="location.href='{{BASE}}login.html'" class="login-btn">로그인</div>
        </div>

        <button class="lg:hidden p-2 text-[#0a1931] cursor-pointer ml-auto" onclick="toggleMobileMenu()" aria-label="메뉴열기" style="margin-right: 0 !important; padding: 8px !important;">
            <svg class="pointer-events-none" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>
</div>
