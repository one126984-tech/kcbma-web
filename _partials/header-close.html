</div>

    <!-- 모바일 메뉴 -->

        <div class="absolute top-0 right-0 bottom-0 w-4/5 max-w-[320px] bg-[#0a1931] shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-4 bg-white border-b border-gray-200">
            <div class="flex items-center h-full">
                <img src="{{BASE}}assets/img/logo.png" alt="대한집합건물관리협회" class="h-[36px] w-auto object-contain" />
            </div>

            <div onclick="if(!location.pathname.endsWith('job-list.html') && !location.pathname.endsWith('resume-list.html')) location.href='{{BASE}}jobs/job-list.html'" class="cursor-pointer hover:text-[#0088cc]">구인구직</div>
            <div onclick="if(!location.pathname.endsWith('bid-list.html')) location.href='{{BASE}}bid/bid-list.html'" class="cursor-pointer hover:text-[#0088cc]">입찰공고</div>

            <div onclick="if(!location.pathname.endsWith('board-corner.html')) location.href='{{BASE}}board/board-corner.html'" class="cursor-pointer hover:text-[#0088cc]">관리단 코너</div>
            <div onclick="if(!location.pathname.endsWith('field-experience.html')) location.href='{{BASE}}community/field-experience.html'" class="cursor-pointer hover:text-[#0088cc]">커뮤니티</div>

            <!-- 모바일 긴급 SOS 호출 -->
            <div onclick="if(!location.pathname.endsWith('sos-request.html')) location.href='{{BASE}}sos/sos-request.html'" class="sos-btn sos-btn-mobile">
                <i class="fa-solid fa-phone-volume" style="font-size:13px;"></i>
                <span>긴급 SOS 호출</span>
            </div>

            <div class="p-6 bg-[#061124] space-y-3 text-[14px] font-medium text-center text-gray-300">
            <div class="flex gap-2 w-full">
                <!-- 모바일 알림 버튼 -->
                <div class="flex-1 py-3 bg-[#1e293b] text-white rounded-lg cursor-pointer hover:bg-gray-800 transition-colors relative">
                    <i class="fa-regular fa-bell mr-1"></i> 알림
                    <!-- 모바일 알림 개수 뱃지 (초기 숨김) -->
                    <span id="mobile-notification-badge" class="hidden absolute top-1 right-2 bg-red-500 text-white text-[10px] px-[5px] py-[2px] rounded-full leading-none border border-[#1e293b]">
                        0
                    </span>
                </div>
                <div onclick="goToMypage()" class="flex-1 py-3 mypage-btn-mobile rounded-lg cursor-pointer">마이페이지</div>
            </div>
            <div id="header-login-btn-mobile" data-auth-btn="true" onclick="location.href='{{BASE}}login.html'" class="w-full py-2.5 mt-2 border border-gray-600 hover:text-white hover:bg-gray-800 rounded-lg cursor-pointer transition-colors">로그인</div>
            </div>
        </div>

    <!-- 마이페이지 로그인 안내 팝업 (비로그인 상태에서 마이페이지 클릭 시) -->
    <div id="mypage-login-prompt" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-[360px] w-full p-6 text-center">
            <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-blue-50 flex items-center justify-center text-[#12387a] text-xl">
                <i class="fas fa-user-lock"></i>
            </div>
            <p class="text-[15px] font-bold text-gray-800 mb-1">먼저 로그인 후 사용 가능합니다.</p>
            <p class="text-[13px] text-gray-500 mb-6">마이페이지는 로그인한 회원만 이용할 수 있어요.</p>
            <div class="flex gap-2">
                <button type="button" onclick="closeMypageLoginPrompt()" class="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-lg text-[14px] hover:bg-gray-50">취소</button>
                <button type="button" onclick="confirmMypageLogin()" class="flex-1 bg-[#12387a] text-white font-bold py-2.5 rounded-lg text-[14px] hover:bg-[#0e2b61]">로그인</button>
            </div>
        </div>
    </div>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 로그인 상태에 따라 헤더의 로그인/로그아웃 버튼을 갱신 ---
        // (예전엔 header.js가 이 역할을 했으나, header.js를 걷어내면서
        //  이 로직이 통째로 사라졌던 문제 수정. 페이지마다 따로 만든
        //  supabase 클라이언트(dummyStorage 사용 등)와 충돌하지 않도록,
        //  세션 확인용 클라이언트는 window.sb 하나만 공유해서 씀 —
        //  assets/js/supabase-config.js를 먼저 불러온 페이지는 그 window.sb를
        //  그대로 재사용하고, 없으면 여기서 한 번만 만듦.)
        async function ensureAuthClient() {
            if (window.sb) return window.sb;
            if (!window.supabase) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            if (!window.sb) {
                window.sb = window.supabase.createClient(
                    'https://ehrahnnowwjkgycvlbzk.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk'
                );
            }
            return window.sb;
        }

        // --- 마이페이지 클릭: 로그인 상태면 바로 이동, 아니면 "마이페이지 클릭 -> 마이페이지 화면(X)"
        //     대신 안내 팝업(로그인/취소)부터 띄운다. 마이페이지 화면이 잠깐 보였다가
        //     사라지는 흔들림을 막기 위해, 애초에 마이페이지로 이동 자체를 안 함. ---
        async function goToMypage() {
            if (location.pathname.endsWith('dashboard.html')) return; // 이미 마이페이지면 아무 것도 안 함(기존과 동일)
            const client = await ensureAuthClient();
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                location.href = '{{BASE}}mypage/dashboard.html';
            } else {
                document.getElementById('mypage-login-prompt').classList.remove('hidden');
            }
        }
        function closeMypageLoginPrompt() {
            document.getElementById('mypage-login-prompt').classList.add('hidden');
        }
        function confirmMypageLogin() {
            // 로그인 완료 후 다시 마이페이지로 돌아오도록 사이트 루트 기준 절대경로로 저장
            // (login.html이 여러 깊이의 페이지에서 열릴 수 있어 {{BASE}} 상대경로는 여기선 쓸 수 없음)
            localStorage.setItem('returnUrl', '/mypage/dashboard.html');
            location.href = '{{BASE}}login.html';
        }

        function applyAuthUI(session) {
            document.querySelectorAll('[data-auth-btn]').forEach(btn => {
                if (session) {
                    btn.textContent = '로그아웃';
                    btn.onclick = async (e) => {
                        e.stopPropagation();
                        await window.sb.auth.signOut();
                        window.location.reload();
                    };
                } else {
                    btn.textContent = '로그인';
                    btn.onclick = () => { location.href = '{{BASE}}login.html'; };
                }
            });
        }

        async function initAuthUI() {
            const client = await ensureAuthClient();
            const { data: { session } } = await client.auth.getSession();
            applyAuthUI(session);
            client.auth.onAuthStateChange((_event, session) => applyAuthUI(session));
            return session;
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // 로그인 상태가 아니면(=window.sb가 아직 없으면) 종료 (에러 방지)
            if (!window.sb) {
                return;
            }
            
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (!window.sb) return;
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await window.sb
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await window.sb
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 로그인/로그아웃 버튼 상태 갱신 후, 알림 개수 불러오기 실행
            initAuthUI().then(fetchUnreadCount).catch(console.error);

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>
