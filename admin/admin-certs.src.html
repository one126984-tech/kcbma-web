<html lang="ko" translate="no">

<!-- @include common-css -->

    <style>
        /* 이 페이지(자격증 발급 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }

        .filter-table { width: 100%; border-top: 2px solid #e5e7eb; background: #fff; border-collapse: collapse; margin-bottom: 15px; }
        .filter-table th { background: #f9fafb; color: #1e3a8a; font-weight: bold; width: 80px; min-width: 80px; text-align: center; border-bottom: 1px dashed #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 15px; padding: 16px 5px; vertical-align: middle; }
        .filter-table td { padding: 16px 20px; border-bottom: 1px dashed #e5e7eb; font-size: 14px; vertical-align: middle; }

        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 8px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: #f8fafc; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-confirm { background: #dbeafe; color: #1e40af; }
        .btn-confirm:hover { background: #bfdbfe; }
        .btn-issue { background: #dcfce7; color: #166534; }
        .btn-issue:hover { background: #bbf7d0; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }
        .btn-disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">
        <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex gap-4 md:gap-8 items-center">
            <div class="md:w-[220px] shrink-0 text-white font-bold text-xl md:text-2xl flex items-center justify-center tracking-wide">
                관리자
            </div>
        </div>
    </div>
<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class=\"side-menu-tab\" onclick=\"window.location.href='admin-field-courses.html'\">현장 교육 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab-active">자격증 발급</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">자격증 발급 관리</div>

            <table class="filter-table shadow-sm">
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">상태</th>
                    <td style="border-bottom: 2px solid #e5e7eb;">
                        <div class="flex gap-5 flex-wrap">
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ALL" checked onchange="applyFilters()"> 전체</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="PENDING_PAYMENT" onchange="applyFilters()"> 입금대기</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="PAYMENT_CONFIRMED" onchange="applyFilters()"> 입금확인</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ISSUED" onchange="applyFilters()"> 발급완료</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="REVOKED" onchange="applyFilters()"> 취소/반려</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">검색</th>
                    <td style="background-color: #f8fafc;">
                        <div class="flex gap-2">
                            <input type="text" id="search-keyword" placeholder="자격증번호 또는 취득자명 입력" class="flex-1 max-w-[320px] border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" onkeydown="if(event.key==='Enter') applyFilters()">
                            <button onclick="applyFilters()" class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13px] py-2 px-4 rounded transition-colors"><i class="fas fa-search mr-1"></i>검색</button>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="section-card">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>자격증번호</th>
                                <th>자격증명</th>
                                <th>취득자명</th>
                                <th>과정명</th>
                                <th>입금자명</th>
                                <th>결제금액</th>
                                <th>신청/발급일</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="cert-list-body">
                            <tr><td colspan="10"><div class="cert-loading-box"><div class="cert-spinner"></div><p>데이터를 불러오는 중입니다...</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let allCerts = [], filteredCerts = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function certStatusBadge(status) {
            if (status === 'ISSUED') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">발급완료</span>';
            if (status === 'PAYMENT_CONFIRMED') return '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[11px] font-bold">입금확인</span>';
            if (status === 'PENDING_PAYMENT') return '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[11px] font-bold">입금대기</span>';
            if (status === 'REVOKED') return '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[11px] font-bold">취소/반려</span>';
            return '<span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[11px] font-bold">-</span>';
        }

        const dummyCerts = [
            { id: 'dc1', cert_number: 'KCBMA-2026-ELC-00038', cert_name: '전기방재안전관리사', holder_name: '김민수', status: 'ISSUED', issued_at: '2026-08-14T00:00:00Z', created_at: '2026-08-10T00:00:00Z', depositor_name: '김민수', payment_amount: 250000, cert_courses: { title: '전기방재안전관리사 실시간 화상 강의 과정' } },
            { id: 'dc2', cert_number: 'KCBMA-2026-MEC-00037', cert_name: '기계설비유지관리사', holder_name: '이영희', status: 'ISSUED', issued_at: '2026-08-13T00:00:00Z', created_at: '2026-08-09T00:00:00Z', depositor_name: '이영희', payment_amount: 250000, cert_courses: { title: '기계설비유지관리사 이론 및 실무 종합과정' } },
            { id: 'dc3', cert_number: null, cert_name: '배관시설관리사', holder_name: '박준호', status: 'PAYMENT_CONFIRMED', issued_at: null, created_at: '2026-08-12T00:00:00Z', depositor_name: '박준호', payment_amount: 250000, cert_courses: { title: '배관시설관리사 실무 심화과정' } },
            { id: 'dc4', cert_number: null, cert_name: '영선실무관리사', holder_name: '최수진', status: 'REVOKED', issued_at: null, created_at: '2026-08-11T00:00:00Z', depositor_name: '최수진', payment_amount: 250000, cert_courses: { title: '영선실무관리사 자격증 취득 과정' } },
            { id: 'dc5', cert_number: null, cert_name: '기전당직실무관리사', holder_name: '정우성', status: 'PENDING_PAYMENT', issued_at: null, created_at: '2026-08-15T00:00:00Z', depositor_name: '정우성', payment_amount: 250000, cert_courses: { title: '기전당직실무관리사 자격 취득 과정' } }
        ];

        async function fetchCerts() {
            const tbody = document.getElementById('cert-list-body');
            tbody.innerHTML = '<tr><td colspan="10"><div class="cert-loading-box"><div class="cert-spinner"></div><p>데이터를 불러오는 중입니다...</p></div></td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_certificates')
                    .select('*, cert_courses(title)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allCerts = (data && data.length > 0) ? data : dummyCerts;
                applyFilters();
            } catch (e) {
                console.error('자격증 목록 조회 실패:', e);
                allCerts = dummyCerts;
                applyFilters();
            }
        }

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'ALL';
        }

        function applyFilters() {
            const status = getRadioValue('status_filter');
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredCerts = allCerts.filter(item => {
                const matchStatus = status === 'ALL' || item.status === status;
                const matchKeyword = !keyword
                    || (item.cert_number || '').toLowerCase().includes(keyword)
                    || (item.holder_name || '').toLowerCase().includes(keyword)
                    || (item.depositor_name || '').toLowerCase().includes(keyword);
                return matchStatus && matchKeyword;
            });

            renderCerts();
        }

        function manageButtons(item) {
            if (item.status === 'PENDING_PAYMENT') {
                return `
                    <div class="flex gap-1.5 justify-center">
                        <span class="btn-manage btn-confirm" onclick="confirmPayment('${item.id}')"><i class="fas fa-check mr-1"></i>입금 확인</span>
                        <span class="btn-manage btn-delete" onclick="rejectRequest('${item.id}')">반려</span>
                    </div>
                `;
            }
            if (item.status === 'PAYMENT_CONFIRMED') {
                return `
                    <div class="flex gap-1.5 justify-center">
                        <span class="btn-manage btn-issue" onclick="finalizeIssue('${item.id}')"><i class="fas fa-award mr-1"></i>발급 처리</span>
                        <span class="btn-manage btn-delete" onclick="rejectRequest('${item.id}')">반려</span>
                    </div>
                `;
            }
            if (item.status === 'ISSUED') {
                return '<span class="btn-manage btn-delete" onclick="revokeCert(\'' + item.id + '\')">발급취소</span>';
            }
            return '<span class="btn-manage btn-disabled">처리완료</span>';
        }

        function renderCerts() {
            const tbody = document.getElementById('cert-list-body');

            if (!filteredCerts || filteredCerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="py-14 text-gray-400">조건에 맞는 자격증이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredCerts.map((item, idx) => {
                const course = item.cert_courses || {};
                const dateLabel = item.status === 'ISSUED' ? formatDate(item.issued_at) : formatDate(item.created_at);
                return `
                <tr>
                    <td class="text-gray-400">${idx + 1}</td>
                    <td class="font-bold text-[#12387a]">${item.cert_number || '-'}</td>
                    <td class="text-left font-medium text-[#0B2A5B]">${item.cert_name || '-'}</td>
                    <td>${item.holder_name || '-'}</td>
                    <td class="text-left text-gray-600">${course.title || '-'}</td>
                    <td>${item.depositor_name || '-'}</td>
                    <td class="text-gray-600">${(item.payment_amount || 250000).toLocaleString()}원</td>
                    <td class="text-gray-500">${dateLabel}</td>
                    <td>${certStatusBadge(item.status)}</td>
                    <td>${manageButtons(item)}</td>
                </tr>
            `;
            }).join('');
        }

        async function confirmPayment(id) {
            if (!confirm('입금을 확인하셨습니까? 확인 시 상태가 "입금확인"으로 변경됩니다.')) return;
            try {
                const { data, error } = await supabaseClient.rpc('confirm_certificate_payment', { p_cert_id: id });
                if (error) throw error;
                if (!data || data.success === false) {
                    showToast((data && data.error) || '처리에 실패했습니다.', 'error');
                    return;
                }
                showToast('입금이 확인되었습니다.', 'success');
                fetchCerts();
            } catch (e) {
                console.error('입금 확인 처리 실패:', e);
                showToast('처리 중 오류가 발생했습니다.', 'error');
            }
        }

        async function finalizeIssue(id) {
            if (!confirm('자격증을 발급 처리하시겠습니까? 발급 시 자격증 번호가 자동 생성됩니다.')) return;
            try {
                const { data, error } = await supabaseClient.rpc('finalize_certificate_issue', { p_cert_id: id });
                if (error) throw error;
                if (!data || data.success === false) {
                    showToast((data && data.error) || '발급 처리에 실패했습니다.', 'error');
                    return;
                }
                showToast(`자격증이 발급되었습니다.\n자격증 번호: ${data.cert_number}`, 'success');
                fetchCerts();
            } catch (e) {
                console.error('자격증 발급 처리 실패:', e);
                showToast('발급 처리 중 오류가 발생했습니다.', 'error');
            }
        }

        async function rejectRequest(id) {
            if (!confirm('이 발급 신청을 반려하시겠습니까?')) return;
            try {
                const { data, error } = await supabaseClient.rpc('reject_certificate_request', { p_cert_id: id });
                if (error) throw error;
                if (!data || data.success === false) {
                    showToast((data && data.error) || '반려 처리에 실패했습니다.', 'error');
                    return;
                }
                showToast('발급 신청이 반려되었습니다.', 'success');
                fetchCerts();
            } catch (e) {
                console.error('반려 처리 실패:', e);
                showToast('반려 처리 중 오류가 발생했습니다.', 'error');
            }
        }

        async function revokeCert(id) {
            if (!confirm('이 자격증을 취소하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_certificates').update({ status: 'REVOKED' }).eq('id', id);
                if (error) throw error;
                showToast('자격증이 취소되었습니다.', 'success');
                fetchCerts();
            } catch (e) {
                console.error('자격증 취소 실패:', e);
                showToast('취소 중 오류가 발생했습니다.', 'error');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCerts();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
