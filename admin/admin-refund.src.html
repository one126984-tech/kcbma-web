<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS 환불 관리 대시보드 | 관리자</title>

<!-- @include critical-css -->

  <style>
      #admin-top-banner { background-color: #1f2937; }
      .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden !important; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include view-transition-css -->
<!-- @include common-css -->
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}} bg-gray-100">

<!-- @include header -->
    <div id="sticky-top-bar" class="w-full flex flex-col shrink-0 bg-transparent z-[900]">
        <div id="sub-header-bar" class="w-full bg-[#1f2937] flex items-center shadow-md text-white font-bold px-4 py-3">
            관리자 시스템
        </div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0 relative">
    <main id="main-content" class="flex-1 w-full overflow-y-auto custom-scroll bg-gray-100 p-6">
        <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            
            <div id="admin-top-banner" class="text-white py-5 px-6 flex items-center justify-between">
                <h1 class="text-xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice-dollar text-yellow-400"></i> 포인트 환불 관리
                </h1>
                <button onclick="fetchRefundRequests()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-bold transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 새로고침
                </button>
            </div>

            <div class="p-6">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b-2 border-gray-200 text-gray-700 text-sm">
                                <th class="py-3 px-4 font-bold">접수일시</th>
                                <th class="py-3 px-4 font-bold">요청자 ID</th>
                                <th class="py-3 px-4 font-bold">상황 / 지역</th>
                                <th class="py-3 px-4 font-bold text-right">환불요청액</th>
                                <th class="py-3 px-4 font-bold text-center">처리</th>
                            </tr>
                        </thead>
                        <tbody id="refund-list-body" class="text-sm divide-y divide-gray-100">
                            <tr>
                                <td colspan="5" class="text-center py-10 text-gray-400 font-bold">목록을 불러오는 중입니다...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    const supabaseClient = window.sb;

    async function fetchRefundRequests() {
        const tbody = document.getElementById('refund-list-body');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>조회 중...</td></tr>';

        try {
            const { data, error } = await supabaseClient
                .from('sos_requests')
                .select(`
                    id, created_at, user_id, category, region, status, refund_reason, refund_requested_at,
                    sos_transactions ( amount )
                `)
                .eq('status', 'refund_requested')
                .eq('sos_transactions.transaction_type', 'deduct');

            if (error) throw error;

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500 font-bold">현재 처리할 환불 요청이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(req => {
                const date = new Date(req.created_at).toLocaleString('ko-KR');
                const amount = req.sos_transactions?.[0]?.amount || 0;
                
                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-4 px-4 text-gray-600">${date}</td>
                        <td class="py-4 px-4 text-gray-900 font-medium text-xs">${req.user_id.slice(0, 8)}...</td>
                        <td class="py-4 px-4">
                            <span class="font-bold text-gray-800">${KC.esc(req.category || '기타')}</span><br>
                            <span class="text-xs text-gray-500">${KC.esc(req.region || '-')}</span>
                            ${req.refund_reason ? `<div class="text-xs mt-1" style="color:#b45309;">요청 사유: ${KC.esc(req.refund_reason)}${req.refund_requested_at ? ` <span class="text-gray-400">(${new Date(req.refund_requested_at).toLocaleString('ko-KR')})</span>` : ''}</div>` : ''}
                        </td>
                        <td class="py-4 px-4 text-right font-black text-red-600">${amount.toLocaleString()}원</td>
                        <td class="py-4 px-4 text-center">
                            <button onclick="approveRefund('${KC.esc(req.id)}', '${KC.esc(req.user_id)}', ${amount})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-xs transition shadow-sm">
                                환불 승인
                            </button>
                            <button onclick="rejectRefund('${KC.esc(req.id)}')" style="margin-top:6px;" class="bg-white hover:bg-gray-50 text-gray-600 border border-gray-300 px-4 py-2 rounded-lg font-bold text-xs transition">
                                반려
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

        } catch (err) {
            console.error('목록 조회 오류:', err);
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-red-500 font-bold">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
        }
    }

    async function approveRefund(requestId, userId, amount) {
        if (!confirm(`해당 접수건에 대해 ${amount.toLocaleString()}원 포인트 환불을 승인하시겠습니까?`)) return;

        try {
            const { error } = await supabaseClient.rpc('process_manual_refund', {
                p_request_id: requestId,
                p_user_id: userId,
                p_amount: amount
            });

            if (error) {
                if (error.message.includes('ALREADY_REFUNDED')) {
                    alert('이미 환불 처리가 완료된 건입니다.');
                } else if (error.message.includes('NOTHING_TO_REFUND')) {
                    alert('이 건은 환불할 차감 금액이 없습니다.');
                } else if (error.message.includes('NOT_REFUND_REQUESTED')) {
                    alert('환불 요청 상태가 아닌 건입니다. 목록을 새로 고칩니다.');
                } else {
                    throw error;
                }
            } else {
                alert('환불 승인 및 포인트 복구가 완료되었습니다.');
            }
            fetchRefundRequests(); 
        } catch (err) {
            console.error('환불 승인 오류:', err);
            alert('환불 처리 중 시스템 오류가 발생했습니다.');
        }
    }

    // ★ 2026-11: 환불 반려 (접수 건은 요청 전 상태로 돌아가고, 반려 사유가 회원 '내 SOS 내역'에 보임)
    async function rejectRefund(requestId) {
        const reason = prompt('반려 사유를 적어 주세요. (회원 화면에 그대로 보입니다)', '협회 확인 결과 환불 대상이 아닙니다.');
        if (reason === null) return;
        try {
            const { error } = await supabaseClient.rpc('admin_reject_sos_refund', { p_request_id: requestId, p_reason: reason });
            if (error) {
                if (error.message.includes('NOT_REFUND_REQUESTED')) alert('이미 처리된 건입니다.');
                else if (error.message.includes('NOT_ADMIN')) alert('관리자만 처리할 수 있습니다.');
                else throw error;
            } else {
                alert('반려했습니다.');
            }
            fetchRefundRequests();
        } catch (err) {
            console.error('환불 반려 오류:', err);
            alert('반려 처리 중 오류가 발생했습니다.');
        }
    }

    document.addEventListener('DOMContentLoaded', fetchRefundRequests);
</script>
</body>
</html>
