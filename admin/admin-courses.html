    <style>
        /* [COMMON-CSS-CRITICAL] 자동 생성됨 — 이 내용을 고치려면
           _partials/critical-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐).

           ⚠ 여기에 opacity 0→1 페이드 같은 "로딩 후 서서히 나타내기" 트릭을
              다시 넣지 말 것. resume-list.html 원본 주석에 남아있듯,
              그런 트릭을 View Transition(아래 view-transition-css 파샬)과
              같이 쓰면 "이중 페이드"로 오히려 흰 화면이 더 도드라져 보이는
              버그가 실제로 있었음. 이 파일은 순수 배경색 즉시 고정 용도로만
              쓸 것. */
        #main-header { background-color: #ffffff; }
        #sub-header-bar {
            background-color: #12387a; height: 56px;
            /* ★ 2026-08: 이제 #sub-header-bar는 header.html/header-close.html
               분할 덕분에 #main-header의 "자식"으로 들어가 있어서 (예전엔
               형제 요소였음) 따로 sticky를 줄 필요가 없어짐 — 부모인
               #main-header가 통째로 sticky라 자동으로 같이 고정됨.
               (예전에 시도했던 position:sticky 오버라이드는 제거함) */
        }

        /* ★★★ 2026-08 추가 → 이후 되돌림: Tailwind CDN 스크립트가 렌더링을
           막고있는 동안(로드 전) 페이지가 스타일 없이 날것으로 보이는 문제를
           고치려고 script에 defer를 붙여봤었는데, 그러면 오른쪽 유틸리티
           영역(알림·마이페이지·로그인)처럼 이 스킈레톤이 못 커버한 부분이
           Tailwind 로드 전에 잠깐 글자가 겹쳐 보이는 "새로운" 버그가 생겨서
           defer는 다시 뺐음 (지금은 원래대로 blocking script).

           ★★★ 2026-08 추가 업데이트: 위 문제 자체가 이제 근본적으로 해결됨.
           Tailwind CDN <script> 태그를 전부 걷어내고, 미리 빌드해둔 정적
           파일(assets/css/tailwind.css)을 <link rel="stylesheet">로 불러오는
           방식으로 교체함 (tailwind.config.js 참고). 이제 "CDN이 다운로드/
           실행되길 기다리는 시간"이 아예 없어서 이 스킈레톤 CSS는 실질적으로
           불필요해졌지만, 혹시 모를 안전망으로 그냥 남겨둠 (있어도 무해함 —
           .css 파일과 값이 같아서 중복 적용일 뿐). */
        #main-header header {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto; width: 100%; height: 70px;
            padding: 0 16px;
        }
        #main-header nav {
            display: none; flex: 1; justify-content: space-between; align-items: center;
            padding: 0 24px; white-space: nowrap;
        }
        @media (min-width: 1024px) {
            #main-header nav { display: flex; }
        }
        #main-header .sos-btn {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        #main-header > header > button { display: block; }
        @media (min-width: 1024px) {
            #main-header > header > button { display: none; }
        }
        #sub-header-bar {
            display: flex; align-items: center; width: 100%;
        }
        #sub-header-bar > div {
            max-width: 1400px; margin: 0 auto; width: 100%;
            display: flex; align-items: center; height: 100%; padding: 0 16px;
        }

        /* ★ 2026-08 추가: 좌측 사이드 탭 메뉴(.side-menu-tab / .side-menu-tab-active)를
           common-css.html이 아니라 여기(critical-css)에도 미리 정의해둠.
           이 두 클래스는 원래 common-css.html에만 있었는데, common-css는 문서
           순서상 Tailwind CDN <script> 태그보다 "뒤"에 온다. Tailwind CDN
           스크립트는 렌더링을 막는(blocking) 스크립트라서, 그게 다운로드/실행
           되는 동안에는 아직 뒤에 있는 common-css의 <style>이 파싱되기 전이라
           활성 탭(파란 배경)이 잠깐 "흰색"으로 보였다가 그 직후 파란색으로
           바뀌는 깜빡임이 있었음. Tailwind 스크립트보다 앞에 오는 이 파일에
           동일한 규칙을 미리 넣어두면, 첫 렌더링부터 바로 파란색으로 나와서
           깜빡임이 없어짐 (common-css.html 쪽 정의는 그대로 둬도 무해 — 값이
           같아서 중복 적용일 뿐 충돌 없음). */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }
    </style>

    <style>
        /* [COMMON-CSS] 자동 생성됨 — 이 내용을 고치려면
           _partials/common-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐). */

        html, body { overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 56px; }

        /* ★ 사이드 탭 메뉴 — 패턴 A: AJAX 탭 전환용 (job-list / resume-list) */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        /* ★ 사이드 탭 메뉴 — 패턴 B: 목록형 (bid-list / field-experience 등)
           패턴 A와 이름/스타일이 다름. 두 패턴이 실제로 공존 중이라 둘 다 남겨둠.
           (장기적으로는 하나로 통일하는 걸 권장 — README 참고) */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        .side-menu-active-wrapper { padding: 10px; }

        /* ★ 좌측 메뉴 독립 스크롤 (스크롤바 왼쪽 배치) — cert-list/field-experience/dashboard 공통 */
        .left-scroll-area {
            direction: rtl;
            overflow-y: auto;
            height: 100%;
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        /* ★ 우측 본문 영역 독립 스크롤 */
        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }

        /* 스크롤바 숨김 유틸리티 */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* -------------------------------------
           공통 헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }
    </style>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // 현재 페이지에 해당하는 GNB 메뉴를 파란색으로 강조 + 헤더 높이 계산
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }
        });
    </script>

    <script>
        const supabaseClient = window.sb;
        let allCourses = [], filteredCourses = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '../../index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function statusBadge(status) {
            if (status === 'OPEN') return '<span class="bg-blue-600 text-white px-2 py-0.5 rounded text-[11px] font-bold">접수중</span>';
            if (status === 'CLOSED') return '<span class="bg-gray-500 text-white px-2 py-0.5 rounded text-[11px] font-bold">마감</span>';
            return '<span class="bg-yellow-400 text-white px-2 py-0.5 rounded text-[11px] font-bold">준비중</span>';
        }

        function methodText(method) {
            if (method === 'VOD') return '동영상(VOD)';
            if (method === 'LIVE') return '실시간(Zoom)';
            if (method === 'MIX') return '혼합형';
            return '-';
        }

        const dummyCourses = [
            { id: 'dummy-1', title: '기전당직실무관리사 자격 취득 과정 (2026년 상반기)', category: '기전', edu_method: 'VOD', status: 'OPEN', enroll_count: 42, view_count: 342, created_at: '2026-07-01T00:00:00Z' },
            { id: 'dummy-2', title: '전기방재안전관리사 실시간 화상 강의 과정', category: '전기방재', edu_method: 'LIVE', status: 'OPEN', enroll_count: 28, view_count: 198, created_at: '2026-07-05T00:00:00Z' },
            { id: 'dummy-3', title: '기계설비유지관리사 이론 및 실무 종합과정', category: '기계', edu_method: 'MIX', status: 'OPEN', enroll_count: 35, view_count: 256, created_at: '2026-07-10T00:00:00Z' },
            { id: 'dummy-4', title: '영선실무관리사 자격증 취득 과정', category: '영선', edu_method: 'VOD', status: 'CLOSED', enroll_count: 51, view_count: 174, created_at: '2026-06-01T00:00:00Z' },
            { id: 'dummy-5', title: '배관시설관리사 실무 심화과정 (Zoom 화상강의)', category: '배관', edu_method: 'LIVE', status: 'OPEN', enroll_count: 19, view_count: 91, created_at: '2026-07-20T00:00:00Z' },
            { id: 'dummy-6', title: '공동주택관리행정사 이론 및 사례 연구', category: '행정', edu_method: 'VOD', status: 'OPEN', enroll_count: 60, view_count: 312, created_at: '2026-06-15T00:00:00Z' },
            { id: 'dummy-7', title: '환경위생관리사 위생관리 실무 종합과정', category: '환경위생', edu_method: 'MIX', status: 'UPCOMING', enroll_count: 0, view_count: 143, created_at: '2026-08-01T00:00:00Z' }
        ];

        async function fetchCourses() {
            const tbody = document.getElementById('course-list-body');
            tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_courses')
                    .select('*')
                    .order('sort_order', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allCourses = (data && data.length > 0) ? data : dummyCourses;
                applyFilters();
            } catch (e) {
                console.error('과정 목록 조회 실패:', e);
                allCourses = dummyCourses;
                applyFilters();
            }
        }

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'ALL';
        }

        function applyFilters() {
            const status = getRadioValue('status_filter');
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredCourses = allCourses.filter(item => {
                const matchStatus = status === 'ALL' || item.status === status;
                const matchKeyword = !keyword || (item.title || '').toLowerCase().includes(keyword);
                return matchStatus && matchKeyword;
            });

            renderCourses();
        }

        function renderCourses() {
            const tbody = document.getElementById('course-list-body');

            if (!filteredCourses || filteredCourses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">조건에 맞는 과정이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredCourses.map((item, idx) => `
                <tr>
                    <td class="text-gray-400">${idx + 1}</td>
                    <td class="text-left font-bold text-[#0B2A5B]">${item.title || '-'}</td>
                    <td>${item.category || '-'}</td>
                    <td>${methodText(item.edu_method)}</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>${item.enroll_count || 0}</td>
                    <td>${item.view_count || 0}</td>
                    <td class="text-gray-500">${formatDate(item.created_at)}</td>
                    <td>
                        <div class="flex flex-wrap gap-1.5 justify-center">
                            <span class="btn-manage btn-edit" onclick="location.href='admin-course-edit.html?id=${item.id}'">수정</span>
                            <span class="btn-manage btn-curriculum" onclick="location.href='admin-curriculum.html?course_id=${item.id}'">커리큘럼</span>
                            <span class="btn-manage btn-exam" onclick="location.href='admin-exams.html?course_id=${item.id}'">시험관리</span>
                            <span class="btn-manage btn-delete" onclick="deleteCourse('${item.id}')">삭제</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteCourse(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            try {
                const { error } = await supabaseClient
                    .from('cert_courses')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                alert('삭제되었습니다.');
                fetchCourses();
            } catch (e) {
                console.error('과정 삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCourses();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
