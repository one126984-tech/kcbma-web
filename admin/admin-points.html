     admin-dashboard.src.html과 동일한 표준 구조(header 파샬, checkAdmin,

<style>
        /* [COMMON-CSS-CRITICAL] 자동 생성됨 — 이 내용을 고치려면
           _partials/critical-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐).

           ⚠ 여기에 opacity 0→1 페이드 같은 "로딩 후 서서히 나타내기" 트릭을
              다시 넣지 말 것. resume-list.html 원본 주석에 남아있듯,
              그런 트릭을 View Transition(아래 view-transition-css 파샬)과
              같이 쓰면 "이중 페이드"로 오히려 흰 화면이 더 도드라져 보이는
              버그가 실제로 있었음. 이 파일은 순수 배경색 즉시 고정 용도로만
              쓸 것. */
        #main-header { background-color: #ffffff; }
        #sub-header-bar {
            background-color: #12387a; height: 6px;
            /* ★ 2026-09: 굵은 직선 형태로 축소 (기존 56px 짜리 텍스트 바에서
               텍스트를 전부 지우고 얇은 색상 바로 변경) — height 값은
               common-css.html 쪽과 반드시 동일하게 맞출 것.
               ★ 2026-08: 이제 #sub-header-bar는 header.html/header-close.html
               분할 덕분에 #main-header의 "자식"으로 들어가 있어서 (예전엔
               형제 요소였음) 따로 sticky를 줄 필요가 없어짐 — 부모인
               #main-header가 통째로 sticky라 자동으로 같이 고정됨.
               (예전에 시도했던 position:sticky 오버라이드는 제거함) */
        }

        /* ★★★ 2026-08 추가 → 이후 되돌림: Tailwind CDN 스크립트가 렌더링을
           막고있는 동안(로드 전) 페이지가 스타일 없이 날것으로 보이는 문제를
           고치려고 script에 defer를 붙여봤었는데, 그러면 오른쪽 유틸리티
           영역(알림·마이페이지·로그인)처럼 이 스킈레톤이 못 커버한 부분이
           Tailwind 로드 전에 잠깐 글자가 겹쳐 보이는 "새로운" 버그가 생겨서
           defer는 다시 뺐음 (지금은 원래대로 blocking script).

           ★★★ 2026-08 추가 업데이트: 위 문제 자체가 이제 근본적으로 해결됨.
           Tailwind CDN <script> 태그를 전부 걷어내고, 미리 빌드해둔 정적
           파일(assets/css/tailwind.css)을 <link rel="stylesheet">로 불러오는
           방식으로 교체함 (tailwind.config.js 참고). 이제 "CDN이 다운로드/
           실행되길 기다리는 시간"이 아예 없어서 이 스킈레톤 CSS는 실질적으로
           불필요해졌지만, 혹시 모를 안전망으로 그냥 남겨둠 (있어도 무해함 —
           .css 파일과 값이 같아서 중복 적용일 뿐). */
        #main-header header {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto; width: 100%; height: 70px;
            padding: 0 16px;
        }
        #main-header nav {
            display: none; flex: 1; justify-content: space-between; align-items: center;
            padding: 0 24px; white-space: nowrap;
        }
        @media (min-width: 768px) {
            #main-header nav { display: flex; }
        }
        /* ★ 2026-09 (4차 수정): 사용자 실측 결과 실제 페이지 폭이 803px로
           나오는 환경(모니터 배율 등으로 인해 창은 넓어 보여도 실제 CSS 기준
           폭은 좁게 잡히는 경우)에서도 가로 메뉴를 보이게 해달라는 요청.
           768~1023px 구간은 원래 메뉴 6개+SOS 문구+아이콘을 다 넣기엔
           여유가 부족한 폭이라, 이 구간에서만 폰트를 줄이고 SOS 문구 텍스트를
           숨겨(아이콘만 유지) 최대한 겹치지 않게 압축함. 1024px 이상에서는
           원래 여백대로 표시됨. */
        @media (min-width: 768px) and (max-width: 1023px) {
            #main-header nav { font-size: 12px; padding: 0 8px; gap: 2px; }
            #main-header .sos-btn span { display: none; }
        }
        #main-header .sos-btn {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        #main-header > header > button { display: block; }
        @media (min-width: 768px) {
            #main-header > header > button { display: none; }
        }
        #sub-header-bar {
            display: flex; align-items: center; width: 100%;
        }
        #sub-header-bar > div {
            max-width: 1400px; margin: 0 auto; width: 100%;
            display: flex; align-items: center; height: 100%; padding: 0 16px;
        }

        /* ★ 2026-08 추가: 좌측 사이드 탭 메뉴(.side-menu-tab / .side-menu-tab-active)를
           common-css.html이 아니라 여기(critical-css)에도 미리 정의해둠.
           이 두 클래스는 원래 common-css.html에만 있었는데, common-css는 문서
           순서상 Tailwind CDN <script> 태그보다 "뒤"에 온다. Tailwind CDN
           스크립트는 렌더링을 막는(blocking) 스크립트라서, 그게 다운로드/실행
           되는 동안에는 아직 뒤에 있는 common-css의 <style>이 파싱되기 전이라
           활성 탭(파란 배경)이 잠깐 "흰색"으로 보였다가 그 직후 파란색으로
           바뀌는 깜빡임이 있었음. Tailwind 스크립트보다 앞에 오는 이 파일에
           동일한 규칙을 미리 넣어두면, 첫 렌더링부터 바로 파란색으로 나와서
           깜빡임이 없어짐 (common-css.html 쪽 정의는 그대로 둬도 무해 — 값이
           같아서 중복 적용일 뿐 충돌 없음). */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }
    </style>

    <style>
        /* [COMMON-CSS] 자동 생성됨 — 이 내용을 고치려면
           _partials/common-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐). */

        html, body { overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 6px; }

        /* ★ 사이드 탭 메뉴 — 패턴 A: AJAX 탭 전환용 (job-list / resume-list) */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        /* ★ 사이드 탭 메뉴 — 패턴 B: 목록형 (bid-list / field-experience 등)
           패턴 A와 이름/스타일이 다름. 두 패턴이 실제로 공존 중이라 둘 다 남겨둠.
           (장기적으로는 하나로 통일하는 걸 권장 — README 참고) */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        .side-menu-active-wrapper { padding: 10px; }

        /* ★ 좌측 메뉴 독립 스크롤 (스크롤바 왼쪽 배치) — cert-list/field-experience/dashboard 공통 */
        .left-scroll-area {
            direction: rtl;
            overflow-y: auto;
            height: 100%;
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        /* ★ 우측 본문 영역 독립 스크롤 */
        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }

        /* 스크롤바 숨김 유틸리티 */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* -------------------------------------
           공통 헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }
    </style>

    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // --- 로그인 상태에 따라 헤더의 로그인/로그아웃 버튼을 갱신 ---
        // (예전엔 header.js가 이 역할을 했으나, header.js를 걷어내면서
        //  이 로직이 통째로 사라졌던 문제 수정. 페이지마다 따로 만든
        //  supabase 클라이언트(dummyStorage 사용 등)와 충돌하지 않도록,
        //  세션 확인용 클라이언트는 window.sb 하나만 공유해서 씀 —
        //  assets/js/supabase-config.js를 먼저 불러온 페이지는 그 window.sb를
        //  그대로 재사용하고, 없으면 여기서 한 번만 만듦.)
        async function ensureAuthClient() {
            if (window.sb) return window.sb;
            if (!window.supabase) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            if (!window.sb) {
                window.sb = window.supabase.createClient(
                    'https://ehrahnnowwjkgycvlbzk.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk'
                );
            }
            return window.sb;
        }

        function applyAuthUI(session) {
            document.querySelectorAll('[data-auth-btn]').forEach(btn => {
                if (session) {
                    btn.textContent = '로그아웃';
                    btn.onclick = async (e) => {
                        e.stopPropagation();
                        await window.sb.auth.signOut();
                        window.location.reload();
                    };
                } else {
                    btn.textContent = '로그인';
                    btn.onclick = () => { location.href = '../../login.html'; };
                }
            });
        }

        async function initAuthUI() {
            const client = await ensureAuthClient();
            const { data: { session } } = await client.auth.getSession();
            applyAuthUI(session);
            client.auth.onAuthStateChange((_event, session) => applyAuthUI(session));
            return session;
        }

        // --- 알림 관련 데이터 로드 및 UI 제어 함수 ---
        async function fetchUnreadCount() {
            // 로그인 상태가 아니면(=window.sb가 아직 없으면) 종료 (에러 방지)
            if (!window.sb) {
                return;
            }
            
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) {
                console.log("로그인된 사용자가 없습니다.");
                return; 
            }

            const { count, error } = await supabase
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', user.id)
                .eq('is_read', false);

            if (error) {
                console.error('알림 개수 로드 오류:', error);
                return;
            }

            // ★ 원인 파악을 위한 디버깅 로그 추가 ★
            console.log("알림 개수:", count, "로그인 유저:", user.id);

            const pcBadge = document.getElementById('notification-badge');
            const mobileBadge = document.getElementById('mobile-notification-badge');

            if (count > 0) {
                if (pcBadge) { pcBadge.innerText = count; pcBadge.classList.remove('hidden'); }
                if (mobileBadge) { mobileBadge.innerText = count; mobileBadge.classList.remove('hidden'); }
            } else {
                if (pcBadge) pcBadge.classList.add('hidden');
                if (mobileBadge) mobileBadge.classList.add('hidden');
            }
        }

        async function loadNotifications() {
            if (!window.sb) return;
            const { data: { user } } = await window.sb.auth.getUser();
            if (!user) return;

            const listContainer = document.getElementById('notification-list');
            if (!listContainer) return;

            const { data, error } = await window.sb
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false })
                .limit(5);

            listContainer.innerHTML = ''; 

            if (error) {
                console.error('알림 로드 오류:', error);
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<li class="px-4 py-3 text-sm text-gray-500">새로운 알림이 없습니다.</li>';
                return;
            }

            data.forEach(notification => {
                const li = document.createElement('li');
                li.className = `px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 ${notification.is_read ? 'text-gray-500' : 'text-black font-medium bg-blue-50'}`;
                li.innerText = notification.message;
                
                li.onclick = async (e) => {
                    e.stopPropagation();
                    if (!notification.is_read) {
                        await window.sb
                            .from('notifications')
                            .update({ is_read: true })
                            .eq('id', notification.id);
                    }
                    if (notification.link_url) {
                        window.location.href = notification.link_url;
                    }
                };
                listContainer.appendChild(li);
            });
        }

        // 현재 페이지에 해당하는 GNB 메뉴 파란색 강조 및 알림 이벤트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }

            // 로그인/로그아웃 버튼 상태 갱신 후, 알림 개수 불러오기 실행
            initAuthUI().then(fetchUnreadCount).catch(console.error);

            // PC 알림 종소리 클릭 이벤트 (드롭다운 토글)
            const bellContainer = document.getElementById('bell-container');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (bellContainer && dropdown) {
                bellContainer.addEventListener('click', (e) => {
                    // 드롭다운 내부 클릭 시 닫히지 않도록 방지
                    if(e.target.closest('#notification-dropdown')) return;
                    
                    dropdown.classList.toggle('hidden');
                    if (!dropdown.classList.contains('hidden')) {
                        loadNotifications();
                    }
                });

                // 빈 화면 클릭 시 드롭다운 닫기
                document.addEventListener('click', (e) => {
                    if (!bellContainer.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>

    <script>
        const supabaseClient = window.sb;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '../../index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        async function searchUsers() {
            const keyword = document.getElementById('search-input').value.trim();
            const tbody = document.getElementById('user-list-body');

            if (!keyword) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">이메일을 입력하고 검색해주세요.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">검색 중...</td></tr>';

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('id, email, company_name, points, created_at')
                .ilike('email', `%${keyword}%`)
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                console.error('회원 검색 오류:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-red-500">검색 중 오류가 발생했습니다: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">일치하는 회원이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(u => `
                <tr id="row-${u.id}">
                    <td class="text-left font-medium text-[#0B2A5B]">${u.email || '-'}</td>
                    <td>${u.company_name || '-'}</td>
                    <td class="text-gray-500">${formatDate(u.created_at)}</td>
                    <td class="font-bold" id="points-${u.id}">${(u.points ?? 0).toLocaleString()}</td>
                    <td>
                        <input type="number" id="amount-${u.id}" class="point-input" placeholder="예: 5000 / -1000" step="1000">
                    </td>
                    <td>
                        <button class="btn-give" onclick="givePoints('${u.id}')">지급/차감</button>
                    </td>
                </tr>
            `).join('');
        }

        async function givePoints(userId) {
            const input = document.getElementById(`amount-${userId}`);
            const amount = parseInt(input.value, 10);

            if (!amount || isNaN(amount)) {
                alert('지급(또는 차감)할 포인트 숫자를 입력해주세요. (차감은 음수로 입력)');
                return;
            }

            const btn = document.querySelector(`#row-${userId} .btn-give`);
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '처리 중...';

            const { data, error } = await supabaseClient.rpc('admin_add_points', {
                target_user_id: userId,
                amount: amount
            });

            btn.disabled = false;
            btn.innerText = originalText;

            if (error) {
                alert('오류가 발생했습니다: ' + error.message);
                return;
            }

            if (data.success) {
                document.getElementById(`points-${userId}`).innerText = data.new_points.toLocaleString();
                input.value = '';
                alert(`처리 완료. 현재 포인트: ${data.new_points.toLocaleString()}`);
            } else {
                alert(data.message);
            }
        }

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchUsers();
        });

        document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
