    <style>
        /* 이 페이지(긴급 SOS 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }

        .filter-table { width: 100%; border-top: 2px solid #e5e7eb; background: #fff; border-collapse: collapse; margin-bottom: 15px; }
        .filter-table th { background: #f9fafb; color: #1e3a8a; font-weight: bold; width: 80px; min-width: 80px; text-align: center; border-bottom: 1px dashed #e5e7eb; border-right: 1px solid #e5e7eb; font-size: 15px; padding: 16px 5px; vertical-align: middle; }
        .filter-table td { padding: 16px 20px; border-bottom: 1px dashed #e5e7eb; font-size: 14px; vertical-align: middle; }

        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 8px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-assign { background: #dbeafe; color: #1d4ed8; }
        .btn-assign:hover { background: #bfdbfe; }
        .btn-complete { background: #dcfce7; color: #15803d; }
        .btn-complete:hover { background: #bbf7d0; }
        .btn-chat { background: #f3f4f6; color: #374151; }
        .btn-chat:hover { background: #e5e7eb; }

        .chat-row td { background: #f9fafb; text-align: left; padding: 16px; }
        .chat-box { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-field-courses.html'">현장 교육 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab-active">SOS 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">긴급 SOS 관리</div>

            <table class="filter-table shadow-sm">
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">상태</th>
                    <td style="border-bottom: 2px solid #e5e7eb;">
                        <div class="flex gap-5 flex-wrap">
                            <label class="custom-radio"><input type="radio" name="status_filter" value="ALL" checked onchange="applyFilters()"> 전체</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="대기중" onchange="applyFilters()"> 대기중 (미배정)</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="매칭됨" onchange="applyFilters()"> 매칭됨</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="완료" onchange="applyFilters()"> 완료</label>
                            <label class="custom-radio"><input type="radio" name="status_filter" value="취소됨" onchange="applyFilters()"> 취소됨</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #e0e7ff; color: #1e3a8a;">검색</th>
                    <td style="background-color: #f8fafc;">
                        <div class="flex gap-2">
                            <input type="text" id="search-keyword" placeholder="위치 또는 연락처로 검색" class="flex-1 max-w-[320px] border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#12387a]" onkeydown="if(event.key==='Enter') applyFilters()">
                            <button onclick="applyFilters()" class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13px] py-2 px-4 rounded transition-colors"><i class="fas fa-search mr-1"></i>검색</button>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="section-card">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>접수일시</th>
                                <th>상황</th>
                                <th>위치</th>
                                <th>연락처</th>
                                <th>상세/사진</th>
                                <th>상태</th>
                                <th>매칭 전문가</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="sos-list-body">
                            <tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        let allRequests = [], allMatches = [], filteredRequests = [];
        let openChatRequestId = null;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str || '';
            return div.innerHTML;
        }

        function requestStatusBadge(status) {
            if (status === '완료') return '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">완료</span>';
            if (status === '취소됨') return '<span class="bg-gray-200 text-gray-500 px-2 py-0.5 rounded text-[11px] font-bold">취소됨</span>';
            return '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[11px] font-bold">대기중</span>';
        }

        function findMatch(requestId) {
            return allMatches.find(m => m.request_id === requestId) || null;
        }

        async function fetchAll() {
            const tbody = document.getElementById('sos-list-body');
            tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            const [{ data: requests, error: reqError }, { data: matches, error: matchError }] = await Promise.all([
                supabaseClient.from('sos_requests').select('*').order('created_at', { ascending: false }),
                supabaseClient.from('sos_matches').select('*')
            ]);

            if (reqError) {
                console.error('SOS 접수 목록 조회 오류:', reqError);
                tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-red-500">목록을 불러오지 못했습니다.</td></tr>';
                return;
            }

            allRequests = requests || [];
            allMatches = matches || [];
            applyFilters();
        }

        function applyFilters() {
            const statusFilter = document.querySelector('input[name="status_filter"]:checked').value;
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            filteredRequests = allRequests.filter(r => {
                const match = findMatch(r.id);
                let effectiveStatus = r.status || '대기중';
                if (effectiveStatus === '대기중' && match) effectiveStatus = '매칭됨';

                if (statusFilter !== 'ALL' && effectiveStatus !== statusFilter) return false;

                if (keyword) {
                    const hay = `${r.region || ''} ${r.contact_phone || ''}`.toLowerCase();
                    if (!hay.includes(keyword)) return false;
                }
                return true;
            });

            renderList();
        }

        function renderList() {
            const tbody = document.getElementById('sos-list-body');
            if (filteredRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-14 text-gray-400">조건에 맞는 접수 내역이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredRequests.map(r => {
                const match = findMatch(r.id);
                const photoCount = (r.photo_urls || '').split(',').filter(Boolean).length;
                const photoLinks = photoCount > 0
                    ? (r.photo_urls || '').split(',').filter(Boolean).map((u, i) => `<a href="${escapeHtml(u)}" target="_blank" class="text-blue-600 underline">사진${i + 1}</a>`).join(' ')
                    : '<span class="text-gray-300">-</span>';

                let manageButtons = '';
                if (!match) {
                    manageButtons += `<button class="btn-manage btn-assign" onclick="assignExpert('${r.id}')">전문가 배정</button>`;
                } else if (r.status !== '완료') {
                    manageButtons += `<button class="btn-manage btn-complete" onclick="markComplete('${r.id}')">완료 처리</button>`;
                }
                manageButtons += ` <button class="btn-manage btn-chat" onclick="toggleChat('${r.id}')">채팅</button>`;

                const rowHtml = `
                    <tr>
                        <td class="whitespace-nowrap">${formatDateTime(r.created_at)}</td>
                        <td class="font-bold">${escapeHtml(r.category)}</td>
                        <td class="text-left max-w-[160px] truncate" title="${escapeHtml(r.region)}">${escapeHtml(r.region) || '-'}</td>
                        <td class="whitespace-nowrap">${escapeHtml(r.contact_phone) || '-'}</td>
                        <td class="text-left max-w-[180px]">
                            ${r.description ? `<p class="truncate text-gray-600" title="${escapeHtml(r.description)}">${escapeHtml(r.description)}</p>` : ''}
                            <p class="text-[11px] mt-0.5">${photoLinks}</p>
                        </td>
                        <td>${requestStatusBadge(r.status)}</td>
                        <td>${match ? `<span class="text-blue-700 font-bold">${escapeHtml(match.expert_name) || ('#' + match.id.slice(0, 8).toUpperCase())}</span>` : '<span class="text-gray-300">미배정</span>'}</td>
                        <td class="whitespace-nowrap">${manageButtons}</td>
                    </tr>`;

                const chatHtml = (openChatRequestId === r.id) ? renderChatRow(r) : '';
                return rowHtml + chatHtml;
            }).join('');
        }

        function renderChatRow(r) {
            return `
                <tr class="chat-row">
                    <td colspan="8">
                        <div id="chat-box-${r.id}" class="chat-box">
                            <p class="text-xs text-gray-400 text-center">불러오는 중...</p>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chat-input-${r.id}" placeholder="전문가로서 답장 보내기" class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#12387a]">
                            <button class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13px] py-2 px-4 rounded-full transition-colors" onclick="sendExpertMessage('${r.id}')">전송</button>
                        </div>
                    </td>
                </tr>`;
        }

        async function toggleChat(requestId) {
            openChatRequestId = (openChatRequestId === requestId) ? null : requestId;
            renderList();
            if (openChatRequestId) await loadChat(requestId);
        }

        async function loadChat(requestId) {
            const { data, error } = await supabaseClient
                .from('sos_messages')
                .select('*')
                .eq('request_id', requestId)
                .order('created_at', { ascending: true });

            const box = document.getElementById(`chat-box-${requestId}`);
            if (!box) return;

            if (error) {
                box.innerHTML = '<p class="text-xs text-red-500 text-center">메시지를 불러오지 못했습니다.</p>';
                return;
            }
            if (!data || data.length === 0) {
                box.innerHTML = '<p class="text-xs text-gray-400 text-center">아직 메시지가 없습니다.</p>';
                return;
            }

            box.innerHTML = data.map(m => {
                const fromExpert = m.sender_type === 'expert';
                return `<div class="flex ${fromExpert ? 'justify-end' : 'justify-start'}">
                          <span class="inline-block max-w-[80%] px-3 py-2 rounded-2xl text-sm ${fromExpert ? 'bg-[#274bce] text-white' : 'bg-gray-100 text-gray-800'}">${escapeHtml(m.message_text)}</span>
                        </div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function sendExpertMessage(requestId) {
            const input = document.getElementById(`chat-input-${requestId}`);
            const text = input.value.trim();
            if (!text) return;

            input.disabled = true;
            const { error } = await supabaseClient
                .from('sos_messages')
                .insert([{ request_id: requestId, message_text: text, sender_type: 'expert' }]);
            input.disabled = false;

            if (error) {
                console.error('메시지 전송 오류:', error);
                alert('메시지 전송 중 오류가 발생했습니다. (sos_messages에 sender_type 컬럼이 있는지 확인해 주세요)');
                return;
            }
            input.value = '';
            loadChat(requestId);
        }

        async function assignExpert(requestId) {
            const name = prompt('배정할 전문가 이름을 입력하세요');
            if (!name) return;
            const phone = prompt('전문가 연락처를 입력하세요 (예: 010-1234-5678)');
            if (!phone) return;

            const { error } = await supabaseClient
                .from('sos_matches')
                .insert([{
                    request_id: requestId,
                    expert_id: crypto.randomUUID(),
                    expert_name: name,
                    expert_phone: phone
                }]);

            if (error) {
                console.error('전문가 배정 오류:', error);
                alert('전문가 배정 중 오류가 발생했습니다. (sos_matches에 expert_name/expert_phone 컬럼이 있는지 확인해 주세요)');
                return;
            }

            await fetchAll();
        }

        async function markComplete(requestId) {
            if (!confirm('이 SOS 건을 완료 처리하시겠습니까?')) return;

            const { error } = await supabaseClient
                .from('sos_requests')
                .update({ status: '완료' })
                .eq('id', requestId);

            if (error) {
                console.error('완료 처리 오류:', error);
                alert('완료 처리 중 오류가 발생했습니다.');
                return;
            }

            await fetchAll();
        }

        (async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchAll();
            setInterval(fetchAll, 20000);
        })();
    </script>

</body>
