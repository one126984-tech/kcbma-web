    <style>
        /* [COMMON-CSS-CRITICAL] 자동 생성됨 — 이 내용을 고치려면

              다시 넣지 말 것. resume-list.html 원본 주석에 남아있듯,
              그런 트릭을 View Transition(아래 view-transition-css 파샬)과
              같이 쓰면 "이중 페이드"로 오히려 흰 화면이 더 도드라져 보이는
              버그가 실제로 있었음. 이 파일은 순수 배경색 즉시 고정 용도로만
              쓸 것. */
        #main-header { background-color: #ffffff; }
        #sub-header-bar {
            background-color: #12387a; height: 56px;

               (예전에 시도했던 position:sticky 오버라이드는 제거함) */
        }

        /* ★★★ 2026-08 추가 → 이후 되돌림: Tailwind CDN 스크립트가 렌더링을
           막고있는 동안(로드 전) 페이지가 스타일 없이 날것으로 보이는 문제를
           고치려고 script에 defer를 붙여봤었는데, 그러면 오른쪽 유틸리티
           영역(알림·마이페이지·로그인)처럼 이 스킈레톤이 못 커버한 부분이
           Tailwind 로드 전에 잠깐 글자가 겹쳐 보이는 "새로운" 버그가 생겨서
           defer는 다시 뺐음 (지금은 원래대로 blocking script).

           ★★★ 2026-08 추가 업데이트: 위 문제 자체가 이제 근본적으로 해결됨.
           Tailwind CDN <script> 태그를 전부 걷어내고, 미리 빌드해둔 정적
           파일(assets/css/tailwind.css)을 <link rel="stylesheet">로 불러오는
           방식으로 교체함 (tailwind.config.js 참고). 이제 "CDN이 다운로드/
           실행되길 기다리는 시간"이 아예 없어서 이 스킈레톤 CSS는 실질적으로
           불필요해졌지만, 혹시 모를 안전망으로 그냥 남겨둠 (있어도 무해함 —
           .css 파일과 값이 같아서 중복 적용일 뿐). */
        #main-header header {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto; width: 100%; height: 70px;
            padding: 0 16px;
        }
        #main-header nav {
            display: none; flex: 1; justify-content: space-between; align-items: center;
            padding: 0 24px; white-space: nowrap;
        }
        @media (min-width: 1024px) {
            #main-header nav { display: flex; }
        }
        #main-header .sos-btn {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        #main-header > header > button { display: block; }
        @media (min-width: 1024px) {
            #main-header > header > button { display: none; }
        }
        #sub-header-bar {
            display: flex; align-items: center; width: 100%;
        }
        #sub-header-bar > div {
            max-width: 1400px; margin: 0 auto; width: 100%;
            display: flex; align-items: center; height: 100%; padding: 0 16px;
        }

        /* ★ 2026-08 추가: 좌측 사이드 탭 메뉴(.side-menu-tab / .side-menu-tab-active)를
           common-css.html이 아니라 여기(critical-css)에도 미리 정의해둠.
           이 두 클래스는 원래 common-css.html에만 있었는데, common-css는 문서
           순서상 Tailwind CDN <script> 태그보다 "뒤"에 온다. Tailwind CDN
           스크립트는 렌더링을 막는(blocking) 스크립트라서, 그게 다운로드/실행
           되는 동안에는 아직 뒤에 있는 common-css의 <style>이 파싱되기 전이라
           활성 탭(파란 배경)이 잠깐 "흰색"으로 보였다가 그 직후 파란색으로
           바뀌는 깜빡임이 있었음. Tailwind 스크립트보다 앞에 오는 이 파일에
           동일한 규칙을 미리 넣어두면, 첫 렌더링부터 바로 파란색으로 나와서
           깜빡임이 없어짐 (common-css.html 쪽 정의는 그대로 둬도 무해 — 값이
           같아서 중복 적용일 뿐 충돌 없음). */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;

        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }
    </style>

    <style>
        /* [COMMON-CSS] 자동 생성됨 — 이 내용을 고치려면
           _partials/common-css.html 파일만 고치고 build.js를 다시 실행할 것.
           절대 각 페이지에서 직접 고치지 말 것 (다음 빌드 때 덮어써짐). */

        html, body { overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; color: #333; margin: 0; }

        #main-header { background-color: #ffffff; }
        #sub-header-bar { background-color: #12387a; height: 56px; }

        /* ★ 사이드 탭 메뉴 — 패턴 A: AJAX 탭 전환용 (job-list / resume-list) */
        .side-menu-tab {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; color: #4b5563; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: background-color .2s, color .2s;
        }
        .side-menu-tab:hover { background-color: #f8fafc; }
        .side-menu-tab-active {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 4px; background-color: #274bce; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        /* ★ 사이드 탭 메뉴 — 패턴 B: 목록형 (bid-list / field-experience 등)
           패턴 A와 이름/스타일이 다름. 두 패턴이 실제로 공존 중이라 둘 다 남겨둠.
           (장기적으로는 하나로 통일하는 걸 권장 — README 참고) */
        .side-menu-item { display: flex; justify-content: center; align-items: center; padding: 14px 0; font-size: 15px; font-weight: bold; color: #4b5563; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .side-menu-item:hover { background-color: #f8fafc; color: #0B2A5B; }
        .side-menu-active { background-color: #274bce !important; color: #ffffff !important; font-weight: bold !important; padding: 12px 0; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; }
        .side-menu-active-wrapper { padding: 10px; }

        /* ★ 좌측 메뉴 독립 스크롤 (스크롤바 왼쪽 배치) — cert-list/field-experience/dashboard 공통 */
        .left-scroll-area {
            direction: rtl;
            overflow-y: auto;
            height: 100%;
            padding-bottom: 2rem;
        }
        .left-scroll-area::-webkit-scrollbar { width: 6px; }
        .left-scroll-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .left-scroll-area::-webkit-scrollbar-track { background-color: transparent; }
        .left-scroll-content { direction: ltr; padding-left: 12px; }

        /* ★ 우측 본문 영역 독립 스크롤 */
        .main-scroll-area { overflow-y: auto; height: 100%; padding-right: 6px; }
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
        .main-scroll-area::-webkit-scrollbar-track { background-color: transparent; }

        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }

        /* 스크롤바 숨김 유틸리티 */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* -------------------------------------
           공통 헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }
    </style>

            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }

        // 현재 페이지에 해당하는 GNB 메뉴를 파란색으로 강조 + 헤더 높이 계산
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.gnb-item').forEach(item => {
                const menuKey = item.getAttribute('data-menu');
                if (menuKey && currentPath.includes('/' + menuKey + '/')) {
                    item.classList.add('text-[#0088cc]');
                }
            });

            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
                const updateHeaderHeightVar = () => {
                    const h = headerEl.getBoundingClientRect().height;
                    document.documentElement.style.setProperty('--header-actual-height', h + 'px');
                };
                updateHeaderHeightVar();
                const ro = new ResizeObserver(updateHeaderHeightVar);
                ro.observe(headerEl);
            }
        });

    <script>
        const supabaseClient = window.sb;
        const params = new URLSearchParams(location.search);
        const courseId = params.get('course_id');
        let currentExam = null;
        let questionList = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '../../index.html';
                return false;
            }
            return true;
        }

        const dummyCourse = { id: courseId || 'dummy', title: '기전당직실무관리사 자격 취득 과정' };

        const dummyExam = { id: 'dexam1', course_id: courseId, title: '기전당직실무관리사 자격 평가', time_limit_min: 60, pass_score: 60, max_attempts: 3, is_active: true };

        const dummyQuestions = [
            { id: 'dq1', exam_id: 'dexam1', question_no: 1, question_text: '집합건물의 관리단 설립 근거 법률은?', option_1: '집합건물법', option_2: '주택법', option_3: '건축법', option_4: '민법', correct_option: 1, points: 5, explanation: '집합건물의 소유 및 관리에 관한 법률(집합건물법)이 근거 법률이다.' },
            { id: 'dq2', exam_id: 'dexam1', question_no: 2, question_text: '기전 설비 점검 주기로 옳은 것은?', option_1: '매일', option_2: '월 1회 이상', option_3: '연 1회', option_4: '점검 불필요', correct_option: 2, points: 5, explanation: '기전 설비는 월 1회 이상 정기점검을 실시해야 한다.' },
            { id: 'dq3', exam_id: 'dexam1', question_no: 3, question_text: '당직 근무 시 최우선 확인 사항은?', option_1: '주차 현황', option_2: '설비 이상 유무', option_3: '민원 접수', option_4: '청소 상태', correct_option: 2, points: 5, explanation: '당직 근무의 최우선 임무는 설비 이상 유무를 확인하는 것이다.' }
        ];

        function toggleExamViews(hasExam) {
            document.getElementById('exam-empty-state').classList.toggle('hidden', hasExam);
            document.getElementById('exam-settings-form').classList.toggle('hidden', !hasExam);
            document.getElementById('questions-section').style.display = hasExam ? '' : 'none';
        }

        async function fetchCourseTitle() {
            if (!courseId) return;
            try {
                const { data, error } = await supabaseClient.from('cert_courses').select('title').eq('id', courseId).single();
                if (error) throw error;
                document.getElementById('course-title').textContent = (data && data.title) ? `시험 관리 - ${data.title}` : '시험 관리';
            } catch (e) {
                console.error('과정 정보 조회 실패:', e);
                document.getElementById('course-title').textContent = `시험 관리 - ${dummyCourse.title}`;
            }
        }

        async function fetchExam() {
            try {
                let query = supabaseClient.from('cert_exams').select('*');
                if (courseId) query = query.eq('course_id', courseId);
                const { data, error } = await query.limit(1).maybeSingle();
                if (error) throw error;

                if (data) {
                    currentExam = data;
                } else if (!courseId) {
                    currentExam = dummyExam;
                } else {
                    currentExam = null;
                }
            } catch (e) {
                console.error('시험 조회 실패:', e);
                currentExam = dummyExam;
            }

            renderExamSettings();
            if (currentExam) {
                fetchQuestions();
            } else {
                toggleExamViews(false);
            }
        }

        function renderExamSettings() {
            const hasExam = !!currentExam;
            toggleExamViews(hasExam);
            if (!hasExam) return;

            document.getElementById('exam-title').value = currentExam.title || '';
            document.getElementById('exam-time_limit_min').value = currentExam.time_limit_min || 60;
            document.getElementById('exam-pass_score').value = currentExam.pass_score || 60;
            document.getElementById('exam-max_attempts').value = currentExam.max_attempts || 3;
        }

        async function createExam() {
            const payload = {
                course_id: courseId,
                title: '자격 평가',
                time_limit_min: 60,
                pass_score: 60,
                max_attempts: 3,
                is_active: true
            };
            try {
                const { data, error } = await supabaseClient.from('cert_exams').insert(payload).select().single();
                if (error) throw error;
                currentExam = data;
                renderExamSettings();
                fetchQuestions();
                alert('시험이 생성되었습니다.');
            } catch (e) {
                console.error('시험 생성 실패:', e);
                currentExam = { ...dummyExam, course_id: courseId };
                renderExamSettings();
                questionList = [];
                renderQuestions();
                alert('시험 생성 중 오류가 발생했습니다. (더미 데이터로 표시됩니다)');
            }
        }

        async function saveExamSettings(e) {
            e.preventDefault();
            if (!currentExam) return;

            const payload = {
                title: document.getElementById('exam-title').value.trim(),
                time_limit_min: parseInt(document.getElementById('exam-time_limit_min').value, 10) || 60,
                pass_score: parseInt(document.getElementById('exam-pass_score').value, 10) || 60,
                max_attempts: parseInt(document.getElementById('exam-max_attempts').value, 10) || 3
            };

            try {
                const { error } = await supabaseClient.from('cert_exams').update(payload).eq('id', currentExam.id);
                if (error) throw error;
                Object.assign(currentExam, payload);
                alert('시험 설정이 저장되었습니다.');
            } catch (e2) {
                console.error('시험 설정 저장 실패:', e2);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function fetchQuestions() {
            if (!currentExam) return;
            const tbody = document.getElementById('question-list-body');
            tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_exam_questions')
                    .select('*')
                    .eq('exam_id', currentExam.id)
                    .order('question_no', { ascending: true });
                if (error) throw error;
                questionList = (data && data.length > 0) ? data : (currentExam.id === dummyExam.id ? dummyQuestions : []);
                renderQuestions();
            } catch (e) {
                console.error('문제 목록 조회 실패:', e);
                questionList = dummyQuestions;
                renderQuestions();
            }
        }

        function truncateText(text, len) {
            if (!text) return '-';
            return text.length > len ? text.slice(0, len) + '...' : text;
        }

        function renderQuestions() {
            const tbody = document.getElementById('question-list-body');
            if (!questionList || questionList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">등록된 문제가 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = questionList.map(item => `
                <tr>
                    <td class="font-bold text-[#12387a]">${item.question_no}</td>
                    <td class="text-left font-medium text-[#0B2A5B]" title="${(item.question_text||'').replace(/"/g,'&quot;')}">${truncateText(item.question_text, 30)}</td>
                    <td class="text-gray-500">${truncateText(item.option_1, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_2, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_3, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_4, 12)}</td>
                    <td><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">${item.correct_option}번</span></td>
                    <td>${item.points}</td>
                    <td>
                        <div class="flex flex-wrap gap-1.5 justify-center">
                            <span class="btn-manage btn-edit" onclick='editQuestion(${JSON.stringify(item).replace(/'/g, "&#39;")})'>수정</span>
                            <span class="btn-manage btn-delete" onclick="deleteQuestion('${item.id}')">삭제</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openQuestionModal() {
            document.getElementById('question-modal-title').textContent = '문제 추가';
            document.getElementById('question-form').reset();
            document.getElementById('q-id').value = '';
            const nextNo = questionList.length > 0 ? Math.max(...questionList.map(q => q.question_no || 0)) + 1 : 1;
            document.getElementById('q-question_no').value = nextNo;
            document.getElementById('q-points').value = 1;
            document.getElementById('q-correct_option').value = '1';
            document.getElementById('question-modal').classList.add('active');
        }

        function editQuestion(item) {
            document.getElementById('question-modal-title').textContent = '문제 수정';
            document.getElementById('q-id').value = item.id;
            document.getElementById('q-question_no').value = item.question_no;
            document.getElementById('q-points').value = item.points;
            document.getElementById('q-question_text').value = item.question_text || '';
            document.getElementById('q-option_1').value = item.option_1 || '';
            document.getElementById('q-option_2').value = item.option_2 || '';
            document.getElementById('q-option_3').value = item.option_3 || '';
            document.getElementById('q-option_4').value = item.option_4 || '';
            document.getElementById('q-correct_option').value = String(item.correct_option || 1);
            document.getElementById('q-explanation').value = item.explanation || '';
            document.getElementById('question-modal').classList.add('active');
        }

        function closeQuestionModal() {
            document.getElementById('question-modal').classList.remove('active');
        }

        async function saveQuestion(e) {
            e.preventDefault();
            if (!currentExam) return;

            const id = document.getElementById('q-id').value;
            const payload = {
                exam_id: currentExam.id,
                question_no: parseInt(document.getElementById('q-question_no').value, 10) || 1,
                question_text: document.getElementById('q-question_text').value.trim(),
                option_1: document.getElementById('q-option_1').value.trim(),
                option_2: document.getElementById('q-option_2').value.trim(),
                option_3: document.getElementById('q-option_3').value.trim(),
                option_4: document.getElementById('q-option_4').value.trim(),
                correct_option: parseInt(document.getElementById('q-correct_option').value, 10),
                points: parseInt(document.getElementById('q-points').value, 10) || 1,
                explanation: document.getElementById('q-explanation').value.trim() || null,
                sort_order: parseInt(document.getElementById('q-question_no').value, 10) || 1
            };

            try {
                let error;
                if (id) {
                    ({ error } = await supabaseClient.from('cert_exam_questions').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('cert_exam_questions').insert(payload));
                }
                if (error) throw error;
                alert('저장되었습니다.');
                closeQuestionModal();
                fetchQuestions();
            } catch (e2) {
                console.error('문제 저장 실패:', e2);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_exam_questions').delete().eq('id', id);
                if (error) throw error;
                alert('삭제되었습니다.');
                fetchQuestions();
            } catch (e) {
                console.error('문제 삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCourseTitle();
            fetchExam();
        }

        document.addEventListener('DOMContentLoaded', init);
