<!-- @include common-css -->

    <style>
        /* 이 페이지(현장 교육 등록/수정) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 30px; }
        .section-title { font-size: 17px; font-weight: 900; color: #12387a; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; }

        .form-table { width: 100%; border-collapse: collapse; }
        .form-table th { background: #f9fafb; color: #1e3a8a; font-weight: bold; width: 160px; min-width: 140px; text-align: left; padding: 14px 16px; font-size: 14px; vertical-align: top; border-bottom: 1px solid #f0f0f0; }
        .form-table th .required { color: #dc2626; margin-left: 3px; }
        .form-table td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }

        .form-input { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 12px; font-size: 14px; transition: border-color 0.15s; }
        .form-input:focus { outline: none; border-color: #12387a; box-shadow: 0 0 0 2px rgba(18,56,122,0.1); }
        textarea.form-input { resize: vertical; font-family: inherit; }

        .custom-radio { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; font-size: 14px; font-weight: 500; }
        .custom-radio input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1e3a8a; }

        .form-hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>
<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab-active">현장 교육 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <div class="text-xl md:text-2xl font-black text-[#0B2A5B]" id="page-title">새 일정 등록</div>
                <button onclick="location.href='admin-field-courses.html'" class="text-gray-500 hover:text-[#12387a] font-bold text-[13.5px]"><i class="fas fa-list mr-1"></i>목록으로</button>
            </div>

            <form id="course-form">
                <div class="section-card">
                    <div class="section-title">기본 정보</div>
                    <table class="form-table">
                        <tr>
                            <th>과정명<span class="required">*</span></th>
                            <td colspan="3"><input type="text" id="title" class="form-input" placeholder="예) 제1회 관리소장 직무능력 향상 현장교육" required></td>
                        </tr>
                        <tr>
                            <th>분류</th>
                            <td>
                                <select id="category" class="form-input">
                                    <option value="소방안전실무">소방안전실무</option>
                                    <option value="전기설비실무">전기설비실무</option>
                                    <option value="기계설비실무">기계설비실무</option>
                                    <option value="건축·영선실무">건축·영선실무</option>
                                    <option value="관리소장직무">관리소장직무</option>
                                    <option value="회계·행정">회계·행정</option>
                                </select>
                            </td>
                            <th>상태</th>
                            <td>
                                <select id="status" class="form-input">
                                    <option value="OPEN">접수중</option>
                                    <option value="CLOSED">마감</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th>교육 장소(현장)</th>
                            <td colspan="3"><input type="text" id="location" class="form-input" placeholder="예) 일산 킨텍스 제1전시장"></td>
                        </tr>
                        <tr>
                            <th>지역</th>
                            <td colspan="3">
                                <input type="text" id="region" class="form-input" placeholder="예) 고양시">
                                <div class="form-hint">목록 페이지의 지역 검색 필터와 매칭됩니다. 시/군/구 명칭을 포함해 입력해주세요.</div>
                            </td>
                        </tr>
                        <tr>
                            <th>교육 일자</th>
                            <td><input type="date" id="edu_date" class="form-input"></td>
                            <th>접수 마감일</th>
                            <td><input type="date" id="deadline" class="form-input"></td>
                        </tr>
                        <tr>
                            <th>상세 안내</th>
                            <td colspan="3"><textarea id="description" class="form-input" rows="8" placeholder="교육 내용, 준비물, 문의처 등을 입력하세요."></textarea></td>
                        </tr>
                    </table>
                </div>

                <div class="flex justify-center gap-3 mt-8">
                    <button type="button" onclick="location.href='admin-field-courses.html'" class="px-8 py-3 border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-50">취소</button>
                    <button type="submit" class="px-10 py-3 bg-[#12387a] hover:bg-[#0e2b61] text-white rounded font-bold shadow-sm">저장하기</button>
                </div>
            </form>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;
        const DB_TABLE_NAME = 'field_courses';

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');
        const isEditMode = !!courseId;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function setFormValues(course) {
            document.getElementById('title').value = course.title || '';
            document.getElementById('category').value = course.category || '소방안전실무';
            document.getElementById('status').value = course.status || 'OPEN';
            document.getElementById('location').value = course.location || '';
            document.getElementById('region').value = course.region || '';
            document.getElementById('edu_date').value = course.edu_date ? course.edu_date.substring(0, 10) : '';
            document.getElementById('deadline').value = course.deadline ? course.deadline.substring(0, 10) : '';
            document.getElementById('description').value = course.description || '';
        }

        async function loadCourse() {
            try {
                const { data, error } = await supabaseClient
                    .from(DB_TABLE_NAME)
                    .select('*')
                    .eq('id', courseId)
                    .single();

                if (error) throw error;
                if (data) setFormValues(data);
            } catch (e) {
                console.error('현장 교육 정보 조회 실패:', e);
                alert('정보를 불러오는 중 오류가 발생했습니다.');
            }
        }

        function buildPayload() {
            return {
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                status: document.getElementById('status').value,
                location: document.getElementById('location').value.trim() || null,
                region: document.getElementById('region').value.trim() || null,
                edu_date: document.getElementById('edu_date').value || null,
                deadline: document.getElementById('deadline').value || null,
                description: document.getElementById('description').value.trim() || null
            };
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            if (!title) { alert('과정명을 입력해주세요.'); return; }

            const payload = buildPayload();

            try {
                let error;
                if (isEditMode) {
                    ({ error } = await supabaseClient
                        .from(DB_TABLE_NAME)
                        .update(payload)
                        .eq('id', courseId));
                } else {
                    ({ error } = await supabaseClient
                        .from(DB_TABLE_NAME)
                        .insert(payload));
                }

                if (error) throw error;
                alert(isEditMode ? '수정되었습니다.' : '등록되었습니다.');
                location.href = 'admin-field-courses.html';
            } catch (e) {
                console.error('저장 실패:', e);
                alert('저장 중 오류가 발생했습니다: ' + (e.message || ''));
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;

            if (isEditMode) {
                document.getElementById('page-title').textContent = '현장 교육 수정';
                await loadCourse();
            }

            document.getElementById('course-form').addEventListener('submit', handleSubmit);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>

</body>
</html>
