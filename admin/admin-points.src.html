<!-- 파일명: admin-points.src.html (신규)
     관리자가 이메일로 회원을 검색해서 포인트를 지급(또는 차감)하는 페이지.
     admin-dashboard.src.html과 동일한 표준 구조(header 파샬, checkAdmin,
     .admin-table 등)를 그대로 따름.
     실제 지급 처리는 admin_add_points RPC(SECURITY DEFINER, 관리자 권한
     체크 포함)를 통해서만 이루어짐 — user_profiles.points를 클라이언트에서
     직접 update하지 않음(RLS로 막혀있고, 다른 사람 포인트를 마음대로
     바꿀 수 없도록 하는 게 맞음). -->
<!-- @var BASE: ../../ -->
<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>회원 포인트 관리 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include common-css -->

    <style>
        /* 이 페이지(회원 포인트 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }
        .section-title { font-size: 18px; font-weight: 900; color: #12387a; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; justify-content: space-between; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 10px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 10px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .point-input { width: 100px; border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 8px; font-size: 13.5px; text-align: right; }
        .point-input:focus { outline: none; border-color: #3b82f6; }

        .btn-give { background: #12387a; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; font-size: 12.5px; cursor: pointer; transition: background-color .15s; }
        .btn-give:hover { background: #0B2A5B; }
        .btn-give:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center"></div>
<!-- @include header-close -->

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">
        <aside class="w-full md:w-[220px] shrink-0 md:sticky md:top-[88px] h-fit">
            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-courses.html'">과정 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-field-courses.html'">현장 교육 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-exams.html'">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>
                <div class="side-menu-tab-active">포인트 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-stats.html'">통계</div>
            </div>
        </aside>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div class="text-xl md:text-2xl font-black text-[#0B2A5B]">회원 포인트 관리</div>

            <div class="section-card">
                <div class="section-title"><span>회원 검색</span></div>
                <div class="flex gap-2">
                    <input type="text" id="search-input" class="flex-1 border border-gray-300 rounded p-2.5 text-[14px] outline-none focus:border-blue-500" placeholder="이메일로 검색 (예: hong@example.com)">
                    <button onclick="searchUsers()" class="px-6 py-2.5 bg-[#12387a] text-white font-bold rounded hover:bg-blue-900 transition text-[14px]">
                        <i class="fas fa-search mr-1"></i> 검색
                    </button>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title"><span>검색 결과</span></div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>이메일</th>
                                <th>업체명</th>
                                <th>가입일</th>
                                <th>현재 포인트</th>
                                <th>지급/차감할 포인트</th>
                                <th>처리</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            <tr><td colspan="6" class="py-10 text-gray-400">이메일을 입력하고 검색해주세요.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <script>
        const supabaseClient = window.sb;

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        async function searchUsers() {
            const keyword = document.getElementById('search-input').value.trim();
            const tbody = document.getElementById('user-list-body');

            if (!keyword) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">이메일을 입력하고 검색해주세요.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">검색 중...</td></tr>';

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('id, email, company_name, points, created_at')
                .ilike('email', `%${keyword}%`)
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                console.error('회원 검색 오류:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-red-500">검색 중 오류가 발생했습니다: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-gray-400">일치하는 회원이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(u => `
                <tr id="row-${u.id}">
                    <td class="text-left font-medium text-[#0B2A5B]">${u.email || '-'}</td>
                    <td>${u.company_name || '-'}</td>
                    <td class="text-gray-500">${formatDate(u.created_at)}</td>
                    <td class="font-bold" id="points-${u.id}">${(u.points ?? 0).toLocaleString()}</td>
                    <td>
                        <input type="number" id="amount-${u.id}" class="point-input" placeholder="예: 5000 / -1000" step="1000">
                    </td>
                    <td>
                        <button class="btn-give" onclick="givePoints('${u.id}')">지급/차감</button>
                    </td>
                </tr>
            `).join('');
        }

        async function givePoints(userId) {
            const input = document.getElementById(`amount-${userId}`);
            const amount = parseInt(input.value, 10);

            if (!amount || isNaN(amount)) {
                alert('지급(또는 차감)할 포인트 숫자를 입력해주세요. (차감은 음수로 입력)');
                return;
            }

            const btn = document.querySelector(`#row-${userId} .btn-give`);
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '처리 중...';

            const { data, error } = await supabaseClient.rpc('admin_add_points', {
                target_user_id: userId,
                amount: amount
            });

            btn.disabled = false;
            btn.innerText = originalText;

            if (error) {
                alert('오류가 발생했습니다: ' + error.message);
                return;
            }

            if (data.success) {
                document.getElementById(`points-${userId}`).innerText = data.new_points.toLocaleString();
                input.value = '';
                alert(`처리 완료. 현재 포인트: ${data.new_points.toLocaleString()}`);
            } else {
                alert(data.message);
            }
        }

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchUsers();
        });

        document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>

</body>
</html>
