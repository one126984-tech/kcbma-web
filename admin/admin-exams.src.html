    <style>
        /* 이 페이지(시험 관리) 전용 CSS */
        html, body { overflow-y: scroll; }

        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 26px; }
        .section-title { font-size: 16px; font-weight: 900; color: #12387a; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e0e7ff; display: flex; align-items: center; justify-content: space-between; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th { background: #f8fafc; color: #1e3a8a; font-weight: bold; padding: 12px 6px; border-bottom: 2px solid #e5e7eb; text-align: center; white-space: nowrap; }
        .admin-table td { padding: 12px 6px; border-bottom: 1px dashed #e5e7eb; text-align: center; vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }

        .btn-manage { display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .btn-edit { background: #e0e7ff; color: #1e3a8a; }
        .btn-edit:hover { background: #c7d2fe; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }

        .form-label { font-size: 13px; font-weight: bold; color: #1e3a8a; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 12px; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #12387a; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 8px; width: 92%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 28px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center">

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 md:px-8 py-8 flex flex-col md:flex-row gap-4 md:gap-8">

            <div class="bg-white border border-gray-200 rounded shadow-sm mb-6 p-3 flex flex-col gap-1">
                <div class="side-menu-tab" onclick="window.location.href='admin-dashboard.html'">대시보드</div>

                <div class="side-menu-tab" onclick="window.location.href='admin-curriculum.html'">커리큘럼 관리</div>
                <div class="side-menu-tab-active">시험 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-enrollments.html'">수강생 관리</div>
                <div class="side-menu-tab" onclick="window.location.href='admin-certs.html'">자격증 발급</div>

        <section class="flex-1 min-w-0 flex flex-col gap-6">
            <div>
                <div class="text-xl md:text-2xl font-black text-[#0B2A5B]" id="course-title">시험 관리</div>
                <a href="admin-courses.html" class="text-[13px] text-gray-500 hover:text-[#12387a] font-bold"><i class="fas fa-chevron-left text-[10px] mr-1"></i>과정 목록으로</a>
            </div>

            <div class="section-card">
                <div class="section-title"><span>시험 설정</span></div>

                <div id="exam-empty-state" class="text-center py-10 hidden">
                    <p class="text-gray-500 mb-4">이 과정에 등록된 시험이 없습니다.</p>
                    <button onclick="createExam()" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[14px] py-2.5 px-6 rounded transition-colors shadow-sm"><i class="fas fa-plus mr-1.5"></i>시험 생성</button>
                </div>

                <form id="exam-settings-form" class="hidden grid grid-cols-1 md:grid-cols-4 gap-4 items-end" onsubmit="saveExamSettings(event)">
                    <div>
                        <label class="form-label">시험 제목</label>
                        <input type="text" id="exam-title" class="form-input">
                    </div>
                    <div>
                        <label class="form-label">제한 시간(분)</label>
                        <input type="number" id="exam-time_limit_min" class="form-input" min="1">
                    </div>
                    <div>
                        <label class="form-label">합격 점수</label>
                        <input type="number" id="exam-pass_score" class="form-input" min="0">
                    </div>
                    <div>
                        <label class="form-label">최대 응시 횟수</label>
                        <input type="number" id="exam-max_attempts" class="form-input" min="1">
                    </div>
                    <div class="md:col-span-4 flex justify-end">
                        <button type="submit" class="bg-[#274bce] hover:bg-[#1e3a9e] text-white font-bold text-[13.5px] py-2.5 px-6 rounded transition-colors">시험 설정 저장</button>

            <div class="section-card" id="questions-section" style="display:none;">

                    <span>문제 목록</span>
                    <button onclick="openQuestionModal()" class="bg-[#12387a] hover:bg-[#0e2b61] text-white font-bold text-[13px] py-2 px-4 rounded transition-colors shadow-sm"><i class="fas fa-plus mr-1"></i>문제 추가</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>문제</th>
                                <th>선택지1</th>
                                <th>선택지2</th>
                                <th>선택지3</th>
                                <th>선택지4</th>
                                <th>정답</th>
                                <th>배점</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="question-list-body">
                            <tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>

    </main>

    <div id="footer-container"></div>
    <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <div class="modal-overlay" id="question-modal">
        <div class="modal-box">
            <div class="flex items-center justify-between mb-5">
                <div class="text-lg font-black text-[#0B2A5B]" id="question-modal-title">문제 추가</div>
                <i class="fas fa-times text-gray-400 cursor-pointer hover:text-gray-700" onclick="closeQuestionModal()"></i>
            </div>
            <form id="question-form" class="flex flex-col gap-4" onsubmit="saveQuestion(event)">
                <input type="hidden" id="q-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">문제 번호 *</label>
                        <input type="number" id="q-question_no" class="form-input" required min="1">
                    </div>
                    <div>
                        <label class="form-label">배점 *</label>
                        <input type="number" id="q-points" class="form-input" required min="1" value="1">
                    </div>
                </div>
                <div>
                    <label class="form-label">문제 내용 *</label>
                    <textarea id="q-question_text" class="form-input" rows="2" required></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">선택지 1 *</label>
                        <input type="text" id="q-option_1" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">선택지 2 *</label>
                        <input type="text" id="q-option_2" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">선택지 3 *</label>
                        <input type="text" id="q-option_3" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">선택지 4 *</label>
                        <input type="text" id="q-option_4" class="form-input" required>
                    </div>
                </div>
                <div>
                    <label class="form-label">정답 *</label>
                    <select id="q-correct_option" class="form-input" required>
                        <option value="1">선택지 1</option>
                        <option value="2">선택지 2</option>
                        <option value="3">선택지 3</option>
                        <option value="4">선택지 4</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">해설</label>
                    <textarea id="q-explanation" class="form-input" rows="2"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-2 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeQuestionModal()" class="py-2.5 px-5 rounded font-bold text-[14px] bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">취소</button>
                    <button type="submit" class="py-2.5 px-6 rounded font-bold text-[14px] bg-[#12387a] text-white hover:bg-[#0e2b61] transition-colors">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabaseClient = window.sb;
        const params = new URLSearchParams(location.search);
        const courseId = params.get('course_id');
        let currentExam = null;
        let questionList = [];

        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || user.user_metadata?.role !== 'admin') {
                alert('관리자 권한이 필요합니다.');
                location.href = '{{BASE}}index.html';
                return false;
            }
            return true;
        }

        const dummyCourse = { id: courseId || 'dummy', title: '기전당직실무관리사 자격 취득 과정' };

        const dummyExam = { id: 'dexam1', course_id: courseId, title: '기전당직실무관리사 자격 평가', time_limit_min: 60, pass_score: 60, max_attempts: 3, is_active: true };

        const dummyQuestions = [
            { id: 'dq1', exam_id: 'dexam1', question_no: 1, question_text: '집합건물의 관리단 설립 근거 법률은?', option_1: '집합건물법', option_2: '주택법', option_3: '건축법', option_4: '민법', correct_option: 1, points: 5, explanation: '집합건물의 소유 및 관리에 관한 법률(집합건물법)이 근거 법률이다.' },
            { id: 'dq2', exam_id: 'dexam1', question_no: 2, question_text: '기전 설비 점검 주기로 옳은 것은?', option_1: '매일', option_2: '월 1회 이상', option_3: '연 1회', option_4: '점검 불필요', correct_option: 2, points: 5, explanation: '기전 설비는 월 1회 이상 정기점검을 실시해야 한다.' },
            { id: 'dq3', exam_id: 'dexam1', question_no: 3, question_text: '당직 근무 시 최우선 확인 사항은?', option_1: '주차 현황', option_2: '설비 이상 유무', option_3: '민원 접수', option_4: '청소 상태', correct_option: 2, points: 5, explanation: '당직 근무의 최우선 임무는 설비 이상 유무를 확인하는 것이다.' }
        ];

        function toggleExamViews(hasExam) {
            document.getElementById('exam-empty-state').classList.toggle('hidden', hasExam);
            document.getElementById('exam-settings-form').classList.toggle('hidden', !hasExam);
            document.getElementById('questions-section').style.display = hasExam ? '' : 'none';
        }

        async function fetchCourseTitle() {
            if (!courseId) return;
            try {
                const { data, error } = await supabaseClient.from('cert_courses').select('title').eq('id', courseId).single();
                if (error) throw error;
                document.getElementById('course-title').textContent = (data && data.title) ? `시험 관리 - ${data.title}` : '시험 관리';
            } catch (e) {
                console.error('과정 정보 조회 실패:', e);
                document.getElementById('course-title').textContent = `시험 관리 - ${dummyCourse.title}`;
            }
        }

        async function fetchExam() {
            try {
                let query = supabaseClient.from('cert_exams').select('*');
                if (courseId) query = query.eq('course_id', courseId);
                const { data, error } = await query.limit(1).maybeSingle();
                if (error) throw error;

                if (data) {
                    currentExam = data;
                } else if (!courseId) {
                    currentExam = dummyExam;
                } else {
                    currentExam = null;
                }
            } catch (e) {
                console.error('시험 조회 실패:', e);
                currentExam = dummyExam;
            }

            renderExamSettings();
            if (currentExam) {
                fetchQuestions();
            } else {
                toggleExamViews(false);
            }
        }

        function renderExamSettings() {
            const hasExam = !!currentExam;
            toggleExamViews(hasExam);
            if (!hasExam) return;

            document.getElementById('exam-title').value = currentExam.title || '';
            document.getElementById('exam-time_limit_min').value = currentExam.time_limit_min || 60;
            document.getElementById('exam-pass_score').value = currentExam.pass_score || 60;
            document.getElementById('exam-max_attempts').value = currentExam.max_attempts || 3;
        }

        async function createExam() {
            const payload = {
                course_id: courseId,
                title: '자격 평가',
                time_limit_min: 60,
                pass_score: 60,
                max_attempts: 3,
                is_active: true
            };
            try {
                const { data, error } = await supabaseClient.from('cert_exams').insert(payload).select().single();
                if (error) throw error;
                currentExam = data;
                renderExamSettings();
                fetchQuestions();
                alert('시험이 생성되었습니다.');
            } catch (e) {
                console.error('시험 생성 실패:', e);
                currentExam = { ...dummyExam, course_id: courseId };
                renderExamSettings();
                questionList = [];
                renderQuestions();
                alert('시험 생성 중 오류가 발생했습니다. (더미 데이터로 표시됩니다)');
            }
        }

        async function saveExamSettings(e) {
            e.preventDefault();
            if (!currentExam) return;

            const payload = {
                title: document.getElementById('exam-title').value.trim(),
                time_limit_min: parseInt(document.getElementById('exam-time_limit_min').value, 10) || 60,
                pass_score: parseInt(document.getElementById('exam-pass_score').value, 10) || 60,
                max_attempts: parseInt(document.getElementById('exam-max_attempts').value, 10) || 3
            };

            try {
                const { error } = await supabaseClient.from('cert_exams').update(payload).eq('id', currentExam.id);
                if (error) throw error;
                Object.assign(currentExam, payload);
                alert('시험 설정이 저장되었습니다.');
            } catch (e2) {
                console.error('시험 설정 저장 실패:', e2);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function fetchQuestions() {
            if (!currentExam) return;
            const tbody = document.getElementById('question-list-body');
            tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">데이터를 불러오는 중입니다...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('cert_exam_questions')
                    .select('*')
                    .eq('exam_id', currentExam.id)
                    .order('question_no', { ascending: true });
                if (error) throw error;
                questionList = (data && data.length > 0) ? data : (currentExam.id === dummyExam.id ? dummyQuestions : []);
                renderQuestions();
            } catch (e) {
                console.error('문제 목록 조회 실패:', e);
                questionList = dummyQuestions;
                renderQuestions();
            }
        }

        function truncateText(text, len) {
            if (!text) return '-';
            return text.length > len ? text.slice(0, len) + '...' : text;
        }

        function renderQuestions() {
            const tbody = document.getElementById('question-list-body');
            if (!questionList || questionList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="py-14 text-gray-400">등록된 문제가 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = questionList.map(item => `
                <tr>
                    <td class="font-bold text-[#12387a]">${item.question_no}</td>
                    <td class="text-left font-medium text-[#0B2A5B]" title="${(item.question_text||'').replace(/"/g,'&quot;')}">${truncateText(item.question_text, 30)}</td>
                    <td class="text-gray-500">${truncateText(item.option_1, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_2, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_3, 12)}</td>
                    <td class="text-gray-500">${truncateText(item.option_4, 12)}</td>
                    <td><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold">${item.correct_option}번</span></td>
                    <td>${item.points}</td>
                    <td>
                        <div class="flex flex-wrap gap-1.5 justify-center">
                            <span class="btn-manage btn-edit" onclick='editQuestion(${JSON.stringify(item).replace(/'/g, "&#39;")})'>수정</span>
                            <span class="btn-manage btn-delete" onclick="deleteQuestion('${item.id}')">삭제</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openQuestionModal() {
            document.getElementById('question-modal-title').textContent = '문제 추가';
            document.getElementById('question-form').reset();
            document.getElementById('q-id').value = '';
            const nextNo = questionList.length > 0 ? Math.max(...questionList.map(q => q.question_no || 0)) + 1 : 1;
            document.getElementById('q-question_no').value = nextNo;
            document.getElementById('q-points').value = 1;
            document.getElementById('q-correct_option').value = '1';
            document.getElementById('question-modal').classList.add('active');
        }

        function editQuestion(item) {
            document.getElementById('question-modal-title').textContent = '문제 수정';
            document.getElementById('q-id').value = item.id;
            document.getElementById('q-question_no').value = item.question_no;
            document.getElementById('q-points').value = item.points;
            document.getElementById('q-question_text').value = item.question_text || '';
            document.getElementById('q-option_1').value = item.option_1 || '';
            document.getElementById('q-option_2').value = item.option_2 || '';
            document.getElementById('q-option_3').value = item.option_3 || '';
            document.getElementById('q-option_4').value = item.option_4 || '';
            document.getElementById('q-correct_option').value = String(item.correct_option || 1);
            document.getElementById('q-explanation').value = item.explanation || '';
            document.getElementById('question-modal').classList.add('active');
        }

        function closeQuestionModal() {
            document.getElementById('question-modal').classList.remove('active');
        }

        async function saveQuestion(e) {
            e.preventDefault();
            if (!currentExam) return;

            const id = document.getElementById('q-id').value;
            const payload = {
                exam_id: currentExam.id,
                question_no: parseInt(document.getElementById('q-question_no').value, 10) || 1,
                question_text: document.getElementById('q-question_text').value.trim(),
                option_1: document.getElementById('q-option_1').value.trim(),
                option_2: document.getElementById('q-option_2').value.trim(),
                option_3: document.getElementById('q-option_3').value.trim(),
                option_4: document.getElementById('q-option_4').value.trim(),
                correct_option: parseInt(document.getElementById('q-correct_option').value, 10),
                points: parseInt(document.getElementById('q-points').value, 10) || 1,
                explanation: document.getElementById('q-explanation').value.trim() || null,
                sort_order: parseInt(document.getElementById('q-question_no').value, 10) || 1
            };

            try {
                let error;
                if (id) {
                    ({ error } = await supabaseClient.from('cert_exam_questions').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('cert_exam_questions').insert(payload));
                }
                if (error) throw error;
                alert('저장되었습니다.');
                closeQuestionModal();
                fetchQuestions();
            } catch (e2) {
                console.error('문제 저장 실패:', e2);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const { error } = await supabaseClient.from('cert_exam_questions').delete().eq('id', id);
                if (error) throw error;
                alert('삭제되었습니다.');
                fetchQuestions();
            } catch (e) {
                console.error('문제 삭제 실패:', e);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function init() {
            const ok = await checkAdmin();
            if (!ok) return;
            fetchCourseTitle();
            fetchExam();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
