<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>로그인 | 대한집합건물관리협회</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; }
    </style>
</head>
<body class="bg-transparent m-0">

    <!-- ★ 완벽한 반투명 뒷배경 (오버레이) + 블러 효과 -->
    <div id="login-overlay" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm transition-opacity duration-300">
        
        <!-- 팝업(모달) 박스 컨테이너 -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-[420px] p-8 sm:p-10 relative">
            
            <!-- 우측 상단 X (닫기) 버튼: 누르면 뒷배경과 함께 화면 즉시 숨김 -->
            <button type="button" onclick="closeLogin()" class="absolute top-4 right-5 text-gray-400 hover:text-gray-800 text-[24px] transition-colors" title="닫기">
                <i class="fas fa-times"></i>
            </button>

            <!-- 간편 로그인 타이틀 -->
            <div class="text-center mb-6 mt-2">
                <h2 class="text-[24px] font-black text-[#0B2A5B] tracking-tight">간편 로그인</h2>
                <p class="text-[13px] text-gray-500 mt-2">소셜 계정으로 빠르고 안전하게 시작하세요.</p>
            </div>

            <!-- 간편 로그인 버튼 모음 -->
            <div class="flex flex-col gap-3.5">
                <!-- 구글 -->
                <button class="w-full bg-[#4285F4] text-white rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] relative hover:bg-[#3367D6] transition-colors shadow-sm cursor-pointer">
                    <i class="fab fa-google absolute left-5 text-lg"></i>
                    구글계정으로 시작하기
                </button>
                <!-- 네이버 -->
                <button class="w-full bg-[#03c75a] text-white rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] relative hover:bg-[#02b351] transition-colors shadow-sm cursor-pointer">
                    <span class="absolute left-5 font-black text-lg">N</span>
                    네이버계정으로 시작하기
                </button>
                <!-- 카카오 -->
                <button class="w-full bg-[#FEE500] text-[#000000] rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] relative hover:bg-[#f4dc00] transition-colors shadow-sm cursor-pointer">
                    <i class="fas fa-comment absolute left-5 text-lg"></i>
                    카카오계정으로 시작하기
                </button>
                <!-- 애플 -->
                <button class="w-full bg-black text-white rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] relative hover:bg-gray-800 transition-colors shadow-sm cursor-pointer">
                    <i class="fab fa-apple absolute left-5 text-xl mb-0.5"></i>
                    Apple로 시작하기
                </button>
            </div>

            <!-- 하단 약관 안내 문구 -->
            <div class="text-center mt-8 text-[14.5px] text-gray-500 leading-relaxed">
                <span class="text-[#0B2A5B] font-bold">로그인</span> 하면<br>
                <a href="#" class="font-bold text-[#12387a] underline hover:text-black">이용약관</a> 및 <a href="#" class="font-bold text-[#12387a] underline hover:text-black">개인정보처리방침</a>에<br>
                동의하게 됩니다.
            </div>

        </div>
    </div>

    <!-- 닫기 동작 스크립트 -->
    <script>
        function closeLogin() {
            // 1. 현재 화면에서 반투명 오버레이를 즉시 숨김
            document.getElementById('login-overlay').style.display = 'none';

            // 2. 이전 페이지 이력이 있으면 뒤로 가기, 없으면 창 닫기 시도
            if (window.history.length > 1) {
                history.back();
            } else {
                window.close();
            }
        }
    </script>
</body>
</html>
