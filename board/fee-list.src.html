<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">

    <!-- ★ 스크롤 영역 시작 -->

        <main class="max-w-[1400px] mx-auto w-full px-4 md:px-8 pt-7 pb-12 flex flex-col md:flex-row gap-8 flex-1 items-start">

            <!-- 좌측 사이드바 (LNB 삼단 배너, board-corner.html과 동일) -->
            <aside class="w-full md:w-[220px] shrink-0 h-auto z-40 relative">
                <div id="side-menu-container" class="bg-white border border-gray-200 rounded shadow-sm p-3 flex flex-col gap-1 sticky top-0 mt-0">

                    <div class="border border-gray-200 border-l-[6px] border-l-[#12387a] bg-[#fdfdfd] rounded-md p-6 md:p-7 mb-8 flex gap-5 md:gap-6 items-start shadow-sm">

                            <i class="fas fa-shield-halved text-[#12387a] text-lg md:text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-[#12387a] font-bold text-[16px] md:text-[18px] mb-3 md:mb-4">관리비 비교·평가 서비스 안내</h3>
                            <ul class="text-gray-600 text-[13px] md:text-[15px] space-y-2 md:space-y-3">
                                <li class="flex gap-2"><span class="text-gray-400">-</span><span><b>무료 진단 의뢰:</b> 입주민이나 관리단 누구나 단지의 최근 관리비 고지서를 첨부하여 평가를 무료로 의뢰할 수 있습니다.</span></li>
                                <li class="flex gap-2"><span class="text-gray-400">-</span><span><b>전문가 맞춤 분석:</b> 공용전기료 등 과다 청구가 의심되는 항목에 대해 여러 전문 업체들의 객관적인 진단을 받아보세요.</span></li>
                                <li class="flex gap-2"><span class="text-gray-400">-</span><span><b>정보 보호 및 유료 열람:</b> 고지서 원본 및 개인정보는 블라인드 처리되며, 전문 업체가 열람권 결제 후 분석 리포트를 제안합니다.</span></li>
                            </ul>

                    <!-- 상단 타이틀 영역 -->
                    <div id="main-title-box" class="flex justify-between items-end pb-3 mb-6 border-b-2 border-[#2f66e0]">

                    <!-- 콘텐츠 리스트 영역 (Supabase에서 동적으로 채워짐) -->

        <!-- 푸터 영역 -->

    <!-- 스크립트: fee_evaluations 조회 (무료 의뢰라 결제모달 없음) -->
    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', fetchFeeEvaluations);

        // fee_evaluations 테이블에서 의뢰 목록을 최신순으로 조회.
        // 무료 의뢰 제도라 결제 모달 없이 바로 목록에 노출됨(위탁관리사 탭과의 차이점).
        // 상세정보 자체는 fee-detail.html에서 열람 가능하며, "업체용 상세열람"은
        // 향후 업체 결제(1만원) 후에만 연락처/고지서를 볼 수 있도록 블라인드 처리할
        // 예정 — 관련 구조는 fee-detail.src.html 쪽 주석 참고.
        async function fetchFeeEvaluations() {
            const { data, error } = await supabaseClient
                .from('fee_evaluations')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return;

            const listContainer = document.getElementById('bidding-list');
            listContainer.innerHTML = '';
            document.getElementById('content-count').innerText = data.length;

            if (data.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 py-16 bg-white border border-gray-200 rounded-md">등록된 관리비 비교·평가 의뢰가 아직 없습니다.</div>`;
                return;
            }

            data.forEach(item => {
                const statusLabel = item.status || '분석 모집중';
                const cardHtml = `
                    <div class="bg-white border border-gray-200 rounded-md p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-blue-300 transition shadow-sm">
                        <div>
                            <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-sm mb-2.5 inline-block">${statusLabel}</span>
                            <h4 class="text-[17px] font-bold text-gray-900 mb-1.5">${item.title}</h4>
                            <p class="text-[14px] text-gray-500">${item.building_summary}</p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="location.href='fee-detail.html?id=${item.id}'" class="bg-[#dcfce7] hover:bg-[#bbf7d0] text-gray-900 text-[14px] font-bold px-5 py-3 rounded-md transition flex items-center gap-2">
                                <i class="fas fa-lock"></i> 업체용 상세열람
                            </button>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>
