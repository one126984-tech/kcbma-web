    <!-- 스크립트: assembly_requests 등록 -->
    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function submitAssembly() {
            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData.user) {
                alert('로그인이 필요합니다.');
                return;
            }

            const title = document.getElementById('input-title').value;
            const locationStr = document.getElementById('input-location').value;
            const summary = document.getElementById('input-summary').value;
            const name = document.getElementById('input-name').value;
            const phone = document.getElementById('input-phone').value;
            const type = document.getElementById('input-type').value;
            const dateStr = document.getElementById('input-date').value;
            const details = document.getElementById('input-details').value;

            if(!title || !locationStr || !summary || !name || !phone || !type || !dateStr || !details) {
                return alert('모든 필수 항목을 입력해주세요.');
            }

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 데이터 저장 중...';
            submitBtn.disabled = true;

            const { error: insertError } = await supabaseClient.from('assembly_requests').insert([{
                title: title, location: locationStr, building_summary: summary, client_name: name,
                client_contact: phone, assembly_type: type, expected_date: dateStr, details: details, status: '헬퍼 모집중'
            }]);

            if (insertError) {
                alert('의뢰 등록에 실패했습니다: ' + insertError.message);
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> 의뢰 등록 완료';
                submitBtn.disabled = false;
            } else {
                alert('총회 전문가 매칭 의뢰가 성공적으로 등록되었습니다.');
                location.href = 'evote-list.html';
            }
        }
    </script>
