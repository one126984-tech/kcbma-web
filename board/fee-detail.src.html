<!-- 파일명: fee-detail.src.html (빌드 전 소스. 실제 배포 파일은 build.js가 만드는 fee-detail.html)
     board-corner.html "관리비 비교·평가" 탭의 "업체용 상세열람" 버튼이 가리키는 페이지.
     URL의 ?id=값으로 fee_evaluations 테이블에서 의뢰 1건을 조회해 단지정보/의뢰목적/
     고지서 첨부파일을 보여줌.
     ★ 첨부파일: data.attachment_url을 실제 <a href>로 바인딩(클릭 시 Storage의
        실제 고지서 파일이 새 탭에서 열림). URL이 없는 경우 "첨부파일 없음" 표시.
     ★ 업체용 유료 열람 구조: board-corner.html의 위탁관리사 매칭 결제 흐름과 동일한
        패턴(payment-modal → processPayment → RPC unlock_fee_evaluation)으로 연동
        완료. fee_evaluations.unlock_fee 컬럼과 fee_evaluation_unlocks 테이블을 통해
        결제 시 포인트 차감 + 열람권 기록을 하나의 트랜잭션으로 처리하며, 이미 결제한
        사용자는 페이지 로드 시 자동으로 블라인드가 해제됨(2026-09).
        헤더/서브헤더/푸터는 다른 페이지와 동일하게 파샬(@include)로 조립. -->
<!-- @var PAGE_CLASS: page-board -->
<!-- @var BASE: ../../ -->
<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>관리비 비교·평가 상세정보 | 대한집합건물관리협회</title>

<!-- @include critical-css -->

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">

<!-- @include view-transition-css -->

<!-- @include common-css -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 이 페이지(관리비 비교·평가 상세) 전용 CSS */
        html, body { overflow: hidden; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background-color: transparent; }

        /* 업체용 유료 열람 블라인드 처리 */
        #locked-section.blur-locked {
            filter: blur(6px);
            user-select: none;
            pointer-events: none;
        }
        #lock-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(255,255,255,0.35);
            border-radius: 8px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->

    <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center relative z-40 shrink-0 shadow-sm"></div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <div class="flex-1 overflow-y-auto custom-scrollbar w-full relative flex flex-col bg-[#F8FAFC]">

        <main class="max-w-[1000px] mx-auto w-full px-4 md:px-8 pt-7 pb-12 flex flex-col gap-6 flex-1 items-start">
            <div class="w-full flex justify-between items-end pb-3 border-b-2 border-[#2563eb]">
                <h3 class="text-[22px] font-bold text-[#2563eb]">관리비 비교·평가 의뢰 상세</h3>
                <button onclick="location.href='fee-list.html'" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-bold rounded-md hover:bg-gray-200 shadow-sm">목록으로</button>
            </div>

            <div class="w-full bg-white border border-gray-200 rounded-md shadow-sm p-8 space-y-6">

                <!-- 상단 기본 정보 (공개 정보 — 블라인드 대상 아님) -->
                <div class="border-b pb-6">
                    <span id="detail-status" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-md inline-block mb-3">불러오는 중</span>
                    <h2 id="detail-title" class="text-2xl font-bold text-gray-900 mb-2">단지 정보를 불러오는 중...</h2>
                    <p id="detail-summary" class="text-gray-500"></p>
                </div>

                <!-- 업체용 열람 대상 정보 (연락처/의뢰목적/첨부파일) -->
                <div id="locked-section" class="blur-locked relative space-y-6">

                    <!-- 의뢰인 정보 -->
                    <div class="bg-blue-50 p-5 rounded-md border border-blue-100 flex flex-col md:flex-row gap-4 items-center">
                        <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl shrink-0">
                            <i class="fas fa-building-user"></i>
                        </div>
                        <div>
                            <p class="text-sm text-blue-600 font-bold mb-1">의뢰 단지 / 담당자</p>
                            <p id="detail-contact" class="text-lg font-bold text-gray-900"></p>
                        </div>
                    </div>

                    <!-- 의뢰 목적 및 현재 상황 -->
                    <div>
                        <h4 class="text-lg font-bold text-gray-900 mb-3"><i class="fas fa-clipboard-list text-gray-400 mr-2"></i>의뢰 목적 및 현재 상황</h4>
                        <div id="detail-purpose" class="bg-gray-50 p-6 rounded-md border border-gray-200 text-gray-700 min-h-[150px] leading-relaxed">
                        </div>
                    </div>

                    <!-- 고지서 파일 첨부 내역 (실제 attachment_url 연동) -->
                    <div>
                        <h4 class="text-lg font-bold text-gray-900 mb-3"><i class="fas fa-file-invoice text-gray-400 mr-2"></i>최근 관리비 고지서 첨부</h4>
                        <div id="detail-attachment-wrapper" class="flex flex-col gap-2"></div>
                    </div>

                </div>
                <!-- /locked-section -->

            </div>
        </main>

        <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
        <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>
    </div>
</div>

    <!-- ================= 결제 모달창 ================= -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[9999] hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 w-[500px] shadow-xl text-center">
            <h2 class="text-xl font-bold mb-6 text-gray-800">상세정보 열람 수수료 결제</h2>
            <div class="mb-8">
                <p class="text-[15px] text-gray-700 whitespace-nowrap mb-4">담당자 연락처, 의뢰 목적, 고지서 원본을 열람하시겠습니까?</p>
                <div class="text-[16px] flex items-center justify-center gap-2">
                    <span class="font-bold text-gray-800">열람 수수료 : </span>
                    <span class="font-bold text-red-600"><span id="modal-fee-text">0</span> 포인트</span>
                    <span id="modal-remaining-container">
                        <!-- 포인트 상황에 따라 자동 교체됨 -->
                    </span>
                </div>
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="closePaymentModal()" class="w-[140px] py-2.5 bg-gray-200 text-gray-700 font-bold rounded-md hover:bg-gray-300 transition text-center">취소</button>
                <button id="payment-confirm-btn" onclick="processPayment()" class="w-[140px] py-2.5 bg-[#dbeafe] text-black font-bold rounded-md hover:bg-[#bfdbfe] transition text-center">결제 진행하기</button>
            </div>
        </div>
    </div>

    <!-- ================= 포인트 충전 팝업 모달창 ================= -->
    <div id="charge-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[9999] hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-[400px] shadow-xl text-center">
            <h2 class="text-xl font-bold mb-4 text-gray-800">포인트 충전</h2>
            <div class="mb-6 text-gray-700 text-[15px]">
                <p>포인트가 부족하여 열람할 수 없습니다.</p>
                <p class="font-bold text-blue-600 mt-2">5,000 포인트를 충전하시겠습니까?</p>
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="closeChargeModal()" class="w-[120px] py-2.5 bg-gray-200 text-gray-700 font-bold rounded-md hover:bg-gray-300 transition">취소</button>
                <button onclick="processCharge()" class="w-[120px] py-2.5 bg-blue-600 text-white font-bold rounded-md hover:bg-blue-700 transition">충전하기</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentEvaluationData = null;
        let currentEvaluationId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const evaluationId = urlParams.get('id');
            currentEvaluationId = evaluationId;

            if (!evaluationId) {
                alert('잘못된 접근입니다.');
                location.href = 'fee-list.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('fee_evaluations')
                .select('*')
                .eq('id', evaluationId)
                .single();

            if (error || !data) {
                alert('데이터를 불러오는데 실패했습니다.');
                return;
            }

            currentEvaluationData = data;

            // 공개 정보 (블라인드 대상 아님)
            document.getElementById('detail-status').innerText = data.status || '분석 모집중';
            document.getElementById('detail-title').innerText = data.title;
            document.getElementById('detail-summary').innerText = data.building_summary;

            // 블라인드 대상 정보는 미리 채워두되(unlock 즉시 보이도록), 화면에는
            // #locked-section의 blur로 가려져 있으므로 로그인 전에는 노출되지 않음.
            document.getElementById('detail-contact').innerText = `${data.client_name} (${data.client_contact})`;

            let formattedPurpose = (data.evaluation_purpose || '').replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
            document.getElementById('detail-purpose').innerHTML = formattedPurpose;

            const attachmentWrapper = document.getElementById('detail-attachment-wrapper');
            if (data.attachment_url) {
                attachmentWrapper.innerHTML = `
                    <a href="${data.attachment_url}" target="_blank" rel="noopener" class="flex items-center gap-2 text-sm text-blue-700 font-medium hover:underline bg-white p-3 rounded-md border border-gray-200 shadow-sm transition hover:border-blue-300 w-fit">
                        <i class="fa-regular fa-file-image text-green-600 text-lg"></i> 관리비 고지서 원본 보기
                    </a>`;
            } else {
                attachmentWrapper.innerHTML = `<p class="text-sm text-gray-400">첨부된 고지서가 없습니다.</p>`;
            }

            // 이미 결제(열람권 보유)한 사용자는 자동으로 블라인드 해제
            const { data: authData } = await supabaseClient.auth.getUser();
            if (authData.user) {
                const { data: unlockRow } = await supabaseClient
                    .from('fee_evaluation_unlocks')
                    .select('user_id')
                    .eq('user_id', authData.user.id)
                    .eq('evaluation_id', evaluationId)
                    .maybeSingle();

                if (unlockRow) {
                    removeLock();
                    return;
                }
            }

            renderLockOverlay();
        });

        function removeLock() {
            const lockedSection = document.getElementById('locked-section');
            lockedSection.classList.remove('blur-locked');
            const overlay = document.getElementById('lock-overlay');
            if (overlay) overlay.remove();
        }

        function renderLockOverlay() {
            const fee = (currentEvaluationData && currentEvaluationData.unlock_fee) || 10000;
            const lockedSection = document.getElementById('locked-section');
            const overlay = document.createElement('div');
            overlay.id = 'lock-overlay';
            overlay.innerHTML = `
                <div class="text-center">
                    <i class="fas fa-lock text-3xl text-[#12387a] mb-3"></i>
                    <p class="text-[15px] font-bold text-gray-800 mb-1">업체 전용 상세정보입니다</p>
                    <p class="text-[13px] text-gray-500 mb-4">담당자 연락처, 의뢰 목적, 고지서 원본은<br>결제 후 열람하실 수 있습니다.</p>
                </div>
                <button onclick="openPaymentModal()" class="px-6 py-3 bg-[#2563eb] text-white font-bold text-[14px] rounded-lg hover:bg-blue-700 transition shadow-md flex items-center gap-2">
                    <i class="fas fa-unlock"></i> ${fee.toLocaleString()}원 결제 후 열람하기
                </button>
            `;
            lockedSection.appendChild(overlay);
        }

        let currentFee = 0;

        async function openPaymentModal() {
            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData.user) {
                alert('로그인이 필요합니다.');
                return;
            }

            currentFee = (currentEvaluationData && currentEvaluationData.unlock_fee) || 10000;

            const { data: profile } = await supabaseClient
                .from('user_profiles')
                .select('points')
                .eq('id', authData.user.id)
                .single();

            const userPoints = profile ? profile.points : 0;
            const remaining = userPoints - currentFee;

            document.getElementById('modal-fee-text').innerText = currentFee.toLocaleString();
            const remainingContainer = document.getElementById('modal-remaining-container');
            const confirmBtn = document.getElementById('payment-confirm-btn');

            if (remaining >= 0) {
                remainingContainer.innerHTML = `<span class="text-blue-600 font-bold ml-1">(결제후 ${remaining.toLocaleString()}포인트 남음)</span>`;
                confirmBtn.disabled = false;
                confirmBtn.className = "w-[140px] py-2.5 bg-[#dbeafe] text-black font-bold rounded-md hover:bg-[#bfdbfe] transition text-center cursor-pointer";
            } else {
                remainingContainer.innerHTML = `<span class="text-blue-600 font-bold ml-2 cursor-pointer underline hover:text-blue-800 transition" onclick="openChargeModal()">포인트 충전하기</span>`;
                confirmBtn.disabled = true;
                confirmBtn.className = "w-[140px] py-2.5 bg-gray-300 text-gray-500 font-bold rounded-md cursor-not-allowed text-center";
            }

            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function openChargeModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('charge-modal').classList.remove('hidden');
        }

        function closeChargeModal() {
            document.getElementById('charge-modal').classList.add('hidden');
        }

        async function processCharge() {
            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData.user) return;

            const { data: profile } = await supabaseClient.from('user_profiles').select('points').eq('id', authData.user.id).single();
            const newPoints = (profile ? profile.points : 0) + 5000;

            const { error } = await supabaseClient.from('user_profiles').update({ points: newPoints }).eq('id', authData.user.id);

            if (error) {
                alert('충전에 실패했습니다.');
            } else {
                alert('5,000 포인트 충전이 완료되었습니다.');
                closeChargeModal();
                openPaymentModal();
            }
        }

        async function processPayment() {
            const confirmBtn = document.getElementById('payment-confirm-btn');
            const originalText = confirmBtn.innerText;
            confirmBtn.innerText = '처리 중...';
            confirmBtn.disabled = true;

            const { data, error } = await supabaseClient.rpc('unlock_fee_evaluation', {
                target_evaluation_id: currentEvaluationId
            });

            confirmBtn.innerText = originalText;
            confirmBtn.disabled = false;
            closePaymentModal();

            if (error) {
                alert('오류가 발생했습니다: ' + error.message);
                return;
            }

            if (data.success) {
                removeLock();
            } else {
                alert(data.message);
            }
        }
    </script>
    <script>
      window.BASE_PATH = '/';
    </script>

</body>
</html>
