     board-corner.html의 "공고 등록" 버튼이 가리키는 신규 페이지.
     Gemini와 함께 작업: 정보 노출 수위 3단계(탐색상황/조정상황/확정상황) 선택에
     따라 필수 입력 필드가 동적으로 바뀌고, 단계별로 등록 수수료(포인트)도 자동

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">

                            <div class="relative border-2 border-gray-200 rounded-xl p-5 hover:border-blue-300 bg-white transition-all duration-200 h-full flex flex-col">

                                    </div>

                    <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-inner mt-4">

                            <i class="fas fa-pen-square"></i> 필수 연락처 정보 입력

                            <input type="email" id="s1-email" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: admin@example.com (업체에게 이메일만 노출됩니다)">
                        </div>

                        <!-- 조정상황 폼 -->
                        <div id="field-stage-2" class="dynamic-field hidden">
                            <label class="block text-[14px] font-bold text-gray-700 mb-2">익명 수신용 안심번호 <span class="text-red-500">*</span></label>
                            <input type="text" id="s2-phone" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 0507-XXXX-XXXX (이름 없이 번호만 노출됩니다)">
                        </div>

                        <!-- 확정상황 폼 -->
                        <div id="field-stage-3" class="dynamic-field hidden space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-[14px] font-bold text-gray-700 mb-2">담당자 실명 <span class="text-red-500">*</span></label>
                                    <input type="text" id="s3-name" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 김관리 위원장">
                                </div>
                                <div>
                                    <label class="block text-[14px] font-bold text-gray-700 mb-2">실제 연락처 <span class="text-red-500">*</span></label>
                                    <input type="text" id="s3-phone" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 010-1234-5678">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[14px] font-bold text-gray-700 mb-2">제안서 수신용 이메일 <span class="text-red-500">*</span></label>
                                <input type="email" id="s3-email" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: admin@example.com">
                            </div>
                        </div>
                    </div>

                <hr class="border-gray-200 w-full" style="margin-top: 60px; margin-bottom: 60px;">

                <!-- 3. 상세 제안 내용 -->
                <div class="space-y-6">

                        <span class="bg-blue-100 text-blue-700 w-6 h-6 flex items-center justify-center rounded-full font-bold text-sm">3</span>
                        <h4 class="text-[17px] font-bold text-gray-800">상세 제안 및 첨부파일</h4>
                    </div>

                    <div>
                        <label class="block text-[14px] font-bold text-gray-700 mb-2">상세 내역 <span class="text-red-500">*</span> <span class="text-xs font-normal text-gray-500 ml-2">(결제한 회원에게만 노출되는 보안 영역입니다)</span></label>
                        <textarea id="input-proposal" rows="7" class="w-full border border-gray-300 p-4 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition outline-none resize-none leading-relaxed" placeholder="현재 상황 및 관리업체에 요구하는 상세 제안 내용을 입력해 주세요."></textarea>

                <!-- 4. 결제 및 등록 버튼 -->

                    <div class="text-[20px] font-black text-gray-900 mb-6">공고 등록 수수료 : <span id="fee-display" class="text-blue-600">50,000 포인트</span></div>
                    <div class="flex gap-3 w-full justify-center">
                        <button onclick="location.href='board-corner.html'" class="px-8 py-3.5 bg-white border border-gray-300 text-gray-700 font-bold text-[16px] rounded-lg hover:bg-gray-50 transition shadow-sm w-40">취소</button>
                        <button onclick="submitPosting()" class="px-8 py-3.5 bg-[#2563eb] text-white font-bold text-[16px] rounded-lg hover:bg-blue-700 transition shadow-sm w-72 flex items-center justify-center gap-2">

        <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
        <script src="{{BASE}}assets/js/footer.js?v=1.3"></script>

    <!-- 스크립트 -->
    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 단계별 수수료 매핑
        const feeMap = {
            '탐색상황': 50000,
            '조정상황': 10000,
            '확정상황': 5000
        };

        // 3단계 라디오 버튼 선택 시 폼 전환 및 하단 수수료 텍스트 변경
        function toggleContactFields() {
            const stage = document.querySelector('input[name="exposure_stage"]:checked').value;
            const field1 = document.getElementById('field-stage-1');
            const field2 = document.getElementById('field-stage-2');
            const field3 = document.getElementById('field-stage-3');
            const feeDisplay = document.getElementById('fee-display');

            field1.classList.add('hidden');
            field2.classList.add('hidden');
            field3.classList.add('hidden');

            if (stage === '탐색상황') {
                field1.classList.remove('hidden');
            } else if (stage === '조정상황') {
                field2.classList.remove('hidden');
            } else if (stage === '확정상황') {
                field3.classList.remove('hidden');
            }

            feeDisplay.innerText = feeMap[stage].toLocaleString() + ' 포인트';
        }

        async function submitPosting() {
            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData.user) {
                alert('로그인이 필요합니다.');
                return;
            }

            const title = document.getElementById('input-title').value;
            const location = document.getElementById('input-location').value;
            const summary = document.getElementById('input-summary').value;
            const proposal = document.getElementById('input-proposal').value;
            const stage = document.querySelector('input[name="exposure_stage"]:checked').value;

            if(!title || !location || !summary || !proposal) {
                return alert('건물 기본 정보와 상세 내역을 모두 입력해주세요.');
            }

            let contactPerson = '';
            let contactPhone = '';

            if (stage === '탐색상황') {
                const email = document.getElementById('s1-email').value;
                if(!email) return alert('[탐색상황] 수신용 이메일을 입력해주세요.');
                contactPerson = '담당자 (이메일 수신)';
                contactPhone = email;
            } 
            else if (stage === '조정상황') {
                const vPhone = document.getElementById('s2-phone').value;
                if(!vPhone) return alert('[조정상황] 익명 수신용 안심번호를 입력해주세요.');
                contactPerson = '담당자 (안심번호)';
                contactPhone = vPhone;
            } 
            else if (stage === '확정상황') {
                const name = document.getElementById('s3-name').value;
                const phone = document.getElementById('s3-phone').value;
                const email = document.getElementById('s3-email').value;

                if(!name || !phone || !email) return alert('[확정상황] 담당자 실명, 실제 연락처, 이메일을 모두 입력해주세요.');

                contactPerson = name;
                contactPhone = `${phone} / ${email}`;
            }

            const fee = feeMap[stage];
            const { data: profile } = await supabaseClient.from('user_profiles').select('points').eq('id', authData.user.id).single();
            const currentPoints = profile ? profile.points : 0;

            if (currentPoints < fee) {
                return alert(`포인트가 부족합니다. (현재: ${currentPoints.toLocaleString()}P / 필요: ${fee.toLocaleString()}P)\n마이페이지에서 충전해주세요.`);
            }

            const { error: pointError } = await supabaseClient.from('user_profiles').update({ points: currentPoints - fee }).eq('id', authData.user.id);
            if (pointError) return alert('결제 처리 중 오류가 발생했습니다.');

            const { error: insertError } = await supabaseClient.from('management_biddings').insert([{
                title: title,
                location: location,
                building_summary: summary,
                contact_person: contactPerson,
                contact_phone: contactPhone,
                detailed_proposal: proposal,
                unlock_fee: 1000,
                status: stage     
            }]);

            if (insertError) {
                alert('공고 등록에 실패했습니다: ' + insertError.message);
            } else {
                alert(`${fee.toLocaleString()}P가 결제되었으며, 공고가 성공적으로 등록되었습니다.`);
                window.location.href = 'board-corner.html'; 
            }
        }
    </script>
</body>
</html>
