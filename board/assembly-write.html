<body class="flex flex-col h-screen page-board">

        <div id="sub-header-bar" class="w-full bg-[#12387a] h-[56px] flex items-center relative z-40 shrink-0 shadow-sm">
            <div class="max-w-[1400px] mx-auto w-full px-4 md:px-8 flex items-center h-full">
                <div class="w-full md:w-[260px] shrink-0 flex items-center justify-center">
                    <div class="text-white font-bold text-xl md:text-2xl tracking-wide px-1">총회 헬퍼 구인 공고</div>
                </div>
            </div>

    <div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
        <div class="flex-1 overflow-y-auto custom-scrollbar w-full relative flex flex-col items-center">

            <main class="max-w-[900px] w-full px-4 md:px-8 pb-20 flex flex-col items-start" style="padding-top: 40px;">

                <div class="w-full flex items-center gap-3 pb-4 border-b-2 border-gray-800 mb-8">
                    <i class="fas fa-users text-2xl text-[#2563eb]"></i>
                    <h3 class="text-[24px] font-extrabold text-gray-900 tracking-tight">총회 전문가(헬퍼) 무료 매칭 의뢰</h3>
                </div>

                <div class="w-full bg-white rounded-xl shadow-lg border border-gray-100 p-8 md:p-10">

                    <!-- 1. 단지 기본 정보 -->
                    <div class="space-y-6">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-blue-100 text-blue-700 w-6 h-6 flex items-center justify-center rounded-full font-bold text-sm">1</span>
                            <h4 class="text-[17px] font-bold text-gray-800">단지 기본 정보</h4>
                        </div>

                        <div>
                            <label class="block text-[14px] font-bold text-gray-700 mb-2">공고 제목 <span class="text-red-500">*</span></label>
                            <input type="text" id="input-title" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition outline-none" placeholder="예: [서울 마포구] 관리인 선임을 위한 총회 대행 헬퍼 구합니다.">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[14px] font-bold text-gray-700 mb-2">지역 <span class="text-red-500">*</span></label>
                                <input type="text" id="input-location" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition outline-none" placeholder="예: 서울 마포구">
                            </div>
                            <div>
                                <label class="block text-[14px] font-bold text-gray-700 mb-2">단지 요약 (규모) <span class="text-red-500">*</span></label>
                                <input type="text" id="input-summary" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition outline-none" placeholder="예: 150세대 지식산업센터">
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 w-full" style="margin-top: 50px; margin-bottom: 50px;">

                    <!-- 2. 의뢰인 연락처 -->
                    <div class="space-y-6">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-blue-100 text-blue-700 w-6 h-6 flex items-center justify-center rounded-full font-bold text-sm">2</span>
                            <h4 class="text-[17px] font-bold text-gray-800">담당자 연락처</h4>
                        </div>
                        <p class="text-[13px] text-gray-500 mb-4">* 매칭된 전문가 및 플랫폼 관리자만 확인 가능하며 외부에 노출되지 않습니다.</p>

                        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-inner">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                                <div>
                                    <label class="block text-[14px] font-bold text-gray-700 mb-2">담당자 실명 / 직책 <span class="text-red-500">*</span></label>
                                    <input type="text" id="input-name" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 관리소장, 입주자대표회장 등">
                                </div>
                                <div>
                                    <label class="block text-[14px] font-bold text-gray-700 mb-2">연락처 (휴대폰) <span class="text-red-500">*</span></label>
                                    <input type="text" id="input-phone" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 010-1234-5678">
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 w-full" style="margin-top: 50px; margin-bottom: 50px;">

                    <!-- 3. 총회 상세 정보 -->
                    <div class="space-y-6">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-blue-100 text-blue-700 w-6 h-6 flex items-center justify-center rounded-full font-bold text-sm">3</span>
                            <h4 class="text-[17px] font-bold text-gray-800">총회 일정 및 주요 안건</h4>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                            <div>
                                <label class="block text-[14px] font-bold text-gray-700 mb-2">주요 안건 (택 1) <span class="text-red-500">*</span></label>
                                <select id="input-type" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
                                    <option value="" disabled selected>안건을 선택해 주세요</option>
                                    <option value="관리인 선임">관리인 선임 및 관리단 구성</option>
                                    <option value="규약 제정">관리규약 제정 및 변경</option>
                                    <option value="관리업체 변경">위탁관리업체 선정/변경</option>
                                    <option value="기타 안건">기타 (하자보수, 임원 해임 등)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[14px] font-bold text-gray-700 mb-2">예상 총회 일정 <span class="text-red-500">*</span></label>
                                <input type="text" id="input-date" class="w-full border border-gray-300 p-3 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: 2026년 10월 중순">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[14px] font-bold text-gray-700 mb-2">진행 상황 및 요청 사항 <span class="text-red-500">*</span></label>
                            <textarea id="input-details" rows="5" class="w-full border border-gray-300 p-4 rounded-lg text-[15px] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition outline-none resize-none leading-relaxed" placeholder="현재 준비된 상황(추진위 구성 여부 등)과 대행사(헬퍼)에게 특별히 요청하고 싶은 업무 범위를 적어주세요."></textarea>
                        </div>
                    </div>

                    <!-- 4. 등록 버튼 -->
                    <div class="flex gap-3 w-full justify-center mt-12">
                        <button onclick="location.href='board-corner.html?tab=assembly'" class="px-8 py-3.5 bg-white border border-gray-300 text-gray-700 font-bold text-[16px] rounded-lg hover:bg-gray-50 transition shadow-sm w-40">취소</button>
                        <button id="btn-submit" onclick="submitAssembly()" class="px-8 py-3.5 bg-[#2563eb] text-white font-bold text-[16px] rounded-lg hover:bg-blue-700 transition shadow-sm w-72 flex items-center justify-center gap-2">
                            <i class="fas fa-check-circle"></i> 무료로 매칭 공고 등록
                        </button>
                    </div>

                </div>
            </main>

            <div id="footer-container" class="w-full shrink-0 mt-auto"></div>
        </div>
    </div>

    <!-- 스크립트: Supabase 연동 처리 -->
    <script>
        const supabaseUrl = 'https://ehrahnnowwjkgycvlbzk.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmFobm5vd3dqa2d5Y3ZsYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzQ1NjQsImV4cCI6MjA5NzYxMDU2NH0.A0MfXNI4W7sPUM4UwSn7_kY5n2gEhp3N8ubH7uBZZwk';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function submitAssembly() {
            const { data: authData } = await supabaseClient.auth.getUser();
            if (!authData.user) {
                alert('로그인이 필요합니다.');
                return;
            }

            const title = document.getElementById('input-title').value;
            const locationStr = document.getElementById('input-location').value;
            const summary = document.getElementById('input-summary').value;
            const name = document.getElementById('input-name').value;
            const phone = document.getElementById('input-phone').value;
            const type = document.getElementById('input-type').value;
            const dateStr = document.getElementById('input-date').value;
            const details = document.getElementById('input-details').value;

            if(!title || !locationStr || !summary || !name || !phone || !type || !dateStr || !details) {
                return alert('모든 필수 항목을 입력해주세요.');
            }

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 데이터 저장 중...';
            submitBtn.disabled = true;

            const { error: insertError } = await supabaseClient.from('assembly_requests').insert([{
                title: title,
                location: locationStr,
                building_summary: summary,
                client_name: name,
                client_contact: phone,
                assembly_type: type,
                expected_date: dateStr,
                details: details,
                status: '헬퍼 모집중'
            }]);

            if (insertError) {
                alert('공고 등록에 실패했습니다: ' + insertError.message);
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> 무료로 매칭 공고 등록';
                submitBtn.disabled = false;
            } else {
                alert('총회 전문가 매칭 공고가 성공적으로 등록되었습니다.');
                window.location.href = 'board-corner.html?tab=assembly'; 
            }
        }
    </script>
</body>
