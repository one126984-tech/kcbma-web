</div>

<script>
    const supabaseClient = window.sb; 
    let isPracticeMode = false;
    let currentStep = 'step-intro';

    const DISPATCH_FEE = 50000;
    const SERVICE_LABEL = { phone: "전화상담 진행", dispatch: "상담 및 출동서비스" };
    let selectedType = 'phone';
    let selectedService = SERVICE_LABEL.phone;
    let selectedServiceCost = 0;   
    let currentBasePrice = 4; // 단위: 만원

    // PG 결제를 위한 포트원 가맹점 식별코드 (현재 임시 코드)
    const IMP_CODE = 'imp00000000'; 

    // 주소 검색 (다음 우편번호 API)
    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('postcode-input').value = data.zonecode;
                document.getElementById('location-input').value = data.address;
                document.getElementById('location-detail-input').focus();
            }
        }).open();
    }

    // 현재 위치 자동(GPS)
    function getCurrentLocation() {
        const gpsBtn = document.getElementById('gps-btn');
        const originalText = gpsBtn.innerHTML;
        
        if (!navigator.geolocation) { 
            alert('현재 브라우저에서 위치 정보를 지원하지 않습니다.'); 
            return; 
        }
        
        gpsBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-green-600"></i> 찾는 중...';
        
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                    const data = await res.json();
                    document.getElementById('location-input').value = data.display_name;
                    gpsBtn.innerHTML = '<i class="fa-solid fa-check text-green-600"></i> 완료';
                    setTimeout(() => { gpsBtn.innerHTML = originalText; }, 2000);
                } catch (e) {
                    document.getElementById('location-input').value = `위도: ${pos.coords.latitude}, 경도: ${pos.coords.longitude}`;
                    gpsBtn.innerHTML = originalText;
                }
            },
            () => { 
                alert('위치 정보를 가져올 수 없습니다. 브라우저의 위치 권한을 확인해 주세요.'); 
                gpsBtn.innerHTML = originalText;
            }
        );
    }

    // 시간대별 요금 업데이트
    function updateTimePrice() {
        const hour = new Date().getHours();
        let newBasePrice = 3; 
        if (hour >= 9 && hour < 18) newBasePrice = 2; 
        else if (hour >= 22 || hour < 6) newBasePrice = 4; 

        if (currentBasePrice !== newBasePrice) {
            currentBasePrice = newBasePrice;
        }
        document.querySelectorAll('.dynamic-time-price').forEach(el => { el.innerText = currentBasePrice; });
    }
    updateTimePrice(); setInterval(updateTimePrice, 60000); 

    function getRequiredAmount() {
        return (currentBasePrice * 10000) + selectedServiceCost;
    }

    // 서비스 라디오 버튼 클릭
    document.querySelectorAll('input[name="svc_type"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.svc-label').forEach(lbl => {
                lbl.classList.remove('border-blue-500', 'bg-blue-50', 'selected');
                lbl.classList.add('border-gray-200');
            });
            if(this.checked) {
                const label = this.closest('label');
                label.classList.remove('border-gray-200');
                label.classList.add('border-blue-500', 'bg-blue-50', 'selected');
                
                selectedType = this.value === 'dispatch' ? 'dispatch' : 'phone';
                selectedService = SERVICE_LABEL[selectedType];
                selectedServiceCost = selectedType === 'dispatch' ? DISPATCH_FEE : 0;
            }
        });
    });

    function startActual() { 
        isPracticeMode = false;
        showStep('step-1-situation'); 
    }

    function startPractice() { 
        isPracticeMode = true;
        showStep('step-1-situation'); 
    }

    document.getElementById('contact-phone-input').addEventListener('input', function(e) {
        let val = this.value.replace(/[^0-9]/g, '');
        let res = '';
        if(val.length < 4) res = val;
        else if(val.length < 7) res = val.substr(0, 3) + '-' + val.substr(3);
        else if(val.length < 11) res = val.substr(0, 3) + '-' + val.substr(3, 3) + '-' + val.substr(6);
        else res = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7);
        this.value = res;
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', function() { this.classList.toggle('selected'); });
    });
    function getSelectedCategories() {
        return Array.from(document.querySelectorAll('.cat-btn.selected')).map(btn => btn.getAttribute('data-cat'));
    }

    function showStep(stepId) {
        ['step-intro', 'step-1-situation', 'step-2-consent', 'step-matching'].forEach(id => {
            const el = document.getElementById(id);
            if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
        });
        document.getElementById(stepId).classList.remove('hidden'); 
        document.getElementById(stepId).classList.add('flex');
        currentStep = stepId;
        document.querySelectorAll('.practice-tip').forEach(el => { el.classList.toggle('hidden', !isPracticeMode); });
    }

    document.getElementById('next-step-btn').addEventListener('click', () => {
        if(!document.getElementById('location-input').value) return alert('현장 주소를 입력해주세요.');
        if(getSelectedCategories().length === 0) return alert('긴급 상황을 선택해 주세요.');
        if(document.getElementById('contact-phone-input').value.length < 12) return alert('정확한 연락처를 입력해주세요.');
        showStep('step-2-consent');
    });
    document.getElementById('prev-step-btn-1').addEventListener('click', () => showStep('step-intro'));
    document.getElementById('prev-step-btn').addEventListener('click', () => showStep('step-1-situation'));

    const submitBtn = document.getElementById('sos-submit-btn');
    document.getElementById('agree-1').addEventListener('change', function() {
        submitBtn.disabled = !this.checked;
        if(this.checked) submitBtn.className = "flex-1 bg-[#2563eb] text-white font-bold text-[16px] py-3.5 rounded-xl shadow-sm transition flex justify-center items-center gap-2";
        else submitBtn.className = "flex-1 bg-gray-300 text-gray-500 font-bold text-[16px] py-3.5 rounded-xl shadow-sm transition flex justify-center items-center gap-2 cursor-not-allowed";
    });

    function closePaymentModal() { document.getElementById('payment-modal').classList.replace('flex', 'hidden'); }

    // 결제 확인 모달 데이터 주입 및 띄우기
    submitBtn.addEventListener('click', () => {
        document.getElementById('modal-svc').innerText = selectedService;
        document.getElementById('modal-cat').innerText = getSelectedCategories().join(', ');
        
        const costContainer = document.getElementById('modal-cost-container');
        costContainer.innerHTML = `
            <div class="flex justify-between items-center">
                <span class="text-gray-600 text-[14px]">기본 상담료</span>
                <span class="font-bold text-gray-800 text-[15px]">${currentBasePrice}0,000원</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-600 text-[14px]">현장 출동비</span>
                <span class="font-bold text-gray-800 text-[15px]">${selectedServiceCost > 0 ? '50,000원' : '0원'}</span>
            </div>
        `;
        document.getElementById('modal-total').innerText = getRequiredAmount().toLocaleString() + '원';
        
        document.getElementById('payment-modal').classList.remove('hidden'); 
        document.getElementById('payment-modal').classList.add('flex');
    });

    // 실제 PG 결제 호출 및 DB 저장 로직
    document.getElementById('modal-pay-btn').addEventListener('click', async function() {
        const btn = this; btn.disabled = true; btn.innerText = '결제창 여는 중...';
        const resetBtn = () => { btn.disabled = false; btn.innerText = '결제 진행하기'; };
        const amountToPay = getRequiredAmount();

        // 1. [연습 모드]일 경우 PG 결제창 생략하고 바로 성공 처리
        if (isPracticeMode) {
            setTimeout(async () => { 
                await processFinalRequest("test_imp_uid_" + new Date().getTime());
            }, 1000);
            return;
        }

        // 2. [실전 모드] 포트원(아임포트) 결제창 호출
        if (!window.IMP) {
            alert('결제 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
            resetBtn(); return;
        }
        
        const IMP = window.IMP;
        IMP.init(IMP_CODE); 

        const paymentData = {
            pg: "html5_inicis",           
            pay_method: "card",           
            merchant_uid: "SOS_" + new Date().getTime(), 
            name: "긴급 SOS - " + selectedService,
            amount: amountToPay,
            buyer_email: "test@example.com", 
            buyer_name: "홍길동",             
            buyer_tel: document.getElementById('contact-phone-input').value,
        };

        IMP.request_pay(paymentData, async function (rsp) {
            if (rsp.success) {
                await processFinalRequest(rsp.imp_uid);
            } else {
                // 결제 취소 또는 에러 시 (현재 임시 코드로 인한 에러 포함)
                alert("결제에 실패하였습니다.\n에러 내용: " + rsp.error_msg);
                resetBtn();
            }
        });
    });

    // 새로 수정한 백엔드 함수(create_sos_request_with_payment)를 호출하는 최종 접수 기능
    async function processFinalRequest(imp_uid) {
        try {
            const fullAddress = document.getElementById('location-input').value;
            
            const { data: newRequestId, error } = await supabaseClient.rpc('create_sos_request_with_payment', {
                p_service_type: selectedType,
                p_category: getSelectedCategories().join(', '),
                p_region: fullAddress,
                p_contact_phone: document.getElementById('contact-phone-input').value,
                p_imp_uid: imp_uid, // 결제 고유 번호 저장
                p_amount_paid: getRequiredAmount() // 결제 금액 전달
            });

            if (error) {
                console.error('DB 저장 오류:', error);
                alert('결제는 완료되었으나 접수 처리 중 오류가 발생했습니다. 고객센터로 문의해 주세요.');
                document.getElementById('modal-pay-btn').disabled = false;
                document.getElementById('modal-pay-btn').innerText = '결제 진행하기';
                return;
            }

            closePaymentModal();
            // 매칭 대기실(상황실)로 이동
            window.location.href = 'sos-room.html?request_id=' + encodeURIComponent(newRequestId);
            
        } catch (err) {
            console.error(err);
            alert('접수 처리 중 심각한 오류가 발생했습니다.');
            document.getElementById('modal-pay-btn').disabled = false;
            document.getElementById('modal-pay-btn').innerText = '결제 진행하기';
        }
    }
</script>
</body>
</html>
