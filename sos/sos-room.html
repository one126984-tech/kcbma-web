<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>긴급 SOS 매칭 방</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col relative">

  <!-- 상단 헤더 (이전으로 가기 고정) -->
  <header class="bg-white shadow-sm p-4 flex items-center border-b sticky top-0 z-10">
    <button onclick="history.back()" class="mr-4 text-gray-600 hover:text-black font-bold flex items-center gap-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      이전
    </button>
    <h1 class="text-xl font-bold text-gray-800">긴급 SOS 매칭 방</h1>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="p-4 max-w-lg mx-auto w-full flex-1 flex flex-col gap-4 pb-6">
    <!-- 접수 내역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
      <div class="p-3 border-b bg-gray-50 font-bold text-gray-700 flex items-center gap-2">
        📄 접수 내역
      </div>
      <div class="p-4 space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-gray-500">상황</span><span class="font-bold text-gray-900">화재</span></div>
        <div class="flex justify-between"><span class="text-gray-500">위치</span><span class="text-gray-900">김포대로 699</span></div>
        <div class="flex justify-between"><span class="text-gray-500">상태</span><span id="room-status" class="text-orange-500 font-bold">대기중</span></div>
      </div>
    </div>

    <!-- 채팅/메시지 영역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 flex-1 flex flex-col min-h-[300px]">
      <div class="p-3 border-b bg-gray-50 font-bold text-gray-700 flex items-center gap-2">
        💬 메시지
      </div>
      <div class="flex-1 p-4 flex flex-col items-center justify-center text-gray-400 text-sm overflow-y-auto">
        아직 메시지가 없습니다.
      </div>
      <div class="p-3 border-t flex gap-2">
        <input type="text" class="flex-1 border border-gray-300 rounded-full px-4 text-sm focus:outline-none focus:border-blue-500" placeholder="내용을 입력하세요">
        <button class="bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-700">전송</button>
      </div>
    </div>

    <!-- 하단 액션 버튼 3개 -->
    <div class="flex gap-2 mt-2">
      <button onclick="holdStatus()" class="flex-1 py-3 bg-gray-500 text-white rounded-lg font-bold hover:bg-gray-600 text-sm shadow-sm transition">
        ⏳ 입력후 대기
      </button>
      <button onclick="searchExperts()" class="flex-1 py-3 bg-yellow-400 text-black rounded-lg font-bold hover:bg-yellow-500 text-sm shadow-sm transition">
        🔍 직접 찾기
      </button>
      <button onclick="openEndModal()" class="flex-1 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 text-sm shadow-sm transition">
        ✔️ 서비스 종료
      </button>
    </div>
  </main>

  <!-- 서비스 종료 복합 모달 -->
  <div id="endServiceModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl w-full max-w-sm overflow-hidden shadow-2xl relative">
      
      <!-- 1단계: 서비스 수령 여부 확인 -->
      <div id="modal-step-1" class="p-6 text-center">
        <h3 class="text-lg font-bold text-gray-800 mb-2">문제가 잘 해결되었나요?</h3>
        <p class="text-sm text-gray-500 mb-6">서비스를 정상적으로 받으셨는지 선택해 주세요.</p>
        <div class="flex flex-col gap-3">
          <button onclick="showStep('success')" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">네, 서비스를 받았습니다</button>
          <button onclick="showStep('fail')" class="w-full py-3 bg-gray-100 text-gray-700 rounded-lg font-bold hover:bg-gray-200 transition border border-gray-300">아니요, 받지 못했습니다</button>
          <button onclick="closeEndModal()" class="w-full py-2 text-sm text-gray-500 mt-2 hover:underline">취소</button>
        </div>
      </div>

      <!-- 2단계 (성공): 결제 안내 및 평가 -->
      <div id="modal-step-success" class="hidden">
        <div class="bg-blue-600 p-4 text-center text-white font-bold text-lg">서비스 종료 및 결제 안내</div>
        <div class="p-6">
          <div class="bg-gray-50 p-4 rounded-lg mb-5 text-center border border-gray-200">
            <p class="text-sm text-gray-600 mb-2">아래 계좌로 입금해 주시면 완료됩니다.</p>
            <p class="text-lg font-extrabold text-gray-800">카카오뱅크 : 원용철</p>
            <p class="text-2xl font-black text-blue-600 mt-1 tracking-wide">3333-07-6043050</p>
          </div>
          
          <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-5 text-sm font-semibold text-center border border-red-200">
            ⚠️ 안내: 하루를 넘기면 2만원씩 비용이 증가하오니 빠른 입금 부탁드립니다.
          </div>

          <div class="mb-5">
            <label class="block text-sm font-bold text-gray-700 mb-2">전문가 평가</label>
            <textarea id="expert-review" rows="2" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="전문가의 서비스는 어떠셨나요?"></textarea>
          </div>
          <div class="flex gap-2">
            <button onclick="closeEndModal()" class="flex-1 py-3 border border-gray-300 rounded-lg text-gray-600 font-bold hover:bg-gray-50">취소</button>
            <button onclick="submitEndService('success')" class="flex-1 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md">확인 및 종료</button>
          </div>
        </div>
      </div>

      <!-- 2단계 (실패): 사과문 및 개선사항 -->
      <div id="modal-step-fail" class="hidden">
        <div class="bg-gray-800 p-4 text-center text-white font-bold text-lg">서비스 종료 (미해결)</div>
        <div class="p-6">
          <div class="text-center mb-6">
            <p class="text-red-500 font-bold mb-2 text-lg">서비스를 제공해 드리지 못해 죄송합니다.</p>
            <p class="text-sm text-gray-600 leading-relaxed">어떤 점이 불편하셨는지 남겨주시면<br>더 나은 서비스로 개선하겠습니다.</p>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">불편/개선 사항</label>
            <textarea id="service-feedback" rows="3" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-800 outline-none" placeholder="매칭 지연, 연락 두절 등 불편하셨던 점을 적어주세요."></textarea>
          </div>
          <div class="flex gap-2">
            <button onclick="closeEndModal()" class="flex-1 py-3 border border-gray-300 rounded-lg text-gray-600 font-bold hover:bg-gray-50">취소</button>
            <button onclick="submitEndService('fail')" class="flex-1 py-3 bg-gray-800 text-white rounded-lg font-bold hover:bg-gray-900 shadow-md">의견 제출 및 종료</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function holdStatus() {
      // TODO: Supabase 상태를 '대기중'으로 업데이트
      document.getElementById('room-status').innerText = '대기중';
      document.getElementById('room-status').className = 'text-orange-500 font-bold';
      alert('현재 상태에서 대기합니다. 언제든 [직접 찾기]를 통해 다시 진행할 수 있습니다.');
    }

    function searchExperts() {
      // TODO: Supabase 상태를 '탐색중'으로 변경
      document.getElementById('room-status').innerText = '탐색중';
      document.getElementById('room-status').className = 'text-blue-500 font-bold';
      alert('대기 상태를 해제하고 전문가 목록 화면으로 이동합니다.');
      // window.location.href = 'expert-list.html'; // 실제 이동할 경로로 수정
    }

    // 모달 제어 로직
    function openEndModal() {
      document.getElementById('endServiceModal').classList.remove('hidden');
      showStep('1');
    }

    function closeEndModal() {
      document.getElementById('endServiceModal').classList.add('hidden');
    }

    function showStep(step) {
      document.getElementById('modal-step-1').classList.add('hidden');
      document.getElementById('modal-step-success').classList.add('hidden');
      document.getElementById('modal-step-fail').classList.add('hidden');

      if(step === '1') document.getElementById('modal-step-1').classList.remove('hidden');
      if(step === 'success') document.getElementById('modal-step-success').classList.remove('hidden');
      if(step === 'fail') document.getElementById('modal-step-fail').classList.remove('hidden');
    }

    function submitEndService(type) {
      if (type === 'success') {
        const review = document.getElementById('expert-review').value;
        // TODO: Supabase에 상태 '완료(성공)', 리뷰 저장 로직 추가
        alert('소중한 평가 감사합니다. 서비스가 정상적으로 종료되었습니다.');
      } else {
        const feedback = document.getElementById('service-feedback').value;
        // TODO: Supabase에 상태 '완료(실패)', 피드백 저장 로직 추가
        alert('의견을 적극 반영하여 더 노력하겠습니다. 서비스가 종료되었습니다.');
      }
      
      closeEndModal();
      window.location.href = '../mypage/my-sos.html';
    }
  </script>
</body>
</html>
