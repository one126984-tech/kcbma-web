<!-- 파일명: sos-partner-apply.src.html -->
<!-- @var PAGE_CLASS: page-sos-partner -->
<!-- @var BASE: ../../ -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전문가 제휴 신청 | 대한집합건물관리협회</title>

<!-- @include critical-css -->
  <style>
      #partner-top-banner { background-color: #1f2937; } /* 다크 그레이 톤으로 신뢰감 부여 */
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">

<!-- @include view-transition-css -->
<!-- @include common-css -->

  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden !important; }
    .break-keep { word-break: keep-all; }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->
    <div id="sticky-top-bar" class="w-full flex flex-col shrink-0 bg-transparent z-[900]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center shadow-md"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <div class="w-full bg-gray-100 shrink-0" style="height:14px;"></div>

    <main id="main-content" class="flex-1 w-full overflow-y-auto custom-scroll bg-gray-100">
        <div class="w-full max-w-md mx-auto bg-white min-h-full shadow-lg flex flex-col relative">

            <!-- 상단 배너 (크기 축소 및 버튼 중앙 정렬) -->
            <div id="partner-top-banner" class="text-white py-4 shadow-sm shrink-0 flex flex-col items-center justify-center relative z-20">
                <!-- 뒤로가기 버튼: 무조건 이전 페이지로 이동 -->
                <button onclick="history.back()" class="absolute left-4 top-1/2 -translate-y-1/2 hover:bg-gray-700 p-2 rounded-full transition z-30 cursor-pointer">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-[20px] font-black tracking-wider text-center break-keep">
                    SOS 서비스 공급자<br><span class="text-yellow-400">파트너 전문가 모집</span>
                </h1>
            </div>

            <!-- 본문 양식 (배너 크기 조정에 맞춰 둥근 모서리 및 겹침 속성 제거) -->
            <div class="flex-1 flex flex-col bg-gray-50 relative z-30">
                <div class="p-5 flex-1 space-y-6 pb-8">
                    <div class="bg-blue-50 border border-blue-200 py-4 px-4 rounded-xl text-center shadow-sm">
                        <p class="font-bold text-blue-900 text-sm leading-relaxed break-keep">
                        정보를 입력해주시면 <strong class="text-blue-700">관리자 심사 후 개별 연락</strong>을 드리며, 최종 승인 시 파트너 전문가로 활동하실 수 있습니다.
                        </p>
                    </div>

                    <form id="partner-form" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">1. 이름 또는 상호명 <span class="text-red-500">*</span></label>
                            <input type="text" required placeholder=" 예 : 홍길동 또는 한국설비" class="w-full border-2 border-gray-300 rounded-xl p-3.5 text-sm focus:outline-none focus:border-blue-500 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">2. 전문 분야 (복수 선택 가능) <span class="text-red-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2 text-sm font-bold text-gray-600">
                                <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-white">
                                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded"> <span>화재/소방</span>
                                </label>
                                <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-white">
                                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded"> <span>누수/배관</span>
                                </label>
                                <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-white">
                                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded"> <span>정전/전기</span>
                                </label>
                                <label class="flex items-center gap-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-white">
                                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded"> <span>화장실 기기</span>
                                </label>
                                <!-- 기타 직접입력란 -->
                                <div class="flex items-center gap-2 p-2.5 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition focus-within:border-[#818cf8] focus-within:bg-indigo-50 bg-white col-span-2 sm:col-span-1">
                                    <input type="checkbox" id="cat-other" class="w-4 h-4 text-blue-600 rounded cursor-pointer ml-0.5">
                                    <input type="text" placeholder="기타(직접작성)" class="w-full bg-transparent outline-none text-sm font-bold text-gray-600 placeholder-gray-400" onfocus="document.getElementById('cat-other').checked = true;">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">3. 주요 활동 지역 <span class="text-red-500">*</span></label>
                            <input type="text" required placeholder=" 예 : 서울 강남구, 서초구 일대" class="w-full border-2 border-gray-300 rounded-xl p-3.5 text-sm focus:outline-none focus:border-blue-500 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">4. 연락처 <span class="text-red-500">*</span></label>
                            <input type="tel" required placeholder=" 예 : 010-1234-5678" class="w-full border-2 border-gray-300 rounded-xl p-3.5 text-sm focus:outline-none focus:border-blue-500 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">5. 경력 및 자격사항 <span class="text-gray-400 font-normal">(선택)</span></label>
                            <textarea rows="3" placeholder="  보유 자격증, 경력 년수, 기타 본인소개 등을 자유롭게 적어주세요." class="w-full border-2 border-gray-300 rounded-xl p-3.5 text-sm focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-2">6. 증빙 서류 첨부 <span class="text-gray-400 font-normal">(사업자등록증명원 등)</span></label>
                            <input type="file" accept="image/*,.pdf" class="w-full border-2 border-gray-300 rounded-xl p-3 text-sm bg-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 cursor-pointer">
                        </div>
                    </form>
                </div>

                <div class="sticky bottom-0 p-4 bg-gray-50 border-t border-gray-200 z-10">
                    <button id="submit-partner-btn" class="w-full bg-[#1f2937] hover:bg-black text-white font-black text-lg py-4 rounded-xl shadow-lg transition duration-300 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 제휴 신청하기
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    document.getElementById('submit-partner-btn').addEventListener('click', function(e) {
        e.preventDefault();
        
        // 간단한 폼 유효성 검사
        const inputs = document.querySelectorAll('#partner-form input[required]');
        let isValid = true;
        inputs.forEach(input => {
            if(!input.value.trim()) isValid = false;
        });

        if(!isValid) {
            alert('필수 항목(*)을 모두 입력해 주세요.');
            return;
        }

        // 제출 완료 처리
        this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 처리 중...';
        this.disabled = true;

        setTimeout(() => {
            alert('파트너 제휴 신청이 완료되었습니다.\n관리자 심사 후 기재해주신 연락처로 개별 안내해 드리겠습니다.');
            window.location.href = 'index.html'; 
        }, 1500);
    });
</script>
</body>
</html>
