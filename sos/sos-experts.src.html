<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS 전문가 찾기 | 대한집합건물관리협회</title>

<!-- @include critical-css -->
  <style>
      #sos-top-banner { background-color: #12387a; } /* 검색 페이지는 파란색 테마 */
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
  
  <!-- 카카오톡 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include view-transition-css -->
<!-- @include common-css -->

  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden !important; }
    .break-keep { word-break: keep-all; }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->
    <div id="sticky-top-bar" class="w-full flex flex-col shrink-0 bg-transparent z-[900]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center shadow-md"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <div class="w-full bg-gray-100 shrink-0" style="height:14px;"></div>

    <main id="main-content" class="flex-1 w-full overflow-y-auto custom-scroll bg-gray-100">
        <div class="w-full max-w-md mx-auto bg-white min-h-full shadow-lg flex flex-col relative">

            <!-- 상단 배너 -->
            <div id="sos-top-banner" class="text-white py-5 shadow-sm shrink-0 flex items-center justify-center relative z-20">
                <button onclick="history.back()" class="absolute left-4 top-1/2 -translate-y-1/2 hover:bg-blue-800 p-2 rounded-full transition">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-[22px] font-bold tracking-wider flex items-center gap-2">
                    전문가 직접 찾기
                </h1>
            </div>

            <!-- 카카오톡 공유 버튼 영역 -->
            <div class="p-4 bg-yellow-50 border-b border-yellow-200 shrink-0">
                <p class="text-[13px] text-yellow-800 font-bold mb-2 text-center break-keep">원하는 전문가가 없나요? 내 상황을 카톡으로 보내고 대기중인 전문가들의 지원을 받아보세요.</p>
                <button id="kakao-share-btn" class="w-full bg-[#FEE500] hover:bg-[#ebd300] text-[#000000] font-black text-[15px] py-3.5 rounded-xl shadow-sm transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-comment"></i> 카카오톡으로 SOS 요청 보내기
                </button>
            </div>

            <!-- 필터 영역 -->
            <div class="p-4 border-b border-gray-200 shrink-0 flex gap-2 bg-white">
                <select id="filter-category" class="flex-1 border-2 border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="">전체 분야</option>
                    <option value="화재">화재/소방</option>
                    <option value="누수">누수/배관</option>
                    <option value="전기">정전/전기</option>
                    <option value="화장실">화장실 기기</option>
                    <option value="가스">가스 누출</option>
                </select>
                <select id="filter-region" class="flex-1 border-2 border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="">전체 지역</option>
                    <option value="서울">서울</option>
                    <option value="경기">경기</option>
                    <option value="인천">인천</option>
                </select>
            </div>

            <!-- 전문가 리스트 -->
            <div class="flex-1 bg-gray-50 p-4 space-y-4" id="expert-list">
                <!-- 전문가 카드가 JS를 통해 렌더링 됩니다 -->
            </div>

            <!-- 파트너 전문가 제휴 신청 배너 -->
            <div class="bg-gray-50 px-4 pb-8">
                <div class="bg-gray-800 rounded-2xl p-5 text-center shadow-md border border-gray-700">
                    <h3 class="text-white font-black text-[16px] mb-1">
                        <i class="fa-solid fa-handshake text-yellow-400 mr-1"></i> 건물 관리/수리 전문가이신가요?
                    </h3>
                    <p class="text-gray-300 text-[13px] mb-4 break-keep">
                        SOS 파트너 전문가로 등록하고, 주변의 긴급 출동 요청을 직접 받아보세요!
                    </p>
                    <button onclick="location.href='sos-partner-apply.html'" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-bold text-[15px] py-3.5 rounded-xl transition shadow-sm">
                        SOS 파트너 전문가 지원하기
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    // 카카오 SDK 초기화 — 실제 카카오 디벨로퍼스 JavaScript 키가 설정되기 전까지는
    // 초기화를 미루고, 공유 버튼을 눌렀을 때만 안내 메시지를 보여줍니다.
    const KAKAO_JS_KEY = 'YOUR_KAKAO_JAVASCRIPT_KEY';
    let kakaoInited = false;

    document.getElementById('kakao-share-btn').addEventListener('click', function() {
        if (KAKAO_JS_KEY === 'YOUR_KAKAO_JAVASCRIPT_KEY') {
            alert('카카오톡 공유 기능은 아직 설정 중입니다. (관리자: Kakao Developers에서 발급받은 JavaScript 키를 등록해 주세요)');
            return;
        }
        if (!kakaoInited) {
            Kakao.init(KAKAO_JS_KEY);
            kakaoInited = true;
        }
        const requestUrl = new URL('sos-request.html', window.location.href).href;
        const shareImageUrl = new URL('{{BASE}}assets/img/logo.png', window.location.href).href;
        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: '🚨 긴급 SOS 지원 요청',
                description: '지금 즉시 출동 가능한 전문가를 찾고 있습니다. 프로필을 확인하시고 지원해 주세요!',
                imageUrl: shareImageUrl,
                link: { mobileWebUrl: requestUrl, webUrl: requestUrl },
            },
            buttons: [
                { title: '지원하기 / 자세히 보기', link: { mobileWebUrl: requestUrl, webUrl: requestUrl } },
            ],
        });
    });

    const supabaseClient = window.sb;
    let allExperts = [];

    // 전문가 카테고리에 맞는 아이콘 (표시용)
    function iconForCategory(category) {
        const c = category || '';
        if (c.includes('누수') || c.includes('배관')) return 'fa-user-tie';
        if (c.includes('전기') || c.includes('정전')) return 'fa-user-gear';
        if (c.includes('화재') || c.includes('소방')) return 'fa-helmet-safety';
        if (c.includes('화장실')) return 'fa-wrench';
        if (c.includes('가스')) return 'fa-fire-flame-simple';
        return 'fa-user-tie';
    }

    async function fetchExperts() {
        const listEl = document.getElementById('expert-list');
        const { data, error } = await supabaseClient
            .from('sos_experts')
            .select('*')
            .eq('is_active', true)
            .order('avg_rating', { ascending: false, nullsFirst: false });

        if (error) {
            console.error('전문가 목록 조회 오류:', error);
            listEl.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">전문가 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
            return;
        }
        allExperts = data || [];
        renderExperts();
    }

    function renderExperts() {
        const listEl = document.getElementById('expert-list');
        const catFilter = document.getElementById('filter-category').value;
        const regFilter = document.getElementById('filter-region').value;

        listEl.innerHTML = '';

        const filtered = allExperts.filter(e => {
            const region = [e.region_main, e.region_sub].filter(Boolean).join(' ');
            return (catFilter === '' || (e.category || '').includes(catFilter)) &&
                   (regFilter === '' || region.includes(regFilter));
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">조건에 맞는 대기중인 전문가가 없습니다.</div>';
            return;
        }

        filtered.forEach(expert => {
            const region = [expert.region_main, expert.region_sub].filter(Boolean).join(' ') || '지역 미등록';
            const rating = expert.avg_rating ? Number(expert.avg_rating).toFixed(1) : '신규';
            const cases = expert.total_cases || 0;
            const available = expert.is_available !== false;
            const phone = expert.phone || '';

            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex flex-col gap-3';
            card.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center shrink-0 border border-gray-200">
                        <i class="fa-solid ${iconForCategory(expert.category)} text-2xl text-gray-400"></i>
                    </div>
                    <div class="flex-1 text-[13px] space-y-1">
                        <div class="flex items-center justify-between">
                            <p class="font-black text-gray-900 text-[16px]">${escapeHtml(expert.name)} <span class="text-xs font-normal text-gray-500">전문가</span></p>
                            ${available ? '<span class="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded-full">즉시가능</span>' : '<span class="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">응답불가</span>'}
                        </div>
                        <p class="text-gray-600 font-bold">${escapeHtml(expert.category || '-')} · ${escapeHtml(region)}</p>
                        <div class="flex items-center gap-2 text-xs">
                            <span class="text-yellow-500 font-bold">★ ${rating}</span>
                            <span class="text-gray-400">|</span>
                            <span class="text-gray-600">누적 ${cases}건 해결</span>
                        </div>
                    </div>
                </div>
                <button ${!available ? 'disabled' : ''} onclick="${available ? `location.href='tel:${phone}'` : ''}" class="w-full py-2.5 rounded-lg font-bold text-sm transition ${available ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
                    ${available ? `<i class="fa-solid fa-phone mr-1"></i> 이 전문가에게 전화하기` : '현재 연락 불가'}
                </button>
            `;
            listEl.appendChild(card);
        });
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str || '';
        return div.innerHTML;
    }

    document.getElementById('filter-category').addEventListener('change', renderExperts);
    document.getElementById('filter-region').addEventListener('change', renderExperts);

    fetchExperts();
</script>
</body>
</html>
