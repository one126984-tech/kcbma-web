<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS 전문가 찾기 | 대한집합건물관리협회</title>

<!-- @include critical-css -->
  <style>
      #sos-top-banner { background-color: #12387a; } /* 검색 페이지는 파란색 테마 */
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{BASE}}assets/css/tailwind.css">
  
  <!-- 카카오톡 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{BASE}}assets/js/supabase-config.js"></script>

<!-- @include view-transition-css -->
<!-- @include common-css -->

  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden !important; }
    .break-keep { word-break: keep-all; }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden {{PAGE_CLASS}}">

<!-- @include header -->
    <div id="sticky-top-bar" class="w-full flex flex-col shrink-0 bg-transparent z-[900]">
        <div id="sub-header-bar" class="w-full bg-[#12387a] flex items-center shadow-md"></div>
    </div>
<!-- @include header-close -->

<div id="page-content" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <div class="w-full bg-gray-100 shrink-0" style="height:14px;"></div>

    <main id="main-content" class="flex-1 w-full overflow-y-auto custom-scroll bg-gray-100">
        <div class="w-full max-w-md mx-auto bg-white min-h-full shadow-lg flex flex-col relative">

            <!-- 상단 배너 -->
            <div id="sos-top-banner" class="text-white py-5 shadow-sm shrink-0 flex items-center justify-center relative z-20">
                <button onclick="history.back()" class="absolute left-4 top-1/2 -translate-y-1/2 hover:bg-blue-800 p-2 rounded-full transition">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-[22px] font-bold tracking-wider flex items-center gap-2">
                    전문가 직접 찾기
                </h1>
            </div>

            <!-- 결제 완료된 SOS 요청이 있을 때 표시 -->
            <div id="request-box" class="hidden p-4 bg-blue-50 border-b border-blue-200 shrink-0">
                <p id="request-box-title" class="text-[14px] text-blue-900 font-black mb-1 break-keep"></p>
                <p id="request-box-desc" class="text-[13px] text-blue-800 mb-3 break-keep"></p>
                <button id="wait-offers-btn" class="w-full bg-white border-2 border-blue-500 text-blue-700 font-bold text-[14px] py-3 rounded-xl hover:bg-blue-100 transition">
                    <i class="fa-solid fa-hourglass-half mr-1"></i> 고르기 어려우면 전문가 응답 기다리기
                </button>
            </div>

            <!-- 카카오톡 공유 버튼 영역 -->
            <div id="kakao-box" class="p-4 bg-yellow-50 border-b border-yellow-200 shrink-0">
                <p class="text-[13px] text-yellow-800 font-bold mb-2 text-center break-keep">원하는 전문가가 없나요? 내 상황을 카톡으로 보내고 대기중인 전문가들의 지원을 받아보세요.</p>
                <button id="kakao-share-btn" class="w-full bg-[#FEE500] hover:bg-[#ebd300] text-[#000000] font-black text-[15px] py-3.5 rounded-xl shadow-sm transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-comment"></i> 카카오톡으로 SOS 요청 보내기
                </button>
            </div>

            <!-- 필터 영역 -->
            <div class="p-4 border-b border-gray-200 shrink-0 flex gap-2 bg-white">
                <select id="filter-category" class="flex-1 border-2 border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="">전체 분야</option>
                    <option value="화재">화재/소방</option>
                    <option value="누수">누수/배관</option>
                    <option value="전기">정전/전기</option>
                    <option value="화장실">화장실 기기</option>
                    <option value="가스">가스 누출</option>
                </select>
                <select id="filter-region" class="flex-1 border-2 border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="">전체 지역</option>
                    <option value="서울">서울</option>
                    <option value="경기">경기</option>
                    <option value="인천">인천</option>
                </select>
            </div>
            <!-- 응대 방식 필터 (전화상담만 / 전화상담 및 출동) -->
            <div class="px-4 pb-4 border-b border-gray-200 shrink-0 bg-white">
                <select id="filter-level" class="w-full border-2 border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="">전체 응대 방식</option>
                    <option value="dispatch">전화상담 및 출동서비스 가능</option>
                    <option value="phone">전화상담만 가능</option>
                </select>
            </div>

            <!-- 전문가 리스트 -->
            <div class="flex-1 bg-gray-50 p-4 space-y-4" id="expert-list">
                <!-- 전문가 카드가 JS를 통해 렌더링 됩니다 -->
            </div>

            <!-- 파트너 전문가 제휴 신청 배너 -->
            <div class="bg-gray-50 px-4 pb-8">
                <div class="bg-gray-800 rounded-2xl p-5 text-center shadow-md border border-gray-700">
                    <h3 class="text-white font-black text-[16px] mb-1">
                        <i class="fa-solid fa-handshake text-yellow-400 mr-1"></i> 건물 관리/수리 전문가이신가요?
                    </h3>
                    <p class="text-gray-300 text-[13px] mb-4 break-keep">
                        SOS 파트너 전문가로 등록하고, 주변의 긴급 출동 요청을 직접 받아보세요!
                    </p>
                    <button onclick="location.href='sos-partner-apply.html'" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-bold text-[15px] py-3.5 rounded-xl transition shadow-sm">
                        SOS 파트너 전문가 지원하기
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- 전화 연결 시트 -->
<div id="call-sheet" class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[9999] hidden items-end sm:items-center justify-center p-4">
    <div class="bg-white rounded-[24px] w-full max-w-sm overflow-hidden shadow-2xl">
        <div class="bg-[#12387a] p-5 text-center">
            <p class="text-blue-200 text-[13px] font-bold mb-1">전문가가 연결되었습니다</p>
            <h3 id="call-sheet-name" class="text-white font-black text-xl"></h3>
        </div>
        <div class="p-5 space-y-3">
            <a id="call-sheet-tel" href="#" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-black text-[17px] py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-phone"></i> <span id="call-sheet-phone"></span> 전화 걸기
            </a>
            <a id="call-sheet-room" href="#" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-[14px] py-3 rounded-xl transition flex items-center justify-center gap-2">
                상담 화면으로 이동 (종료 · 전문가 변경)
            </a>
            <p class="text-[12px] text-gray-500 text-center break-keep">통화가 끝나면 상담 화면에서 [종료하기]를 눌러 주세요. 출동이 없었다면 출동비는 환불됩니다.</p>
        </div>
    </div>
</div>

<script>
    // 카카오 SDK 초기화 — 실제 카카오 디벨로퍼스 JavaScript 키가 설정되기 전까지는
    // 초기화를 미루고, 공유 버튼을 눌렀을 때만 안내 메시지를 보여줍니다.
    const KAKAO_JS_KEY = 'YOUR_KAKAO_JAVASCRIPT_KEY';
    let kakaoInited = false;

    document.getElementById('kakao-share-btn').addEventListener('click', function() {
        if (KAKAO_JS_KEY === 'YOUR_KAKAO_JAVASCRIPT_KEY') {
            alert('카카오톡 공유 기능은 아직 설정 중입니다. (관리자: Kakao Developers에서 발급받은 JavaScript 키를 등록해 주세요)');
            return;
        }
        if (!kakaoInited) {
            Kakao.init(KAKAO_JS_KEY);
            kakaoInited = true;
        }
        const requestUrl = new URL('sos-request.html', window.location.href).href;
        const shareImageUrl = new URL('{{BASE}}assets/img/logo.png', window.location.href).href;
        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: '🚨 긴급 SOS 지원 요청',
                description: '지금 즉시 출동 가능한 전문가를 찾고 있습니다. 프로필을 확인하시고 지원해 주세요!',
                imageUrl: shareImageUrl,
                link: { mobileWebUrl: requestUrl, webUrl: requestUrl },
            },
            buttons: [
                { title: '지원하기 / 자세히 보기', link: { mobileWebUrl: requestUrl, webUrl: requestUrl } },
            ],
        });
    });

    const supabaseClient = window.sb;
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('request_id');
    const presetCats = (params.get('cat') || '').split(',').map(s => s.trim()).filter(Boolean);
    const presetRegion = (params.get('region') || '').trim();
    const isPractice = params.get('practice') === '1';

    let requestInfo = null;   // 서버에서 확인된 (결제 완료) 요청. 없으면 전화 연결 불가
    let allExperts = [];
    let assigning = false;

    // 전문가 카테고리에 맞는 아이콘 (표시용)
    function iconForCategory(category) {
        const c = category || '';
        if (c.includes('누수') || c.includes('배관')) return 'fa-user-tie';
        if (c.includes('전기') || c.includes('정전')) return 'fa-user-gear';
        if (c.includes('화재') || c.includes('소방')) return 'fa-helmet-safety';
        if (c.includes('화장실')) return 'fa-wrench';
        if (c.includes('가스')) return 'fa-fire-flame-simple';
        return 'fa-user-tie';
    }

    // 결제 완료된 요청인지 서버에서 확인하고, 요청 조건으로 필터를 미리 맞춘다
    async function initRequestMode() {
        if (!requestId) return;
        try {
            const { data, error } = await supabaseClient.rpc('get_sos_request_fee', { p_request_id: requestId });
            if (error) throw error;
            requestInfo = Array.isArray(data) ? (data[0] || null) : (data || null);
        } catch (e) {
            console.error('요청 정보 확인 오류:', e);
            requestInfo = null;
        }
        if (!requestInfo) return;

        const isDispatch = requestInfo.service_type === 'dispatch';
        document.getElementById('request-box').classList.remove('hidden');
        document.getElementById('kakao-box').classList.add('hidden');
        document.getElementById('request-box-title').innerText =
            (isPractice ? '[연습 모드] ' : '') + (isDispatch ? '전화상담 + 출동서비스' : '전화상담') + ' 접수가 완료되었습니다.';
        document.getElementById('request-box-desc').innerText = isDispatch
            ? '출동 가능한 전문가만 보여드립니다. 마음에 드는 전문가에게 바로 전화하세요.'
            : '마음에 드는 전문가에게 바로 전화하세요. (전화상담 1건, 기본 30분)';

        // 필터 미리 적용
        const catSel = document.getElementById('filter-category');
        if (presetCats.length === 1 && Array.from(catSel.options).some(o => o.value === presetCats[0])) catSel.value = presetCats[0];
        const regSel = document.getElementById('filter-region');
        if (presetRegion && Array.from(regSel.options).some(o => o.value === presetRegion)) regSel.value = presetRegion;
        if (isDispatch) {
            const lvSel = document.getElementById('filter-level');
            lvSel.value = 'dispatch';
            lvSel.disabled = true;
        }
    }

    // 대기 중인 전문가 목록 (전화번호는 받지 않음 — 전화 연결 시 서버가 알려줌)
    async function fetchExperts() {
        const listEl = document.getElementById('expert-list');
        let { data, error } = await supabaseClient.rpc('list_standby_experts');
        if (error) {
            console.warn('list_standby_experts를 사용할 수 없어 직접 조회로 대체합니다:', error.message);
            ({ data, error } = await supabaseClient
                .from('sos_experts')
                .select('id,name,category,region_main,region_sub,service_level,avg_rating,total_cases,provides_photo,avail_from,avail_to')
                .eq('is_active', true)
                .eq('is_standby', true)
                .order('avg_rating', { ascending: false, nullsFirst: false }));
        }
        if (error) {
            console.error('전문가 목록 조회 오류:', error);
            listEl.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">전문가 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
            return;
        }
        allExperts = data || [];
        renderExperts();
    }

    // 전문가가 정한 서비스 가능 시간 안인지 (한국 시간 기준, 밤을 넘기는 시간대 지원)
    function inServiceHours(e) {
        if (!e.avail_from || !e.avail_to) return true;
        const from = String(e.avail_from).slice(0, 5), to = String(e.avail_to).slice(0, 5);
        if (from === to) return true;
        const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
        const cur = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        return from < to ? (cur >= from && cur < to) : (cur >= from || cur < to);
    }

    // 요청한 현장 상황과 전문가 분야가 맞는지
    function matchesPreset(e) {
        if (presetCats.length === 0) return false;
        return presetCats.some(c => (e.category || '').includes(c));
    }

    function renderExperts() {
        const listEl = document.getElementById('expert-list');
        const catFilter = document.getElementById('filter-category').value;
        const regFilter = document.getElementById('filter-region').value;
        const levelFilter = document.getElementById('filter-level').value;

        listEl.innerHTML = '';

        let filtered = allExperts.filter(e => {
            const region = [e.region_main, e.region_sub].filter(Boolean).join(' ');
            return inServiceHours(e) &&
                   (catFilter === '' || (e.category || '').includes(catFilter)) &&
                   (regFilter === '' || region.includes(regFilter)) &&
                   (levelFilter === '' || e.service_level === levelFilter);
        });

        // 상황이 여러 개 선택된 요청이면, 상황이 맞는 전문가를 위로 올린다
        if (requestInfo && catFilter === '' && presetCats.length > 1) {
            filtered = [...filtered.filter(matchesPreset), ...filtered.filter(e => !matchesPreset(e))];
        }

        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold break-keep">조건에 맞는 대기중인 전문가가 없습니다.' +
                (requestInfo ? '<br><span class="text-[13px] font-normal">잠시 후 다시 확인하거나, 위의 [전문가 응답 기다리기]를 이용해 주세요.</span>' : '') + '</div>';
            return;
        }

        filtered.forEach(expert => {
            const region = [expert.region_main, expert.region_sub].filter(Boolean).join(' ') || '지역 미등록';
            const rating = expert.avg_rating ? Number(expert.avg_rating).toFixed(1) : '신규';
            const cases = expert.total_cases || 0;
            const canDispatch = expert.service_level === 'dispatch';
            const hasPhone = expert.has_phone !== false;   // 목록에는 번호가 없으므로 '연락 가능 여부'만 확인
            const hoursText = (expert.avail_from && expert.avail_to)
                ? String(expert.avail_from).slice(0, 5) + '~' + String(expert.avail_to).slice(0, 5) : '24시간';
            const photoText = expert.provides_photo ? '사진 제공' : '사진 제공 안 함';

            const levelBadge = canDispatch
                ? '<span class="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded-full whitespace-nowrap">전화+출동 가능</span>'
                : '<span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full whitespace-nowrap">전화상담만</span>';
            const matchBadge = (requestInfo && matchesPreset(expert))
                ? '<span class="text-[10px] font-bold bg-red-50 text-red-600 border border-red-200 px-1.5 py-0.5 rounded ml-1 whitespace-nowrap">상황 일치</span>' : '';

            let btnHtml;
            if (!hasPhone) {
                btnHtml = '<button disabled class="w-full py-2.5 rounded-lg font-bold text-sm bg-gray-200 text-gray-400 cursor-not-allowed">현재 연락 불가</button>';
            } else if (requestInfo) {
                btnHtml = `<button onclick="callExpert('${expert.id}')" class="w-full py-2.5 rounded-lg font-bold text-sm transition bg-blue-600 text-white hover:bg-blue-700"><i class="fa-solid fa-phone mr-1"></i> 이 전문가에게 전화하기</button>`;
            } else {
                btnHtml = '<button onclick="goRequest()" class="w-full py-2.5 rounded-lg font-bold text-sm transition bg-red-600 text-white hover:bg-red-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i> SOS 요청하고 전화하기</button>';
            }

            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex flex-col gap-3';
            card.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center shrink-0 border border-gray-200">
                        <i class="fa-solid ${iconForCategory(expert.category)} text-2xl text-gray-400"></i>
                    </div>
                    <div class="flex-1 text-[13px] space-y-1 min-w-0">
                        <div class="flex items-center justify-between gap-2">
                            <p class="font-black text-gray-900 text-[16px] truncate">${escapeHtml(expert.name)} <span class="text-xs font-normal text-gray-500">전문가</span></p>
                            ${levelBadge}
                        </div>
                        <p class="text-gray-600 font-bold">${escapeHtml(expert.category || '-')} · ${escapeHtml(region)}${matchBadge}</p>
                        <p class="text-[11px] text-gray-500"><i class="fa-regular fa-clock mr-1"></i>${hoursText} <span class="mx-1 text-gray-300">|</span> <i class="fa-solid fa-camera mr-1"></i>${photoText}</p>
                        <div class="flex items-center gap-2 text-xs">
                            <span class="text-yellow-500 font-bold">★ ${rating}</span>
                            <span class="text-gray-400">|</span>
                            <span class="text-gray-600">누적 ${cases}건 해결</span>
                        </div>
                    </div>
                </div>
                ${btnHtml}
            `;
            listEl.appendChild(card);
        });
    }

    function goRequest() { location.href = 'sos-request.html'; }

    // 이 전문가에게 전화: 서버가 매칭을 만들고 전화번호를 알려준다 (결제된 요청만 가능)
    async function callExpert(expertId) {
        if (!requestInfo || assigning) return;
        const expert = allExperts.find(e => e.id === expertId);
        if (!expert) return;
        const msg = `${expert.name} 전문가에게 전화 연결할까요?\n선택하면 전문가 연락처가 열립니다.` +
            (isPractice ? '\n\n※ 연습 모드여도 실제 전문가에게 연결될 수 있습니다.' : '');
        if (!confirm(msg)) return;

        assigning = true;
        const { data, error } = await supabaseClient.rpc('assign_expert_direct', {
            p_request_id: requestId,
            p_expert_id: expert.id
        });
        assigning = false;

        if (error) {
            const m = String(error.message || '');
            console.error('전문가 연결 오류:', error);
            if (m.includes('ALREADY_MATCHED')) {
                alert('이미 전문가가 배정된 접수입니다. 상담 화면으로 이동합니다.');
                location.href = 'sos-room.html?request_id=' + encodeURIComponent(requestId);
            } else if (m.includes('NOT_STANDBY') || m.includes('EXPERT_BUSY')) {
                alert('이 전문가는 방금 대기를 종료했거나 다른 상담 중입니다. 다른 전문가를 선택해 주세요.');
                fetchExperts();
            } else if (m.includes('REQUEST_NOT_FOUND')) {
                alert('접수 정보를 찾을 수 없습니다. 처음부터 다시 진행해 주세요.');
            } else {
                alert('전문가 연결 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            }
            return;
        }

        const row = Array.isArray(data) ? data[0] : data;
        const phone = typeof row === 'string' ? row : (row && (row.expert_phone || row.phone));
        if (!phone) {
            alert('전문가 연락처를 받지 못했습니다. 상담 화면에서 다시 확인해 주세요.');
            location.href = 'sos-room.html?request_id=' + encodeURIComponent(requestId);
            return;
        }
        openCallSheet(expert, phone);
    }

    function openCallSheet(expert, phone) {
        document.getElementById('call-sheet-name').innerText = expert.name + ' 전문가';
        document.getElementById('call-sheet-phone').innerText = phone;
        document.getElementById('call-sheet-tel').href = 'tel:' + String(phone).replace(/[^0-9+]/g, '');
        document.getElementById('call-sheet-room').href = 'sos-room.html?request_id=' + encodeURIComponent(requestId);
        const sheet = document.getElementById('call-sheet');
        sheet.classList.remove('hidden');
        sheet.classList.add('flex');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str || '';
        return div.innerHTML;
    }

    document.getElementById('filter-category').addEventListener('change', renderExperts);
    document.getElementById('filter-region').addEventListener('change', renderExperts);
    document.getElementById('filter-level').addEventListener('change', renderExperts);
    document.getElementById('wait-offers-btn').addEventListener('click', () => {
        if (requestId) location.href = 'sos-room.html?request_id=' + encodeURIComponent(requestId);
    });

    (async function init() {
        await initRequestMode();
        await fetchExperts();
    })();
</script>
</body>
</html>
