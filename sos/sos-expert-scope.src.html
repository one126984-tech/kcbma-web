<script src="{{BASE}}assets/js/region-data.js"></script>
<script>
    const supabaseClient = window.sb;
    const DRAFT_KEY = 'sosExpertDraft';
    const isPractice = new URLSearchParams(location.search).get('practice') === '1';   // 연습: 로그인·저장 없이 실제와 같은 화면
    const MODAL_URL = 'sos-request.html?expert=1' + (isPractice ? '&practice=1' : '');
    const CATS = [
        { key: '화재', label: '🔥 화재/소방' }, { key: '전기', label: '⚡ 정전/전기' }, { key: '누수', label: '💧 누수/배관' },
        { key: '가스', label: '🧯 가스누출' }, { key: '화장실', label: '🚽 화장실 기기' }, { key: '기타', label: '✏️ 기타(입력)' }
    ];
    const MAX_CATS = 2;
    const MAJORS = ['전국', '서울', '부산', '대구', '인천', '광주', '대전', '울산', '세종', '경기', '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주'];
    const SVC_TITLE = { phone: '📞 전화상담 범위', dispatch: '🚚 출동서비스 범위' };

    let draft = null;          // 프로필에서 넘어온 내용 + 이 화면 입력
    let me = null, lastApp = null, currentUser = null;
    let scope = emptyScope();
    let contactMode = 'call';
    let busy = false;

    function emptyScope() {
        return { phone: { on: false, regions: [], all_day: true, times: [] }, dispatch: { on: false, regions: [], all_day: true, times: [] } };
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function digits(s) { return String(s || '').replace(/\D/g, ''); }
    function readDraft() { try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
    function saveDraft() {
        draft = Object.assign(draft || {}, { savedAt: Date.now(), cats: draft && draft.cats ? draft.cats : [], scope, contactMode });
        try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {}
    }
    function goProfile() { saveDraft(); location.href = 'sos-expert-profile.html' + (isPractice ? '?practice=1' : ''); }

    // ---------- 2. 전문 분야 ----------
    function renderCats() {
        const cats = draft.cats || [];
        document.getElementById('cat-grid').innerHTML = CATS.map(c => {
            const i = cats.indexOf(c.key);
            return `<button type="button" class="cat-btn ${i > -1 ? 'on' : ''}" data-cat="${c.key}">${i > -1 ? `<span class="rank r${i + 1}">${i + 1}순위</span>` : ''}${c.label}</button>`;
        }).join('');
    }
    document.getElementById('cat-grid').addEventListener('click', e => {
        const b = e.target.closest('.cat-btn'); if (!b) return;
        const cats = draft.cats || (draft.cats = []);
        const k = b.dataset.cat, i = cats.indexOf(k);
        if (i > -1) cats.splice(i, 1);
        else if (cats.length >= MAX_CATS) { alert('전문 분야는 최대 2개까지 선택할 수 있습니다.'); return; }
        else {
            if (k === '기타' && !draft.catOther) {
                const t = prompt('기타 분야를 적어 주세요 (예: 승강기, 방수)');
                if (!t || !t.trim()) return;
                draft.catOther = t.trim();
            }
            cats.push(k);
        }
        renderCats(); saveDraft();
    });

    // ---------- 3. 전화 대기 방식 ----------
    function renderMode() {
        ['call', 'text'].forEach(k => {
            const el = document.getElementById('mode-' + k);
            el.classList.toggle('on', contactMode === k);
            el.querySelector('input').checked = contactMode === k;
        });
    }
    document.querySelectorAll('input[name="cmode"]').forEach(r => r.addEventListener('change', function () { if (this.checked) { contactMode = this.value; renderMode(); saveDraft(); } }));

    // ---------- 4. 서비스 항목 ----------
    function timesText(s) { return s.all_day ? '24시간' : (s.times || []).map(t => `${t.from}~${t.to}`).join(', '); }
    function renderSvc() {
        ['phone', 'dispatch'].forEach(k => {
            const s = scope[k];
            document.getElementById('chk-' + k).checked = !!s.on;
            document.getElementById('svc-' + k).classList.toggle('on', !!s.on);
            const sum = document.getElementById('sum-' + k);
            if (s.on) {
                sum.classList.remove('hidden');
                sum.innerHTML = `<b>지역 :</b> ${esc(s.regions.join(', '))}<br><b>시간 :</b> ${esc(timesText(s))}<br><button type="button" class="svc-edit" onclick="openModal('${k}')">지역·시간 수정</button>`;
            } else { sum.classList.add('hidden'); sum.innerHTML = ''; }
        });
        document.getElementById('dispatch-note').classList.toggle('hidden', !(scope.dispatch.on && me && !me.can_dispatch));
    }
    ['phone', 'dispatch'].forEach(k => {
        document.getElementById('chk-' + k).addEventListener('change', function () {
            if (this.checked) { this.checked = false; openModal(k); }   // 모달에서 '선택 완료'를 눌러야 체크됨
            else {
                if (!confirm((k === 'phone' ? '전화상담' : '출동서비스') + ' 선택을 해제할까요? 입력한 지역과 시간이 지워집니다.')) { this.checked = true; return; }
                scope[k] = { on: false, regions: [], all_day: true, times: [] };
                renderSvc(); saveDraft();
            }
        });
    });

    // ---------- 모달: 지역(다중) + 시간(행 추가) ----------
    let mdKey = null, mdRegions = [], mdAllDay = true, mdTimes = [];
    function openModal(k) {
        mdKey = k;
        const s = scope[k];
        mdRegions = s.regions.slice();
        mdAllDay = s.on ? !!s.all_day : true;
        mdTimes = (s.times && s.times.length) ? s.times.map(t => ({ ...t })) : [{ from: '09:00', to: '18:00' }];
        document.getElementById('md-title').textContent = SVC_TITLE[k];
        toggleRegionPanel(false);
        renderChips(); renderTimes();
        document.getElementById('md-back').classList.add('open');
    }
    function closeModal(ok) {
        if (ok) {
            if (!mdRegions.length) { alert('서비스 지역을 1곳 이상 선택해 주세요.'); return; }
            if (!mdAllDay) {
                readTimeInputs();
                const rows = mdTimes.filter(t => t.from && t.to);
                if (!rows.length) { alert('서비스 시간을 입력하거나 "24시간 가능"을 선택해 주세요.'); return; }
                if (rows.some(t => t.from === t.to)) { alert('시작 시간과 종료 시간이 같은 행이 있습니다. 확인해 주세요.'); return; }
                mdTimes = rows;
            }
            scope[mdKey] = { on: true, regions: mdRegions.slice(), all_day: mdAllDay, times: mdAllDay ? [] : mdTimes.map(t => ({ from: t.from, to: t.to })) };
            renderSvc(); saveDraft();
        }
        document.getElementById('md-back').classList.remove('open');
        mdKey = null;
    }

    function renderChips() {
        document.getElementById('rg-chips').innerHTML = mdRegions.map((r, i) => `<span class="rg-chip">${esc(r)}<button type="button" onclick="removeRegion(${i})" aria-label="삭제">✕</button></span>`).join('');
        document.getElementById('rg-text').textContent = mdRegions.length ? mdRegions.join(', ') : '지역 선택';
    }
    function removeRegion(i) { mdRegions.splice(i, 1); renderChips(); }
    function toggleRegionPanel(open) {
        const p = document.getElementById('rg-panel');
        const show = open === undefined ? p.classList.contains('hidden') : open;
        p.classList.toggle('hidden', !show);
        if (show) {
            backToMajor();
            const pickedMajors = new Set(mdRegions.map(r => r.split(' ')[0]));
            document.getElementById('rg-major-list').innerHTML = MAJORS.map(m =>
                `<label><input type="checkbox" class="rg-maj" value="${m}" ${pickedMajors.has(m) ? 'checked' : ''}> ${m}</label>`).join('');
        }
    }
    document.getElementById('rg-toggle').addEventListener('click', () => toggleRegionPanel());
    function backToMajor() { document.getElementById('rg-major').classList.remove('hidden'); document.getElementById('rg-minor').classList.add('hidden'); }
    function openMinor() {
        const majors = [...document.querySelectorAll('.rg-maj:checked')].map(x => x.value);
        if (!majors.length) { alert('먼저 대분류(시·도)를 1개 이상 체크해 주세요.'); return; }
        let html = '';
        majors.forEach(m => {
            html += `<div class="rg-group">[${m}]</div>`;
            if (m === '전국') {
                html += `<label><input type="checkbox" class="rg-min" value="전국 전체" ${mdRegions.includes('전국 전체') ? 'checked' : ''}> 전국(지역무관)</label>`;
                return;
            }
            html += `<label><input type="checkbox" class="rg-min" value="${m} 전체" ${mdRegions.includes(m + ' 전체') ? 'checked' : ''}> <b style="color:#12387a;">${m} 전체</b></label>`;
            const subs = (typeof subRegionData !== 'undefined' && subRegionData[m]) ? [...subRegionData[m]].sort((a, b) => a.localeCompare(b, 'ko')) : [];   // 가나다순
            subs.forEach(s => {
                if (s.replace(/\s/g, '') === `${m}전체` || s === '전국전체') return;
                const v = `${m} ${s}`;
                html += `<label title="${esc(s)}"><input type="checkbox" class="rg-min" value="${esc(v)}" ${mdRegions.includes(v) ? 'checked' : ''}> ${esc(s)}</label>`;
            });
        });
        document.getElementById('rg-minor-list').innerHTML = html;
        document.getElementById('rg-major').classList.add('hidden');
        document.getElementById('rg-minor').classList.remove('hidden');
    }
    function applyMinor() {
        const shown = [...document.querySelectorAll('.rg-min')].map(x => x.value);
        const checked = [...document.querySelectorAll('.rg-min:checked')].map(x => x.value);
        // 이번에 펼친 시·도의 선택만 바꾸고, 다른 시·도에서 고른 지역은 그대로 둠
        mdRegions = mdRegions.filter(r => !shown.includes(r)).concat(checked);
        // '전국 전체'를 고르면 나머지는 의미가 없으므로 정리
        if (mdRegions.includes('전국 전체')) mdRegions = ['전국 전체'];
        else {
            const allMajors = mdRegions.filter(r => / 전체$/.test(r)).map(r => r.split(' ')[0]);
            mdRegions = mdRegions.filter(r => / 전체$/.test(r) || !allMajors.includes(r.split(' ')[0]));
        }
        if (mdRegions.length > 60) { alert('지역은 60곳까지 고를 수 있습니다. 넓은 지역은 "○○ 전체"를 이용해 주세요.'); mdRegions = mdRegions.slice(0, 60); }
        renderChips(); toggleRegionPanel(false);
    }

    function readTimeInputs() {
        document.querySelectorAll('#tm-rows .tm-row').forEach((row, i) => {
            if (!mdTimes[i]) return;
            mdTimes[i].from = row.querySelector('.tm-from').value;
            mdTimes[i].to = row.querySelector('.tm-to').value;
        });
    }
    function renderTimes() {
        document.getElementById('tm-24').checked = mdAllDay;
        const box = document.getElementById('tm-rows');
        box.classList.toggle('tm-off', mdAllDay);
        document.getElementById('tm-add').classList.toggle('tm-off', mdAllDay);
        box.innerHTML = mdTimes.map((t, i) => `
            <div class="tm-row">
                <input type="time" class="tm-from" value="${t.from || ''}" aria-label="시작 시간">
                <span style="color:#9ca3af;font-weight:900;">~</span>
                <input type="time" class="tm-to" value="${t.to || ''}" aria-label="종료 시간">
                ${mdTimes.length > 1 ? `<button type="button" onclick="removeTime(${i})">삭제</button>` : ''}
            </div>`).join('');
    }
    function removeTime(i) { readTimeInputs(); mdTimes.splice(i, 1); renderTimes(); }
    document.getElementById('tm-add').addEventListener('click', () => {
        readTimeInputs();
        if (mdTimes.length >= 10) { alert('시간대는 10개까지 추가할 수 있습니다.'); return; }
        mdTimes.push({ from: '', to: '' }); renderTimes();
    });
    document.getElementById('tm-24').addEventListener('change', function () { readTimeInputs(); mdAllDay = this.checked; renderTimes(); });

    // ---------- 1. 기존 정보 불러오기 ----------
    function normalizeScope(s) {
        const base = emptyScope();
        if (!s || typeof s !== 'object') return base;
        ['phone', 'dispatch'].forEach(k => {
            const v = s[k];
            if (v && v.on) base[k] = { on: true, regions: Array.isArray(v.regions) ? v.regions.slice(0, 60) : [], all_day: !!v.all_day, times: Array.isArray(v.times) ? v.times.slice(0, 10) : [] };
        });
        return base;
    }
    function legacyScope(ex) {
        // 예전 방식(지역 1개·시간 1개)으로 저장된 전문가는 그 값으로 범위를 만들어 줌
        const region = [ex.region_main, ex.region_sub].filter(Boolean).join(' ') || '전국 전체';
        const allDay = !ex.avail_from || !ex.avail_to;
        const times = allDay ? [] : [{ from: String(ex.avail_from).slice(0, 5), to: String(ex.avail_to).slice(0, 5) }];
        const s = emptyScope();
        s.phone = { on: true, regions: ['전국 전체'], all_day: allDay, times };
        if (ex.service_level === 'dispatch') s.dispatch = { on: true, regions: [region], all_day: allDay, times };
        return s;
    }
    document.getElementById('load-saved').addEventListener('click', () => {
        let src = null;
        if (me) src = { scope: me.service_scope ? normalizeScope(me.service_scope) : legacyScope(me), mode: me.contact_mode };
        else if (lastApp && lastApp.service_scope) src = { scope: normalizeScope(lastApp.service_scope), mode: lastApp.contact_mode };
        if (!src) { alert('저장된 서비스 범위가 없습니다. 아래에서 직접 입력해 주세요.'); return; }
        scope = src.scope; contactMode = src.mode === 'text' ? 'text' : 'call';
        setLoadButtons('saved', '✔ 저장해 둔 전화 대기 방식과 서비스 항목(지역·시간)을 불러왔습니다. 바꿀 부분만 고치세요.');
        renderMode(); renderSvc(); saveDraft();
        guideTo('sec-svc');
    });
    document.getElementById('load-new').addEventListener('click', () => {
        if ((scope.phone.on || scope.dispatch.on) && !confirm('입력한 서비스 범위(지역·시간)를 지우고 새로 입력할까요?')) return;
        scope = emptyScope(); contactMode = 'call';
        setLoadButtons('new', '✏️ 새로 입력합니다. 3번에서 전화 대기 방식을 고르고, 4번에서 전화상담·출동서비스를 체크해 지역과 시간을 넣어 주세요.');
        renderMode(); renderSvc(); saveDraft();
        guideTo('sec-svc');
    });
    function setLoadButtons(which, msg) {
        document.getElementById('load-saved').classList.toggle('on', which === 'saved');
        document.getElementById('load-new').classList.toggle('on', which === 'new');
        const el = document.getElementById('load-msg');
        el.textContent = msg; el.classList.remove('hidden');
    }
    // 입력할 곳으로 화면을 옮기고 잠깐 테두리를 반짝여 알려 줌
    function guideTo(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }

    // ---------- 확인 / 제출 ----------
    function validateAll() {
        if (!draft || !draft.name || digits(draft.phone).length < 10) { alert('프로필(이름·연락처)이 비어 있습니다. 뒤로가기를 눌러 프로필부터 입력해 주세요.'); return false; }
        if (!draft.cats || !draft.cats.length) { alert('전문 분야를 1개 이상 선택해 주세요.'); return false; }
        if (!scope.phone.on && !scope.dispatch.on) { alert('서비스 항목(전화상담 또는 출동서비스)을 1개 이상 선택해 주세요.'); return false; }
        return true;
    }
    function scopeForSave() {
        const out = {};
        ['phone', 'dispatch'].forEach(k => {
            const s = scope[k];
            out[k] = s.on ? { on: true, regions: s.regions, all_day: !!s.all_day, times: s.all_day ? [] : s.times } : { on: false };
        });
        return out;
    }
    function regionSummary() {
        const parts = [];
        if (scope.phone.on) parts.push('전화: ' + scope.phone.regions.join(', '));
        if (scope.dispatch.on) parts.push('출동: ' + scope.dispatch.regions.join(', '));
        return parts.join(' / ');
    }

    document.getElementById('save-btn').addEventListener('click', async function () {
        if (busy || !validateAll()) return;
        if (isPractice) {
            alert('[연습] 실제에서는 여기서 콜대기 조건이 저장되고, 바로 콜 대기가 시작됩니다.\n연습용 긴급 SOS 요청현황으로 이동합니다.');
            location.href = 'sos-standby.html?practice=1';
            return;
        }
        if (!currentUser) { alert('로그인 후 이용할 수 있습니다. 로그인 화면으로 이동합니다.'); saveDraft(); location.href = '{{BASE}}login.html'; return; }
        busy = true; this.disabled = true; const old = this.innerHTML; this.innerHTML = '저장 중...';
        let error;
        if (me) {
            ({ error } = await supabaseClient.rpc('set_my_service_setup', {
                p_name: draft.name, p_categories: draft.cats.join(','), p_intro: draft.intro || '',
                p_contact_mode: contactMode, p_scope: scopeForSave()
            }));
        } else {
            // 승인 전 지원자: 내 지원서에 저장 (분야를 여기서 바꿨을 수 있으므로 신상자료도 함께 저장)
            ({ error } = await supabaseClient.rpc('set_my_application_profile', { p_name: draft.name, p_categories: draft.cats.join(','), p_intro: draft.intro || '', p_doc_path: null }));
            if (!error) ({ error } = await supabaseClient.rpc('set_my_application_scope', { p_contact_mode: contactMode, p_scope: scopeForSave() }));
        }
        busy = false; this.disabled = false; this.innerHTML = old;
        if (error) {
            console.error('서비스 범위 저장 오류:', error);
            const msg = String(error.message || '');
            if (msg.includes('INVALID_SCOPE')) alert('서비스 범위에 빠진 내용이 있습니다. 지역과 시간을 확인해 주세요.');
            else if (msg.includes('STEP2_REQUIRED')) alert('2단계(신상자료)를 먼저 저장해 주세요.');
            else if (msg.includes('NOT_EXPERT') || msg.includes('NO_APPLICATION')) alert('1단계 지원서가 없습니다. 1단계부터 진행해 주세요.');
            else alert('저장 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            return;
        }
        try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
        if (me) {
            location.href = 'sos-standby.html?start=1';   // 저장과 동시에 콜 대기 시작 → 긴급 SOS 요청현황
        } else {
            alert('3단계까지 저장했습니다.\n운영진 승인이 끝나면 저장한 조건이 그대로 적용되고, 3단계에서 다음을 누르면 바로 콜 대기가 시작됩니다.');
            location.href = MODAL_URL;
        }
    });
    async function init() {
        draft = readDraft();
        if (isPractice) {
            document.getElementById('step-tag').textContent = '[연습] 3단계 · 콜대기 조건 설정';
            document.getElementById('step-tag').style.background = '#7c3aed';
            me = { id: 'practice', name: '한국전기 홍길동', can_dispatch: true, contact_mode: 'call' };
            draft = Object.assign(draft || {}, { name: (draft && draft.name) || '한국전기 홍길동', phone: '010-0000-1234', intro: (draft && draft.intro) || '연습용 소개', cats: (draft && draft.cats && draft.cats.length) ? draft.cats.slice(0, MAX_CATS) : ['전기', '화재'] });
            scope = draft.scope ? normalizeScope(draft.scope) : { phone: { on: true, regions: ['전국 전체'], all_day: false, times: [{ from: '09:00', to: '18:00' }] }, dispatch: { on: true, regions: ['서울 강남구', '서울 서초구'], all_day: true, times: [] } };
            contactMode = draft.contactMode === 'text' ? 'text' : 'call';
            me.service_scope = JSON.parse(JSON.stringify(scope));   // '기존 정보입력' 연습용
            document.getElementById('who').innerHTML = '🧪 <b>연습 모드</b> · 가상 조건이 채워져 있습니다. 전화상담·출동 체크, 지역·시간을 바꿔 보고 아래 <b>다음</b>을 누르면 연습용 요청현황으로 갑니다. 실제로 저장되지 않습니다.';
            document.getElementById('who').style.background = '#f3e8ff'; document.getElementById('who').style.color = '#6b21a8';
            document.getElementById('save-btn').textContent = '다음 (연습 콜대기) →';
            renderCats(); renderMode(); renderSvc(); saveDraft();
            return;
        }
        try { const { data: { user } } = await supabaseClient.auth.getUser(); currentUser = user || null; } catch (e) { currentUser = null; }
        if (currentUser) {
            const { data: ex } = await supabaseClient.from('sos_experts').select('*').eq('user_id', currentUser.id).eq('is_active', true).maybeSingle();
            me = ex || null;
            if (!me) {
                const { data: app } = await supabaseClient.from('sos_applications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(1).maybeSingle();
                lastApp = app || null;
            }
        }
        // 3단계는 1단계 지원 + 2단계 저장을 마친 회원만 (승인 전 지원자도 미리 저장 가능)
        if (!currentUser) {
            alert('전문가 활동은 회원만 할 수 있습니다.\n로그인(또는 회원가입) 후 이용해 주세요.');
            location.href = '{{BASE}}login.html'; return;
        }
        if (!me && !lastApp) { alert('1단계부터 진행하세요.'); location.href = MODAL_URL; return; }
        const step2Done = me ? !!(me.profile_done_at || me.service_scope) : !!lastApp.profile_done_at;
        if (!step2Done) {
            alert('2단계부터 진행하세요.\n신상자료를 먼저 저장해 주세요.');
            location.href = 'sos-expert-profile.html'; return;
        }
        // 3단계에서는 저장된 신상자료를 기준으로 함 (2단계에서 방금 저장한 내용 포함)
        const src = me ? { name: me.name, phone: me.phone, intro: me.intro, cats: me.categories || me.category }
                       : { name: lastApp.name, phone: lastApp.phone, intro: lastApp.bio, cats: String(lastApp.categories || '').split(' (')[0] };
        draft = Object.assign(draft || {}, { name: src.name, phone: src.phone, intro: src.intro || '',
            cats: String(src.cats || '').split(',').map(x => x.trim()).filter(k => CATS.some(c => c.key === k)) });
        draft.cats = (draft.cats || []).slice(0, MAX_CATS);
        if (draft.scope) scope = normalizeScope(draft.scope);
        else if (me) scope = me.service_scope ? normalizeScope(me.service_scope) : legacyScope(me);
        else if (lastApp && lastApp.service_scope) scope = normalizeScope(lastApp.service_scope);
        contactMode = draft.contactMode || (me && me.contact_mode) || (lastApp && lastApp.contact_mode) || 'call';
        if (contactMode !== 'text') contactMode = 'call';

        if (me) {
            document.getElementById('who').innerHTML = `<span style="color:#15803d;">✔ 승인된 전문가</span> · ${esc(draft.name)}<br><span style="font-weight:500;color:#6b7280;">바꿀 조건(시간·지역 등)만 고치고 아래 <b>다음</b>을 누르면 바로 콜 대기가 시작됩니다.</span>`;
            document.getElementById('save-btn').textContent = '다음 (콜대기 시작) →';
        } else {
            document.getElementById('who').innerHTML = `지원서 심사 상태: <b>${esc(lastApp.status || '대기중')}</b> · ${esc(draft.name)}<br><span style="font-weight:500;color:#6b7280;">승인 전에도 콜대기 조건을 미리 저장해 둘 수 있습니다. 승인되면 그대로 적용됩니다.</span>`;
            document.getElementById('save-btn').textContent = '저장하기';
        }
        renderCats(); renderMode(); renderSvc(); saveDraft();
    }
    init();
</script>
</body>
</html>
