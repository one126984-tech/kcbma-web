<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>대한집합건물관리협회</title>

    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 전체 화면 기본 설정 */
        html, body { height: 100%; margin: 0; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #23344e; /* 초기 배경 네이비 */
            color: #333; 
            /* ★ 우측 스크롤 삭제(hidden) */
            overflow-y: hidden;
            overflow-x: hidden;
        }

        /* -------------------------------------
           헤더 관련 스타일
           ------------------------------------- */
        .sos-btn {
            background-color: transparent;
            color: #dc2626;
            border: none;
            cursor: pointer;
            padding: 5px 8px;
            margin-left: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .sos-btn:hover { color: #991b1b; }
        .sos-btn-mobile { margin-top: 8px; margin-left: 0; display: inline-flex; }

        .login-btn {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.15s;
        }
        .login-btn:hover { background-color: #1a252f; }

        .mypage-btn-mobile {
            background-color: #0088cc;
            color: #ffffff;
            transition: background-color 0.15s;
        }
        .mypage-btn-mobile:hover { background-color: #0077b3; }


        /* -------------------------------------
           배너 영역 스타일 
           ------------------------------------- */
        .hero-banner {
            background-color: #23344e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            min-height: 100vh; /* 화면 전체를 채움 */
            padding: 130px 20px 40px 20px; 
            box-sizing: border-box;
        }

        /* '어서 오세요' 라운드 배지 */
        .welcome-badge {
            display: inline-block;
            border: 2px solid #00d233;
            color: #ffffff;
            padding: 8px 36px;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .hero-banner .subtitle-top {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero-banner .title-main {
            font-size: 4.5rem;
            font-weight: 900; 
            margin-bottom: 1.5rem;
            letter-spacing: -0.05em;
        }

        .hero-banner .subtitle-bottom {
            font-size: 1.2rem;
            font-weight: 400;
            color: #e2e8f0;
            letter-spacing: 0.5px;
            word-break: keep-all; 
            margin-bottom: 3rem;
        }

        /* 모바일 반응형 처리 */
        @media (max-width: 768px) {
            .hero-banner { padding-top: 110px; }
            .hero-banner .title-main { font-size: 2.8rem; margin-bottom: 1rem; }
            .hero-banner .subtitle-top { font-size: 1.1rem; margin-bottom: 1rem; }
            .hero-banner .subtitle-bottom { font-size: 1.05rem; margin-bottom: 2.5rem;}
            .welcome-badge { padding: 6px 24px; font-size: 1rem; margin-bottom: 1.5rem; }
            
            .sos-main-btn { padding: 15px 25px; font-size: 1.25rem; }
            .sos-main-btn i { font-size: 1.5rem; }
            .sos-desc { font-size: 0.85rem; flex-direction: column; gap: 5px;}
        }
    </style>
</head>

<body class="flex flex-col h-screen page-home">

    <!-- 시작: 공통 헤더 영역 -->
    <div class="sticky top-0 z-[1000] w-full flex flex-col bg-white border-b border-gray-200 shadow-sm" id="main-header">
        <header class="flex justify-between items-center px-4 md:px-8 max-w-[1400px] mx-auto w-full h-[70px]">
            
            <!-- 1) 좌측 로고 -->
            <div class="flex items-center h-full cursor-pointer shrink-0 mr-4" onclick="location.href='index.html'">
            <img src="assets/img/관리협회.png" class="h-[38px] md:h-[44px] w-auto object-contain" alt="대한집합건물관리협회" onerror="this.src='방패로고.jpg'">
            </div>
            
            <!-- 2) 중앙 메인 GNB (PC 메뉴) -->
            <nav class="hidden lg:flex flex-1 justify-center lg:justify-between items-center px-6 xl:px-12 font-medium text-[15px] xl:text-[16px] text-gray-700 whitespace-nowrap">
            <div onclick="location.href='pages/about/about.html'" class="gnb-item nav-about cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">협회소개</div>
            <div onclick="location.href='pages/jobs/job-list.html'" class="gnb-item nav-jobs cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">구인구직</div>
            <div onclick="location.href='pages/bid/bid-list.html'" class="gnb-item nav-bid cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">입찰공고</div>
            <div onclick="location.href='pages/cert/cert-list.html'" class="gnb-item nav-cert cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">자격증</div>
            <div onclick="location.href='pages/community/field-experience.html'" class="gnb-item nav-community cursor-pointer hover:text-[#0088cc] pb-1 transition-colors">자료 / 커뮤니티</div>
        
            <!-- 긴급SOS 문의 -->
            <div onclick="location.href='pages/sos/sos-request.html'" class="sos-btn nav-sos">
                <i class="fa-solid fa-phone-volume" style="font-size:13px;"></i>
                <span>긴급SOS 문의</span>
            </div>
            </nav>
        
            <!-- 3) 우측 유틸리티 영역 -->
            <div class="hidden sm:flex items-center gap-3 shrink-0 ml-2 whitespace-nowrap font-medium text-gray-700">
            <div class="relative cursor-pointer flex items-center justify-center w-[36px] h-[36px] rounded-full hover:bg-gray-100 transition-colors" title="알림 확인">
                <i class="fa-regular fa-bell text-gray-700 text-[18px]"></i>
                <span class="absolute top-[2px] right-[2px] flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white border-2 border-white">2</span>
            </div>
            <div onclick="location.href='pages/mypage/dashboard.html'" class="cursor-pointer text-[14px] hover:text-[#0088cc]">마이페이지</div>
            <div onclick="location.href='login.html'" class="login-btn">로그인</div>
            </div>
            
            <button class="lg:hidden p-2 text-[#0a1931] cursor-pointer ml-auto" onclick="toggleMobileMenu()" aria-label="메뉴열기">
            <svg class="pointer-events-none" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            </button>
        </header>
    </div>
    
    <!-- 모바일 메뉴 -->
    <div id="mobile-menu" style="display:none;" class="fixed inset-0 z-[1100] bg-black/60 transition-opacity" role="dialog" aria-modal="true">
        <div class="absolute top-0 right-0 bottom-0 w-4/5 max-w-[320px] bg-[#0a1931] shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-4 bg-white border-b border-gray-200">
            <div class="flex items-center h-full">
                <img src="assets/img/관리협회.png" alt="대한집합건물관리협회" class="h-[36px] w-auto object-contain" />
            </div>
            <button onclick="toggleMobileMenu()" class="text-3xl text-gray-500 hover:text-gray-800 leading-none px-2">&times;</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-6 text-white font-medium text-[16px]">
            <div onclick="location.href='pages/about/about.html'" class="cursor-pointer hover:text-[#0088cc]">협회소개</div>
            <div onclick="location.href='pages/jobs/job-list.html'" class="cursor-pointer hover:text-[#0088cc]">구인구직</div>
            <div onclick="location.href='pages/bid/bid-list.html'" class="cursor-pointer hover:text-[#0088cc]">입찰공고</div>
            <div onclick="location.href='pages/cert/cert-list.html'" class="cursor-pointer hover:text-[#0088cc]">자격증</div>
            <div onclick="location.href='pages/community/field-experience.html'" class="cursor-pointer hover:text-[#0088cc]">자료 / 커뮤니티</div>
            
            <!-- 모바일 긴급SOS 문의 -->
            <div onclick="location.href='pages/sos/sos-request.html'" class="sos-btn sos-btn-mobile">
                <i class="fa-solid fa-phone-volume" style="font-size:13px;"></i>
                <span>긴급SOS 문의</span>
            </div>
            </div>
            
            <div class="p-6 bg-[#061124] space-y-3 text-[14px] font-medium text-center text-gray-300">
            <div class="flex gap-2 w-full">
                <div class="flex-1 py-3 bg-[#1e293b] text-white rounded-lg cursor-pointer hover:bg-gray-800 transition-colors relative">
                <i class="fa-regular fa-bell mr-1"></i> 알림
                <span class="absolute top-1 right-2 bg-red-500 text-white text-[10px] px-[5px] py-[2px] rounded-full leading-none border border-[#1e293b]">2</span>
                </div>
                <div onclick="location.href='pages/mypage/dashboard.html'" class="flex-1 py-3 mypage-btn-mobile rounded-lg cursor-pointer">마이페이지</div>
            </div>
            <div onclick="location.href='login.html'" class="w-full py-2.5 mt-2 border border-gray-600 hover:text-white hover:bg-gray-800 rounded-lg cursor-pointer transition-colors">로그아웃</div>
            </div>
        </div>
    </div>
    
    <script>
        // 모바일 메뉴 열기/닫기 스크립트
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.body.style.overflow = '';
            } else {
            menu.style.display = 'block';
            document.body.style.overflow = 'hidden';
            }
        }
    
        // 헤더 높이 계산 스크립트
        document.addEventListener('DOMContentLoaded', function() {
            const headerEl = document.getElementById('main-header');
            if (headerEl && 'ResizeObserver' in window) {
            const updateHeaderHeightVar = () => {
                const h = headerEl.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--header-actual-height', h + 'px');
            };
            updateHeaderHeightVar();
            const ro = new ResizeObserver(updateHeaderHeightVar);
            ro.observe(headerEl);
            }
        });
    </script>
    <!-- 끝: 공통 헤더 영역 -->

    <!-- 전체 본문 컨테이너 -->
    <main class="w-full flex flex-col relative min-h-0 flex-1">
        
        <!-- 1. 메인 표지 (Hero Banner) -->
        <section class="hero-banner flex-1">
            <div class="welcome-badge">어서 오세요</div>
            <p class="subtitle-top">집합건물관리의 든든한 울타리</p>
            <h1 class="title-main">대한집합건물관리협회</h1>
            <p class="subtitle-bottom">실무 중심의 역량강화를 통해 안전하고 효율적으로 건물 관리 합니다.</p>
        </section>

    </main>

    <!-- 🚨 긴급 SOS 우측 상단 배너 (PC 전용) -->
    <a href="pages/sos/sos-request.html" class="fixed top-[120px] right-8 z-50 hidden md:flex items-center gap-4 group">
        <!-- 텍스트 영역 -->
        <div class="flex flex-col items-end opacity-90 group-hover:opacity-100 transition-opacity">
            <p class="text-gray-300 text-[13px] mb-2 font-medium tracking-wider">
                🔥 화재 • 💦 누수 • ⚡ 정전 발생 시 전문가 즉시 매칭
            </p>
            <div class="mr-2 mt-1">
                <span class="font-black text-[17px] tracking-widest text-gray-300">
                    <span class="text-pink-300">24시간</span> 긴급 SOS 호출
                </span>
            </div>
        </div>
        <!-- 둥근 버튼 영역 -->
        <div class="w-[90px] h-[90px] bg-red-600 rounded-full flex flex-col items-center justify-center text-white shadow-[0_0_25px_rgba(239,68,68,0.6)] border-[3px] border-red-400 group-hover:scale-110 group-hover:bg-red-500 transition-all duration-300">
            <span class="text-3xl mb-1 group-hover:animate-bounce">🚨</span>
            <span class="font-extrabold text-sm tracking-tight">SOS 호출</span>
        </div>
    </a>

    <!-- 🚨 긴급 SOS 플로팅 버튼 (우측 하단 고정, 모바일 전용) -->
    <a href="pages/sos/sos-request.html" 
       class="fixed bottom-6 right-6 md:hidden bg-red-600 text-white w-16 h-16 flex flex-col items-center justify-center rounded-full shadow-2xl hover:bg-red-700 hover:scale-110 active:scale-95 transition-all z-50 group border-4 border-white/20">
        
        <!-- 아이콘 및 텍스트 -->
        <span class="text-2xl mb-0.5 group-hover:animate-bounce">🚨</span>
        
        <!-- 시선을 끄는 물결(Ping) 애니메이션 효과 -->
        <span class="absolute inset-0 w-full h-full rounded-full bg-red-500 opacity-40 animate-ping -z-10"></span>
    </a>

</body>
</html>
