<!-- 네비게이션 및 로그인 (최상단 바) -->
<div class="hidden md:flex w-full bg-[#0a1931] h-[40px] items-center">
    <div class="max-w-[1400px] mx-auto w-full px-4 flex justify-end gap-3 text-white text-[13px] font-bold">
        <div class="bg-[#03c75a] hover:bg-[#02a64b] px-4 py-1.5 rounded cursor-pointer">네이버카페</div>
        <div class="bg-[#1f3b73] hover:bg-[#152a55] px-4 py-1.5 rounded cursor-pointer">로그인</div>
        <div class="bg-[#1f3b73] hover:bg-[#152a55] px-4 py-1.5 rounded cursor-pointer">회원가입</div>
    </div>
</div>

<!-- 메인 헤더 영역 -->
<header class="flex justify-between items-center px-4 h-[64px] max-w-[1400px] mx-auto w-full bg-white">
    <!-- 1. 방패 로고 및 텍스트 로고 이미지 (절대 경로 적용) -->
    <div class="flex items-center cursor-pointer gap-2.5" onclick="window.location.href='/'">
        <img src="/assets/img/방패로고-removebg-preview.png" alt="방패로고" class="h-10 md:h-11 w-auto object-contain">
        <img src="/assets/img/관리협회_글자만-removebg-preview.png" alt="대한집합건물관리협회" class="h-8 md:h-[34px] w-auto object-contain mt-0.5">
    </div>
    
    <!-- 2. 데스크톱 메뉴 -->
    <nav class="hidden md:flex space-x-12 font-bold text-[17px] items-center">
        <div class="cursor-pointer text-gray-700 hover:text-[#008f8c]">협회소개</div>
        <div class="cursor-pointer text-gray-700 hover:text-[#008f8c]">정보교류</div>
        <div class="cursor-pointer text-gray-700 hover:text-[#008f8c]">입찰공고</div>
        <div class="cursor-pointer text-[#2BA8A0] font-black border-b-2 border-[#2BA8A0] pb-1">구인구직</div>
        <div class="cursor-pointer text-gray-700 hover:text-[#008f8c]">교육/실습</div>
        <div class="cursor-pointer text-gray-700 hover:text-[#008f8c]">커뮤니티</div>
    </nav>

    <!-- 3. 모바일 햄버거 버튼 -->
    <button class="md:hidden text-gray-700 p-2 focus:outline-none" onclick="document.getElementById('mobile-menu').style.display='block'">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
</header>

<!-- ========================================== -->
<!-- 📱 모바일 전용 슬라이드 메뉴 (Drawer) -->
<!-- ========================================== -->
<div id="mobile-menu" style="display:none;" class="fixed inset-0 z-[1000] bg-black/60 transition-opacity" role="dialog" aria-modal="true">
    <div class="absolute top-0 right-0 bottom-0 w-4/5 max-w-[320px] bg-[#0a1931] shadow-2xl flex flex-col">
        
        <div class="flex justify-between items-center p-4 bg-white border-b border-gray-200">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <img src="/assets/img/방패로고-removebg-preview.png" alt="방패로고" class="h-[30px] w-auto object-contain">
                <img src="/assets/img/관리협회_글자만-removebg-preview.png" alt="대한집합건물관리협회 텍스트 로고" class="h-[22px] w-auto object-contain">
            </div>
            
            <button onclick="document.getElementById('mobile-menu').style.display='none'" class="text-gray-500 hover:text-black focus:outline-none p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-2">
            <div class="cursor-pointer block px-4 py-3 text-white font-bold text-lg hover:bg-[#1a365d] rounded">협회소개</div>
            <div class="cursor-pointer block px-4 py-3 text-white font-bold text-lg hover:bg-[#1a365d] rounded">정보교류</div>
            <div class="cursor-pointer block px-4 py-3 text-white font-bold text-lg hover:bg-[#1a365d] rounded">입찰공고</div>
            <div class="cursor-pointer block px-4 py-3 text-[#2BA8A0] font-black text-lg bg-[#1a365d] rounded">구인구직</div>
            <div class="cursor-pointer block px-4 py-3 text-white font-bold text-lg hover:bg-[#1a365d] rounded">교육/실습</div>
            <div class="cursor-pointer block px-4 py-3 text-white font-bold text-lg hover:bg-[#1a365d] rounded">커뮤니티</div>
        </nav>

        <div class="p-5 border-t border-[#1a365d] bg-[#071324]">
            <div class="flex flex-col gap-3">
                <div class="w-full text-center bg-[#03c75a] hover:bg-[#02a64b] text-white font-bold py-2.5 rounded cursor-pointer">네이버카페</div>
                <div class="flex gap-2">
                    <div class="flex-1 text-center bg-white text-[#0a1931] font-bold py-2.5 rounded cursor-pointer hover:bg-gray-100">로그인</div>
                    <div class="flex-1 text-center border border-white text-white font-bold py-2.5 rounded cursor-pointer hover:bg-white/10">회원가입</div>
                </div>
            </div>
        </div>
    </div>
</div>
